<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>知识库</title>
<!-- CET-4 baseline, CET-6 focus -->
<!-- generated by build-site: CET learning profile; compact date navigation -->
<style>
  /* CET-4 baseline, CET-6 focus */
  :root {
    --paper: #fbfaf7;
    --ink: #1a1a18;
    --quiet: #6f6e67;
    --rule: #e7e5de;
    --mark: #ffe680;
    --rose: #b76578;
    --rose-soft: #f4e4e8;
    --en: Constantia, Cambria, Georgia, "Times New Roman", serif;
    --zh: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
    --sans: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    --ui: "Segoe UI", "Noto Sans SC", "Microsoft YaHei", -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #141311;
      --ink: #ecebe6;
      --quiet: #97968d;
      --rule: #2c2b28;
      --mark: rgba(255, 230, 128, .24);
      --rose: #dfa0ae;
      --rose-soft: rgba(223, 160, 174, .12);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.75 var(--ui);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 28px; }
  body.notion-mode .wrap { max-width: 1480px; }
  header.top { padding: 54px 0 18px; }
  h1 { font-family: var(--zh); font-size: 23px; font-weight: 600; margin: 0 0 8px; letter-spacing: .01em; }
  .sub { color: var(--quiet); font-size: 13px; }
  .sub span { margin-right: 16px; white-space: nowrap; display: inline-block; }
  .sub b { color: var(--ink); font-weight: 600; }
  .viewnav {
    display: flex; gap: 3px; margin-top: 22px;
    border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none;
  }
  .viewnav::-webkit-scrollbar { display: none; }
  .viewnav button {
    position: relative; flex: 0 0 auto; padding: 9px 12px 10px;
    background: transparent; border: 0; color: var(--quiet);
    font: 13px/1.4 var(--ui); cursor: pointer; white-space: nowrap;
  }
  .viewnav button:hover { color: var(--ink); }
  .viewnav button[data-on="1"] { color: var(--ink); font-weight: 600; }
  .viewnav button[data-on="1"]::after {
    content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px;
    height: 2px; background: var(--rose);
  }
  .viewnav .n { margin-left: 5px; color: var(--quiet); font-size: 11px; font-weight: 400; }

  /* 左侧博主栏 + 右侧内容 */
  .layout {
    display: grid; grid-template-columns: 196px minmax(0, 1fr);
    gap: 46px; align-items: start;
  }
  aside#side { position: sticky; top: 26px; }
  .side-block + .side-block { margin-top: 26px; }
  .side-title {
    font: 600 10.5px/1.4 var(--ui); letter-spacing: .12em; color: var(--quiet);
    margin: 0 0 9px; text-transform: uppercase;
  }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    width: 100%; text-align: left; cursor: pointer;
    font: 13.5px/1.45 var(--ui); color: var(--quiet);
    background: transparent; border: 0; border-radius: 4px; padding: 7px 10px;
  }
  .nav button:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .nav button[data-on="1"] { color: var(--accent-fg, #fff); background: var(--accent, var(--ink)); }
  .nav button[data-on="1"] .n { opacity: .75; }
  .nav .n { font-size: 11.5px; font-variant-numeric: tabular-nums; opacity: .6; flex: 0 0 auto; }
  .notion-source { --accent: #2f3330; --accent-fg: #fff; }
  .notion-source span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .date-toggle {
    justify-content: flex-start !important;
    color: var(--rose) !important;
    font-size: 11.5px !important;
    padding: 5px 10px !important;
  }
  .date-toggle::before { content: "+"; margin-right: 5px; font-size: 13px; }
  .date-toggle[aria-expanded="true"]::before { content: "−"; }
  .content { min-width: 0; }
  .searchbar { border-bottom: 1px solid var(--rule); padding: 0 0 13px; }
  input[type=search] {
    width: 100%; padding: 10px 13px; font: 14px/1.4 var(--ui); color: var(--ink);
    background: transparent; border: 1px solid var(--rule); border-radius: 3px;
  }
  input[type=search]::placeholder { color: var(--quiet); }
  .crumb { font: 12.5px/1.6 var(--ui); color: var(--quiet); padding: 15px 0 0; }
  .crumb b { color: var(--ink); font-weight: 600; }
  main { padding: 26px 0 90px; }
  article { margin-bottom: 46px; }

  /* 句型库：列表保持阅读密度，详情才展开完整结构 */
  .library-toolbar {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 20px; padding: 18px 0 14px; border-bottom: 1px solid var(--rule);
  }
  .library-title { margin: 0; font: 600 20px/1.35 var(--zh); }
  .library-note { margin: 4px 0 0; color: var(--quiet); font-size: 12.5px; }
  .learning-summary { color: var(--quiet); font-size: 12px; text-align: right; line-height: 1.7; white-space: nowrap; }
  .learning-summary b { color: var(--ink); font-weight: 600; }
  .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 12px 0 4px; }
  .filter-label { color: var(--quiet); font-size: 11.5px; margin-right: 3px; }
  .chip {
    border: 1px solid var(--rule); border-radius: 999px; background: transparent;
    color: var(--quiet); padding: 4px 10px; font: 12px/1.4 var(--ui); cursor: pointer;
  }
  .chip:hover { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 25%, var(--rule)); }
  .chip[data-on="1"] { color: var(--ink); border-color: var(--rose); background: var(--rose-soft); }
  .pattern-library { border-top: 1px solid var(--rule); margin-top: 14px; }
  .pattern-row {
    display: grid; grid-template-columns: minmax(0, 1fr) 142px;
    gap: 22px; margin: 0; padding: 19px 0 18px; border-bottom: 1px solid var(--rule);
  }
  .pattern-row .lib-en {
    margin: 0; font-family: var(--en); font-size: 19px; line-height: 1.42;
    letter-spacing: .002em;
  }
  .pattern-row .lib-zh { margin: 4px 0 0; font-family: var(--zh); color: var(--quiet); font-size: 14.5px; line-height: 1.75; }
  .pattern-row .lib-usage { margin: 6px 0 0; color: var(--quiet); font-size: 12.5px; line-height: 1.65; }
  .pattern-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 10px; margin-top: 9px; color: var(--quiet); font-size: 11.5px; }
  .pattern-meta .scene-text { color: var(--rose); }
  .pattern-actions { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .favorite-btn, .detail-btn {
    font: 12px/1.4 var(--ui); border: 0; background: transparent; color: var(--quiet);
    cursor: pointer; padding: 3px 0; text-align: left;
  }
  .favorite-btn:hover, .detail-btn:hover { color: var(--ink); }
  .favorite-btn[data-on="1"] { color: var(--rose); }
  .mastery-select {
    width: 100%; border: 1px solid var(--rule); border-radius: 3px;
    background: var(--paper); color: var(--quiet); padding: 4px 6px; font: 11.5px/1.4 var(--ui);
  }
  .scene-overview { border-top: 1px solid var(--rule); margin-top: 16px; }
  .scene-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center;
    padding: 18px 0; border-bottom: 1px solid var(--rule);
  }
  .scene-name { margin: 0; font: 600 17px/1.4 var(--en); }
  .scene-zh { color: var(--quiet); font: 500 13px/1.6 var(--zh); margin: 2px 0 0; }
  .scene-desc { color: var(--quiet); font-size: 12.5px; margin: 5px 0 0; }
  .scene-count { color: var(--rose); font: 600 13px/1.4 var(--ui); white-space: nowrap; }
  .notion-toolbar {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 18px;
    padding: 18px 0 14px; border-bottom: 1px solid var(--rule);
  }
  .notion-title { margin: 0; font: 600 22px/1.35 var(--en); }
  .notion-sub { margin: 4px 0 0; color: var(--quiet); font: 12.5px/1.65 var(--ui); }
  .notion-sync { color: var(--quiet); font: 11.5px/1.65 var(--ui); text-align: right; white-space: nowrap; }
  .notion-filters { display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .notion-filter { display: flex; align-items: center; gap: 6px; color: var(--quiet); font: 11.5px/1.4 var(--ui); }
  .notion-filter select {
    max-width: 175px; border: 1px solid var(--rule); border-radius: 3px;
    background: var(--paper); color: var(--ink); padding: 5px 7px; font: 12px/1.4 var(--ui);
  }
  .notion-table-wrap { overflow: visible; border-bottom: 1px solid var(--rule); }
  .notion-table { width: 100%; min-width: 1000px; border-collapse: collapse; table-layout: fixed; }
  .notion-table th {
    padding: 12px 13px; text-align: left; vertical-align: bottom;
    color: color-mix(in srgb, var(--ink) 68%, var(--paper));
    font: 500 11.5px/1.4 var(--ui); border-bottom: 1px solid var(--rule);
    background: var(--paper);
  }
  .notion-table td {
    padding: 17px 13px; vertical-align: top;
    border-bottom: 1px solid color-mix(in srgb, var(--rule) 58%, transparent);
    color: color-mix(in srgb, var(--ink) 88%, var(--paper));
    font: 13.5px/1.72 var(--zh);
  }
  .notion-table tbody tr:hover td { background: color-mix(in srgb, var(--ink) 2.2%, transparent); }
  .notion-table .n-expression { width: 15%; color: var(--ink); font: 600 15.5px/1.55 var(--en); }
  .notion-table .n-expression a {
    color: inherit; text-decoration: none; text-underline-offset: 3px;
    text-decoration-color: color-mix(in srgb, var(--ink) 28%, transparent);
  }
  .notion-table .n-expression a:hover {
    text-decoration: underline; text-decoration-thickness: 1px;
  }
  .notion-table .n-category { width: 12%; }
  .notion-table .n-mastery { width: 7%; }
  .notion-table .n-meaning { width: 14%; color: var(--ink); font-size: 13.5px; }
  .notion-table .n-example { width: 18%; font-family: var(--en); font-size: 13.5px; line-height: 1.65; }
  .notion-table .n-notes { width: 16%; font-size: 13px; line-height: 1.72; }
  .notion-table .n-priority { width: 7%; }
  .notion-table .n-related { width: 11%; font-family: var(--en); font-size: 13.5px; }
  .notion-pill {
    display: inline-block; border: 1px solid transparent; border-radius: 4px; padding: 2px 7px;
    white-space: normal; background: color-mix(in srgb, var(--ink) 7%, var(--paper));
    color: color-mix(in srgb, var(--ink) 78%, var(--paper)); font: 500 11.5px/1.5 var(--ui);
  }
  .notion-pill[data-kind="category-natural"] { background: #e8f2e8; border-color: #d6e8d7; color: #315e3b; }
  .notion-pill[data-kind="category-creator"] { background: #f3e9df; border-color: #e9d9c7; color: #704a2d; }
  .notion-pill[data-kind="category-work"] { background: #e9eef5; border-color: #d8e1ed; color: #355675; }
  .notion-pill[data-kind="category-tiktok"] { background: #f6e7ea; border-color: #ecd6dc; color: #7a3d4b; }
  .notion-pill[data-kind="category-pattern"] { background: #eee9f6; border-color: #e1d8ee; color: #5c4777; }
  .notion-pill[data-kind="category-daily"] { background: #f5efdc; border-color: #ebe1c4; color: #6b5726; }
  .notion-pill[data-kind="must"], .notion-pill[data-kind="mastered"] {
    background: #f4e0e2; border-color: #ecd1d5; color: #7a3035;
  }
  .notion-pill[data-kind="learning"] { background: #f4ebc9; border-color: #e9ddaE; color: #65511a; }
  .notion-pill[data-kind="new"] { background: #ecebe5; border-color: #dfded7; color: #55534c; }
  .notion-empty { padding: 56px 20px; text-align: center; color: var(--quiet); font-family: var(--zh); }
  .notion-empty code { font-family: var(--ui); color: var(--ink); }
  .detail-back {
    border: 0; border-bottom: 1px solid var(--rule); background: transparent; color: var(--quiet);
    padding: 0 0 2px; margin-bottom: 22px; font: 12.5px/1.5 var(--ui); cursor: pointer;
  }
  .detail-back:hover { color: var(--ink); border-bottom-color: var(--ink); }
  .pattern-detail { margin: 0; }
  .detail-en { margin: 0; font: 400 28px/1.42 var(--en); max-width: 760px; }
  .detail-zh { margin: 8px 0 0; color: var(--quiet); font: 500 16px/1.8 var(--zh); }
  .detail-actions { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; margin: 18px 0 24px; }
  .detail-actions .mastery-select { width: auto; min-width: 100px; }
  .detail-section { border-top: 1px solid var(--rule); padding: 18px 0 4px; }
  .detail-section h3 { margin-top: 0; }
  .keyword-list { margin: 0; padding: 0; list-style: none; }
  .keyword-list li { display: grid; grid-template-columns: minmax(150px, 240px) 1fr; gap: 18px; padding: 7px 0; }
  .keyword-term { font: 15px/1.6 var(--en); }
  .keyword-meaning { color: var(--quiet); font-family: var(--zh); }
  .structure-box {
    margin: 0; padding: 15px 17px; border-left: 3px solid var(--rose);
    background: var(--rose-soft); font: 17px/1.65 var(--en);
  }
  .detail-example { margin: 0; font: 17px/1.7 var(--en); }
  .similar-list { display: grid; gap: 8px; }
  .similar-list button {
    border: 0; border-bottom: 1px solid var(--rule); background: transparent;
    padding: 7px 0 8px; text-align: left; color: var(--ink); font: 15px/1.5 var(--en); cursor: pointer;
  }
  .similar-list button span { display: block; margin-top: 2px; color: var(--quiet); font: 12.5px/1.5 var(--zh); }
  .source-card { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: baseline; }
  .source-title { font-family: var(--zh); font-weight: 600; }
  .source-links { display: flex; flex-wrap: wrap; gap: 16px; }
  .source-links a, .source-links button { font: 12.5px/1.5 var(--ui); color: var(--quiet); text-decoration: none; border: 0; border-bottom: 1px solid var(--rule); background: transparent; padding: 0; cursor: pointer; }
  .source-links a:hover, .source-links button:hover { color: var(--ink); border-bottom-color: var(--ink); }

  /* 每日口语那种「大字压色块」的卡片头 */
  .cover {
    background: var(--accent);
    color: var(--accent-fg);
    padding: 26px 26px 24px;
    border-radius: 4px;
  }
  .cover .who {
    font: 600 12.5px/1.5 var(--ui); letter-spacing: .04em;
    opacity: .78; display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 12px;
  }
  .cover h2 {
    font-family: var(--zh); font-size: 25px; font-weight: 700;
    margin: 0; line-height: 1.42; letter-spacing: .01em;
  }
  .cover .en-sub {
    font-family: var(--en); font-size: 16.5px; line-height: 1.5;
    margin-top: 9px; opacity: .88;
  }
  .badge {
    display: inline-block; font: 600 11.5px/1.4 var(--ui); letter-spacing: .06em;
    padding: 2px 8px; border-radius: 3px;
    border: 1px solid currentColor; opacity: .72;
  }

  .body { padding-top: 18px; }
  .summary { font-family: var(--zh); font-size: 15px; font-weight: 500; line-height: 1.95; margin: 0; }
  .flag {
    margin: 14px 0 0; padding: 7px 11px; border-left: 2px solid var(--rule);
    font-size: 12.5px; color: var(--quiet);
  }
  h3 {
    font: 600 12px/1.4 var(--ui); color: var(--quiet); letter-spacing: .08em;
    margin: 28px 0 10px; text-transform: uppercase;
  }
  ul.points { margin: 0; padding: 0; list-style: none; }
  ul.points li {
    font-family: var(--zh); font-size: 14.8px; font-weight: 500; line-height: 1.9;
    padding-left: 15px; position: relative;
  }
  ul.points li::before {
    content: ""; position: absolute; left: 0; top: .74em;
    width: 5px; height: 5px; background: var(--accent); border-radius: 50%;
  }

  /* 视频卡片：句型 + 时间轨 */
  .pattern {
    display: grid; grid-template-columns: 62px 1fr; column-gap: 14px;
    padding: 14px 0; border-top: 1px solid var(--rule);
  }
  .patterns > .pattern:first-child { border-top: 0; }
  .rail { padding-top: 3px; }
  .time {
    font: 12.5px/1.6 var(--ui); font-variant-numeric: tabular-nums; letter-spacing: .04em;
    color: var(--quiet); background: transparent; border: 0; padding: 0; cursor: pointer; white-space: nowrap;
  }
  .time::before { content: "▶"; font-size: 8px; margin-right: 5px; vertical-align: 1px; }
  .time:hover { color: var(--ink); }
  .pat-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .en { font-family: var(--en); font-size: 18px; line-height: 1.4; }
  .zh { font-family: var(--zh); font-size: 15px; font-weight: 500; line-height: 1.7; color: var(--quiet); }
  .usage { font-size: 12.5px; color: var(--quiet); margin-top: 4px; }
  .ex {
    font-family: var(--en); font-size: 15.5px; line-height: 1.6;
    margin-top: 7px; padding-left: 11px; border-left: 2px solid var(--rule);
  }

  /* 图文卡片：中文 / 英文原文 / 更地道的说法 */
  .qa { margin: 0; }
  .qa-row { display: grid; grid-template-columns: 68px 1fr; column-gap: 14px; padding: 12px 0; border-top: 1px solid var(--rule); }
  .qa-row:first-child { border-top: 0; }
  .qa-label {
    font: 600 11.5px/1.9 var(--ui); color: var(--quiet); letter-spacing: .06em;
  }
  .qa-row p { margin: 0; }
  .qa-zh { font-family: var(--zh); font-size: 16px; font-weight: 500; line-height: 1.9; }
  .qa-en { font-family: var(--en); font-size: 17.5px; line-height: 1.62; }
  .full-en {
    font-family: var(--en); font-size: 17.5px; line-height: 1.78;
    margin: 0; padding: 15px 17px;
    border-left: 3px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 13%, transparent);
    border-radius: 0 3px 3px 0;
  }
  .idioms { display: flex; flex-direction: column; gap: 18px; }
  .idiom { padding-left: 14px; border-left: 3px solid var(--accent); }
  .idiom .was { font-family: var(--en); font-size: 14.5px; color: var(--quiet); line-height: 1.55; text-decoration: line-through; text-decoration-color: var(--rule); }
  .idiom .now { font-family: var(--en); font-size: 18px; line-height: 1.5; margin-top: 5px; }
  .idiom .why { font-family: var(--zh); font-size: 13.5px; font-weight: 500; color: var(--quiet); margin-top: 5px; line-height: 1.8; }
  .slides { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .slides a { display: block; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
  .slides img { display: block; width: 100%; height: auto; }

  .player { margin-top: 16px; }
  .player video { width: 100%; max-height: 360px; background: #000; display: block; }
  .hits { margin-top: 14px; display: flex; flex-direction: column; gap: 5px; }
  .hit { display: grid; grid-template-columns: 62px 1fr; column-gap: 14px; font-size: 13.5px; }
  .hit-text { font-family: var(--zh); color: var(--quiet); }
  .actions { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 22px; align-items: baseline; }
  .act {
    font: 13px/1.6 var(--ui); color: var(--quiet); background: transparent; border: 0; padding: 0;
    cursor: pointer; text-decoration: none; border-bottom: 1px solid var(--rule);
  }
  .act:hover { color: var(--ink); border-bottom-color: var(--ink); }
  .empty { color: var(--quiet); padding: 70px 0 0; text-align: center; font-family: var(--zh); }
  footer { color: var(--quiet); font-size: 12.5px; padding: 0 0 60px; }
  mark { background: var(--mark); color: inherit; padding: 0 1px; }
  .hl {
    background: var(--mark); color: var(--ink);
    border-radius: 2px; padding: 0 1px;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }
  .gesture-hint {
    color: var(--quiet); font-size: 11.5px; line-height: 1.5;
    margin-top: 7px; text-align: right;
  }
  .selection-tools {
    position: fixed; z-index: 80;
    display: flex; align-items: center; gap: 2px;
    padding: 4px; border: 1px solid color-mix(in srgb, var(--ink) 20%, var(--paper));
    border-radius: 5px; background: var(--paper);
    box-shadow: 0 8px 26px color-mix(in srgb, var(--ink) 16%, transparent);
  }
  .selection-tools[hidden] { display: none; }
  .selection-tools button {
    font: 12.5px/1.4 var(--ui); color: var(--ink);
    background: transparent; border: 0; border-radius: 3px;
    padding: 6px 9px; cursor: pointer; white-space: nowrap;
  }
  .selection-tools button:hover {
    background: color-mix(in srgb, var(--ink) 7%, transparent);
  }
  .selection-tools button[data-primary="1"] {
    background: var(--mark); color: #1a1a18;
  }
  .speak-toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 90;
    transform: translate(-50%, 10px); pointer-events: none;
