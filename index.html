<title>小红书英语知识库</title>
<style>
  :root {
    --paper: #fbfbf9;
    --ink: #191917;
    --quiet: #6d6c66;
    --rule: #e6e5e0;
    --mark: #ffe680;
    --en: Constantia, Cambria, Georgia, "Times New Roman", serif;
    --zh: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
    --ui: "Segoe UI", "Noto Sans SC", "Microsoft YaHei", -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #131312;
      --ink: #ecebe6;
      --quiet: #96958c;
      --rule: #2b2b28;
      --mark: rgba(255, 230, 128, .24);
    }
  }
  * { box-sizing: border-box; }
  body {

    background: var(--paper);
    color: var(--ink);
    font: 15px/1.75 var(--ui);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 28px; }
  header { padding: 54px 0 18px; }
  h1 {
    font-family: var(--zh);

  .sub { color: var(--quiet); font-size: 13px; }
  .sub span + span { margin-left: 18px; }
  .sub b { color: var(--ink); font-weight: 600; }
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding: 12px 0;
  }
  .toolbar-inner { display: flex; flex-direction: column; gap: 10px; }
  input[type=search] {
    width: 100%; padding: 10px 13px; font: 14px/1.4 var(--ui); color: var(--ink);

  input[type=search]::placeholder { color: var(--quiet); }
  .chips { display: flex; flex-wrap: wrap; gap: 18px; }
  .chip {
    color: var(--quiet); font-size: 13px; cursor: pointer; user-select: none;
    padding-bottom: 1px; border-bottom: 1px solid transparent;
  }
  .chip:hover { color: var(--ink); border-bottom-color: var(--rule); }
  .chip[data-on="1"] { color: var(--ink); border-bottom-color: var(--ink); }
  main { padding: 30px 0 90px; }
  article + article { border-top: 1px solid var(--rule); margin-top: 40px; padding-top: 40px; }
  .meta { display: flex; flex-wrap: wrap; gap: 0 16px; font-size: 12.5px; color: var(--quiet); }
  .creator { color: var(--ink); font-weight: 600; }
  h2 { font-family: var(--zh); font-size: 19px; font-weight: 600; margin: 9px 0 0; line-height: 1.55; }
  .summary { font-family: var(--zh); font-size: 15px; font-weight: 500; line-height: 1.95; margin: 11px 0 0; color: var(--ink); }
  .flag {
    margin: 12px 0 0; padding: 7px 11px; border-left: 2px solid var(--rule);
    font-size: 12.5px; color: var(--quiet); background: transparent;
  }
  h3 { font-size: 12.5px; font-weight: 600; color: var(--quiet); margin: 26px 0 4px; letter-spacing: .02em; }
  ul.points { margin: 0; padding: 0; list-style: none; }
  ul.points li { font-family: var(--zh); font-size: 14.8px; font-weight: 500; line-height: 1.9; padding-left: 15px; position: relative; }
  ul.points li::before {
    content: ""; position: absolute; left: 0; top: .72em;
    width: 5px; height: 5px; background: var(--quiet); border-radius: 50%;
  }
  .pattern {
    display: grid; grid-template-columns: 62px 1fr; column-gap: 14px;
    padding: 14px 0; border-top: 1px solid var(--rule);
  }
  .patterns > .pattern:first-child { border-top: 0; }
  .rail { padding-top: 3px; }
  .time {
    font: 12.5px/1.6 var(--ui); font-variant-numeric: tabular-nums; letter-spacing: .04em;
    color: var(--quiet); background: transparent; border: 0; padding: 0; cursor: pointer; white-space: nowrap;
  }
  .time::before { content: "▶"; font-size: 8px; margin-right: 5px; vertical-align: 1px; }
  .time:hover { color: var(--ink); }
  .time:hover::after { content: ""; display: block; height: 1px; background: var(--ink); margin-top: 1px; }
  .pat-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .en { font-family: var(--en); font-size: 18px; line-height: 1.4; color: var(--ink); }
  .zh { font-family: var(--zh); font-size: 15px; font-weight: 500; line-height: 1.7; color: var(--quiet); }
  .usage { font-size: 12.5px; color: var(--quiet); margin-top: 4px; }
  .ex {
    font-family: var(--en); font-size: 15.5px; line-height: 1.6; color: var(--ink);
    margin-top: 7px; padding-left: 11px; border-left: 2px solid var(--rule);
  }
  .player { margin-top: 16px; }
  .player video { width: 100%; max-height: 360px; background: #000; display: block; }
  .hits { margin-top: 14px; display: flex; flex-direction: column; gap: 5px; }
  .hits h3 { margin-top: 0; }
  .hit { display: grid; grid-template-columns: 62px 1fr; column-gap: 14px; font-size: 13.5px; }
  .hit-text { font-family: var(--zh); color: var(--quiet); }
  .actions { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 22px; align-items: baseline; }
  .act {
    font: 13px/1.6 var(--ui); color: var(--quiet); background: transparent; border: 0; padding: 0;
    cursor: pointer; text-decoration: none; border-bottom: 1px solid var(--rule);
  }
  .act:hover { color: var(--ink); border-bottom-color: var(--ink); }
  .empty { color: var(--quiet); padding: 70px 0 0; text-align: center; font-family: var(--zh); }
  footer { color: var(--quiet); font-size: 12.5px; padding: 0 0 60px; }
  mark { background: var(--mark); color: inherit; padding: 0 1px; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    header { padding: 30px 0 12px; }
    h1 { font-size: 20px; }
    main { padding: 22px 0 70px; }
    article + article { margin-top: 30px; padding-top: 30px; }
    h2 { font-size: 17.5px; }
    .pattern { grid-template-columns: 1fr; row-gap: 6px; padding: 14px 0; }
    .rail { padding-top: 0; }
    .hit { grid-template-columns: 1fr; row-gap: 2px; }
    .player video { max-height: 240px; }
    input[type=search] { font-size: 16px; }
  }
</style>

0d1.mp4"},{"noteId":"6ac44d60000000001a029e90","creator":"William","title":"这些日常用语，你会用英语说吗？","publishedAt":"2026-10-08T03:53:00.000Z","durationSeconds":50.4,"likes":"58","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44d60000000001a029e90?xsec_token=ABJJEVXqZom342wHuvi159oecZ0AgVQuy0kHnvFZHs7bs=&xsec_source=pc_user","ipLocation":"安徽","summary":"这条视频用一连串生活场景对话，教人描述物品“出状况”时该怎么说英语：碗磕了口、椅子晃、金属凹了，还有“这里的东西都旧了”。跟着看能学会 chipped、wobbly、dented 这类高频形容词，以及 seen better days 这种地道说法。","tags":["日常英语","英语口语","地道表达","状态形容词"],"keyPoints":["视频用一个接一个的实物场景（缺口的碗、摇晃的椅子、凹陷的金属），把描述物品破损状态的形容词串起来教。","chipped、wobbly、dented 都用来形容东西“有毛病”，但分别对应缺口、晃动、凹陷三种不同情况。","除了单词，还教了两个地道说法：seen better days 和 used to be in much better condition，用来形容东西旧了、不如从前。","每出现一个新词，对话里都会紧跟一句解释或追问，方便理解词的准确含义。"],"patterns":[{"en":"chipped","zh":"有缺口的、磕破的","usage":"形容碗盘、杯子等边缘掉了一小块时用。","example":"Oh, it's chipped.","start":4.98},{"en":"wobbly","zh":"摇晃的、不稳的","usage":"形容桌椅等因为不稳而会晃动的物体时用。","example":"It's wobbly.","start":14.18},{"en":"dented","zh":"有凹陷的、被撞瘪的","usage":"形容金属等硬物表面被撞出坑时用。","example":"Oh, it's dented.","start":24.66},{"en":"a small piece broke off","zh":"掉了一小块","usage":"解释某处缺口是怎么形成的时候用。","example":"You mean a small piece broke off?","start":6.98},{"en":"What's wrong with ...?","zh":"……怎么了？出什么问题了？","usage":"看到某样东西不太对劲，想开口问原因时用。","example":"Whoa, what's wrong with this chair?","start":11.7},{"en":"got pushed in","zh":"被压进去、凹进去了","usage":"指着某处凹陷，说明它是被外力压出来的时候用。","example":"See how the metal got pushed in right here?","start":27.06},{"en":"seen better days","zh":"不如从前了、有点旧了","usage":"委婉地说东西虽然还能用，但状态已经很旧很差时用。","example":"everything around here has seen better days","start":29.14},{"en":"used to be in much better condition","zh":"以前状况好得多","usage":"强调某物过去的状态比现在好很多时用。","example":"all of this stuff used to be in much better condition","start":36.62}],"quotes":[{"text":"Wait, why is there a piece missing from this bowl?","start":0,"matched":true},{"text":"Oh, it's chipped.","start":4.98,"matched":true},{"text":"So it moves because it's not stable?","start":16.18,"matched":true},{"text":"everything around here has seen better days","start":29.14,"matched":true}],"partial":false,"partialReason":null,"transcriptPath":"C:\\Users\\加勒比海带\\Documents\\Codex\\2026-10-04\\new-chat\\work\\transcripts\\6ac44d60000000001a029e90.json","transcript":[{"t":0,"x":"Wait, why is there a piece missing from this bowl?"},{"t":4.98,"x":"Oh, it's chipped."},{"t":6.18,"x":"Chipped?"},{"t":6.98,"x":"You mean a small piece broke off?"},{"t":9.14,"x":"Yeah, exactly."},{"t":10.26,"x":"Great."},{"t":11.7,"x":"Whoa, what's wrong with this chair?"},{"t":14.18,"x":"It's wobbly."},{"t":15.22,"x":"Wobbly?"},{"t":16.18,"x":"So it moves because it's not stable?"},{"t":19.46,"x":"Yeah, that's right."},{"t":20.82,"x":"Wonderful."},{"t":22.74,"x":"What happened to that?"},{"t":24.1,"x":"This?"},{"t":24.66,"x":"Oh, it's dented."},{"t":26.34,"x":"Dented?"},{"t":27.06,"x":"See how the metal got pushed in right here?"},{"t":29.14,"x":"that's a dent oh I see so that's a dent yeah everything around here has seen"},{"t":36.62,"x":"better days seen better days are you saying that all of this stuff used to"},{"t":41.1,"x":"be in much better condition yeah exactly hmm you've seen better days too excuse"},{"t":47.26,"x":"me nothing no no what did you say"}],"mediaFile":"6ac44d60000000001a029e90.mp4","media":"media/6ac44d60000000001a029e90.mp4"},{"noteId":"6ac44d2c000000001a029e2b","creator":"William","title":"合租室友太双标，你会如何应对？","publishedAt":"2026-10-07T10:22:01.000Z","durationSeconds":41.7,"likes":"41","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44d2c000000001a029e2b?xsec_token=ABJJEVXqZom342wHuvi159oZ0ltMB8zFdCwJ5b-dodJ60=&xsec_source=pc_user","ipLocation":"安徽","summary":"这是一段合租室友吵架的口语对话，William 和室友互相指责对方邋遢、不体谅人、双标，最后以「放马过来吧」收场。视频把吵架时高频的地道表达逐个拆解并解释含义，适合学习如何用英语表达不满、反问和回怼。","tags":["英语口语","地道表达","合租冲突","吵架回怼"],"keyPoints":["视频用一段室友争执的短对话，演示了英语吵架时最常用的指责、反问和挑衅表达。","每个关键词都会立刻用英文解释一遍，例如 slob、inconsiderate、hypocrite 的含义。","反问句 Are you saying...? 是这对话里推动冲突升级的核心句式。","结尾的 Come at me, bro. 是口语中很有挑衅感的说法，语气比字面意思更强硬。"],"patterns":[{"en":"Are you serious?","zh":"你是认真的吗？","usage":"对方说的话让你难以置信或觉得离谱时用来反问。","example":"Are you serious? Look at this place.","start":0},{"en":"You're such a slob.","zh":"你真是太邋遢了。","usage":"直接指责对方又脏又乱、不收拾时使用。","example":"You're such a slob.","start":0},{"en":"Excuse me?","zh":"你说什么？/ 你再说一遍？","usage":"觉得对方的话冒犯或不服气时，用上扬语气反问回去。","example":"Excuse me? At least I'm not inconsiderate.","start":7.04},{"en":"At least I'm not inconsiderate.","zh":"至少我没那么不体谅人。","usage":"被指责后用来自我辩护，同时反手讽刺对方。","example":"Excuse me? At least I'm not inconsiderate.","start":7.04},{"en":"Are you saying ...?","zh":"你是在说……吗？","usage":"确认对方话里的隐含意思，通常带点火药味。","example":"Are you saying I don't care how my actions affect other people?","start":12.16},{"en":"You're such a hypocrite.","zh":"你真是个双标的人。","usage":"说别人说一套做一套、只要求别人不要求自己时使用。","example":"Oh please, you're such a hypocrite.","start":21.52},{"en":"Practice what you preach.","zh":"自己先做到再要求别人。","usage":"批评对方光会嘴上讲道理、自己却不照做时用。","example":"Practice what you preach.","start":29.54},{"en":"Come at me, bro.","zh":"放马过来吧，兄弟。","usage":"口语里带挑衅意味地表示随时奉陪、不服就打。","example":"Come at me, bro.","start":38.1}],"quotes":[{"text":"Are you serious? Look at this place. You're such a slob.","start":0,"matched":true},{"text":"Excuse me? At least I'm not inconsiderate.","start":7.04,"matched":true},{"text":"You leave your dirty dishes in the sink every night.","start":17.52,"matched":true},{"text":"Come at me, bro.","start":38.1,"matched":true}],"partial":false,"partialReason":null,"transcriptPath":"C:\\Users\\加勒比海带\\Documents\\Codex\\2026-10-04\\new-chat\\work\\transcripts\\6ac44d2c000000001a029e2b.json","transcript":[{"t":0,"x":"Are you serious? Look at this place. You're such a slob."},{"t":3.52,"x":"A slob? You mean someone who's really messy?"},{"t":7.04,"x":"Yes. Look around. Excuse me? At least I'm not inconsiderate."},{"t":12.16,"x":"Inconsiderate me? Are you saying I don't care how my actions affect other people?"},{"t":17.52,"x":"Exactly. You leave your dirty dishes in the sink every night."},{"t":21.52,"x":"Oh please, you're such a hypocrite."},{"t":23.92,"x":"A hypocrite? Like I tell you what to do but I don't even do it myself?"},{"t":28.16,"x":"Exactly."},{"t":29.54,"x":"Practice what you preach."},{"t":31.1,"x":"Practice what you preach?"},{"t":32.18,"x":"Are you telling me that I can't tell you this stuff"},{"t":34.3,"x":"because I don't do it myself?"},{"t":35.82,"x":"Yeah."},{"t":36.7,"x":"Okay, you know what?"},{"t":38.1,"x":"Come at me, bro."},{"t":38.94,"x":"Oh, are you sure?"},{"t":39.78,"x":"Are you sure?"},{"t":40.62,"x":"Come on."}],"mediaFile":"6ac44d2c000000001a029e2b.mp4","media":"media/6ac44d2c000000001a029e2b.mp4"},{"noteId":"6ac44cfe000000001500f89c","creator":"William","title":"遇到这些情况，你会用英语描述吗？","publishedAt":"2026-10-07T04:21:00.000Z","durationSeconds":41.5,"likes":"39","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44cfe000000001500f89c?xsec_token=ABJJEVXqZom342wHuvi159oSRe0Cw3wwUywMOxJksJLyM=&xsec_source=pc_user","ipLocation":"安徽","summary":"这段视频还原了面对一团糟的厨房时，如何用英语吐槽脏乱场景。通过对话形式，可以学到描述黏手、掉渣、剩饭等日常生活问题的地道说法。","tags":["实用英语","日常口语","厨房场景","地道表达"],"keyPoints":["视频用一段厨房对话演示如何抱怨脏乱环境，场景非常贴近日常生活。","重点词汇包括 sticky（黏的）、crumbs（碎屑）、leftovers（剩饭）。","句型上涵盖了抱怨、追问、确认和决定行动等常见口语功能。"],"patterns":[{"en":"What's going on?","zh":"怎么了？发生什么事了？","usage":"看到异常情况、想询问对方发生什么时用。","example":"Oh my god. What's going on?","start":0},{"en":"This kitchen is a mess.","zh":"这个厨房一团糟。","usage":"抱怨某个地方又脏又乱时用。","example":"This kitchen is a mess.","start":0},{"en":"I can't live like this anymore.","zh":"我再也受不了这样了。","usage":"表达对某种状况忍无可忍时用。","example":"I can't live like this anymore.","start":0},{"en":"it's like glue","zh":"就像胶水一样。","usage":"想形容某种东西特别黏、黏得甩不掉时用。","example":"it's like glue","start":null},{"en":"Do you mean sticky?","zh":"你是说黏黏的吗？","usage":"对方描述不清时，用关键词帮他把意思说出来。","example":"Oh, do you mean sticky?","start":13.96},{"en":"get stuck to my feet","zh":"粘在我脚上。","usage":"描述碎屑、纸片之类的东西粘在脚底时用。","example":"all these crumbs just get stuck to my feet","start":28.24},{"en":"there's some food left afterwards","zh":"之后会剩下一些食物。","usage":"说明吃完饭后还有剩余食物时用。","example":"there's some food left afterwards","start":33.4},{"en":"it's time for me to clean","zh":"我该打扫了。","usage":"觉得该动手做某件事时用，后面可替换成其他动词。","example":"I think it's time for me to clean","start":39.04}],"quotes":[{"text":"This kitchen is a mess.","start":0,"matched":true},{"text":"I can't live like this anymore.","start":0,"matched":true},{"text":"Oh, do you mean sticky?","start":13.96,"matched":true},{"text":"I think it's time for me to clean","start":39.04,"matched":true}],"partial":false,"partialReason":null,"transcriptPath":"C:\\Users\\加勒比海带\\Documents\\Codex\\2026-10-04\\new-chat\\work\\transcripts\\6ac44cfe000000001500f89c.json","transcript":[{"t":0,"x":"Oh my god. What's going on? This kitchen is a mess. I can't live like this anymore. Like the counter it's"},{"t":7.64,"x":"it's not wet, but"},{"t":9.76,"x":"it's like"},{"t":11.48,"x":"glue my hand is like"},{"t":13.96,"x":"Staying on it. Oh, do you mean sticky? Yeah sticky disgusting and when I walk all these little food"},{"t":22.64,"x":"Pieces, they just you know attack my feet. Oh, yeah all these crumbs"},{"t":28.24,"x":"yeah crumbs all these crumbs just get stuck to my feet and then you know you"},{"t":33.4,"x":"eat but then there's some food left afterwards oh yeah leftovers yeah I"},{"t":39.04,"x":"think it's time for me to clean"}],"mediaFile":"6ac44cfe000000001500f89c.mp4","media":"media/6ac44cfe000000001500f89c.mp4"},{"noteId":"6ac44cc7000000001500f814","creator":"William","title":"当你遇到这人这事，你会说...？","publishedAt":"2026-10-06T10:22:01.000Z","durationSeconds":46.6,"likes":"44","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44cc7000000001500f814?xsec_token=ABJJEVXqZom342wHuvi159oQNhLq9RVozPKtlPKhz2YKo=&xsec_source=pc_user","ipLocation":"安徽","summary":"这是一条生活场景英语短视频：William 在吃东西时被人直接伸手拿食物，他语气不好地回了一句，对方听不懂，于是顺势讲解 snap at someone 这个表达。看完能学会几个拿别人食物、被人凶、偷吃一口等日常互动里的地道说法。","tags":["生活英语","英语口语","地道表达","词汇辨析"],"keyPoints":["to snap at someone 指带着怒气和刻薄的语气对人说话，不一定是大喊。","steal a bite 是口语里「偷吃一口、蹭一口」的说法，常用来指没打招呼就吃别人东西。","视频用「没问过就拿我吃的」和「snap at someone」两个点串起了一段很日常的对话。","遇到听不懂的表达时，可以直接用 what does that mean 追问。"],"patterns":[{"en":"What you doing?","zh":"你干嘛呢？","usage":"熟人之间随口打招呼、问对方正在做什么。","example":"Hey, what you doing?","start":0.24},{"en":"let me have some","zh":"让我也来点儿吧","usage":"看到别人在吃东西，想分一口时用。","example":"Oh, yeah, let me have some","start":0.24},{"en":"you didn't have to ...","zh":"你没必要……","usage":"觉得对方反应过激、做得太过了的时候说。","example":"you didn't have to snap at me like that","start":5.91},{"en":"what does that mean","zh":"那是什么意思","usage":"听到不懂的表达，直接追问对方。","example":"what does that mean","start":11.79},{"en":"snap at someone","zh":"冲某人发火、没给好气地说话","usage":"形容因为生气而语气很冲、很刻薄地回应别人。","example":"to snap at someone means to speak angrily and harshly","start":11.79},{"en":"steal a bite","zh":"偷吃一口、蹭一口","usage":"说别人没问过就吃了一口你的东西。","example":"do you mean you don't like when people steal a bite?","start":32.37},{"en":"I snap at people when they ...","zh":"别人……的时候我会冲他们发火","usage":"解释自己在什么情况下会控制不住脾气。","example":"I snap at people when they try to steal a bite.","start":32.37},{"en":"Where can I learn more of this vocabulary?","zh":"我在哪儿能学到更多这类词汇？","usage":"想问对方还有没有更多相关内容可以学。","example":"where can I learn more of this vocabulary?","start":38.01}],"quotes":[{"text":"you didn't have to snap at me like that","start":5.91,"matched":true},{"text":"I snapped at you because I don't like when people take my food without like asking","start":16.15,"matched":true},{"text":"I snap at people when they try to steal a bite.","start":32.37,"matched":true},{"text":"can I have some now?","start":42.33,"matched":true}],"partial":false,"partialReason":null,"transcriptPath":"C:\\Users\\加勒比海带\\Documents\\Codex\\2026-10-04\\new-chat\\work\\transcripts\\6ac44cc7000000001500f814.json","transcript":[{"t":0.24,"x":"Hey, what you doing? I'm eating. Oh, yeah, let me have some whoa. No"},{"t":5.91,"x":"What are you whoa you didn't have to snap at me like that wait what snap"},{"t":11.79,"x":"Wait, what what does that mean to snap at someone means to speak?"},{"t":16.15,"x":"Angrily and and harshly. Oh, yeah, I snapped at you because I don't like when people"},{"t":22.71,"x":"people take my food without like asking or just take my food in general do you"},{"t":32.37,"x":"mean you don't like when people steal a bite? oh yeah I snap at people when they"},{"t":38.01,"x":"try to steal a bite. where can I learn more of this vocabulary? oh you can"},{"t":42.33,"x":"always follow this account to learn more. can I have some now? no okay"}],"mediaFile":"6ac44cc7000000001500f814.mp4","media":"media/6ac44cc7000000001500f814.mp4"},{"noteId":"6ac44c980000000018039101","creator":"William","title":"你在生活中会遇到这种人...？","publishedAt":"2026-10-06T03:40:04.000Z","durationSeconds":46.5,"likes":"154","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44c980000000018039101?xsec_token=ABJJEVXqZom342wHuvi159obpjaGMf58Qn_yG7ULSCTsY=&xsec_source=pc_user","ipLocation":"安徽","summary":"这条视频用一段“最后一块饼干被吃掉”的争吵对话，演示了英语里指责对方时最常用的几个词。博主一人分饰两角，把 petty、defensive、overreacting、blow out of proportion 等词放进真实的互怼场景里，同时给出它们的解释。适合想学会在吵架时用地道英语表达不满的人。","tags":["英语口语","地道表达","争吵场景","词汇辨析"],"keyPoints":["视频只用一段饼干被吃掉的日常小冲突，就串起了四个互相指责的高频形容词和短语。","每个被指责的词后面，被指责的人都会反问一遍并复述它的意思，等于自带词典解释。","这些词都属于吵架时“说对方反应过度、太小气、太防御”的固定套路表达。","结尾用 blow something out of proportion 做了个喜剧式的升级，说明这个短语可以反过来威胁使用。"],"patterns":[{"en":"you're being so petty","zh":"你太斤斤计较了／你太小气了","usage":"觉得对方为一件小事较真、不值得计较时用。","example":"Oh my god, you're being so petty.","start":4.2},{"en":"get upset over something","zh":"因为某事而生气／不高兴","usage":"描述自己或别人为了某件具体的事恼火时用。","example":"Like I'm getting upset over something small and unimportant?","start":7.8},{"en":"Why are you getting so defensive?","zh":"你怎么这么防御心重／这么玻璃心？","usage":"对方一被指出问题就急着辩解时反问。","example":"Why are you getting so defensive?","start":15.9},{"en":"You started it.","zh":"是你先挑起的。","usage":"把责任推回给对方、强调冲突由对方引起时用。","example":"You started it.","start":22.1},{"en":"You're completely overreacting.","zh":"你完全反应过度了。","usage":"认为对方的情绪或举动明显超过事情本身应得的程度时用。","example":"You're completely overreacting.","start":25.9},{"en":"blow this way out of proportion","zh":"把这件事过度放大／小题大做","usage":"说对方把一件小事搞成了大问题。","example":"Yes, you're blowing this way out of proportion.","start":32.76},{"en":"than it needs to be","zh":"比它本应有的程度更……","usage":"接在比较级后面，说明某件事被夸张到超出必要程度。","example":"than it needs to be?","start":38.56},{"en":"Are you serious right now?","zh":"你现在是认真的吗？","usage":"对眼前对方的行为感到难以置信时脱口而出。","example":"Are you serious right now?","start":43.2}],"quotes":[{"text":"Did you seriously eat the last cookie?","start":0,"matched":true},{"text":"I was saving that.","start":3.1,"matched":true},{"text":"It's a cookie.","start":12.2,"matched":true},{"text":"I'm just protecting myself because you're criticizing me.","start":19.2,"matched":true}],"partial":false,"partialReason":null,"transcriptPath":"C:\\Users\\加勒比海带\\Documents\\Codex\\2026-10-04\\new-chat\\work\\transcripts\\6ac44c980000000018039101.json","transcript":[{"t":0,"x":"Did you seriously eat the last cookie?"},{"t":2.4,"x":"Yeah."},{"t":3.1,"x":"I was saving that."},{"t":4.2,"x":"Oh my god, you're being so petty."},{"t":6.6,"x":"Petty?"},{"t":7.8,"x":"Like I'm getting upset over something small and unimportant?"},{"t":11.1,"x":"Yes."},{"t":12.2,"x":"It's a cookie."},{"t":13.3,"x":"Well, maybe if you weren't so selfish."},{"t":15.9,"x":"Why are you getting so defensive?"},{"t":17.8,"x":"Defensive?"},{"t":19.2,"x":"I'm just protecting myself because you're criticizing me."},{"t":22.1,"x":"You started it."},{"t":23.2,"x":"Because you ate my cookie."},{"t":25.9,"x":"You're completely overreacting."},{"t":28.4,"x":"Overreacting?"},{"t":29.4,"x":"you think my reaction is stronger than the situation deserves?"},{"t":32.76,"x":"Yes, you're blowing this way out of proportion."},{"t":35.52,"x":"Are you saying I'm making the situation way more serious"},{"t":38.56,"x":"than it needs to be?"},{"t":39.52,"x":"Yeah."},{"t":40.36,"x":"Oh, you wanna see me blow something out of proportion?"},{"t":43.2,"x":"Are you serious right now?"},{"t":44.7,"x":"Let's see how you like that."}],"mediaFile":"6ac44c980000000018039101.mp4","media":"media/6ac44c980000000018039101.mp4"},{"noteId":"6abfa28c00000000140383bc","creator":"瑞秋爱玛","title":"全英｜失业近五个月，只为等外企offer…","publishedAt":"2026-10-02T12:24:44Z","durationSeconds":217.3,"likes":"74","noteUrl":"https://www.xiaohongshu.com/user/profile/61361d670000000002019d71/6abfa28c00000000140383bc?xsec_token=ABv3RalkvFCSrUwbgHRIf3-_iJGkb2hLPypZDn95H5H9Y=&xsec_source=pc_user","ipLocation":"上海","summary":"在外企和私企都待过的亲身对比，从加班、工作范围、团队氛围、请假制度一路讲到年会，全程英语叙述，适合练「对比陈述」的句式。","tags":["全英播客","职场英语","对比论述"],"keyPoints":["对比类口播的万能结构：先立维度（加班/工作量/氛围/请假/年会），再逐条对比","描述公司文化的高频词：work-life boundaries、job scope、proper boundaries、office politics","讲自己的经历时用 During my stay at …, I would have to … 这种过去习惯句式","ASR 提示：结尾一段识别质量差（出现 keyboard 等无关词），引用时建议回看原片"],"patterns":[{"en":"respect work-life boundaries","zh":"尊重工作与生活的边界","usage":"形容公司不侵占私人时间","example":"Multinationals generally respect work-life boundaries.","start":27.79},{"en":"Once your tasks are wrapped up, you can log off.","zh":"活干完就能下线。","usage":"wrap up = 收尾完成，log off 比 leave 更贴线上办公","example":"Once your assigned tasks are wrapped up, you can log off.","start":35.79},{"en":"You are expected to stay reachable at work.","zh":"要求你随时能被联系上。","usage":"be expected to 表达隐性要求，比 must 更准","example":"In private companies, you are expected to stay reachable.","start":44.79},{"en":"a daily occurrence","zh":"每天都会发生的事","usage":"描述常态化的加班或状况","example":"Getting off work at 10pm is a daily occurrence.","start":46.79},{"en":"value efficiency over looking busy","zh":"看重效率，而不是看起来很忙","usage":"A over B 句式，对比两种取向","example":"Foreign companies value efficiency over looking busy.","start":72.95},{"en":"job boundaries tend to be blurry","zh":"职责边界往往很模糊","usage":"tend to be 表示普遍倾向","example":"For local private firms, job boundaries tend to be blurry.","start":77.63},{"en":"maintain proper boundaries","zh":"保持恰当的距离","usage":"形容同事之间不过界","example":"Colleagues maintain proper boundaries.","start":97.1},{"en":"asking for leave still feels like asking for a favor","zh":"请假还是像在求人。","usage":"feel like + 动名词，描述主观感受","example":"In many private companies, asking for leave still feels like asking for a favor.","start":140.46},{"en":"leave released by the hour","zh":"按小时批假","usage":"描述苛刻的请假制度","example":"A leave was released by the hour, meaning you have to work until you get eight hours.","start":154.13}],"quotes":[{"text":"Foreign companies usually have clear job descriptions. Your responsibilities are well defined and value efficiency over looking busy.","start":70.15,"matched":true},{"text":"In many private companies, asking for leave still feels like asking for a favor.","start":140.46,"matched":true}],"partial":false,"partialReason":null,"transcriptPath":"C:\\Users\\加勒比海带\\Documents\\Codex\\2026-10-04\\new-chat\\work\\transcripts\\6abfa28c00000000140383bc.json","transcript":[{"t":0,"x":"As you guys know, I find a new job at a multinational company after five months of gap."},{"t":5.07,"x":"What you probably don't know is that one's worked at a private local company."},{"t":9.47,"x":"You may wonder what's the real difference between the two."},{"t":12.11,"x":"Today we are skipping those one-sided stereotypes."},{"t":15.07,"x":"Let's talk about the actual differences I've observed from overtime, workload, team"},{"t":20.59,"x":"vibe, leave policy all the way to annual parties."},{"t":25.95,"x":"First, overtime and working hours."},{"t":27.79,"x":"Multinationalists generally respect work-life boundaries."},{"t":31.79,"x":"Overtime is only for exceptional cases, never a counter-expectation."},{"t":35.79,"x":"Once your assigned tasks are wrapped up, you can log off."},{"t":39.79,"x":"The person time is respected, but private companies may operate with a different mindset."},{"t":44.79,"x":"You are expected to stay reachable at work."},{"t":46.79,"x":"During my stay at that private company, getting off work at 10pm is a daily occurrence."},{"t":51.79,"x":"If there happens to be a special occasion like annual meetings or exhibitions,"},{"t":55.79,"x":"decisions, I would have to stand by for the whole night."},{"t":58.79,"x":"I simply could not understand why there are so many things to do and why those things"},{"t":62.43,"x":"have to be done with such urgency."},{"t":67.95,"x":"Next workload and job scope."},{"t":70.15,"x":"Foreign companies usually have clear job descriptions."},{"t":72.95,"x":"Your responsibilities are where defined and value efficiency over looking busy."},{"t":77.63,"x":"For local private firms, job boundaries tend to be blurry."},{"t":81.11,"x":"It's common for one person to have multiple roles."},{"t":84.07,"x":"constantly take on unexpected extra work and absorb all sorts of emergency"},{"t":88.51,"x":"issues like changing water for bars fish tank. Then workplace atmosphere"},{"t":97.1,"x":"multinational teams are professional and polite, colleagues maintain proper boundaries."},{"t":101.54,"x":"We focus on getting things done with less emotional pressure or office politics."},{"t":106.02,"x":"In a private company the boss is more dictatorial than supportive and sometimes"},{"t":110.74,"x":"your boss could be the major source of pressure and uncomfortableness of your work."},{"t":114.46,"x":"For example, you may find yourself in a meeting listening to your boss rambling on and on and"},{"t":119.9,"x":"you have to pretend to stay for attention by scribbling away furiously, besides invisible"},{"t":125.94,"x":"internal competition and the pressure I usually have here."},{"t":131.91,"x":"At foreign companies, vocation is treated as your basic right."},{"t":135.05,"x":"You submit the application no need to over-explain or feel guilty for taking time off."},{"t":140.46,"x":"In many private companies, asking for leave still feels like asking for a favor."},{"t":145.42,"x":"You have to carefully explain your situation and worry about leaving your extra work for"},{"t":150.1,"x":"your team or leaving a bad impression on your manager."},{"t":154.13,"x":"In my case, another bothering issue is that a leave was released by the hour, meaning you"},{"t":158.45,"x":"have to work until you get eight hours to ask for a day's leave."},{"t":162.77,"x":"What can I say?"},{"t":163.77,"x":"Let's talk about annual parties."},{"t":169.65,"x":"Annual parties and multinationals are mostly for rest and rewards, good food,"},{"t":174.61,"x":"lucky draws, simple socializing."},{"t":177.25,"x":"No mandatory performances or meaningless formalities."},{"t":180.21,"x":"Private company annual parties are designed to boost team morale, which I'm not sure about."},{"t":184.53,"x":"The emphasised passion and the unity, which often means compulsory group activities and"},{"t":189.41,"x":"talent shows, are forced to act on state play, boosting about the greatness of the company."},{"t":196.05,"x":"As a newcomer, I was like,"},{"t":197.89,"x":"Mi ma to vi mi ma!"},{"t":200.01,"x":"Okay, now here is a keyboard."},{"t":202.45,"x":"the option is inherently better or worse. Your choice really depends on what you're prioritizing"},{"t":208.29,"x":"your career, so which one can start if it's you? Drop your thoughts in the comment below. Bye."}],"mediaFile":"6abfa28c00000000140383bc.mp4","media":"media/6abfa28c00000000140383bc.mp4"},{"noteId":"6abf181a000000001c00f40b","creator":"William","title":"Do You Know...？","publishedAt":"2026-10-02T10:40:04Z","durationSeconds":63.4,"likes":"179","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6abf181a000000001c00 ? He's moving in today today"},{"t":19.64,"x":"You did all of this behind my back behind your back"},{"t":23.26,"x":"Yes, you planned the whole thing without telling me because I knew you'd make it difficult"},{"t":27.46,"x":"Of course I'd make it difficult. I live here."},{"t":30.1,"x":"Look, somebody had to take matters into their own hands."},{"t":33.3,"x":"Take matters into your own hands?"},{"t":35.22,"x":"So you just handled everything yourself without asking me?"},{"t":38.18,"x":"Pretty much."},{"t":39.14,"x":"You don't get to choose my new roommate?"},{"t":40.82,"x":"It's too late. It's already set in stone."},{"t":42.9,"x":"Set in stone?"},{"t":44.18,"x":"It's decided. It's not changing."},{"t":46.26,"x":"Oh, it's changing."},{"t":47.7,"x":"No, it's not."},{"t":49.06,"x":"Yes, it..."},{"t":50.46,"x":"Actually, that should be him."},{"t":51.98,"x":"Him?"},{"t":52.78,"x":"Hey, you must be my new roommate."},{"t":54.3,"x":"He said you're super easy to live with."},{"t":56.54,"x":"Nice to meet you."},{"t":57.74,"x":"Is there something going on?"}],"mediaFile":"6abf181a000000001c00f40b.mp4","media":"media/6abf181a000000001c00f40b.mp4"},{"noteId":"6abe414f000000001802e6de","creator":"William","title":"生活英语：遇到这些情况怎么说？","publishedAt":"2026-10-01T13:30:12.000Z","durationSeconds":42.7,"likes":"174","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6abe414f000000001802e6de?xsec_token=ABMM5QYrg-hkp0j8yab-OPSbfVp518R7T6Inq9vIlhr4w=&xsec_source=pc_user","ipLocation":"安徽","summary":"这条视频还原了把咖啡打翻在笔记本电脑上后的真实对话场景，从惊呼、询问状况到描述电脑故障，全程用英语完成。博主顺带讲了几个描述「打翻、卡住、死机、报废」的地道说法，并点出背过的单词在需要时用不出来，是因为「认识单词」和「压力下用出单词」是两回事。","tags":["生活英语","英语口语","突发状况","单词活用"],"keyPoints":["场景是打翻咖啡、电脑出故障时的即时英语对话，重点在描述物品状态。","打翻用 knocked over，死机可以用 it froze 或 it's just not responding。","彻底坏掉，尤其是被液体弄坏，可以用 it might be fried。","博主提醒：认识单词和能在紧张时脱口而出，是两个完全不同的能力。"],"patterns":[{"en":"knocked over","zh":"打翻、碰倒（杯子、瓶子等）","usage":"描述不小心把液体或物件弄翻时","example":"Oh, you knocked over your coffee."," dB2mKv0=&xsec_source=pc_user","ipLocation":"云南","summary":"一场完整的英文线上会议主持范例，从开场寒暄、共享屏幕、拉人发言，到确认行动项、收尾，全程是可直接照搬的模板句。","tags":["职场英语","会议主持","模板句"],"keyPoints":["开场三段式：问好 → 等人到齐 → 说明议程并共享屏幕","推进会议的万能句是「把球传出去」：有人负责就点名，没人负责就确认行动项","时间不够时不要硬展开，用 take it offline + I'll ping you right after this 优雅收口","ASR 修正：原文把 blockers 误成 blogs、cover 误成 come from、side 误成 site、ping 误成 paint"],"patterns":[{"en":"How's everyone doing today?","zh":"大家今天怎么样？","usage":"会议开场破冰，比 How are you 更适合多人场合","example":"Morning, everyone. Good to see you. How's everyone doing today?","start":0},{"en":"I'll pull up today's agenda and share my screen.","zh":"我把今天的议程调出来并共享屏幕。","usage":"宣布会议正式开始前的标准动作","example":"Before we get started, I'll pull up today's agenda and share my screen.","start":8.45},{"en":"Can everyone hear me and see my screen?","zh":"大家能听到我、能看到我的屏幕吗？","usage":"共享后例行确认，避免白讲十分钟","example":"Can everyone hear me and see my screen?","start":13.25},{"en":"flag any blockers","zh":"提出任何卡点","usage":"议程里专门留一段收集障碍项","example":"Today we want to go through project updates, flag any blockers, and cover this week's action items.","start":null},{"en":"Would you like to kick us off?","zh":"你来开头吧？","usage":"点名让某人先发言，比 You start 客气","example":"Sarah, would you like to kick us off?","start":23.49},{"en":"I think you're on mute.","zh":"你好像静音了。","usage":"线上会议最高频事故，用 I think 软化","example":"I think you're on mute. … There you go, we can hear you now.","start":26.34},{"en":"Let's take that offline.","zh":"这个我们会后单独聊。","usage":"话题跑偏或时间不够时的收口句","example":"We're running a little short on time today, so let's take that offline.","start":72.62},{"en":"Let's quickly confirm who's doing what.","zh":"我们快速确认一下谁做什么。","usage":"收尾阶段锁定行动项，避免会后互相等","example":"Next up, action items. Let's quickly confirm who's doing what.","start":59.94},{"en":"I appreciate everyone's time.","zh":"谢谢大家的时间。","usage":"结束语，比 Thanks 更有分量","example":"Alright, let's wrap up here. I appreciate everyone's time.","start":79.27}],"quotes":[{"text":"Can everyone hear me and see my screen?","start":13.25,"matched":true},{"text":"I think you're on mute.","start":26.34,"matched":true},{"text":"Let's take that offline. I'll ping you right after this.","start":76.35,"matched":true}],"partial":false,"partialReason":null,"transcriptPath":"C:\\Users\\加勒比海带\\Documents\\Codex\\2026-10-04\\new-chat\\work\\transcripts\\6ab4e8f5000000001203e583.json","transcript":[{"t":0,"x":"Morning, everyone. Good to see you. How's everyone doing today?"},{"t":4.29,"x":"Yes, I'm here. Busy week. Alright, looks like a few people are still joining."},{"t":8.45,"x":"So before we get started, I'll pull up today's agenda and share my screen."},{"t":13.25,"x":"Can everyone hear me and see my screen?"},{"t":16.05,"x":"Great. Alright, let's get into it."},{"t":18.13,"x":"So today we want through project updates, flag any blogs,"},{"t":21.17,"x":"and come from this week's action items."},{"t":23.49,"x":"Sarah, would you like to kick us off?"},{"t":26.34,"x":"I think you're on mute."},{"t":28.46,"x":"There you go. We can hear you now."},{"t":29.98,"x":"Thanks. So what's the next step on your site?"},{"t":34.22,"x":"Got it. If we haven't heard back by Wednesday,"},{"t":36.78,"x":"could you follow up with the client?"},{"t":39.33,"x":"Sounds good."},{"t":41.02,"x":"Hi Mike, welcome. We've just started and going through project updates."},{"t":45.68,"x":"Jack, anything to add from the product site?"},{"t":48.66,"x":"Got it. So the revised timeline should be ready by Thursday."},{"t":52.82,"x":"Great, thanks Jack."},{"t":54.18,"x":"Alright, that covers the project updates."},{"t":56.26,"x":"Does anyone have any blocks to flag?"},{"t":58.34,"x":"Perfect, no blocks then."},{"t":59.94,"x":"Next up, action items."},{"t":61.46,"x":"Let's quickly confirm who's doing what."},{"t":63.6,"x":"Sarah will follow up with the client on Wednesday if we haven't heard back."},{"t":67.5,"x":"Jack will share the revised timeline by Thursday."},{"t":70.62,"x":"Anything I missed? Yeah, go ahead."},{"t":72.62,"x":"Good point. We're running a little short on time today,"},{"t":76.35,"x":"so let's take that offline. I'll paint you right after this."},{"t":79.27,"x":"Alright, let's wrap up here."},{"t":81.11,"x":"I appreciate everyone's time. See you next week."}],"mediaFile":"6ab4e8f5000000001203e583.mp4","media":"media/6ab4e8f5000000001203e583.mp4"},{"noteId":"6ab27d57000000003403460a","creator":"瑞秋爱玛","title":"全英｜缓解高敏感？放弃抵抗吧...","publishedAt":"2026-09-22T13:06:31Z","durationSeconds":199.4,"likes":"41","noteUrl":"https://www.xiaohongshu.com/user/profile/61361d670000000002019d71/6ab27d57000000003403460a?xsec_token=AB9E-xa2VSqgYZ2v3DktfXBND7mlAMnZcDX1f2H4QCjnM=&xsec_source=pc_user","ipLocation":"上海","summary":"35 岁才发现自己是高敏感人格（HSP），今年终于学会不再对抗情绪。情绪类英语口播，长句多、情绪词密集，适合练「描述心理状态」。","tags":["全英播客","情绪表达","心理词汇"],"keyPoints":["描述内耗的成套词汇：emotionally burned out、brain is spinning、on the verge of falling apart","核心转折句是本条的精华：When you stop fighting your emotions, they get bored.","self-doubt 时自我攻击的问句三连：What's wrong with me? Am I not good enough? Am I incompetent?","结尾的安慰句式可以直接背下来用在别人身上：You are not broken, you are not too much."],"patterns":[{"en":"emotionally burned out","zh":"情绪上彻底耗竭","usage":"比 tired 更准确地描述长期透支","example":"I don't know if you ever felt emotionally burned out.","start":6.64},{"en":"your brain is spinning","zh":"脑子停不下来地转","usage":"形容想太多、静不下来","example":"Your brain is spinning all the time, even when you tell it to stop.","start":12.96},{"en":"on the verge of falling apart","zh":"处在崩溃边缘","usage":"on the verge of + 名词/动名词","example":"I constantly felt like I was on the verge of completely falling apart.","start":57.48},{"en":"process things differently","zh":"对外界信息的处理方式不同","usage":"中性描述敏感特质，不带贬义","example":"I literally process things differently from other people.","start":null},{"en":"make peace with myself","zh":"与自己和解","usage":"接受自身特质的关键短语","example":"This year, I finally figured out how to make peace with myself.","start":77.01},{"en":"I just sit with it, quietly, unapologetically.","zh":"我就安静地陪着这种情绪，不觉得抱歉。","usage":"sit with + 情绪，表示不逃避也不对抗","example":"I don't fake the smile. I just sit with it, quietly, unapologetically.","start":94.28},{"en":"When you stop fighting your emotions, they get bored.","zh":"当你不再对抗情绪，它们自己就无聊了。","usage":"整条视频的金句，可直接引用","example":"They realize you're not giving them any drama, any resistance, any fuel, and they just leave.","start":0},{"en":"You are not broken, you are not too much.","zh":"你没有坏掉，你也不是太过分。","usage":"安慰高敏感者最有效的一句","example":"You just feel things deeply and that's not a flaw, that's who you are.","start":190.16}],"quotes":[{"text":"When you stop fighting your emotions, they get bored.","start":148.45,"matched":true},{"text":"You are not broken, you are not too much. You just feel things deeply and that's not a flaw, that's who you are.","start":186.36,"matched":true}],"partial":false,"partialReason":null,"transcriptPath":"C:\\Users\\加勒比海带\\Documents\\Codex\\2026-10-04\\new-chat\\work\\transcripts\\6ab27d57000000003403460a.json","transcript":[{"t":0,"x":"They realize you're not giving them any drama, any resistance, any fuel, and they just leave."},{"t":6.64,"x":"Hey guys, today I want to talk about how I eat my high sensitivity. I don't know if you ever felt"},{"t":12.96,"x":"emotionally burned out or like your brain is spinning all the time even when you tell it to stop"},{"t":18.48,"x":"or maybe when you're interacting with people your heart is racing and you feel like you're"},{"t":22.96,"x":"or burning yourself out. That used to be me for years, actually for most of my life."},{"t":30.28,"x":"And if you're a highly sensitive person, you probably know exactly what I'm talking about."},{"t":35.2,"x":"If you're always exhausted, even after a full night's sleep, if you can't focus no"},{"t":39.64,"x":"matter how hard you try, if a single comment from someone can ruin your entire day, this"},{"t":45.68,"x":"one is for you because I've been there. I'm 35 and I've always presented myself"},{"t":51.76,"x":"by the easygoing, positive one, the one who's always fine,"},{"t":55.76,"x":"the one who never breaks."},{"t":57.48,"x":"But deep down, I constantly felt like"},{"t":59.88,"x":"I was on the verge of completely falling apart."},{"t":62.56,"x":"But I never knew why."},{"t":63.76,"x":"Or maybe I just never had the energy to figure it out."},{"t":66.89,"x":"It took me almost two decades to realize"},{"t":69.69,"x":"I'm a highly sensitive person."},{"t":72.93,"x":"I bring literally processed things"},{"t":75.01,"x":"differently from other people."},{"t":77.01,"x":"And this year, I finally figured out"},{"t":79.57,"x":"how to make peace with myself."},{"t":81.84,"x":"be a slave to your feelings."},{"t":84.32,"x":"That's right, I give up."},{"t":86.82,"x":"I surrender to whatever the hell that is bothering me."},{"t":89.76,"x":"If I'm feeling down,"},{"t":91.04,"x":"I let myself be down for it as long as I want."},{"t":94.28,"x":"I don't fake the smile I'm always wearing."},{"t":97.2,"x":"I don't pretend to be happy when I'm not."},{"t":99.4,"x":"I don't force myself to be interested in a conversation"},{"t":102,"x":"just to avoid seeming rude."},{"t":104.16,"x":"I just sit with it, quietly, unapologetically"},{"t":107.92,"x":"and let myself feel every bit of it."},{"t":110.96,"x":"Before when my brain was spinning and I couldn't focus, the old me would spiral into self-doubt."},{"t":116.96,"x":"Like what's wrong with me?"},{"t":118.96,"x":"Am I not good enough?"},{"t":120.26,"x":"Am I incompetent?"},{"t":121.96,"x":"And then I pushed myself a bit harder, which of course just made everything worse."},{"t":127.96,"x":"But now I literally say it out loud."},{"t":131.96,"x":"Fuck it. I'm exhausted. I need to stop."},{"t":134.96,"x":"I stop the work I'm doing. I step away from the conversations that drew me."},{"t":138.96,"x":"I close my eyes, or stare into space, or go to the park, find a bench, and stay there"},{"t":144.4,"x":"alone."},{"t":145.69,"x":"And you know what the craziest part is?"},{"t":148.45,"x":"When you stop fighting your emotions, they get bored."},{"t":151.69,"x":"They realize you're not giving them any drama, any resistance, any fuel, and they just"},{"t":157.25,"x":"leave."},{"t":158.25,"x":"I wish I could go back in time and hug the younger me."},{"t":160.93,"x":"The one who was constantly struggling, who didn't know what was wrong with her,"},{"t":165.65,"x":"who thought she just wasn't trying hard enough."},{"t":168.57,"x":"I tell her I'm so sorry I didn't know how to take care of you emotionally and I want"},{"t":173.73,"x":"you to know this is who you are and that's okay, you are enough just as you are."},{"t":179.04,"x":"And if you are watching this and you are a highly sensitive person too, I hope that makes"},{"t":184.24,"x":"you feel a little less alone."},{"t":186.36,"x":"You are not broken, you are not too much."},{"t":190.16,"x":"You just feel things deeply and that's not a flaw, that's who you are."}],"mediaFile":"6ab27d57000000003403460a.mp4","media":"media/6ab27d57000000003403460a.mp4"},{"noteId":"6aacfbdc000000000b002e93","creator":"开心学英语","title":"情景英语：老板替员工去开家长会破防了！","publishedAt":"2026-09-18T08:52:44Z","durationSeconds":41.2,"likes":"89","noteUrl":"https://www.xiaohongshu.com/user/profile/69cf8d170000000032036d59/6aacfbdc000000000b002e93?xsec_token=AB8mR_Nd0S3GYoZeUObSwukau_SLGLm2DZlLHW5LtzdBM=&xsec_source=pc_user","ipLocation":"黑龙江","summary":"员工想请假去开家长会，老板嫌客户要来验货不放人，最后老板自己冒充叔叔去了，回来被老师骂到破防。","tags":["职场英语","请假","情景对话"],"keyPoints":["请假时的固定说法是 take a day off，理由用 there's … and someone has to be there","No can do 是很口语的「不行」，比 No 多一点无奈","ripped me a new one 表示「把我骂惨了」，属于口语俚语，听懂即可"],"patterns":[{"en":"take a day off","zh":"请一天假","usage":"临时请假最常用的表达","example":"Mr. Lee, I need to take a day off today.","start":0.82},{"en":"You just got here.","zh":"你才刚来。","usage":"表达「刚入职就请假」的不满","example":"You just got here. Why do you need time off?","start":3.42},{"en":"No can  break you down."},{"t":306.33,"x":"Tom, can I see you in my office for a minute? Sure. What is it about? This morning, the"},{"t":312.11,"x":"secretary showed me your attendance record and it shows that you are often late for"},{"t":316.39,"x":"work. I promise I will never be late again. I was told that you always leave early"},{"t":320.83,"x":"too. I'm sorry. I promise that too. But I can't trust you anymore. What do"},{"t":324.67,"x":"What do you mean?"},{"t":325.67,"x":"I am sorry to inform you that you are fired."},{"t":329.54,"x":"I got it."},{"t":330.54,"x":"I will leave after handing over my work."}],"mediaFile":"6aa3c183000000002600a97e.mp4","media":"media/6aa3c183000000002600a97e.mp4"},{"noteId":"6a20021a000000002202bd5a","creator":"Bapanda职场英语表达","title":"如何回应外国同事问any questions?","publishedAt":"2026-06-03T10:29:46Z","durationSeconds":84.9,"likes":"4842","noteUrl":"https://www.xiaohongshu.com/user/profile/59addf2d50c4b41fabc101b0/6a20021a000000002202bd5a?xsec_token=AB9pmeuVrklVMF7F2WL9HajO7XnBINDj31w1vMLLWgdbM=&xsec_source=pc_user","ipLocation":"","summary":"中文讲解「别人问 any questions 该怎么接」：别只回一个冷冰冰的 no，要顺手递一句情绪价值，还要准备一句缓冲话术给自己争取时间。","tags":["职场英语","会议互动","情商表达"],"keyPoints":["any questions 在英文里不只是收尾，它是一个互动信号，冷冰冰的 no 会显得像「别问了，赶紧散会」","即使是拒绝式回答，母语者也常用 nope 这种轻松语气，或顺手加一句接住对方的话","面对老板或客户时，回答的同时要递情绪价值，比如谢谢对方清晰的概述","真有疑问时先用缓冲句切入，给自己几秒组织语言的时间，听起来还很自然"],"patterns":[{"en":"nope","zh":"没有（轻松语气的 no）","usage":"熟人或平级同事之间，比 no 更不冷场","example":"Nope, I'm good.","start":22},{"en":"Thanks for the clear overview.","zh":"谢谢你这么清晰的概述。","usage":"面对老板或客户时说 no 的同时递情绪价值","example":"No questions — thanks for the clear overview.","start":null},{"en":"Actually, I do have one small question about this.","zh":"其实关于这点我有一个小问题。","usage":"有问题时的切入句，small 降低对方压力","example":"Actually, I do have one small question about this.","start":null},{"en":"Let me think about how to phrase this.","zh":"让我想想怎么说。","usage":"缓冲句，给自己几秒组织语言","example":"Let me think about how to phrase this.","start":null}],"quotes":[],"partial":true,"partialReason":"这条视频的英文例句是打在画面上的，音频里只有中文讲解。当前卡片是从讲解内容反推的骨架，完整例句需要补 OCR。","transcriptPath":"C:\\Users\\加勒比海带\\Documents\\Codex\\2026-10-04\\new-chat\\work\\transcripts\\6a20021a000000002202bd5a.json","transcript":[{"t":0,"x":"今天有人问我如果工作的时候别人问 any questions 我应该怎么回答"},{"t":4.8,"x":"很多人的第一反应就是 no 因为听懂了就结束"},{"t":9,"x":"但是在英文里面 any questions 往往不只是收尾"},{"t":13,"x":"它也是一个互动的信号 就是哪怕你没有问题"},{"t":16,"x":"也很少只是回一个冷冰冰的 no"},{"t":19,"x":"因为听起来就这样子别发问了 赶紧下班"},{"t":22,"x":"native speaker 哪怕是说 no 它也会用一个声调的 nope"},{"t":26,"x":"或者顺手用一句话去接触对方"},{"t":29,"x":"跟同事之间或者是日常开会的时候 你可以说"},{"t":36.1,"x":"但是如果是面对是老板或者客户的话"},{"t":38.4,"x":"那只说上面那几句话好像就显得有点轻了"},{"t":41.6,"x":"那他们更喜欢一边回答 一边递一些情绪价值"},{"t":48.4,"x":"意思就是说没问题 谢谢你那么清晰的概述"},{"t":51.6,"x":"但是如果你真的有问题要问 你也不需要想很多"},{"t":54.8,"x":"可以先用一句话切入"},{"t":59,"x":"如果你怕说完这句话的时候卡壳"},{"t":62.2,"x":"可以用它们很常用的一个环冲剧"},{"t":68.8,"x":"这句话的意思就是"},{"t":69.8,"x":"其实关于这件事还有一个小小的问题"},{"t":72,"x":"让我想想怎么去组织我的语言"},{"t":74.2,"x":"你看它可以帮你争取几秒失口的时间"},{"t":77,"x":"而且听起来就是非常自然"},{"t":81.4,"x":"评论区留言告诉我"},{"t":82.8,"x":"你最怕别人用英文问你哪一句"}],"mediaFile":"6a20021a000000002202bd5a.mp4","media":"media/6a20021a000000002202bd5a.mp4"}]};
const state = { q: '', creator: null };

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtTime = (sec) => {
  if (sec === null || sec === undefined) return null;
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
};
const fmtDate = (iso) => (iso ? String(iso).slice(0, 10) : '');
const highlight = (text) => {
  const q = state.q.trim();
  const safe = esc(text);
  if (!q) return safe;
  const pattern = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try { return safe.replace(new RegExp(pattern, 'gi'), (m) => '<mark>' + m + '</mark>'); } catch { return safe; }
};

function patternMatches(card, q) {
  if (!q) return true;
  const hay = [
    card.creator, card.title, card.summary, card.keyPoints.join(' '),
    card.patterns.map((p) => [p.en, p.zh, p.usage, p.example].join(' ')).join(' '),
    (card.transcript ?? []).map((seg) => seg.x).join(' '),
  ].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every((token) => hay.includes(token));
}

// 句型卡片没写到的说法，也能从视频原话里捞出来
function transcriptHits(card, q) {
  if (!q || !card.transcript || card.transcript.length === 0) return [];
  const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (tokens.length === 0) return [];
  return card.transcript
    .filter((seg) => tokens.every((token) => String(seg.x).toLowerCase().includes(token)))
    .slice(0, 3);
}

function render() {
  const q = state.q.trim();
  const cards = DATA.cards.filter((c) =>
    patternMatches(c, q) &&
    (!state.creator || c.creator === state.creator)
  );

  document.getElementById('list').innerHTML = cards.length === 0
    ? '<div class="empty">没有匹配的内容，换一个词试试</div>'
    : cards.map((card) => `
    <article data-card="${esc(card.noteId)}">
      <div class="meta">
        <span class="creator">${esc(card.creator)}</span>
        <span>${fmtDate(card.publishedAt)}</span>
        <span>${card.durationSeconds ? Math.round(card.durationSeconds / 60 * 10) / 10 + ' 分钟' : ''}</span>
        <span>${card.patterns.length} 个句型</span>
      </div>
      <h2>${highlight(card.title)}</h2>
      ${(() => {
        const hits = transcriptHits(card, q);
        if (hits.length === 0) return '';
        return `<div class="hits"><h3>视频里说到的地方</h3>${hits.map((hit) => `
          <div class="hit">
            <div class="rail"><button class="time" data-t="${hit.t}" data-note="${esc(card.noteId)}" title="跳到视频这一秒（Shift+点击复制时间）">${fmtTime(hit.t)}</button></div>
            <span class="hit-text">${highlight(hit.x)}</span>
          </div>`).join('')}</div>`;
      })()}
      <p class="summary">${highlight(card.summary)}</p>
      ${card.partial ? `<div class="flag">${esc(card.partialReason)}</div>` : ''}
      <h3>要点</h3>
      <ul class="points">${card.keyPoints.map((p) => '<li>' + highlight(p) + '</li>').join('')}</ul>
      <h3>可复用句型</h3>
      <div class="patterns">${card.patterns.map((p) => `
        <div class="pattern">
          <div class="rail">
            ${p.start !== null && p.start !== undefined ? `<button class="time" data-t="${p.start}" data-note="${esc(card.noteId)}" title="跳到视频这一秒（Shift+点击复制时间）">${fmtTime(p.start)}</button>` : ''}
          </div>
          <div>
            <div class="pat-head">
              <span class="en">${highlight(p.en)}</span>
              <span class="zh">${highlight(p.zh)}</span>
            </div>
            <div class="usage">${highlight(p.usage)}</div>
            <div class="ex">${highlight(p.example)}</div>
          </div>
        </div>`).join('')}</div>
      ${card.media ? '<div class="player" hidden></div>' : ''}
      <div class="actions">
        <a class="act" href="${esc(card.noteUrl)}" target="_blank" rel="noreferrer">看原片</a>
        ${card.media ? `<button class="act" data-play="${esc(card.noteId)}">播放整段</button>` : ''}
        <button class="act" data-copy="${esc(card.noteId)}">复制全部句型</button>
      </div>
    </article>`).join('');

  // 原片拿不到时（比如网页被单独发到手机、media 文件夹没跟过去）给一句人话，
  // 而不是留一个点了没反应的黑框。之后点时间戳退回「复制时间」。
  const markNoMedia = (box) => {
    if (box.dataset.dead === '1') return;
    box.dataset.dead = '1';
    box.hidden = false;
    box.innerHTML = '<p class="flag">原片在电脑上。单独把网页发到手机就播不了，连同一个 Wi-Fi 用桌面「手机上看知识库」才有视频。</p>';
  };

  // 时间戳直接播本地已下载的原片段，不用再开小红书（小红书走系统代理会被风控）
  const ensurePlayer = (card) => {
    if (!card || !card.media) return null;
    const article = document.querySelector('article[data-card="' + card.noteId + '"]');
    if (!article) return null;
    const box = article.querySelector('.player');
    if (!box) return null;
    if (box.dataset.dead === '1') return null;
    box.hidden = false;
    let video = box.querySelector('video');
    if (!video) {
      video = document.createElement('video');
      video.controls = true;
      video.preload = 'metadata';
      video.src = card.media;
      const watchdog = setTimeout(() => { if (video.readyState < 1) markNoMedia(box); }, 4000);
      video.addEventListener('loadedmetadata', () => clearTimeout(watchdog));
      video.addEventListener('error', () => { clearTimeout(watchdog); markNoMedia(box); });
      box.appendChild(video);
    }
    return video;
  };

  document.querySelectorAll('[data-t]').forEach((btn) => {
    btn.addEventListener('click', (event) => {
      if (event.shiftKey) {
        if (navigator.clipboard) navigator.clipboard.writeText(btn.textContent.trim()).catch(() => {});
        return;
      }
      const card = DATA.cards.find((c) => c.noteId === btn.dataset.note);
      const video = ensurePlayer(card);
      if (!video) {
        const text = btn.textContent.trim();
        navigator.clipboard && navigator.clipboard.writeText(text).catch(() => {});
        return;
      }
      const second = Number(btn.dataset.t) || 0;
      const seek = () => {
        video.currentTime = second;
        const playing = video.play();
        if (playing && playing.catch) playing.catch(() => {});
      };
      if (video.readyState >= 1) seek();
      else video.addEventListener('loadedmetadata', seek, { once: true });
      const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      video.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'center' });
    });
  });

  document.querySelectorAll('[data-play]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const card = DATA.cards.find((c) => c.noteId === btn.dataset.play);
      const video = ensurePlayer(card);
      if (video && video.play) video.play().catch(() => {});
    });
  });

  document.querySelectorAll('[data-copy]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const card = DATA.cards.find((c) => c.noteId === btn.dataset.copy);
      if (!card) return;
      const text = [
        card.creator + ' · ' + card.title,
        '',
        ...card.patterns.map((p) => `${p.en} | ${p.zh}
  ${p.example}`),
      ].join('\n');
      try { await navigator.clipboard.writeText(text); btn.textContent = '已复制'; } catch { btn.textContent = '复制失败'; }
      setTimeout(() => { btn.textContent = '复制全部句型'; }, 1400);
    });
  });
}

function chips() {
  const creatorBox = document.getElementById('creatorChips');
  creatorBox.innerHTML = DATA.creators.map((c) => `<span class="chip" data-creator="${esc(c)}">${esc(c)}</span>`).join('');

  creatorBox.querySelectorAll('[data-creator]').forEach((el) => el.addEventListener('click', () => {
    state.creator = state.creator === el.dataset.creator ? null : el.dataset.creator;
    syncChips(); render();
  }));
}

function syncChips() {
  document.querySelectorAll('[data-creator]').forEach((el) => el.dataset.on = String(state.creator === el.dataset.creator));
}

document.getElementById('stats').innerHTML =
  `<span><b>${DATA.stats.cards}</b> 条视频</span><span><b>${DATA.stats.patterns}</b> 个句型</span><span>${DATA.stats.creators} 位博主</span><span>${DATA.stats.audioMinutes} 分钟音频</span>`;
document.getElementById('foot').textContent = '上次更新 ' + DATA.generatedAt.slice(0, 16).replace('T', ' ');

document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
chips();
render();
</script>
</body>
</html>
