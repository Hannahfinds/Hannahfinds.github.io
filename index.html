tasks?","enReference":"Because important tasks often create more pressure and make people worry about doing badly. In comparison, checking a phone, cleaning the room, or doing an easier task gives people an immediate sense of relief, even if only for a short time.","idiomatic":[{"orig":"checking a phone","better":"scrolling through your phone","why":"中文「刷手机」指不停地滑屏，英语里最对应的是 scroll through your phone，而 checking a phone 听起来只是「看一眼手机」，动作感不对。"},{"orig":"make people worry about doing badly","better":"make people worry they'll mess it up","why":"口语里更常说 mess it up / screw it up，比偏书面的 doing badly 更自然、更有画面感。"},{"orig":"gives people an immediate sense of relief","better":"gives you instant relief","why":"an immediate sense of relief 偏书面、偏重，日常口语直接说 instant relief 更简洁自然，也更适合闲聊语气。"},{"orig":"In comparison","better":"On the flip side","why":"口语里做正反对照时，On the flip side 更像聊天语气，In comparison 相对正式，听起来偏书面论述。"}],"media":null,"images":["media/6acecf88000000001901d400-1.webp","media/6acecf88000000001901d400-2.webp"]},{"kind":"image","noteId":"6acecf7a000000001901ec00","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-14T00:40:26.000Z","durationSeconds":null,"likes":"38","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6acecf7a000000001901ec00?xsec_token=ABhOi4d97EgujecA70-ffqNcCzVQcr2U8lPoIghcFRBGE=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练的是「讨论拖延症成因」这个话题的口语表达：先否定一个常见看法（不是时间管理问题），再说明真正原因是情绪上的逃避。适合雅思口语里表达观点、解释原因、做对比的场景。","tags":[],"keyPoints":["开场用 I don't think so 礼貌地否定对方观点，是口语里最省力的反驳方式。","核心句用 but still delay starting it 加 because 解释动机，构成「现象+原因」的完整论证结构。","结尾用 rather than the task itself 把真正逃避的对象（情绪）和表面对象（任务）对比出来，让观点更立体。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"拖延主要是时间管理问题吗？","zhReference":"我觉得不完全是，因为很多人明明知道截止日期，却还是迟迟不开始。真正让人逃避的可能是任务带来的压力、无聊、挫败感，或者对失败的担心。","enQuestion":"Is procrastination mainly a time-management problem?","enReference":"I don't think so. Many people know exactly when a task is due but still delay starting it, because what they are avoiding may be stress, boredom, frustration, or fear of failure rather than the task itself.","idiomatic":[{"orig":"I don't think so.","better":"Not really.","why":"口语对话里更常用 Not really 来委婉否定，比 I don't think so 更轻快、更像日常聊天。"},{"orig":"still delay starting it","better":"still put it off","why":"put off 是美式口语里说「拖延、往后拖」最自然的动词短语，比 delay doing 更口语化。"},{"orig":"what they are avoiding may be stress, boredom, frustration, or fear of failure rather than the task itself","better":"it's not the task they're avoiding — it's the stress, the boredom, the frustration, or the fear of failing","why":"改成 it's not X, it's Y 的对比句式，先说否定再给真正原因，节奏更像真人说话，也更有强调感。"}],"media":null,"images":["media/6acecf7a000000001901ec00-1.webp","media/6acecf7a000000001901ec00-2.webp"]},{"kind":"video","noteId":"6ace106c0000000012034a73","creator":"William","title":"生活中这些情况，你会用英语描述吗？","publishedAt":"2026-10-13T11:05:16.000Z","durationSeconds":46.9,"likes":"33","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ace106c0000000012034a73?xsec_token=ABhOi4d97EgujecA70-ffqNUYsfMqK0Dup3N23BH8d7SY=&xsec_source=pc_user","ipLocation":"安徽","summary":"这是一段日常居家场景的双人英语对话：家里的下水道堵了、抽屉卡住、灯闪、地板咯吱响，反复用简短口语表达「出故障」。可以学到 clogged、jammed、stuck、flickering、creaks 这一类描述东西坏了的常用说法，以及打扰别人、抱怨、自我安慰的地道句式。","tags":["英语口语","地道表达","生活场景","家居故障"],"keyPoints":["全片用一问一答的方式教授如何描述家里各种东西坏了、卡住了、不正常的状况。","核心形容词都很短很好记：clogged 堵住、jammed 卡住、stuck 动不了、flickering 闪烁。","对话里包含请求打扰（sorry to bother you）、抱怨（does anything here work normally）和安慰（you'll get used to it）的常用说法。","结尾一句反问和一句 No 形成幽默收尾，适合模仿语气和节奏。"],"patterns":[{"en":"Did you need something?","zh":"你需要什么吗？","usage":"看到别人站在旁边或欲言又止时，主动询问对方来意。","example":"Hey, did you need something?","start":0},{"en":"The drain is clogged","zh":"下水道堵了","usage":"水里下不去、管道不通时描述堵塞。","example":"Oh, the drain is clogged.","start":4.32},{"en":"It's jammed","zh":"它卡住了","usage":"东西被卡死、动不了，比如门、抽屉、机器。","example":"It's jammed.","start":14.29},{"en":"Is the light flickering?","zh":"灯在闪吗？","usage":"灯忽明忽暗、闪个不停时问或描述。","example":"Is the light flickering now?","start":20.56}],"quotes":[{"text":"Why is the water not going down?","start":1.28,"matched":true},{"text":"something's blocking it so the water can't go down","start":7.28,"matched":true},{"text":"No disrespect, but does anything here work normally?","start":26.64,"matched":true},{"text":"It makes that sound when you step on it.","start":35.48,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Hey, did you need something?"},{"t":1.28,"x":"Yeah, sorry to bother you. Why is the water not going down?"},{"t":4.32,"x":"Oh, the drain is clogged."},{"t":6.16,"x":"Clogged?"},{"t":7.28,"x":"Yeah, something's blocking it so the water can't go down."},{"t":10.16,"x":"Oh, that's okay. Why won't this open?"},{"t":14.29,"x":"It's jammed."},{"t":15.33,"x":"Jammed?"},{"t":16.53,"x":"The drawer is stuck. It won't move."},{"t":18.77,"x":"Oh, okay."},{"t":20.56,"x":"Is the light flickering now?"},{"t":22.24,"x":"Flickering?"},{"t":23.04,"x":"It keeps turning on and off really fast."},{"t":25.44,"x":"Oh, yeah."},{"t":26.64,"x":"No disrespect, but does anything here work normally?"},{"t":31.54,"x":"What was that?"},{"t":33.24,"x":"The floor creaks."},{"t":34.48,"x":"Creaks?"},{"t":35.48,"x":"It makes that sound when you step on it."},{"t":37.64,"x":"Wow, I guess it's not a big deal, but you'll get used to it."},{"t":42.08,"x":"At least the rent is cheap, right?"},{"t":44.7,"x":"No."}],"media":"media/6ace106c0000000012034a73.mp4","images":[]},{"kind":"video","noteId":"6acda95c000000001203d078","creator":"福禄咪学英语","title":"约会点餐篇｜常用英语学习、美剧学英语","publishedAt":"2026-10-13T03:45:32.000Z","durationSeconds":52,"likes":"51","noteUrl":"https://www.xiaohongshu.com/user/profile/683532dc000000001d017868/6acda95c000000001203d078?xsec_token=ABQNVuPCXeiKjr4YM1NqbwDeW1CB_EXo6aeq9iIsH8ifQ=&xsec_source=pc_user","ipLocation":"黑龙江","summary":"这条视频用一段餐厅约会点餐的对话，还原了从打招呼、点菜点酒到结账的完整流程。能学到请对方推荐、点饮料、要求后加菜、送账单等地道口语表达。对话里还夹着情侣间轻松打趣的小互动，句式短、可直接套用到真实用餐场景。","tags":["约会点餐","餐厅口语","实用英语","看美剧学英语"],"keyPoints":["视频按真实用餐顺序展开：打招呼、问推荐、点菜点酒、要求加菜、请人送账单，是一条完整的点餐动线。","重点表达集中在「请人推荐」和「下单决定」上，比如推荐菜品、两个都要、之后再加菜。","情侣间的玩笑和「今晚不取车」的商量让句子更口语化，适合在轻松场合直接照搬。"],"patterns":[{"en":"I'm so glad you said yes.","zh":"真高兴你答应了","usage":"对方接受邀约或请求后，表达自己很开心","example":"I'm so glad you said yes to this date.","start":0},{"en":"Ready to order?","zh":"可以点餐了吗","usage":"服务员过来问是否开始点单","example":"Good evening. Ready to order?","start":8},{"en":"What do you recommend?","zh":"你有什么推荐吗","usage":"菜单看不懂或想听建议时问对方","example":"What do you recommend?","start":9.92},{"en":"Anything to drink?","zh":"要喝点什么吗","usage":"点完菜后询问要不要饮料","example":"Anything to drink?","start":29.09},{"en":"We'll take both.","zh":"两个都要","usage":"对方给的两个选项都想要时","example":"We'll take both.","start":27.89},{"en":"Can we add more later?","zh":"可以之后再加吗","usage":"先点一部分，问能否稍后追加","example":"Can we add more later?","start":39.41},{"en":"I'll bring the check after dinner.","zh":"餐后我把账单拿来","usage":"餐后结账，或请服务员送账单","example":"I'll bring the check after dinner.","start":42.29}],"quotes":[{"text":"I'm so glad you said yes to this date.","start":0,"matched":true},{"text":"What do you recommend?","start":9.92,"matched":true},{"text":"Then we'll Uber home and get the car tomorrow.","start":34.13,"matched":true},{"text":"I'll bring the check after dinner.","start":42.29,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"I'm so glad you said yes to this date."},{"t":2.16,"x":"How glad?"},{"t":3.28,"x":"Uh, really, really glad."},{"t":5.44,"x":"I'm teasing. Let's order."},{"t":7.12,"x":"Excuse me."},{"t":8,"x":"Good evening. Ready to order?"},{"t":9.92,"x":"What do you recommend?"},{"t":10.96,"x":"Our fusion menu blends Chinese, Japanese, and Californian flavors."},{"t":14.96,"x":"Their Chinese dishes are amazing."},{"t":17.04,"x":"Sichuan poached fish in chili oil and cola-glazed chicken wings please."},{"t":21.52,"x":"Any appetizer desserts you'd recommend?"},{"t":24.37,"x":"Shrimp cocktail to start and apple pie caliper dessert."},{"t":27.89,"x":"We'll take both."},{"t":29.09,"x":"Anything to drink?"},{"t":30.21,"x":"A bottle of red wine, please."},{"t":31.97,"x":"But we drove here."},{"t":34.13,"x":"Then we'll Uber home and get the car tomorrow."},{"t":36.29,"x":"Tonight, let's have fun."},{"t":37.97,"x":"Okay."},{"t":38.61,"x":"Anything else?"},{"t":39.41,"x":"Can we add more later?"},{"t":40.69,"x":"Absolutely."},{"t":41.41,"x":"Just let me know."},{"t":42.29,"x":"I'll bring the check after dinner."},{"t":43.89,"x":"Date."},{"t":45.25,"x":"Menu."},{"t":46.45,"x":"Appetizers."},{"t":48.05,"x":"Dessert."},{"t":49.33,"x":"Add more."},{"t":50.37,"x":"Check."}],"media":"media/6acda95c000000001203d078.mp4","images":[]},{"kind":"video","noteId":"6accbbe50000000012036943","creator":"William","title":"新室友之间的事，这些表达你都知道吗？","publishedAt":"2026-10-12T10:52:22.000Z","durationSeconds":50.5,"likes":"39","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6accbbe50000000012036943?xsec_token=AB9tunrnLU5ckEnHlpgaxzXvXBZPGA-Fa1uEkb9z8oW7o=&xsec_source=pc_user","ipLocation":"","summary":"这条视频模拟两个新室友讨论合租生活的对话场景：如何避免互相妨碍、怎么分工家务、怎么公平承担自己的那份活儿，以及遇到小摩擦时如何慢慢磨合。通过一问一答的重复和解释，能学到「step on each other's toes」「divvy up the chores」「pull your weight」「work out the kinks」等地道的口语表达。","tags":["英语口语","地道表达","合租日常","室友英语"],"keyPoints":["视频以两个新室友的对话形式展开，场景是刚住到一起时商量如何相处和分工。","每个地道表达都通过「提问—重复—英文解释」的方式讲清楚意思，方便记忆。","涵盖避免互相妨碍、分担家务、尽自己的本分、磨合小问题等合租高频话题。","结尾用石头剪刀布决定谁做家务，气氛轻松，说明两人能相处得来。"],"patterns":[{"en":"step on each other's toes","zh":"妨碍、冒犯到别人","usage":"和别人共处、共事时，提醒彼此不要互相影响或越界","example":"Okay, well, since we'll be living together now, we need to make sure we're not stepping on each other's toes.","start":0},{"en":"get in each other's way","zh":"互相妨碍、挡着对方的路","usage":"形容两个人生活或做事时互相干扰","example":"Yeah, we need to make sure we're not getting in each other's way.","start":6.16},{"en":"divvy up the chores","zh":"把家务分摊一下","usage":"和室友或家人商量谁负责哪些家务时","example":"Fair. Maybe we should divvy up the chores.","start":9.2},{"en":"pull your weight","zh":"尽自己的本分","usage":"强调自己没有偷懒、在做分内的事","example":"And I don't want you thinking I'm not pulling my weight.","start":18.96},{"en":"work out the kinks","zh":"磨合、解决那些小毛病","usage":"形容新关系或新系统刚开始时不顺，需要慢慢调整","example":"We just have to work out the kinks.","start":28.16},{"en":"Best two out of three.","zh":"三局两胜。","usage":"玩石头剪刀布等游戏时约定规则","example":"Best two out of three.","start":43.36},{"en":"I think we're gonna get along.","zh":"我觉得我们会相处得不错。","usage":"表达对一段新关系或新合作有信心","example":"I think we're gonna get along.","start":44.64}],"quotes":[{"text":"Okay, well, since we'll be living together now, we need to make sure we're not stepping on each other's toes.","start":0,"matched":true},{"text":"Fair. Maybe we should divvy up the chores.","start":9.2,"matched":true},{"text":"And I don't want you thinking I'm not pulling my weight.","start":18.96,"matched":true},{"text":"We just have to work out the kinks.","start":28.16,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Okay, well, since we'll be living together now, we need to make sure we're not stepping on each other's toes."},{"t":4.32,"x":"Stepping on each other's toes?"},{"t":6.16,"x":"Yeah, we need to make sure we're not getting in each other's way."},{"t":9.2,"x":"Fair. Maybe we should divvy up the chores."},{"t":12.32,"x":"Divvy up?"},{"t":13.44,"x":"Split them between us."},{"t":14.96,"x":"That's actually a good idea. I just want to make sure you don't feel like you have to do everything."},{"t":18.96,"x":"And I don't want you thinking I'm not pulling my weight."},{"t":21.92,"x":"Pulling your weight?"},{"t":23.52,"x":"Doing the work I'm supposed to do."},{"t":25.6,"x":"Exactly. Look, this is new for both of us."},{"t":28.16,"x":"We just have to work out the kinks."},{"t":30,"x":"Work out the kinks?"},{"t":31.6,"x":"Yeah, fix the little problems until everything works better."},{"t":34.8,"x":"Hmm, okay."},{"t":36.56,"x":"Dishes?"},{"t":37.44,"x":"Me?"},{"t":38.08,"x":"Trash?"},{"t":39.04,"x":"You?"},{"t":39.76,"x":"Bathroom?"},{"t":40.56,"x":"You."},{"t":40.8,"x":"You?"},{"t":42.16,"x":"Rock, paper, scissors?"},{"t":43.36,"x":"Best two out of three."},{"t":44.64,"x":"I think we're gonna get along."},{"t":46.08,"x":"Rock, paper, scissors."},{"t":47.2,"x":"Shoot."}],"media":"media/6accbbe50000000012036943.mp4","images":[]},{"kind":"video","noteId":"6acb5270000000000a02698b","creator":"瑞秋爱玛","title":"全英｜当学生开始有个性…从教以来，首次震惊","publishedAt":"2026-10-11T09:10:08.000Z","durationSeconds":197.9,"likes":"54","noteUrl":"https://www.xiaohongshu.com/user/profile/61361d670000000002019d71/6acb5270000000000a02698b?xsec_token=ABCt-6-6rH6zSHi9_a_LHX8ZSvqOJLSGr3WqgizicrAkw=&xsec_source=pc_user","ipLocation":"","summary":"博主分享学校里的真实事件：一名学生没写完语文作业被老师谈话，最后竟对着刚入职的班主任发火，还甩出一句「我来学校是上课的，不是来写作业的」。视频用这个故事聊师生关系的变化与「个性/自由」用错场合的问题，能学到讲故事、复述冲突和表态议论时的高频口语句型。","tags":["英语口语","校园故事","教育反思","师生关系"],"keyPoints":["视频以全英文口播讲一个校园冲突故事，适合学习叙事和复述事件的表达。","重点句型围绕「讲八卦故事」「描述发脾气」「表达态度」三类口语场景。","博主的观点是：尊重不是天生的权利，而是靠自己赢来的。","结尾用换位设想（长大后对老板这么说）来强化论点，是一种很好用的口语论证方式。"],"patterns":[{"en":"I've got such a crazy ... story to share with you guys","zh":"我有个超离谱的故事要跟你们分享","usage":"视频或播客开场，先抛钩子把人留下来","example":"Okay, I've got such a crazy school story to share with you guys","start":0},{"en":"pull sb aside","zh":"把某人叫到一边","usage":"描述老师、上司把人单独叫走训话的场景","example":"Naturally his Chinese teacher pulled him aside for a classic teacher lecture","start":15.4},{"en":"go off on sb","zh":"对某人大发火、开喷","usage":"形容某人情绪爆发、冲着一个无辜的人发飙","example":"He's just going off on this head teacher who literally had nothing to do with the homework situation","start":55.59},{"en":"I can't imagine doing sth","zh":"我无法想象自己会做某事","usage":"表达自己对某种行为完全不能接受或不敢做","example":"I can't imagine talking to a teacher like that.","start":80.87},{"en":"Times have definitely changed.","zh":"时代真的不一样了。","usage":"对比过去和现在，感慨风气变化时的万能句","example":"Times have definitely changed, and that's for sure.","start":103.67},{"en":"let's flip the script","zh":"我们换个角度/反过来想一下","usage":"议论中转换视角，把情况倒过来设想","example":"For real though, let's flip the script for a second.","start":159.11},{"en":"Good luck with that.","zh":"祝你成功吧（反讽）","usage":"用反讽语气暗示对方那种想法行不通","example":"Good luck with that.","start":172.1},{"en":"it's something you have to earn","zh":"这是要靠自己赢来的东西","usage":"强调某样东西不是理所当然，而是需要努力换取的","example":"Respect isn't something you're entitled to. It's something you have to earn.","start":147.11}],"quotes":[{"text":"Why do I have to finish my homework? I come here for lessons, not for homework.","start":66.31,"matched":true},{"text":"Respect isn't something you're entitled to. It's something you have to earn.","start":147.11,"matched":true},{"text":"Being rude to the people who actually care about you and dropping these edgy one-liners doesn't make you cool at all.","start":152.11,"matched":true},{"text":"Do your boring homework now so you can actually stand up for yourself and the rebellion actually matters.","start":177.94,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Okay, I've got such a crazy school story to share with you guys"},{"t":3.72,"x":"So I work at a school and this whole thing went down in one of my colleagues classes"},{"t":9.12,"x":"So there's this student who didn't finish his Chinese homework"},{"t":15.4,"x":"Naturally his Chinese teacher pulled him aside for a classic teacher lecture"},{"t":19.68,"x":"Like why didn't you finish your homework as a student you should prioritize your homework blah blah blah, right?"},{"t":25.6,"x":"That kid though he had a total attitude the entire time"},{"t":29.36,"x":"so the teacher finally told him go to your head teacher off he went and here's"},{"t":35.48,"x":"the wild part he straight up ran it at the head teacher who's only her second"},{"t":41.12,"x":"year of teaching super new to the job wait he rented at that teacher why the"},{"t":50.55,"x":"kid needs to chill clearly he just snapped from all the preaching clearly"},{"t":55.59,"x":"he did. But this is the best part. He's just going off on this head teacher who"},{"t":61.51,"x":"literally had nothing to do with the homework situation and drops this iconic"},{"t":66.31,"x":"line. Why do I have to finish my homework? I come here for lessons, not for homework."},{"t":73.79,"x":"Like Mike dropped. Total silence. Wow, he actually said that out loud. I can't"},{"t":80.87,"x":"imagine talking to a teacher like that. Back in our days, if we just spoke to a teacher"},{"t":86.07,"x":"with that kind of term, we would have been in serious trouble. Teachers back then had"},{"t":91.47,"x":"zero patience with kids acting out like that. You messed around, you got ridden off completely."},{"t":98.47,"x":"No more attention, no more chances, just off the radar for good."},{"t":103.67,"x":"Times have definitely changed, and that's for sure. But honestly, it's not even"},{"t":107.67,"x":"his bad attitude that stuck with me, it's what he said."},{"t":112.67,"x":"I get the attitude part, you know, you're defensive, you get frustrated, you lose it"},{"t":118.43,"x":"in the moment."},{"t":119.43,"x":"But that line, I come here for lessons, not for homework."},{"t":125.23,"x":"You can practically see his thought process."},{"t":128.23,"x":"He's over there thinking, oh I'm my own boss, I get to do whatever I want, everyone"},{"t":133.27,"x":"has to respect me, leave me alone, no matter what."},{"t":137.11,"x":"These things are so precocious. They're all about freedom and individuality, but the problem is they're using the mindset in all the wrong situations."},{"t":147.11,"x":"Respect isn't something you're entitled to. It's something you have to earn."},{"t":152.11,"x":"Being rude to the people who actually care about you and dropping these edgy one-liners doesn't make you cool at all."},{"t":159.11,"x":"For real though, let's flip the script for a second."},{"t":164.18,"x":"Imagine when he's an adult and his boss tells him to work overtime and he goes, I come here"},{"t":170.1,"x":"for work, not for overwork."},{"t":172.1,"x":"Good luck with that."},{"t":173.78,"x":"So since you come here for lessons, here is a real lesson you need to learn."},{"t":177.94,"x":"Do your boring homework now so you can actually stand up for yourself and the rebellion"},{"t":182.62,"x":"actually matters."},{"t":183.62,"x":"Exactly."},{"t":184.62,"x":"That's deep."},{"t":185.89,"x":"just wanted to hop on here and share the story today. Let us know what you think."},{"t":190.81,"x":"Drop your comments. See you next time. See you. Bye bye. Bye bye."}],"media":"media/6acb5270000000000a02698b.mp4","images":[]},{"kind":"video","noteId":"6ac44d7d000000001b02c0d1","creator":"William","title":"生活中别人不座位，你要自己处理？","publishedAt":"2026-10-08T11:24:01.000Z","durationSeconds":73.6,"likes":"19","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44d7d000000001b02c0d1?xsec_token=ABJJEVXqZom342wHuvi159oS0m1pT1EZ6AQzj-KjaYqJU=&xsec_source=pc_user","ipLocation":"安徽","summary":"这条视频用室友不打扫卫生的生活场景，演示抱怨家务、描述清洁动作时可以用到的地道英语。博主一边吐槽一边讲清 wipe、scrub、blot 三个清洁动词的区别和用法，适合拿去描述居家清洁或跟人抱怨室友。","tags":["家务英语","地道口语","清洁动词"],"keyPoints":["视频借室友不收拾卫生间的抱怨场景，带出描述家务的日常口语说法。","重点区分三个清洁动词：wipe 是擦表面，scrub 是用力刷洗，blot 是用吸水材料轻按吸干。","讲解方式是先做动作再给英文定义，方便直接跟着情境记忆单词。","结尾用 follow this account 提醒关注账号，是短视频常见的收尾话术。"],"patterns":[{"en":"clean up after oneself","zh":"收拾自己弄乱的东西","usage":"抱怨或要求别人把用过的地方收拾干净时用。","example":"he just won't clean up after himself","start":7.52},{"en":"leave sth how it is","zh":"让某处保持原样不管","usage":"说别人用完东西不收拾、直接走人时用。","example":"he uses the bathroom and then just leaves it how it is","start":7.52},{"en":"wipe the counter","zh":"擦台面","usage":"描述用抹布擦拭台面这类日常清洁动作时用。","example":"i need to wipe the counters","start":23.04},{"en":"scrub the bathtub","zh":"刷洗浴缸","usage":"描述用力刷洗某个脏污表面时用。","example":"Yes, I have to scrub the bathtub,","start":40.34}],"quotes":[{"text":"he just won't clean up after himself","start":7.52,"matched":true},{"text":"he uses the bathroom and then just leaves it how it is","start":7.52,"matched":true},{"text":"When you rub something with a lot of force,","start":35.82,"matched":true},{"text":"and you just kind of like, you don't rub, blot.","start":59.19,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"oh god why are you okay it's my roommate again again wait what did he do this time"},{"t":7.52,"x":"he just won't clean up after himself oh no he uses the bathroom and then just leaves it how it is"},{"t":14.8,"x":"and i have to come here and i clean all the time for example right now i need to you know"},{"t":23.04,"x":"like this to this part or you have to wipe the counter right i need to wipe the counters"},{"t":28.16,"x":"And then I need to, the bathtub, I need to scrub."},{"t":35.82,"x":"When you rub something with a lot of force,"},{"t":38.14,"x":"you rub it really hard to clean it, scrub."},{"t":40.34,"x":"Yes, I have to scrub the bathtub,"},{"t":42.78,"x":"and then he spilled something over here on the floor,"},{"t":45.26,"x":"so I need to grab, you know, something and, you know."},{"t":49.83,"x":"Oh, you need to grab something and just blot, huh?"},{"t":53.03,"x":"Oh yeah, blot is when you dry some kind of wet surface"},{"t":56.71,"x":"with, you know, absorbent material,"},{"t":59.19,"x":"and you just kind of like, you don't rub, blot."},{"t":62.37,"x":"You just kind of go like this, blot."},{"t":64.81,"x":"Oh, yeah, yeah, wow."},{"t":66.93,"x":"Wait, where did you not learn more of this stuff?"},{"t":69.29,"x":"Well, you might want to clean the bathroom first"},{"t":71.17,"x":"and then follow this account to learn more."}],"media":"media/6ac44d7d000000001b02c0d1.mp4","images":[]},{"kind":"video","noteId":"6ac44d60000000001a029e90","creator":"William","title":"这些日常用语，你会用英语说吗？","publishedAt":"2026-10-08T03:53:00.000Z","durationSeconds":50.4,"likes":"58","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44d60000000001a029e90?xsec_token=ABJJEVXqZom342wHuvi159oecZ0AgVQuy0kHnvFZHs7bs=&xsec_source=pc_user","ipLocation":"安徽","summary":"这条视频用一连串生活场景对话，教人描述物品“出状况”时该怎么说英语：碗磕了口、椅子晃、金属凹了，还有“这里的东西都旧了”。跟着看能学会 chipped、wobbly、dented 这类高频形容词，以及 seen better days 这种地道说法。","tags":["日常英语","英语口语","地道表达","状态形容词"],"keyPoints":["视频用一个接一个的实物场景（缺口的碗、摇晃的椅子、凹陷的金属），把描述物品破损状态的形容词串起来教。","chipped、wobbly、dented 都用来形容东西“有毛病”，但分别对应缺口、晃动、凹陷三种不同情况。","除了单词，还教了两个地道说法：seen better days 和 used to be in much better condition，用来形容东西旧了、不如从前。","每出现一个新词，对话里都会紧跟一句解释或追问，方便理解词的准确含义。"],"patterns":[{"en":"chipped","zh":"有缺口的、磕破的","usage":"形容碗盘、杯子等边缘掉了一小块时用。","example":"Oh, it's chipped.","start":4.98},{"en":"wobbly","zh":"摇晃的、不稳的","usage":"形容桌椅等因为不稳而会晃动的物体时用。","example":"It's wobbly.","start":14.18},{"en":"dented","zh":"有凹陷的、被撞瘪的","usage":"形容金属等硬物表面被撞出坑时用。","example":"Oh, it's dented.","start":24.66},{"en":"a small piece broke off","zh":"掉了一小块","usage":"解释某处缺口是怎么形成的时候用。","example":"You mean a small piece broke off?","start":6.98},{"en":"seen better days","zh":"不如从前了、有点旧了","usage":"委婉地说东西虽然还能用，但状态已经很旧很差时用。","example":"everything around here has seen better days","start":29.14}],"quotes":[{"text":"Wait, why is there a piece missing from this bowl?","start":0,"matched":true},{"text":"Oh, it's chipped.","start":4.98,"matched":true},{"text":"So it moves because it's not stable?","start":16.18,"matched":true},{"text":"everything around here has seen better days","start":29.14,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Wait, why is there a piece missing from this bowl?"},{"t":4.98,"x":"Oh, it's chipped."},{"t":6.18,"x":"Chipped?"},{"t":6.98,"x":"You mean a small piece broke off?"},{"t":9.14,"x":"Yeah, exactly."},{"t":10.26,"x":"Great."},{"t":11.7,"x":"Whoa, what's wrong with this chair?"},{"t":14.18,"x":"It's wobbly."},{"t":15.22,"x":"Wobbly?"},{"t":16.18,"x":"So it moves because it's not stable?"},{"t":19.46,"x":"Yeah, that's right."},{"t":20.82,"x":"Wonderful."},{"t":22.74,"x":"What happened to that?"},{"t":24.1,"x":"This?"},{"t":24.66,"x":"Oh, it's dented."},{"t":26.34,"x":"Dented?"},{"t":27.06,"x":"See how the metal got pushed in right here?"},{"t":29.14,"x":"that's a dent oh I see so that's a dent yeah everything around here has seen"},{"t":36.62,"x":"better days seen better days are you saying that all of this stuff used to"},{"t":41.1,"x":"be in much better condition yeah exactly hmm you've seen better days too excuse"},{"t":47.26,"x":"me nothing no no what did you say"}],"media":"media/6ac44d60000000001a029e90.mp4","images":[]},{"kind":"video","noteId":"6ac44d2c000000001a029e2b","creator":"William","title":"合租室友太双标，你会如何应对？","publishedAt":"2026-10-07T10:22:01.000Z","durationSeconds":41.7,"likes":"41","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44d2c000000001a029e2b?xsec_token=ABJJEVXqZom342wHuvi159oZ0ltMB8zFdCwJ5b-dodJ60=&xsec_source=pc_user","ipLocation":"安徽","summary":"这是一段合租室友吵架的口语对话，William 和室友互相指责对方邋遢、不体谅人、双标，最后以「放马过来吧」收场。视频把吵架时高频的地道表达逐个拆解并解释含义，适合学习如何用英语表达不满、反问和回怼。","tags":["英语口语","地道表达","合租冲突","吵架回怼"],"keyPoints":["视频用一段室友争执的短对话，演示了英语吵架时最常用的指责、反问和挑衅表达。","每个关键词都会立刻用英文解释一遍，例如 slob、inconsiderate、hypocrite 的含义。","反问句 Are you saying...? 是这对话里推动冲突升级的核心句式。","结尾的 Come at me, bro. 是口语中很有挑衅感的说法，语气比字面意思更强硬。"],"patterns":[{"en":"You're such a slob.","zh":"你真是太邋遢了。","usage":"直接指责对方又脏又乱、不收拾时使用。","example":"You're such a slob.","start":0},{"en":"At least I'm not inconsiderate.","zh":"至少我没那么不体谅人。","usage":"被指责后用来自我辩护，同时反手讽刺对方。","example":"Excuse me? At least I'm not inconsiderate.","start":7.04},{"en":"Are you saying ...?","zh":"你是在说……吗？","usage":"确认对方话里的隐含意思，通常带点火药味。","example":"Are you saying I don't care how my actions affect other people?","start":12.16},{"en":"You're such a hypocrite.","zh":"你真是个双标的人。","usage":"说别人说一套做一套、只要求别人不要求自己时使用。","example":"Oh please, you're such a hypocrite.","start":21.52},{"en":"Practice what you preach.","zh":"自己先做到再要求别人。","usage":"批评对方光会嘴上讲道理、自己却不照做时用。","example":"Practice what you preach.","start":29.54},{"en":"Come at me, bro.","zh":"放马过来吧，兄弟。","usage":"口语里带挑衅意味地表示随时奉陪、不服就打。","example":"Come at me, bro.","start":38.1}],"quotes":[{"text":"Are you serious? Look at this place. You're such a slob.","start":0,"matched":true},{"text":"Excuse me? At least I'm not inconsiderate.","start":7.04,"matched":true},{"text":"You leave your dirty dishes in the sink every night.","start":17.52,"matched":true},{"text":"Come at me, bro.","start":38.1,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Are you serious? Look at this place. You're such a slob."},{"t":3.52,"x":"A slob? You mean someone who's really messy?"},{"t":7.04,"x":"Yes. Look around. Excuse me? At least I'm not inconsiderate."},{"t":12.16,"x":"Inconsiderate me? Are you saying I don't care how my actions affect other people?"},{"t":17.52,"x":"Exactly. You leave your dirty dishes in the sink every night."},{"t":21.52,"x":"Oh please, you're such a hypocrite."},{"t":23.92,"x":"A hypocrite? Like I tell you what to do but I don't even do it myself?"},{"t":28.16,"x":"Exactly."},{"t":29.54,"x":"Practice what you preach."},{"t":31.1,"x":"Practice what you preach?"},{"t":32.18,"x":"Are you telling me that I can't tell you this stuff"},{"t":34.3,"x":"because I don't do it myself?"},{"t":35.82,"x":"Yeah."},{"t":36.7,"x":"Okay, you know what?"},{"t":38.1,"x":"Come at me, bro."},{"t":38.94,"x":"Oh, are you sure?"},{"t":39.78,"x":"Are you sure?"},{"t":40.62,"x":"Come on."}],"media":"media/6ac44d2c000000001a029e2b.mp4","images":[]},{"kind":"video","noteId":"6ac44cfe000000001500f89c","creator":"William","title":"遇到这些情况，你会用英语描述吗？","publishedAt":"2026-10-07T04:21:00.000Z","durationSeconds":41.5,"likes":"39","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44cfe000000001500f89c?xsec_token=ABJJEVXqZom342wHuvi159oSRe0Cw3wwUywMOxJksJLyM=&xsec_source=pc_user","ipLocation":"安徽","summary":"这段视频还原了面对一团糟的厨房时，如何用英语吐槽脏乱场景。通过对话形式，可以学到描述黏手、掉渣、剩饭等日常生活问题的地道说法。","tags":["实用英语","日常口语","厨房场景","地道表达"],"keyPoints":["视频用一段厨房对话演示如何抱怨脏乱环境，场景非常贴近日常生活。","重点词汇包括 sticky（黏的）、crumbs（碎屑）、leftovers（剩饭）。","句型上涵盖了抱怨、追问、确认和决定行动等常见口语功能。"],"patterns":[{"en":"This kitchen is a mess.","zh":"这个厨房一团糟。","usage":"抱怨某个地方又脏又乱时用。","example":"This kitchen is a mess.","start":0},{"en":"I can't live like this anymore.","zh":"我再也受不了这样了。","usage":"表达对某种状况忍无可忍时用。","example":"I can't live like this anymore.","start":0},{"en":"Do you mean sticky?","zh":"你是说黏黏的吗？","usage":"对方描述不清时，用关键词帮他把意思说出来。","example":"Oh, do you mean sticky?","start":13.96},{"en":"get stuck to my feet","zh":"粘在我脚上。","usage":"描述碎屑、纸片之类的东西粘在脚底时用。","example":"all these crumbs just get stuck to my feet","start":28.24}],"quotes":[{"text":"This kitchen is a mess.","start":0,"matched":true},{"text":"I can't live like this anymore.","start":0,"matched":true},{"text":"Oh, do you mean sticky?","start":13.96,"matched":true},{"text":"I think it's time for me to clean","start":39.04,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Oh my god. What's going on? This kitchen is a mess. I can't live like this anymore. Like the counter it's"},{"t":7.64,"x":"it's not wet, but"},{"t":9.76,"x":"it's like"},{"t":11.48,"x":"glue my hand is like"},{"t":13.96,"x":"Staying on it. Oh, do you mean sticky? Yeah sticky disgusting and when I walk all these little food"},{"t":22.64,"x":"Pieces, they just you know attack my feet. Oh, yeah all these crumbs"},{"t":28.24,"x":"yeah crumbs all these crumbs just get stuck to my feet and then you know you"},{"t":33.4,"x":"eat but then there's some food left afterwards oh yeah leftovers yeah I"},{"t":39.04,"x":"think it's time for me to clean"}],"media":"media/6ac44cfe000000001500f89c.mp4","images":[]},{"kind":"video","noteId":"6ac44cc7000000001500f814","creator":"William","title":"当你遇到这人这事，你会说...？","publishedAt":"2026-10-06T10:22:01.000Z","durationSeconds":46.6,"likes":"44","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44cc7000000001500f814?xsec_token=ABJJEVXqZom342wHuvi159oQNhLq9RVozPKtlPKhz2YKo=&xsec_source=pc_user","ipLocation":"安徽","summary":"这是一条生活场景英语短视频：William 在吃东西时被人直接伸手拿食物，他语气不好地回了一句，对方听不懂，于是顺势讲解 snap at someone 这个表达。看完能学会几个拿别人食物、被人凶、偷吃一口等日常互动里的地道说法。","tags":["生活英语","英语口语","地道表达","词汇辨析"],"keyPoints":["to snap at someone 指带着怒气和刻薄的语气对人说话，不一定是大喊。","steal a bite 是口语里「偷吃一口、蹭一口」的说法，常用来指没打招呼就吃别人东西。","视频用「没问过就拿我吃的」和「snap at someone」两个点串起了一段很日常的对话。","遇到听不懂的表达时，可以直接用 what does that mean 追问。"],"patterns":[{"en":"you didn't have to ...","zh":"你没必要……","usage":"觉得对方反应过激、做得太过了的时候说。","example":"you didn't have to snap at me like that","start":5.91},{"en":"snap at someone","zh":"冲某人发火","usage":"形容因为生气而语气很冲、很刻薄地回应别人。","example":"to snap at someone means to speak angrily and harshly","start":11.79},{"en":"steal a bite","zh":"偷吃一口、蹭一口","usage":"说别人没问过就吃了一口你的东西。","example":"do you mean you don't like when people steal a bite?","start":32.37}],"quotes":[{"text":"you didn't have to snap at me like that","start":5.91,"matched":true},{"text":"I snapped at you because I don't like when people take my food without like asking","start":16.15,"matched":true},{"text":"I snap at people when they try to steal a bite.","start":32.37,"matched":true},{"text":"can I have some now?","start":42.33,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.24,"x":"Hey, what you doing? I'm eating. Oh, yeah, let me have some whoa. No"},{"t":5.91,"x":"What are you whoa you didn't have to snap at me like that wait what snap"},{"t":11.79,"x":"Wait, what what does that mean to snap at someone means to speak?"},{"t":16.15,"x":"Angrily and and harshly. Oh, yeah, I snapped at you because I don't like when people"},{"t":22.71,"x":"people take my food without like asking or just take my food in general do you"},{"t":32.37,"x":"mean you don't like when people steal a bite? oh yeah I snap at people when they"},{"t":38.01,"x":"try to steal a bite. where can I learn more of this vocabulary? oh you can"},{"t":42.33,"x":"always follow this account to learn more. can I have some now? no okay"}],"media":"media/6ac44cc7000000001500f814.mp4","images":[]},{"kind":"video","noteId":"6ac44c980000000018039101","creator":"William","title":"你在生活中会遇到这种人...？","publishedAt":"2026-10-06T03:40:04.000Z","durationSeconds":46.5,"likes":"154","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44c980000000018039101?xsec_token=ABJJEVXqZom342wHuvi159obpjaGMf58Qn_yG7ULSCTsY=&xsec_source=pc_user","ipLocation":"安徽","summary":"这条视频用一段“最后一块饼干被吃掉”的争吵对话，演示了英语里指责对方时最常用的几个词。博主一人分饰两角，把 petty、defensive、overreacting、blow out of proportion 等词放进真实的互怼场景里，同时给出它们的解释。适合想学会在吵架时用地道英语表达不满的人。","tags":["英语口语","地道表达","争吵场景","词汇辨析"],"keyPoints":["视频只用一段饼干被吃掉的日常小冲突，就串起了四个互相指责的高频形容词和短语。","每个被指责的词后面，被指责的人都会反问一遍并复述它的意思，等于自带词典解释。","这些词都属于吵架时“说对方反应过度、太小气、太防御”的固定套路表达。","结尾用 blow something out of proportion 做了个喜剧式的升级，说明这个短语可以反过来威胁使用。"],"patterns":[{"en":"you're being so petty","zh":"你太斤斤计较了","usage":"觉得对方为一件小事较真、不值得计较时用。","example":"Oh my god, you're being so petty.","start":4.2},{"en":"get upset over something","zh":"因为某事而生气／不高兴","usage":"描述自己或别人为了某件具体的事恼火时用。","example":"Like I'm getting upset over something small and unimportant?","start":7.8},{"en":"Why are you getting so defensive?","zh":"你怎么这么玻璃心？","usage":"对方一被指出问题就急着辩解时反问。","example":"Why are you getting so defensive?","start":15.9},{"en":"You started it.","zh":"是你先挑起的。","usage":"把责任推回给对方、强调冲突由对方引起时用。","example":"You started it.","start":22.1},{"en":"You're completely overreacting.","zh":"你完全反应过度了。","usage":"认为对方的情绪或举动明显超过事情本身应得的程度时用。","example":"You're completely overreacting.","start":25.9},{"en":"blow this way out of proportion","zh":"小题大做、过度放大","usage":"说对方把一件小事搞成了大问题。","example":"Yes, you're blowing this way out of proportion.","start":32.76}],"quotes":[{"text":"Did you seriously eat the last cookie?","start":0,"matched":true},{"text":"I was saving that.","start":3.1,"matched":true},{"text":"It's a cookie.","start":12.2,"matched":true},{"text":"I'm just protecting myself because you're criticizing me.","start":19.2,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Did you seriously eat the last cookie?"},{"t":2.4,"x":"Yeah."},{"t":3.1,"x":"I was saving that."},{"t":4.2,"x":"Oh my god, you're being so petty."},{"t":6.6,"x":"Petty?"},{"t":7.8,"x":"Like I'm getting upset over something small and unimportant?"},{"t":11.1,"x":"Yes."},{"t":12.2,"x":"It's a cookie."},{"t":13.3,"x":"Well, maybe if you weren't so selfish."},{"t":15.9,"x":"Why are you getting so defensive?"},{"t":17.8,"x":"Defensive?"},{"t":19.2,"x":"I'm just protecting myself because you're criticizing me."},{"t":22.1,"x":"You started it."},{"t":23.2,"x":"Because you ate my cookie."},{"t":25.9,"x":"You're completely overreacting."},{"t":28.4,"x":"Overreacting?"},{"t":29.4,"x":"you think my reaction is stronger than the situation deserves?"},{"t":32.76,"x":"Yes, you're blowing this way out of proportion."},{"t":35.52,"x":"Are you saying I'm making the situation way more serious"},{"t":38.56,"x":"than it needs to be?"},{"t":39.52,"x":"Yeah."},{"t":40.36,"x":"Oh, you wanna see me blow something out of proportion?"},{"t":43.2,"x":"Are you serious right now?"},{"t":44.7,"x":"Let's see how you like that."}],"media":"media/6ac44c980000000018039101.mp4","images":[]},{"kind":"video","noteId":"6abfa28c00000000140383bc","creator":"瑞秋爱玛","title":"全英｜失业近五个月，只为等外企offer…","publishedAt":"2026-10-02T12:24:44Z","durationSeconds":217.3,"likes":"74","noteUrl":"https://www.xiaohongshu.com/user/profile/61361d670000000002019d71/6abfa28c00000000140383bc?xsec_token=ABv3RalkvFCSrUwbgHRIf3-_iJGkb2hLPypZDn95H5H9Y=&xsec_source=pc_user","ipLocation":"上海","summary":"在外企和私企都待过的亲身对比，从加班、工作范围、团队氛围、请假制度一路讲到年会，全程英语叙述，适合练「对比陈述」的句式。","tags":["全英播客","职场英语","对比论述"],"keyPoints":["对比类口播的万能结构：先立维度（加班/工作量/氛围/请假/年会），再逐条对比","描述公司文化的高频词：work-life boundaries、job scope、proper boundaries、office politics","讲自己的经历时用 During my stay at …, I would have to … 这种过去习惯句式","ASR 提示：结尾一段识别质量差（出现 keyboard 等无关词），引用时建议回看原片"],"patterns":[{"en":"respect work-life boundaries","zh":"尊重工作与生活的边界","usage":"形容公司不侵占私人时间","example":"Multinationals generally respect work-life boundaries.","start":27.79},{"en":"Once your tasks are wrapped up, you can log off.","zh":"活干完就能下线。","usage":"wrap up = 收尾完成，log off 比 leave 更贴线上办公","example":"Once your assigned tasks are wrapped up, you can log off.","start":35.79},{"en":"You are expected to stay reachable at work.","zh":"要求你随时能被联系上。","usage":"be expected to 表达隐性要求，比 must 更准","example":"In private companies, you are expected to stay reachable.","start":44.79},{"en":"a daily occurrence","zh":"每天都会发生的事","usage":"描述常态化的加班或状况","example":"Getting off work at 10pm is a daily occurrence.","start":46.79},{"en":"value efficiency over looking busy","zh":"看重效率，而不是看起来很忙","usage":"A over B 句式，对比两种取向","example":"Foreign companies value efficiency over looking busy.","start":72.95},{"en":"job boundaries tend to be blurry","zh":"职责边界往往很模糊","usage":"tend to be 表示普遍倾向","example":"For local private firms, job boundaries tend to be blurry.","start":77.63},{"en":"asking for leave still feels like asking for a favor","zh":"请假还是像在求人。","usage":"feel like + 动名词，描述主观感受","example":"In many private companies, asking for leave still feels like asking for a favor.","start":140.46}],"quotes":[{"text":"Foreign companies usually have clear job descriptions. Your responsibilities are well defined and value efficiency over looking busy.","start":70.15,"matched":true},{"text":"In many private companies, asking for leave still feels like asking for a favor.","start":140.46,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"As you guys know, I find a new job at a multinational company after five months of gap."},{"t":5.07,"x":"What you probably don't know is that one's worked at a private local company."},{"t":9.47,"x":"You may wonder what's the real difference between the two."},{"t":12.11,"x":"Today we are skipping those one-sided stereotypes."},{"t":15.07,"x":"Let's talk about the actual differences I've observed from overtime, workload, team"},{"t":20.59,"x":"vibe, leave policy all the way to annual parties."},{"t":25.95,"x":"First, overtime and working hours."},{"t":27.79,"x":"Multinationalists generally respect work-life boundaries."},{"t":31.79,"x":"Overtime is only for exceptional cases, never a counter-expectation."},{"t":35.79,"x":"Once your assigned tasks are wrapped up, you can log off."},{"t":39.79,"x":"The person time is respected, but private companies may operate with a different mindset."},{"t":44.79,"x":"You are expected to stay reachable at work."},{"t":46.79,"x":"During my stay at that private company, getting off work at 10pm is a daily occurrence."},{"t":51.79,"x":"If there happens to be a special occasion like annual meetings or exhibitions,"},{"t":55.79,"x":"decisions, I would have to stand by for the whole night."},{"t":58.79,"x":"I simply could not understand why there are so many things to do and why those things"},{"t":62.43,"x":"have to be done with such urgency."},{"t":67.95,"x":"Next workload and job scope."},{"t":70.15,"x":"Foreign companies usually have clear job descriptions."},{"t":72.95,"x":"Your responsibilities are where defined and value efficiency over looking busy."},{"t":77.63,"x":"For local private firms, job boundaries tend to be blurry."},{"t":81.11,"x":"It's common for one person to have multiple roles."},{"t":84.07,"x":"constantly take on unexpected extra work and absorb all sorts of emergency"},{"t":88.51,"x":"issues like changing water for bars fish tank. Then workplace atmosphere"},{"t":97.1,"x":"multinational teams are professional and polite, colleagues maintain proper boundaries."},{"t":101.54,"x":"We focus on getting things done with less emotional pressure or office politics."},{"t":106.02,"x":"In a private company the boss is more dictatorial than supportive and sometimes"},{"t":110.74,"x":"your boss could be the major source of pressure and uncomfortableness of your work."},{"t":114.46,"x":"For example, you may find yourself in a meeting listening to your boss rambling on and on and"},{"t":119.9,"x":"you have to pretend to stay for attention by scribbling away furiously, besides invisible"},{"t":125.94,"x":"internal competition and the pressure I usually have here."},{"t":131.91,"x":"At foreign companies, vocation is treated as your basic right."},{"t":135.05,"x":"You submit the application no need to over-explain or feel guilty for taking time off."},{"t":140.46,"x":"In many private companies, asking for leave still feels like asking for a favor."},{"t":145.42,"x":"You have to carefully explain your situation and worry about leaving your extra work for"},{"t":150.1,"x":"your team or leaving a bad impression on your manager."},{"t":154.13,"x":"In my case, another bothering issue is that a leave was released by the hour, meaning you"},{"t":158.45,"x":"have to work until you get eight hours to ask for a day's leave."},{"t":162.77,"x":"What can I say?"},{"t":163.77,"x":"Let's talk about annual parties."},{"t":169.65,"x":"Annual parties and multinationals are mostly for rest and rewards, good food,"},{"t":174.61,"x":"lucky draws, simple socializing."},{"t":177.25,"x":"No mandatory performances or meaningless formalities."},{"t":180.21,"x":"Private company annual parties are designed to boost team morale, which I'm not sure about."},{"t":184.53,"x":"The emphasised passion and the unity, which often means compulsory group activities and"},{"t":189.41,"x":"talent shows, are forced to act on state play, boosting about the greatness of the company."},{"t":196.05,"x":"As a newcomer, I was like,"},{"t":197.89,"x":"Mi ma to vi mi ma!"},{"t":200.01,"x":"Okay, now here is a keyboard."},{"t":202.45,"x":"the option is inherently better or worse. Your choice really depends on what you're prioritizing"},{"t":208.29,"x":"your career, so which one can start if it's you? Drop your thoughts in the comment below. Bye."}],"media":"media/6abfa28c00000000140383bc.mp4","images":[]},{"kind":"video","noteId":"6abf181a000000001c00f40b","creator":"William","title":"Do You Know...？","publishedAt":"2026-10-02T10:40:04Z","durationSeconds":63.4,"likes":"179","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6abf181a000000001c00f40b?xsec_token=ABv3RalkvFCSrUwbgHRIf3-7N39J2h9FxEPavOJ91SE7A=&xsec_source=pc_user","ipLocation":"安徽","summary":"室友没打招呼就搬走、当天还要塞个新室友进来。整段对话专门练「被突袭」「背着我做」「已成定局」这几组高频表达。","tags":["日常口语","冲突对话","室友沟通"],"keyPoints":["冲突场景里英语母语者很少直说「你怎么不告诉我」，而是用 blindside / behind my back 这类固定搭配","set in stone 用来表示「已经定了、不能改」，比 decided 更强调不可逆","pretty much 是口语里表示「基本上就是」的高频缩写式回答"],"patterns":[{"en":"blindside someone","zh":"突然袭击、把人打个措手不及","usage":"对方毫无预兆地抛来一个重大消息时","example":"You can't just blindside me like that.","start":5.66},{"en":"hit someone with huge news","zh":"甩给某人一个重磅消息","usage":"强调消息的分量和突然性","example":"You hit me with huge news with absolutely no warning.","start":5.66},{"en":"behind someone's back","zh":"背着某人（偷偷做）","usage":"发现对方瞒着自己行动时","example":"You did all of this behind my back?","start":19.64},{"en":"take matters into your own hands","zh":"自己动手把事情办了","usage":"等不及别人、决定自己解决","example":"Somebody had to take matters into their own hands.","start":30.1},{"en":"It's already set in stone.","zh":"已经板上钉钉了。","usage":"表示决定已定、不打算改","example":"It's too late. It's already set in stone.","start":40.82},{"en":"Pretty much.","zh":"差不多就是这样。","usage":"口语里简短肯定对方的总结","example":"So you just handled everything yourself? — Pretty much.","start":35.22},{"en":"easy to live with","zh":"好相处、适合同住","usage":"评价室友或伴侣的相处难度","example":"He said you're super easy to live with.","start":54.3}],"quotes":[{"text":"You can't just blindside me like that.","start":5.66,"matched":true},{"text":"It's already set in stone.","start":40.82,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.5,"x":"Whoa, whoa, whoa. Where are you going? I'm moving out. You're what? I'm moving out"},{"t":5.66,"x":"You can't just blindside me like that blindside you. Yes hit me with huge news with absolutely no warning"},{"t":13.64,"x":"Relax, I already found someone to take my room. You what? He's moving in today today"},{"t":19.64,"x":"You did all of this behind my back behind your back"},{"t":23.26,"x":"Yes, you planned the whole thing without telling me because I knew you'd make it difficult"},{"t":27.46,"x":"Of course I'd make it difficult. I live here."},{"t":30.1,"x":"Look, somebody had to take matters into their own hands."},{"t":33.3,"x":"Take matters into your own hands?"},{"t":35.22,"x":"So you just handled everything yourself without asking me?"},{"t":38.18,"x":"Pretty much."},{"t":39.14,"x":"You don't get to choose my new roommate?"},{"t":40.82,"x":"It's too late. It's already set in stone."},{"t":42.9,"x":"Set in stone?"},{"t":44.18,"x":"It's decided. It's not changing."},{"t":46.26,"x":"Oh, it's changing."},{"t":47.7,"x":"No, it's not."},{"t":49.06,"x":"Yes, it..."},{"t":50.46,"x":"Actually, that should be him."},{"t":51.98,"x":"Him?"},{"t":52.78,"x":"Hey, you must be my new roommate."},{"t":54.3,"x":"He said you're super easy to live with."},{"t":56.54,"x":"Nice to meet you."},{"t":57.74,"x":"Is there something going on?"}],"media":"media/6abf181a000000001c00f40b.mp4","images":[]},{"kind":"video","noteId":"6abe414f000000001802e6de","creator":"William","title":"生活英语：遇到这些情况怎么说？","publishedAt":"2026-10-01T13:30:12.000Z","durationSeconds":42.7,"likes":"174","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6abe414f000000001802e6de?xsec_token=ABMM5QYrg-hkp0j8yab-OPSbfVp518R7T6Inq9vIlhr4w=&xsec_source=pc_user","ipLocation":"安徽","summary":"这条视频还原了把咖啡打翻在笔记本电脑上后的真实对话场景，从惊呼、询问状况到描述电脑故障，全程用英语完成。博主顺带讲了几个描述「打翻、卡住、死机、报废」的地道说法，并点出背过的单词在需要时用不出来，是因为「认识单词」和「压力下用出单词」是两回事。","tags":["生活英语","英语口语","突发状况","单词活用"],"keyPoints":["场景是打翻咖啡、电脑出故障时的即时英语对话，重点在描述物品状态。","打翻用 knocked over，死机可以用 it froze 或 it's just not responding。","彻底坏掉，尤其是被液体弄坏，可以用 it might be fried。","博主提醒：认识单词和能在紧张时脱口而出，是两个完全不同的能力。"],"patterns":[{"en":"knocked over","zh":"打翻、碰倒","usage":"描述不小心把液体或物件弄翻时","example":"Oh, you knocked over your coffee.","start":6.79},{"en":"it's just not responding","zh":"它就是没有任何反应","usage":"描述电子设备有电但操作无反应时","example":"Oh, it's on it's just not responding or you could say it froze froze like frozen","start":13.03},{"en":"Is it dead?","zh":"它是彻底废了吗？","usage":"半开玩笑地问设备是不是完全没救了","example":"Wait, is it dead?","start":22.38},{"en":"it might be fried","zh":"它可能已经烧了／废了","usage":"推测设备因进水等原因彻底损坏时","example":"Yeah, it might be fried as in completely broken from the liquid","start":22.38},{"en":"I just can't seem to find them","zh":"就是想不起来／找不到","usage":"表达明明会却一时想不起来时","example":"it seems like I know these words but when I need them I just can't seem to find them","start":28.42}],"quotes":[{"text":"Oh, you knocked over your coffee.","start":6.79,"matched":true},{"text":"Wait, is it dead?","start":22.38,"matched":true},{"text":"Yeah, it might be fried as in completely broken from the liquid","start":22.38,"matched":true},{"text":"knowing words and being able to use them under pressure are two completely different things","start":35.22,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.43,"x":"Oh, my laptop. Oh, no. Is it okay? What happened? I pushed down my coffee"},{"t":6.79,"x":"Oh, you knocked over your coffee. Yeah knocked over and now the computer"},{"t":13.03,"x":"Isn't working. Oh, it's on it's just not responding or you could say it froze froze like frozen"},{"t":22.38,"x":"Wait, is it dead? Yeah, it might be fried as in completely broken from the liquid"},{"t":28.42,"x":"fried knocked over froze it seems like I know these words but when I need them I"},{"t":35.22,"x":"just can't seem to find them well that's because knowing words and being able to"},{"t":39.18,"x":"use them under pressure are two completely different things"}],"media":"media/6abe414f000000001802e6de.mp4","images":[]},{"kind":"video","noteId":"6abe4106000000001500efd7","creator":"William","title":"当你英语不好，遇到这种情况怎么说？","publishedAt":"2026-10-01T11:16:22.000Z","durationSeconds":38.6,"likes":"308","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6abe4106000000001500efd7?xsec_token=ABMM5QYrg-hkp0j8yab-OPSZdg7yFmCD99Lx4JngAIbng=&xsec_source=pc_user","ipLocation":"安徽","summary":"这条视频模拟室友不讲卫生的日常抱怨场景：剪脚趾甲不收拾、洗完澡吹头发掉一地。通过一问一答的对话，自然带出「toenail clippings」「blow-dry」「shed」等地道词汇和口语表达，适合用来吐槽生活琐事。","tags":["英语口语","生活词汇","室友吐槽","地道表达"],"keyPoints":["视频用室友邋遢的真实场景，把「剪脚趾甲、吹头发、掉头发」这几个日常动作串成一段对话。","重点词汇是 toenail clippings（脚趾甲碎屑）、blow-dry（用吹风机吹干）、shed（掉毛、掉发）。","表达不满时可以用 That's disgusting 和 What's going on，语气自然又口语化。","博主最后提醒可以关注账号继续学这类生活词汇。"],"patterns":[{"en":"leave sth all over the floor","zh":"把某物弄得满地都是。","usage":"抱怨别人乱丢东西、不收拾时用。","example":"My roommate, he cut his nails on his feet and left them all over the floor.","start":0},{"en":"toenail clippings","zh":"剪下的脚趾甲","usage":"具体指剪脚趾甲留下的碎屑。","example":"Oh, toenail clippings?","start":7.92},{"en":"blow-dry one's hair","zh":"用吹风机吹头发。","usage":"描述洗完澡后用吹风机吹干头发。","example":"Oh, and he blow-dries his hair.","start":14.67},{"en":"hair shedding","zh":"掉头发、掉毛。","usage":"说头发正常脱落时用这个名词形式。","example":"I mean the little hair shedding is normal, he just needs to clean it up.","start":21.39},{"en":"shed","zh":"掉（毛发）。","usage":"动词，指人或动物掉毛、掉发。","example":"Sheds, yes, he sheds a lot.","start":29.85}],"quotes":[{"text":"Oh my god, that's disgusting.","start":0,"matched":true},{"text":"My roommate, he cut his nails on his feet and left them all over the floor.","start":0,"matched":true},{"text":"Oh, and he blow-dries his hair.","start":14.67,"matched":true},{"text":"I mean the little hair shedding is normal, he just needs to clean it up.","start":21.39,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Oh my god, that's disgusting. What's going on? My roommate, he cut his nails on his"},{"t":7.92,"x":"feet and left them all over the floor. Oh, toenail clippings? Tonal clippings, yeah."},{"t":14.67,"x":"And after the shower, he also blew his hair. Oh, and he blow-dries his hair. He has blow-dries his"},{"t":21.39,"x":"hair and his hair comes out of his head a lot on the floor. I mean the little"},{"t":29.85,"x":"hair shedding is normal, he just needs to clean it up. Sheds, yes, he sheds a lot."},{"t":34.33,"x":"Wow, where can I learn this vocabulary? Oh you can just follow this account to"},{"t":38.05,"x":"learn more."}],"media":"media/6abe4106000000001500efd7.mp4","images":[]},{"kind":"video","noteId":"6abdf54c000000001a028227","creator":"Bapanda职场英语表达","title":"英文不好牛马主持英文线上会议无痛版下","publishedAt":"2026-10-01T05:53:16.000Z","durationSeconds":116.1,"likes":"88","noteUrl":"https://www.xiaohongshu.com/user/profile/59addf2d50c4b41fabc101b0/6abdf54c000000001a028227?xsec_token=AB88Uln-G1_PhlGHQgj5kfkJvPDtj1gENCMAvXWivMQJU=&xsec_source=pc_user","ipLocation":"云南","summary":"这条视频演示了主持英文线上会议的完整流程，从开场问候、调试麦克风和屏幕共享，到引导同事发言、澄清疑问、控制节奏和收尾总结。可以学到一套开线上会议时最常用的救场句和推进句，不用背长难句也能把会议主持下来。","tags":["职场英语","英文会议","线上会议","会议表达"],"keyPoints":["开场先用问候加确认音画的方式启动会议，比如确认大家能否听到、能否看到屏幕。","听不清或技术卡顿时，可以用简短的句子请对方重复、确认是否掉线，不用慌张。","听不懂时要主动打断澄清，用追问把模糊的说法问具体，避免会议跑偏。","推进会议靠分配发言、暂时搁置跑题内容和最后总结下一步，这几步串起来就是一套完整主持流程。"],"patterns":[{"en":"Am I breaking up?","zh":"我的声音是不是断断续续的？","usage":"怀疑网络或麦克风有问题、对方没回应时主动检查。","example":"Am I breaking up?","start":3.76},{"en":"Could you repeat that last part?","zh":"你能把最后那部分再说一遍吗？","usage":"对方刚才那句话没听清，只求重复关键部分时用。","example":"Could you repeat that last part?","start":38.72},{"en":"Sorry I'm not sure I follow.","zh":"抱歉，我不太跟得上你的意思。","usage":"礼貌表示没听懂，请对方补充说明。","example":"Sorry I'm not sure I follow.","start":43.2},{"en":"What do you mean by that?","zh":"你这么说是什么意思？","usage":"对方表述含糊，需要问清楚具体所指。","example":"What do you mean by that?","start":47.39},{"en":"Let's park there for now.","zh":"这个我们先暂时放一放。","usage":"话题跑偏或需要留到后面再谈时，温和地把讨论拉回来。","example":"Well, that's a good point, but let's park there for now.","start":72},{"en":"Do you want to take this one?","zh":"这个问题你想来回答吗？","usage":"把问题转给更合适的同事，请对方接手。","example":"Sarah, do you want to take this one?","start":67.39},{"en":"Does that work for everyone?","zh":"这样安排大家都方便吗？","usage":"确定时间或下一步安排后，向所有人确认是否可行。","example":"Does that work for everyone?","start":108.91}],"quotes":[{"text":"Can everyone see it okay? Hang on, let me try that again.","start":15.25,"matched":true},{"text":"Wait are we looking at the same time period?","start":52.48,"matched":true},{"text":"All right, let's quickly recap the next steps.","start":98.51,"matched":true},{"text":"I'll send out a quick recap email.","start":111.97,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Morning everyone, good to see you all. Welcome to our Q2 review."},{"t":3.76,"x":"Can everyone hear me okay? Am I breaking up? Hold on, let me check my mic."},{"t":10.02,"x":"Is this any better? Great, thanks. All right, let me share my screen."},{"t":15.25,"x":"Can everyone see it okay? Hang on, let me try that again."},{"t":19.98,"x":"How about now? Perfect."},{"t":22.56,"x":"So today we went through our Q2 results and discussed our priorities for Q3."},{"t":28.08,"x":"So overall it was a solid quarter but customer retention was our biggest challenge."},{"t":34.72,"x":"James over to you. Sorry James you cut out for a second."},{"t":38.72,"x":"Could you repeat that last part? Got it, thanks."},{"t":43.2,"x":"Sarah anything to add? Sorry I'm not sure I follow."},{"t":47.39,"x":"What do you mean by that? Oh okay that makes sense."},{"t":52.48,"x":"Wait are we looking at the same time period?"},{"t":55.36,"x":"James is that for the whole quarter or just August?"},{"t":59.94,"x":"Oh, got it. That's why the numbers don't match."},{"t":63.95,"x":"Well, actually, Sarah would be the best person to answer that."},{"t":67.39,"x":"Sarah, do you want to take this one?"},{"t":70,"x":"Got it. Thanks."},{"t":72,"x":"Well, that's a good point, but let's park there for now."},{"t":75,"x":"Let's bring it back to Q2 customer retention first."},{"t":78,"x":"So what do you think caused the problem?"},{"t":80.4,"x":"Sarah, go ahead. James, I'll come to you next."},{"t":84.2,"x":"Sounds good. Thanks, Sarah. James, go ahead."},{"t":87.2,"x":"You're right. Good point."},{"t":89.2,"x":"All right, we have about 10 minutes left."},{"t":91.2,"x":"So let's move on to Q3."},{"t":93.44,"x":"Jack, what's the main focus for your team?"},{"t":97.23,"x":"Sounds good."},{"t":98.51,"x":"All right, let's quickly recap the next steps."},{"t":100.99,"x":"Our main focus for Q3 is customer retention."},{"t":104.75,"x":"Jar will share the updated plan by Friday."},{"t":107.23,"x":"We'll go over it next week."},{"t":108.91,"x":"Does that work for everyone?"},{"t":111.49,"x":"Perfect."},{"t":111.97,"x":"I'll send out a quick recap email."},{"t":114.13,"x":"Thanks everyone."},{"t":115.09,"x":"Have a good day."}],"media":"media/6abdf54c000000001a028227.mp4","images":[]},{"kind":"video","noteId":"6abb869c000000001803aad9","creator":"Bapanda职场英语表达","title":"英文不好牛马主持英文线上会议无痛版中","publishedAt":"2026-09-29T09:36:28.000Z","durationSeconds":131.8,"likes":"391","noteUrl":"https://www.xiaohongshu.com/user/profile/59addf2d50c4b41fabc101b0/6abb869c000000001803aad9?xsec_token=AB2HWJnCOMa6nyKXjfiibhZev7TCAQ1y85bG7-dtAk_-I=&xsec_source=pc_user","ipLocation":"云南","summary":"这条视频模拟了一场英文线上项目会议，从开场等人、催进度、遇到网络卡顿，到确认分工和收尾总结，覆盖了主持会议的完整流程。可以学到一批职场会议里高频、拿来就能用的短句，尤其是控场、追问和礼貌插话的表达。","tags":["线上会议","职场英语","会议口语","主持控场"],"keyPoints":["开场先感谢已到场的人，说明还在等人，并承诺之后补上进度，可以让会议顺利开始。","用简短问句请别人汇报进度、确认是否按计划推进，比自己长篇解释更自然。","遇到对方网络卡顿时，用轻松的说法提醒并确认能否听见，避免气氛尴尬。","会议结束前复述每项待办和负责人，再确认一次大家是否认同，能有效收尾。"],"patterns":[{"en":"We'll catch you up later.","zh":"我们稍后会把进度补给你。","usage":"有人迟到或还没上线，先开会并承诺会后同步。","example":"Alright, let's get started. We'll catch you up later.","start":5.44},{"en":"how are things ting until you get Lisa's page."},{"t":42.53,"x":"Got it."},{"t":43.23,"x":"We'll ask Lisa about the timing."},{"t":44.93,"x":"Hi Lisa, welcome."},{"t":46.03,"x":"No worries."},{"t":46.73,"x":"Mike is waiting for your final product page"},{"t":48.73,"x":"before he can finish testing."},{"t":51.03,"x":"How are the launch materials looking?"},{"t":54.1,"x":"Sorry to jump in, just so we say on time,"},{"t":56.3,"x":"what's left to finish?"},{"t":58.32,"x":"Thursday."},{"t":59.32,"x":"Sounds good."},{"t":60.22,"x":"Thanks."},{"t":60.72,"x":"Mike, once you get the page, how long will testing take?"},{"t":63.84,"x":"So sorry, go ahead."},{"t":66.21,"x":"Great."},{"t":67.25,"x":"Does it work for you, Mike?"},{"t":68.97,"x":"Perfect."},{"t":70.32,"x":"Oh, sure. Thanks for the update."},{"t":71.88,"x":"Hi, Derek. Good to have you with us."},{"t":73.8,"x":"We're just going through the latest updates."},{"t":76.8,"x":"We're still aiming for next Friday."},{"t":78.6,"x":"Development is almost done and testing is in progress."},{"t":83.4,"x":"There are two things we are watching."},{"t":85,"x":"We are expecting confirmation from the supplier tomorrow"},{"t":87.92,"x":"and the final product page is still Thursday."},{"t":90.72,"x":"Right now, either one affects the launch date."},{"t":93.5,"x":"But I'll let you know if anything changes."},{"t":96.14,"x":"We'll do."},{"t":97.88,"x":"I don't have the latest number with me right now,"},{"t":100.04,"x":"so let me double check after the meeting."},{"t":102.16,"x":"I will send them to you by the end of today."},{"t":105.4,"x":"Thanks for dropping in."},{"t":106.64,"x":"All right, let's quickly go over the next steps."},{"t":109.32,"x":"James will update us once he hears back from the supplier."},{"t":113.04,"x":"And Lisa, you will send Mike the final product"},{"t":115.28,"x":"page on Thursday morning."},{"t":117.08,"x":"And Mike, you'll finish testing once you get the page."},{"t":120.44,"x":"and I'll send Derek the latest sign-up numbers today."},{"t":124.06,"x":"And we're still aiming to launch next Friday."},{"t":126.62,"x":"Does that all sound right?"},{"t":128.78,"x":"Great."},{"t":129.74,"x":"Thanks everyone."},{"t":130.74,"x":"Have a good day."}],"media":"media/6abb869c000000001803aad9.mp4","images":[]},{"kind":"video","noteId":"6aba3abf000000001a02b51b","creator":"William","title":"生活中这些英语表达，你会说...?","publishedAt":"2026-09-28T10:00:31.000Z","durationSeconds":54.4,"likes":"282","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6aba3abf000000001a02b51b?xsec_token=ABaCxODGoN2P_dlhnIMH1e-XInQkRiLb_I0fCklKcb9sg=&xsec_source=pc_user","ipLocation":"安徽","summary":"视频用一段情侣之间闹别扭、互相埋怨的日常对话，自然带出多个地道口语表达。你能学到怎么用英语表达「冷战、戳我痛点、翻旧账、掩藏问题」这类情绪化场景，也能顺便记住几个口语化的固定说法。","tags":["英语口语","地道表达","日常对话","情绪表达"],"keyPoints":["整条视频以情侣吵架的对话展开，语境真实，便于直接套用到日常口语。","核心表达集中在「冷战、惹人生气、记仇翻旧账、回避问题」这几类情绪话题上。","对话后半段用「饼干」这个梗把矛盾夸张化，适合观察口语里的语气和吐槽方式。","所有例句都是口语短句，适合背诵后用在朋友或伴侣之间的对话里。"],"patterns":[{"en":"give me the cold shoulder","zh":"对我冷淡、跟我冷战","usage":"对方因为生气而故意不理你时用","example":"Are you seriously giving me the cold shoulder?","start":6.1},{"en":"push my buttons","zh":"专戳我的痛点","usage":"说某人明知会让你不爽还故意那么做时用","example":"Maybe because you know how to push my buttons.","start":11.58},{"en":"keep score","zh":"记仇、把对错都记着","usage":"形容别人总记得你做过的每件错事时用","example":"No, you just keep score.","start":24.1},{"en":"bring it up","zh":"（把旧事）提起来、翻出来说","usage":"指在争吵或谈话中重提某件往事时用","example":"and you bring it up every time we argue.","start":29.58},{"en":"sweep everything under the rug","zh":"把问题掩盖起来、当没发生过","usage":"形容回避问题、不愿正面解决时用","example":"Because you just sweep everything under the rug.","start":31.5},{"en":"I swear to God","zh":"我发誓、真的","usage":"想强调自己说的是实话或急于辩解时用","example":"I swear to God.","start":45.49},{"en":"since you brought it up","zh":"既然你提起来了","usage":"对方先提到某件事，你顺势接着说时用","example":"But since you brought it up.","start":48.39}],"quotes":[{"text":"Seriously, you're just gonna ignore me now?","start":2.33,"matched":true},{"text":"Are you seriously giving me the cold shoulder?","start":6.1,"matched":true},{"text":"Yes, you remember every single thing I've done wrong","start":26.86,"matched":true},{"text":"It was my last cookie.","start":51.29,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Hey, what are you about to do?"},{"t":2.33,"x":"Seriously, you're just gonna ignore me now?"},{"t":6.1,"x":"Are you seriously giving me the cold shoulder?"},{"t":8.3,"x":"The cold shoulder?"},{"t":9.38,"x":"Yeah, you're ignoring me because you're mad at me."},{"t":11.58,"x":"Maybe because you know how to push my buttons."},{"t":13.9,"x":"Push your buttons."},{"t":15.26,"x":"You say and do things because you know they will annoy me."},{"t":18.78,"x":"Come on, you get mad about everything"},{"t":21.5,"x":"because you keep doing the same things."},{"t":24.1,"x":"No, you just keep score."},{"t":25.82,"x":"Keep score?"},{"t":26.86,"x":"Yes, you remember every single thing I've done wrong"},{"t":29.58,"x":"and you bring it up every time we argue."},{"t":31.5,"x":"Because you just sweep everything under the rug."},{"t":34.4,"x":"Sweep it under the rug?"},{"t":36.3,"x":"You ignore problems that pretend they never happened instead of dealing with them."},{"t":39.6,"x":"Hey, I don't do that."},{"t":41.4,"x":"Really?"},{"t":42.99,"x":"Did you forget about the do not bring up the cookie?"},{"t":45.49,"x":"I swear to God."},{"t":46.49,"x":"I wasn't going to."},{"t":47.49,"x":"Good."},{"t":48.39,"x":"But since you brought it up."},{"t":50.29,"x":"Oh my God."},{"t":51.29,"x":"It was my last cookie."},{"t":52.79,"x":"Not this sh** again."}],"media":"media/6aba3abf000000001a02b51b.mp4","images":[]},{"kind":"video","noteId":"6ab4e8f5000000001203e583","creator":"Bapanda职场英语表达","title":"英文不好职场牛马主持英文线上会议无痛版上","publishedAt":"2026-09-24T09:10:13Z","durationSeconds":83.7,"likes":"1万","noteUrl":"https://www.xiaohongshu.com/user/profile/59addf2d50c4b41fabc101b0/6ab4e8f5000000001203e583?x
