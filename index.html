ext":"Let's take that offline. I'll ping you right after this.","start":76.35,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Morning, everyone. Good to see you. How's everyone doing today?"},{"t":4.29,"x":"Yes, I'm here. Busy week. Alright, looks like a few people are still joining."},{"t":8.45,"x":"So before we get started, I'll pull up today's agenda and share my screen."},{"t":13.25,"x":"Can everyone hear me and see my screen?"},{"t":16.05,"x":"Great. Alright, let's get into it."},{"t":18.13,"x":"So today we want through project updates, flag any blogs,"},{"t":21.17,"x":"and come from this week's action items."},{"t":23.49,"x":"Sarah, would you like to kick us off?"},{"t":26.34,"x":"I think you're on mute."},{"t":28.46,"x":"There you go. We can hear you now."},{"t":29.98,"x":"Thanks. So what's the next step on your site?"},{"t":34.22,"x":"Got it. If we haven't heard back by Wednesday,"},{"t":36.78,"x":"could you follow up with the client?"},{"t":39.33,"x":"Sounds good."},{"t":41.02,"x":"Hi Mike, welcome. We've just started and going through project updates."},{"t":45.68,"x":"Jack, anything to add from the product site?"},{"t":48.66,"x":"Got it. So the revised timeline should be ready by Thursday."},{"t":52.82,"x":"Great, thanks Jack."},{"t":54.18,"x":"Alright, that covers the project updates."},{"t":56.26,"x":"Does anyone have any blocks to flag?"},{"t":58.34,"x":"Perfect, no blocks then."},{"t":59.94,"x":"Next up, action items."},{"t":61.46,"x":"Let's quickly confirm who's doing what."},{"t":63.6,"x":"Sarah will follow up with the client on Wednesday if we haven't heard back."},{"t":67.5,"x":"Jack will share the revised timeline by Thursday."},{"t":70.62,"x":"Anything I missed? Yeah, go ahead."},{"t":72.62,"x":"Good point. We're running a little short on time today,"},{"t":76.35,"x":"so let's take that offline. I'll paint you right after this."},{"t":79.27,"x":"Alright, let's wrap up here."},{"t":81.11,"x":"I appreciate everyone's time. See you next week."}],"media":"media/6ab4e8f5000000001203e583.mp4","images":[]},{"kind":"video","noteId":"6ab27d57000000003403460a","creator":"瑞秋爱玛","title":"全英｜缓解高敏感？放弃抵抗吧...","publishedAt":"2026-09-22T13:06:31Z","durationSeconds":199.4,"likes":"41","noteUrl":"https://www.xiaohongshu.com/user/profile/61361d670000000002019d71/6ab27d57000000003403460a?xsec_token=AB9E-xa2VSqgYZ2v3DktfXBND7mlAMnZcDX1f2H4QCjnM=&xsec_source=pc_user","ipLocation":"上海","summary":"35 岁才发现自己是高敏感人格（HSP），今年终于学会不再对抗情绪。情绪类英语口播，长句多、情绪词密集，适合练「描述心理状态」。","tags":["全英播客","情绪表达","心理词汇"],"keyPoints":["描述内耗的成套词汇：emotionally burned out、brain is spinning、on the verge of falling apart","核心转折句是本条的精华：When you stop fighting your emotions, they get bored.","self-doubt 时自我攻击的问句三连：What's wrong with me? Am I not good enough? Am I incompetent?","结尾的安慰句式可以直接背下来用在别人身上：You are not broken, you are not too much."],"patterns":[{"en":"emotionally burned out","zh":"情绪上彻底耗竭","usage":"比 tired 更准确地描述长期透支","example":"I don't know if you ever felt emotionally burned out.","start":6.64},{"en":"your brain is spinning","zh":"脑子停不下来地转","usage":"形容想太多、静不下来","example":"Your brain is spinning all the time, even when you tell it to stop.","start":12.96},{"en":"on the verge of falling apart","zh":"处在崩溃边缘","usage":"on the verge of + 名词/动名词","example":"I constantly felt like I was on the verge of completely falling apart.","start":57.48},{"en":"process things differently","zh":"对外界信息的处理方式不同","usage":"中性描述敏感特质，不带贬义","example":"I literally process things differently from other people.","start":null},{"en":"make peace with myself","zh":"与自己和解","usage":"接受自身特质的关键短语","example":"This year, I finally figured out how to make peace with myself.","start":77.01},{"en":"I just sit with it, quietly, unapologetically.","zh":"安静地陪着情绪，不觉得抱歉","usage":"sit with + 情绪，表示不逃避也不对抗","example":"I don't fake the smile. I just sit with it, quietly, unapologetically.","start":94.28},{"en":"When you stop fighting your emotions, they get bored.","zh":"不再对抗情绪，它自己就无聊了","usage":"整条视频的金句，可直接引用","example":"They realize you're not giving them any drama, any resistance, any fuel, and they just leave.","start":0},{"en":"You are not broken, you are not too much.","zh":"你没有坏掉，你也不是太过分。","usage":"安慰高敏感者最有效的一句","example":"You just feel things deeply and that's not a flaw, that's who you are.","start":190.16}],"quotes":[{"text":"When you stop fighting your emotions, they get bored.","start":148.45,"matched":true},{"text":"You are not broken, you are not too much. You just feel things deeply and that's not a flaw, that's who you are.","start":186.36,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"They realize you're not giving them any drama, any resistance, any fuel, and they just leave."},{"t":6.64,"x":"Hey guys, today I want to talk about how I eat my high sensitivity. I don't know if you ever felt"},{"t":12.96,"x":"emotionally burned out or like your brain is spinning all the time even when you tell it to stop"},{"t":18.48,"x":"or maybe when you're interacting with people your heart is racing and you feel like you're"},{"t":22.96,"x":"or burning yourself out. That used to be me for years, actually for most of my life."},{"t":30.28,"x":"And if you're a highly sensitive person, you probably know exactly what I'm talking about."},{"t":35.2,"x":"If you're always exhausted, even after a full night's sleep, if you can't focus no"},{"t":39.64,"x":"matter how hard you try, if a single comment from someone can ruin your entire day, this"},{"t":45.68,"x":"one is for you because I've been there. I'm 35 and I've always presented myself"},{"t":51.76,"x":"by the easygoing, positive one, the one who's always fine,"},{"t":55.76,"x":"the one who never breaks."},{"t":57.48,"x":"But deep down, I constantly felt like"},{"t":59.88,"x":"I was on the verge of completely falling apart."},{"t":62.56,"x":"But I never knew why."},{"t":63.76,"x":"Or maybe I just never had the energy to figure it out."},{"t":66.89,"x":"It took me almost two decades to realize"},{"t":69.69,"x":"I'm a highly sensitive person."},{"t":72.93,"x":"I bring literally processed things"},{"t":75.01,"x":"differently from other people."},{"t":77.01,"x":"And this year, I finally figured out"},{"t":79.57,"x":"how to make peace with myself."},{"t":81.84,"x":"be a slave to your feelings."},{"t":84.32,"x":"That's right, I give up."},{"t":86.82,"x":"I surrender to whatever the hell that is bothering me."},{"t":89.76,"x":"If I'm feeling down,"},{"t":91.04,"x":"I let myself be down for it as long as I want."},{"t":94.28,"x":"I don't fake the smile I'm always wearing."},{"t":97.2,"x":"I don't pretend to be happy when I'm not."},{"t":99.4,"x":"I don't force myself to be interested in a conversation"},{"t":102,"x":"just to avoid seeming rude."},{"t":104.16,"x":"I just sit with it, quietly, unapologetically"},{"t":107.92,"x":"and let myself feel every bit of it."},{"t":110.96,"x":"Before when my brain was spinning and I couldn't focus, the old me would spiral into self-doubt."},{"t":116.96,"x":"Like what's wrong with me?"},{"t":118.96,"x":"Am I not good enough?"},{"t":120.26,"x":"Am I incompetent?"},{"t":121.96,"x":"And then I pushed myself a bit harder, which of course just made everything worse."},{"t":127.96,"x":"But now I literally say it out loud."},{"t":131.96,"x":"Fuck it. I'm exhausted. I need to stop."},{"t":134.96,"x":"I stop the work I'm doing. I step away from the conversations that drew me."},{"t":138.96,"x":"I close my eyes, or stare into space, or go to the park, find a bench, and stay there"},{"t":144.4,"x":"alone."},{"t":145.69,"x":"And you know what the craziest part is?"},{"t":148.45,"x":"When you stop fighting your emotions, they get bored."},{"t":151.69,"x":"They realize you're not giving them any drama, any resistance, any fuel, and they just"},{"t":157.25,"x":"leave."},{"t":158.25,"x":"I wish I could go back in time and hug the younger me."},{"t":160.93,"x":"The one who was constantly struggling, who didn't know what was wrong with her,"},{"t":165.65,"x":"who thought she just wasn't trying hard enough."},{"t":168.57,"x":"I tell her I'm so sorry I didn't know how to take care of you emotionally and I want"},{"t":173.73,"x":"you to know this is who you are and that's okay, you are enough just as you are."},{"t":179.04,"x":"And if you are watching this and you are a highly sensitive person too, I hope that makes"},{"t":184.24,"x":"you feel a little less alone."},{"t":186.36,"x":"You are not broken, you are not too much."},{"t":190.16,"x":"You just feel things deeply and that's not a flaw, that's who you are."}],"media":"media/6ab27d57000000003403460a.mp4","images":[]},{"kind":"video","noteId":"6aacfbdc000000000b002e93","creator":"开心学英语","title":"情景英语：老板替员工去开家长会破防了！","publishedAt":"2026-09-18T08:52:44Z","durationSeconds":41.2,"likes":"89","noteUrl":"https://www.xiaohongshu.com/user/profile/69cf8d170000000032036d59/6aacfbdc000000000b002e93?xsec_token=AB8mR_Nd0S3GYoZeUObSwukau_SLGLm2DZlLHW5LtzdBM=&xsec_source=pc_user","ipLocation":"黑龙江","summary":"员工想请假去开家长会，老板嫌客户要来验货不放人，最后老板自己冒充叔叔去了，回来被老师骂到破防。","tags":["职场英语","请假","情景对话"],"keyPoints":["请假时的固定说法是 take a day off，理由用 there's … and someone has to be there","No can do 是很口语的「不行」，比 No 多一点无奈","ripped me a new one 表示「把我骂惨了」，属于口语俚语，听懂即可"],"patterns":[{"en":"take a day off","zh":"请一天假","usage":"临时请假最常用的表达","example":"Mr. Lee, I need to take a day off today.","start":0.82},{"en":"No can do.","zh":"不行。","usage":"口语化的拒绝，带无奈而非生硬","example":"No can do. We have a client coming in today to inspect the goods.","start":11.32},{"en":"I've got this.","zh":"这事我来。","usage":"接下任务的自信说法","example":"I'll pretend to be his uncle. — For real? — Yeah, I've got this.","start":21.1},{"en":"rip someone a new one","zh":"把某人骂惨了","usage":"俚语，意思是严厉斥责","example":"The teacher ripped me a new one all afternoon.","start":32.24}],"quotes":[{"text":"No can do. We have a client coming in today to inspect the goods.","start":11.32,"matched":true},{"text":"The teacher ripped me a new one all afternoon.","start":32.24,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.82,"x":"Mr. Lee, I need to take a day off today."},{"t":3.42,"x":"You just got here. Why do you need time off?"},{"t":5.62,"x":"My kid teacher just called."},{"t":7.32,"x":"There's a parent teacher conference and someone has to be there."},{"t":10.12,"x":"No can do."},{"t":11.32,"x":"We have a client coming in today to inspect the goods."},{"t":14.32,"x":"Who's gonna host them if you're gone?"},{"t":16.32,"x":"The teacher was really strict about it."},{"t":19.1,"x":"Said no exceptions."},{"t":21.1,"x":"I'll go. I'll pretend to be his uncle."},{"t":24.65,"x":"For real?"},{"t":25.94,"x":"Yeah. I've got this."},{"t":27.94,"x":"Thanks a lot."},{"t":29.44,"x":"Your kid got a six on his test."},{"t":32.24,"x":"The teacher ripped me a new one all afternoon."},{"t":35.3,"x":"I was so embarrassed."},{"t":36.76,"x":"Next time, no matter whose parent teacher conference it is,"},{"t":39.52,"x":"I'm not going."}],"media":"media/6aacfbdc000000000b002e93.mp4","images":[]},{"kind":"video","noteId":"6aa3c183000000002600a97e","creator":"开心学英语","title":"情景英语：工作中的遭遇！","publishedAt":"2026-09-11T08:53:23Z","durationSeconds":332.6,"likes":"8167","noteUrl":"https://www.xiaohongshu.com/user/profile/69cf8d170000000032036d59/6aa3c183000000002600a97e?xsec_token=ABOEOvAiJfPqdric2HyjHDg5jD5GY1-N8U5J43aUDuKWk=&xsec_source=pc_user","ipLocation":"黑龙江","summary":"一条 5 分半的办公室情景合集，把新人最容易踩的坑全演了一遍：打印机不会用、被指着干活、被抢功劳、请假被怼、最后因为迟到早退被开除。","tags":["职场英语","情景对话","新人生存"],"keyPoints":["求助前先自己试：Maybe give it a shot on your own before you ask someone to walk you through it","优先级要能说清楚：Your priority should be your core responsibilities","被抢功劳可以直接问：How come she gets all the credit?","进度要主动报：You can't just keep your head down or people might think you're slacking off","健康优先的收尾句：We work to live, not live to work"],"patterns":[{"en":"black and white, double-sided","zh":"黑白、双面（打印）","usage":"交代打印任务时的标准说法","example":"Can you print two copies, black and white, double-sided?","start":0.34},{"en":"Figure it out yourself.","zh":"自己想办法。","usage":"冷淡地拒绝手把手教；学的时候要知道对方在敷衍","example":"Figure it out yourself. That's how all new interns learn.","start":26.74},{"en":"If you're stuck, just ask your cohorts.","zh":"卡住了就去问同批进来的人。","usage":"cohorts 指同期同事，比 colleagues 更具体","example":"If you're stuck, just ask your cohorts. Stay on top of your work.","start":39.42},{"en":"Would you mind stepping over here?","zh":"方便过来一下吗？","usage":"把同事叫到一边谈话，比 come here 客气","example":"Would you mind stepping over here? I have something to discuss with you.","start":58.36},{"en":"Could I ask for your advice?","zh":"能请教你一下吗？","usage":"向资深同事求教的开场","example":"I'm not sure how to go about it. Could I ask for your advice?","start":75},{"en":"put together a rough draft first","zh":"先攒个初稿","usage":"让对方先有产出，而不是空手来问","example":"You need to put together a rough draft first, then I can point you in the right direction.","start":87.92},{"en":"Crank it out.","zh":"赶紧赶出来。","usage":"催活的口语说法，带点不耐烦","example":"The manager needs the new product video urgently. Crank it out.","start":102.64},{"en":"I'm swamped.","zh":"我忙炸了。","usage":"比 I'm busy 更有画面，也更容易换来体谅","example":"I'm swamped. Just get it done and send it over by 10, okay?","start":109.36},{"en":"keep your focus on what truly matters","zh":"把精力放在真正重要的事上","usage":"主管讲优先级时的说法","example":"Assist with other tasks when time permits, but always keep your focus on what truly matters.","start":224.09},{"en":"How come she gets all the credit?","zh":"凭什么功劳都算她的？","usage":"How come 是口语里的「凭什么/怎么会」","example":"But didn't you do all that work? How come she gets all the credit?","start":138.06},{"en":"It's your call.","zh":"你自己决定。","usage":"把决定权交回给对方，同时不承担后果","example":"If you leave early, you'll lose your attendance bonus. It's your call.","start":155.96},{"en":"slacking off","zh":"摸鱼、偷懒","usage":"描述工作态度不积极","example":"You can't just keep your head down or people might think you're slacking off.","start":175.61},{"en":"Health comes first.","zh":"健康第一。","usage":"劝人休息时的收尾句","example":"Take a few days off and rest at home. Health comes first.","start":297.13},{"en":"We work to live, not live to work.","zh":"为生活而工作，不为工作而活","usage":"反内卷金句，适合收尾","example":"We work to live, not live to work. Don't let it break you down.","start":302.89},{"en":"I am sorry to inform you that you are fired.","zh":"很遗憾地通知你，你被解雇了。","usage":"正式通知句型，I am sorry to inform you 是固定开头","example":"I am sorry to inform you that you are fired. — I will leave after handing over my work.","start":325.67},{"en":"People who do solid work will never be overlooked.","zh":"踏实做事的人不会被埋没。","usage":"表扬 + 给信心，solid work 比 good work 更实","example":"You do a good job. People who do solid work will never be overlooked.","start":272.54}],"quotes":[{"text":"Work is different from school. Maybe give it a shot on your own before you ask someone to walk you through it.","start":93.96,"matched":true},{"text":"We work to live, not live to work. Don't let it break you down.","start":302.89,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.34,"x":"I just sent you a file. Can you print two copies, black and white, double-sided?"},{"t":4.34,"x":"Okay, but we don't have a color printer."},{"t":6.34,"x":"Black and white is fine."},{"t":7.34,"x":"How many copies would you like?"},{"t":10.34,"x":"Two copies."},{"t":12.62,"x":"Single-sided?"},{"t":13.62,"x":"Double-sided! Double-sided!"},{"t":16.45,"x":"Excuse me, I'm new here. Could you show me how to fill out this form?"},{"t":19.45,"x":"I'm busy. Just look it up online yourself."},{"t":21.45,"x":"Alright, thanks."},{"t":23.74,"x":"Excuse me, could you show me how to use this printer?"},{"t":26.74,"x":"Figure it out yourself. That's how all new interns learn."},{"t":29.74,"x":"Okay, fine. Thank you."},{"t":33.66,"x":"What's taking you so long to print one file?"},{"t":36.06,"x":"Sorry, it's my first time using the office printer."},{"t":38.22,"x":"Still trying to work it out."},{"t":39.42,"x":"If you're stuck, just ask your cohorts."},{"t":41.3,"x":"Stay on top of your work."},{"t":43.84,"x":"Got it."},{"t":45.62,"x":"Keep the door open during work hours."},{"t":47.3,"x":"OK."},{"t":48.6,"x":"The air conditioner is on."},{"t":49.68,"x":"Keep the door closed."},{"t":50.76,"x":"Don't waste electricity."},{"t":53.52,"x":"So my words don't count anymore, huh?"},{"t":55.4,"x":"I told you."},{"t":56.24,"x":"Door stays open."},{"t":58.36,"x":"Would you mind stepping over here?"},{"t":59.6,"x":"I have something to discuss with you."},{"t":61.24,"x":"Would you two please discuss this?"},{"t":62.96,"x":"Should we leave the door open or keep it closed?"},{"t":66.46,"x":"It doesn't matter if it's open or closed, right?"},{"t":69.72,"x":"Excuse me, do you have a minute?"},{"t":71.84,"x":"What's going on?"},{"t":72.68,"x":"The manager asked me to write a project plan,"},{"t":75,"x":"but I'm not sure how to go about it."},{"t":76.56,"x":"Could I ask for your advice?"},{"t":78,"x":"Sure, send me what you've got"},{"t":79.72,"x":"and I'll give it a once over."},{"t":81.8,"x":"I haven't actually written anything yet."},{"t":83.8,"x":"Well, it's not like I can write it for you, right?"},{"t":86.24,"x":"There's a template in the group chat."},{"t":87.92,"x":"You need to put together a rough draft first,"},{"t":89.96,"x":"then I can point you in the right direction."},{"t":92.6,"x":"That makes sense."},{"t":93.96,"x":"Work is different from school."},{"t":95.76,"x":"Maybe give it a shot on your own"},{"t":97.32,"x":"before you ask someone to walk you through it."},{"t":99.84,"x":"Got it."},{"t":100.84,"x":"I'll draft it myself first."},{"t":102.64,"x":"The manager needs the new product video urgently."},{"t":105,"x":"Crank it out."},{"t":106.2,"x":"Wait, didn't the manager assign this to you?"},{"t":108.52,"x":"I'm swamped."},{"t":109.36,"x":"Just get it done and send it over by 10, okay?"},{"t":112.3,"x":"By the way, crunch this month's sales figures."},{"t":115.83,"x":"Should I work on the video"},{"t":116.99,"x":"or sort out the sales figures first?"},{"t":118.55,"x":"Finish the video first,"},{"t":119.75,"x":"then get them sorted right after."},{"t":123.26,"x":"Mr. Li, I've finished the product video and sales figures"},{"t":126.18,"x":"and emailed them to you."},{"t":127.74,"x":"I just reviewed them."},{"t":129.1,"x":"Great work, you'll get a bonus this month."},{"t":131.38,"x":"Thank you, I'll keep up the good work."},{"t":133.58,"x":"Hey, I heard Mary is getting a bonus this month."},{"t":136.62,"x":"Yeah, I'm jealous."},{"t":138.06,"x":"But didn't you do all that work?"},{"t":139.96,"x":"How come she gets all the credit?"},{"t":141.84,"x":"I'm new around here,"},{"t":143.16,"x":"so I don't wanna get on her bad side."},{"t":145.16,"x":"Miss Li, what's going on?"},{"t":147.32,"x":"Would it be okay if I left early today?"},{"t":149.4,"x":"My parents are in Guangzhou today."},{"t":151.04,"x":"They don't know how to get a cab,"},{"t":152.24,"x":"so I have to go to the train station to pick them up."},{"t":154.32,"x":"Everyone's still on the clock,"},{"t":155.96,"x":"and if you leave early,"},{"t":156.92,"x":"you'll lose your attendance bonus."},{"t":158.8,"x":"It's your call."},{"t":159.94,"x":"What's the new intern been up to lately?"},{"t":162,"x":"She's been focused on the project proposal lately."},{"t":164.88,"x":"I see."},{"t":166.4,"x":"She hasn't checked in,"},{"t":167.3,"x":"so I have no idea what she's up to."},{"t":170.21,"x":"You haven't checked in on the proposal yet?"},{"t":171.91,"x":"The manager just asked about you."},{"t":173.57,"x":"I wanna get it all done before I check in."},{"t":175.61,"x":"You can't just keep your head down"},{"t":177.53,"x":"or people might think you're slacking off."},{"t":179.85,"x":"But what am I supposed to say"},{"t":181.29,"x":"if I haven't finished it yet."},{"t":183.03,"x":"You should give daily progress updates."},{"t":185.33,"x":"That way the manager knows you're on top of your work."},{"t":188.57,"x":"Got it, thanks."},{"t":189.57,"x":"I'll keep him posted."},{"t":190.93,"x":"Could you grab my packets from the lobby?"},{"t":192.81,"x":"I texted you the pickup code."},{"t":194.21,"x":"Sure, no problem."},{"t":197.46,"x":"Where should I put your packages?"},{"t":199.06,"x":"You can leave them right here, please."},{"t":200.9,"x":"Could you please organize these files by category?"},{"t":203.78,"x":"But I still have other tasks to complete."},{"t":205.74,"x":"Could you do this first?"},{"t":206.78,"x":"It's urgent."},{"t":208.9,"x":"All right."},{"t":209.74,"x":"Have you finished the data report I assigned to you?"},{"t":212.81,"x":"I'm sorry, I haven't finished it yet."},{"t":215.85,"x":"This is a straightforward task, why has it taken you so long?"},{"t":219.37,"x":"I assisted colleagues with some other tasks today and that slowed down my progress."},{"t":224.09,"x":"Your priority should be your core responsibilities, assist with other tasks when time permits,"},{"t":229.29,"x":"but always keep your focus on what truly matters."},{"t":232.21,"x":"Who's going to take the lead on this event proposal?"},{"t":234.57,"x":"I'll take care of this and send it to you tomorrow."},{"t":237.62,"x":"Lisa, I'm swamp with client meetings. I need you to get the event proposal done today."},{"t":242.62,"x":"Ah, fine."},{"t":244.82,"x":"Who put this event proposal together?"},{"t":246.82,"x":"I'm sorry, Mr. Wang. I planned to handle this myself, but I was swamped with work, so I passed the task off to Lisa."},{"t":253.94,"x":"So Lisa did the whole thing?"},{"t":254.94,"x":"Yes! She did it all on her own!"},{"t":257.94,"x":"Lisa, come to my office."},{"t":259.94,"x":"Don't be nervous. Have a seat."},{"t":261.94,"x":"Did you put together this event proposal?"},{"t":264.46,"x":"Yes. I worked late yesterday to get it done."},{"t":267.46,"x":"work. The proposal is excellent. This is your bonus from t const state = { q: '', creator: null };

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtTime = (sec) => {
  if (sec === null || sec === undefined) return null;
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
};
const fmtDate = (iso) => (iso ? String(iso).slice(0, 10) : '');
const highlight = (text) => {
  const q = state.q.trim();
  const safe = esc(text);
  if (!q) return safe;
  const pattern = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try { return safe.replace(new RegExp(pattern, 'gi'), (m) => '<mark>' + m + '</mark>'); } catch { return safe; }
};

function searchable(card) {
  return [
    card.creator, card.title, card.summary, (card.keyPoints ?? []).join(' '),
    (card.patterns ?? []).map((p) => [p.en, p.zh, p.usage, p.example].join(' ')).join(' '),
    card.zhQuestion, card.zhReference, card.enQuestion, card.enReference,
    (card.idiomatic ?? []).map((it) => [it.orig, it.better, it.why].join(' ')).join(' '),
    (card.transcript ?? []).map((seg) => seg.x).join(' '),
  ].join(' ').toLowerCase();
}

function patternMatches(card, q) {
  if (!q) return true;
  const hay = searchable(card);
  return q.toLowerCase().split(/\s+/).every((token) => hay.includes(token));
}

// 卡片没写到的说法，也能从视频原话里捞出来
function transcriptHits(card, q) {
  if (!q || !card.transcript || card.transcript.length === 0) return [];
  const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (tokens.length === 0) return [];
  return card.transcript
    .filter((seg) => tokens.every((token) => String(seg.x).toLowerCase().includes(token)))
    .slice(0, 3);
}

function cover(card) {
  const accent = DATA.palette[card.creator] || { bg: '#dcdad2', fg: '#1a1a18' };
  const isImage = card.kind === 'image';
  const heading = isImage ? (card.zhQuestion || card.title) : card.title;
  const sub = isImage ? card.enQuestion : '';
  const meta = [];
  meta.push('<span class="who-name">' + esc(card.creator) + '</span>');
  meta.push('<span>' + fmtDate(card.publishedAt) + '</span>');
  if (isImage) meta.push('<span class="badge">图文</span>');
  else if (card.durationSeconds) meta.push('<span>' + Math.round(card.durationSeconds / 60 * 10) / 10 + ' 分钟</span>');
  return `<div class="cover">
    <div class="who">${meta.join('')}</div>
    <h2>${highlight(heading)}</h2>
    ${sub ? `<div class="en-sub">${highlight(sub)}</div>` : ''}
  </div>`;
}

function imageBody(card) {
  const parts = [];
  const rows = [];
  if (card.zhReference) {
    rows.push(`<div class="qa-row"><span class="qa-label">中文参考</span><p class="qa-zh">${highlight(card.zhReference)}</p></div>`);
  }
  if (card.enReference) {
    rows.push(`<div class="qa-row"><span class="qa-label">英文原文</span><p class="qa-en">${highlight(card.enReference)}</p></div>`);
  }
  if (rows.length) parts.push(`<div class="qa">${rows.join('')}</div>`);

  if ((card.idiomatic ?? []).length) {
    parts.push('<h3>更地道的说法</h3><div class="idioms">' + card.idiomatic.map((it) => `<div class="idiom">
      <div class="was">${highlight(it.orig)}</div>
      <div class="now">${highlight(it.better)}</div>
      <div class="why">${highlight(it.why)}</div>
    </div>`).join('') + '</div>');
  }

  if ((card.keyPoints ?? []).length) {
    parts.push('<h3>要点</h3><ul class="points">' + card.keyPoints.map((p) => '<li>' + highlight(p) + '</li>').join('') + '</ul>');
  }

  if ((card.images ?? []).length) {
    parts.push('<h3>原图</h3><div class="slides">' + card.images.map((src, i) =>
      `<a href="${esc(src)}" target="_blank" rel="noreferrer"><img src="${esc(src)}" alt="原图 ${i + 1}" loading="lazy" /></a>`).join('') + '</div>');
  }
  return parts.join('');
}

function videoBody(card, q) {
  const parts = [];
  const hits = transcriptHits(card, q);
  if (hits.length) {
    parts.push('<div class="hits"><h3>视频里说到的地方</h3>' + hits.map((hit) => `<div class="hit">
      <div class="rail"><button class="time" data-t="${hit.t}" data-note="${esc(card.noteId)}" title="跳到视频这一秒（Shift+点击复制时间）">${fmtTime(hit.t)}</button></div>
      <span class="hit-text">${highlight(hit.x)}</span>
    </div>`).join('') + '</div>');
  }
  parts.push(`<p class="summary">${highlight(card.summary)}</p>`);
  if (card.partial) parts.push(`<div class="flag">${esc(card.partialReason)}</div>`);
  if ((card.keyPoints ?? []).length) {
    parts.push('<h3>要点</h3><ul class="points">' + card.keyPoints.map((p) => '<li>' + highlight(p) + '</li>').join('') + '</ul>');
  }
  if ((card.patterns ?? []).length) {
    parts.push('<h3>可复用句型</h3><div class="patterns">' + card.patterns.map((p) => `<div class="pattern">
      <div class="rail">${p.start !== null && p.start !== undefined ? `<button class="time" data-t="${p.start}" data-note="${esc(card.noteId)}" title="跳到视频这一秒（Shift+点击复制时间）">${fmtTime(p.start)}</button>` : ''}</div>
      <div>
        <div class="pat-head"><span class="en">${highlight(p.en)}</span><span class="zh">${highlight(p.zh)}</span></div>
        <div class="usage">${highlight(p.usage)}</div>
        <div class="ex">${highlight(p.example)}</div>
      </div>
    </div>`).join('') + '</div>');
  }
  if (card.media) parts.push('<div class="player" hidden></div>');
  return parts.join('');
}

function actionsFor(card) {
  const acts = [`<a class="act" href="${esc(card.noteUrl)}" target="_blank" rel="noreferrer">看原笔记</a>`];
  if (card.media) acts.push(`<button class="act" data-play="${esc(card.noteId)}">播放整段</button>`);
  if ((card.patterns ?? []).length) acts.push(`<button class="act" data-copy="${esc(card.noteId)}">复制全部句型</button>`);
  return '<div class="actions">' + acts.join('') + '</div>';
}

function render() {
  const q = state.q.trim();
  const cards = DATA.cards.filter((c) =>
    patternMatches(c, q) &&
    (!state.creator || c.creator === state.creator)
  );

  document.getElementById('list').innerHTML = cards.length === 0
    ? '<div class="empty">没有匹配的内容，换一个词试试</div>'
    : cards.map((card) => {
        const accent = DATA.palette[card.creator] || { bg: '#dcdad2', fg: '#1a1a18' };
        return `<article data-card="${esc(card.noteId)}" style="--accent:${accent.bg};--accent-fg:${accent.fg}">
          ${cover(card)}
          <div class="body">${card.kind === 'image' ? imageBody(card) : videoBody(card, q)}${actionsFor(card)}</div>
        </article>`;
      }).join('');

  wirePlayers();
}

// 原片拿不到时（比如网页被单独发到手机、media 文件夹没跟过去）给一句人话，
// 而不是留一个点了没反应的黑框。
const markNoMedia = (box) => {
  if (box.dataset.dead === '1') return;
  box.dataset.dead = '1';
  box.hidden = false;
  box.innerHTML = '<p class="flag">原片在电脑上。单独把网页发到手机就播不了，连同一个 Wi-Fi 用桌面「手机上看知识库」才有视频。</p>';
};

function ensurePlayer(card) {
  if (!card || !card.media) return null;
  const article = document.querySelector('article[data-card="' + card.noteId + '"]');
  if (!article) return null;
  const box = article.querySelector('.player');
  if (!box) return null;
  if (box.dataset.dead === '1') return null;
  box.hidden = false;
  let video = box.querySelector('video');
  if (!video) {
    video = document.createElement('video');
    video.controls = true;
    video.preload = 'metadata';
    video.src = card.media;
    const watchdog = setTimeout(() => { if (video.readyState < 1) markNoMedia(box); }, 4000);
    video.addEventListener('loadedmetadata', () => clearTimeout(watchdog));
    video.addEventListener('error', () => { clearTimeout(watchdog); markNoMedia(box); });
    box.appendChild(video);
  }
  return video;
}

function wirePlayers() {
  // 时间戳直接播本地已下载的原片段，不用再开小红书（小红书走系统代理会被风控）
  document.querySelectorAll('[data-t]').forEach((btn) => {
    btn.addEventListener('click', (event) => {
      if (event.shiftKey) {
        if (navigator.clipboard) navigator.clipboard.writeText(btn.textContent.trim()).catch(() => {});
        return;
      }
      const card = DATA.cards.find((c) => c.noteId === btn.dataset.note);
      const video = ensurePlayer(card);
      if (!video) {
        navigator.clipboard && navigator.clipboard.writeText(btn.textContent.trim()).catch(() => {});
        return;
      }
      const second = Number(btn.dataset.t) || 0;
      const seek = () => {
        video.currentTime = second;
        const playing = video.play();
        if (playing && playing.catch) playing.catch(() => {});
      };
      if (video.readyState >= 1) seek();
      else video.addEventListener('loadedmetadata', seek, { once: true });
      const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      video.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'center' });
    });
  });

  document.querySelectorAll('[data-play]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const card = DATA.cards.find((c) => c.noteId === btn.dataset.play);
      const video = ensurePlayer(card);
      if (video && video.play) video.play().catch(() => {});
    });
  });

  document.querySelectorAll('[data-copy]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const card = DATA.cards.find((c) => c.noteId === btn.dataset.copy);
      if (!card) return;
      const text = [
        card.creator + ' · ' + card.title,
        '',
        ...card.patterns.map((p) => `${p.en} | ${p.zh}
  ${p.example}`),
      ].join('\n');
      try { await navigator.clipboard.writeText(text); btn.textContent = '已复制'; } catch { btn.textContent = '复制失败'; }
      setTimeout(() => { btn.textContent = '复制全部句型'; }, 1400);
    });
  });
}

function chips() {
  const box = document.getElementById('creatorChips');
  box.innerHTML = DATA.creators.map((c) => `<span class="chip" data-creator="${esc(c)}">${esc(c)}</span>`).join('');
  box.querySelectorAll('[data-creator]').forEach((el) => el.addEventListener('click', () => {
    state.creator = state.creator === el.dataset.creator ? null : el.dataset.creator;
    syncChips(); render();
  }));
}

function syncChips() {
  document.querySelectorAll('[data-creator]').forEach((el) => { el.dataset.on = String(state.creator === el.dataset.creator); });
}

document.getElementById('stats').innerHTML = [
  '<span><b>' + DATA.stats.cards + '</b> 条视频</span>',
  '<span><b>' + DATA.stats.imageCards + '</b> 篇图文</span>',
  '<span><b>' + DATA.stats.patterns + '</b> 个句型</span>',
  DATA.stats.rewrites ? '<span><b>' + DATA.stats.rewrites + '</b> 处地道改写</span>' : '',
  '<span><b>' + DATA.stats.creators + '</b> 位博主</span>',
].filter(Boolean).join('');
document.getElementById('foot').textContent = '上次更新 ' + DATA.generatedAt.slice(0, 16).replace('T', ' ');

document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
chips();
render();
</script>
