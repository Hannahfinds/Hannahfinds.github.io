ia/6adb662d000000002c019c59.mp4","images":[]},{"kind":"video","noteId":"6adb5d3c000000002c01a288","creator":"瑞秋爱玛","title":"全英｜找到新工作，裁员后遗症还在……","publishedAt":"2026-10-23T13:12:28.000Z","durationSeconds":143,"likes":"7","noteUrl":"https://www.xiaohongshu.com/user/profile/61361d670000000002019d71/6adb5d3c000000002c01a288?xsec_token=ABPjqclhl2-2a8z2cxHdDtU25EQoQ3hort5e1x7Z5ur0U=&xsec_source=pc_user","ipLocation":"","summary":"视频中，一对伴侣围绕裁员后的心理创伤展开对话，讲述即使已经找到新工作，仍会陷入自我怀疑并担心再次失业。内容涵盖求职压力、伴侣支持以及如何面对挥之不去的焦虑，适合学习职场与情绪表达。","tags":["职场英语","裁员心理","情绪表达","口语表达"],"keyPoints":["裁员经历可能留下持续的心理阴影，即使已经入职新岗位，仍会担心旧事重演。","求职期间双方都会承受压力，彼此支持时应避免无意中增加对方的心理负担。","感到焦虑并不意味着自己有问题，做好当下的工作并继续向前是视频传递的态度。"],"patterns":[{"en":"be stressed out","zh":"压力大，焦虑不堪","usage":"描述因工作或生活压力而焦虑不堪时使用。","example":"Even though I didn't say it, I was also stressed out.","start":33.93},{"en":"put more pressure on sb","zh":"给某人增加压力","usage":"表示自己的言行可能让对方承担更多压力时使用。","example":"I didn't make a big deal out of it because I didn't want to put more pressure on you.","start":39.85},{"en":"land work","zh":"找到工作","usage":"谈论求职成功、得到工作机会时使用。","example":"If you never land work, I'd be the breadwinner and you'd be the house husband.","start":55.81},{"en":"a sword hanging over sb","zh":"像悬在头顶的利剑","usage":"形容某种威胁或焦虑始终笼罩着自己时使用。","example":"I just feel like there is a sword hanging over me.","start":73.49},{"en":"stick with sb","zh":"长久萦绕在心头","usage":"表示创伤、印象或情绪长时间难以消散时使用。","example":"The trauma sticks with you.","start":103.53},{"en":"catch oneself doing sth","zh":"发现自己正在做某事","usage":"描述下意识陷入担忧或某种行为时使用。","example":"Even now I still catch myself worrying what if it happens again but I guess that's just something I have to live with for a while.","start":111.03},{"en":"count yourself lucky","zh":"庆幸自己没碰上坏事","usage":"劝人庆幸自己没有遭遇某种糟糕经历时使用。","example":"If you've never been burned by your job, congratulations, count yourself lucky, but if at some point in your career you have been hurt and pushed to the verge of breaking down, you can relate.","start":91.69},{"en":"It's all in the mind.","zh":"问题出在心理层面","usage":"表示某种困扰主要源于内心的想法或感受时使用。","example":"It's all in the mind.","start":111.03}],"quotes":[{"text":"Even though I didn't say it, I was also stressed out.","start":33.93,"matched":true},{"text":"I just feel like there is a sword hanging over me.","start":73.49,"matched":true},{"text":"The trauma sticks with you.","start":103.53,"matched":true},{"text":"It's all in the mind.","start":111.03,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Today we want to talk about the mental trauma of getting laid off, did you go through that?"},{"t":6.05,"x":"I definitely did and I still feel it today, a month after starting my new job, I don't"},{"t":12.49,"x":"want to admit it, but I think the moment I got the news I was already a little traumatized"},{"t":18.33,"x":"even though the whole team got laid off, I still spiraled into self-doubt like why"},{"t":24.17,"x":"Why me?"},{"t":25.17,"x":"Isn't anxiety really built up as I send out countless resumes and got nothing back?"},{"t":31.05,"x":"Right."},{"t":32.05,"x":"Back then it wasn't just you."},{"t":33.93,"x":"Even though I didn't say it, I was also stressed out."},{"t":36.89,"x":"On one hand, I tried my best to be supportive."},{"t":39.85,"x":"I didn't make a big deal out of it because I didn't want to put more pressure on you."},{"t":44.89,"x":"I knew that wouldn't help, but on the other hand, I kept thinking, is he ever"},{"t":50.49,"x":"gonna find a job? What if he never gets hired again? At one point we even talked"},{"t":55.81,"x":"about this. If you never land work, I'd be the breadwinner and you'd be the house"},{"t":61.01,"x":"husband. Yeah and I'm still fine with that by the way if I lose my job again."},{"t":65.97,"x":"Okay so you're still feeling the after effects of trauma? I still do. It's all"},{"t":73.49,"x":"in the mind. I just feel like there is a sword hanging over me. I think anyone"},{"t":77.85,"x":"I've always been laid off once in my life, knows exactly what I mean, especially in this"},{"t":82.97,"x":"tough job market, you end up walking on ax shells, constantly worrying that the same"},{"t":88.29,"x":"thing will happen to you again."},{"t":90.41,"x":"I get it."},{"t":91.69,"x":"If you've never been burned by your job, congratulations, count yourself lucky, but if"},{"t":96.81,"x":"at some point in your career you have been hurt and pushed to the verge of breaking"},{"t":101.49,"x":"down, you can relate."},{"t":103.53,"x":"The trauma sticks with you."},{"t":105.45,"x":"a long time you just feel restless but I'm sure it's only a phase. Exactly again"},{"t":111.03,"x":"it's all in the mind. Even now I still catch myself worrying what if it happens"},{"t":116.15,"x":"again but I guess that's just something I have to live with for a while. Right. So"},{"t":121.47,"x":"to anyone going through the same thing you are not crazy it's not just you"},{"t":126.23,"x":"all we can do is to do our job well and keep moving forward and live the"},{"t":132.83,"x":"rest up to fate. Yeah, exactly. All right guys, so much for today. We'll see you next time. Bye bye!"}],"media":"media/6adb5d3c000000002c01a288.mp4","images":[]},{"kind":"image","noteId":"6ada7e92000000001400c800","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-22T21:22:26.000Z","durationSeconds":null,"likes":"16","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ada7e92000000001400c800?xsec_token=ABZOXas8oO_TMS9As3hE5w69boV7AMSeJRqsT4Ghdpg-o=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练习用英文讨论战争为什么主要由普通人承担代价，适合表达政治决策、商业利益与民生后果之间的关系。","tags":[],"keyPoints":["先说明战争决策通常由政府作出，部分企业还可能因此获利。","再强调真正承受生命、工作和家庭损失的是普通人。","最后点出普通人虽承担后果，却无权决定战争是否发生。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"为什么战争中受苦的往往是普通人？","zhReference":"因为做决定的通常是政府，一些企业可能从战争中赚钱，但真正承担后果的往往是普通人。他们可能失去家人、工作甚至家园，却没有决定战争是否发生的权力。","enQuestion":"Why do ordinary people often suffer most from war?","enReference":"Because governments usually make the decisions, and some companies may make money from war, but ordinary people often face the real consequences. They may lose their families, jobs, or even homes, without having the power to decide whether the war happens.","idiomaticFull":"Why do ordinary people usually end up getting hit the hardest in a war? The thing is, governments are usually the ones calling the shots, and some companies may profit from war, but everyday folks are often the ones left dealing with the fallout. They can lose their families, jobs, even their homes, and they don't really get a say in whether the war happens.","idiomatic":[{"orig":"often suffer most from war","better":"usually end up getting hit the hardest in a war","why":"这是日常聊天里更自然的表达，也更贴近“受冲击最大”的意思。"},{"orig":"governments usually make the decisions","better":"governments are usually the ones calling the shots","why":"call the shots 是口语中很常见的说法，表示“做决定、拍板”。"},{"orig":"face the real consequences","better":"left dealing with the fallout","why":"deal with the fallout 更口语，也更能表达“承担后果、收拾局面”。"},{"orig":"without having the power to decide","better":"don't really get a say in","why":"get a say in 是母语者日常表达“有发言权、能参与决定”的方式。"}],"media":null,"images":["media/6ada7e92000000001400c800-1.webp","media/6ada7e92000000001400c800-2.webp"]},{"kind":"image","noteId":"6ada7e77000000001400c001","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-22T21:21:59.000Z","durationSeconds":null,"likes":"12","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ada7e77000000001400c001?xsec_token=ABZOXas8oO_TMS9As3hE5w6zIFfHaU3g9yzmlknzaA_DI=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练习用英语讨论战争的利益与代价，并说明不同群体承担的结果并不相同。适合口语观点表达和利弊分析场景。","tags":[],"keyPoints":["先提出利益是否大于代价的问题。","说明不同群体受到的影响无法简单比较。","对比企业获利与政府、军人及平民承担的代价。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"战争带来的利益会大于代价吗？","zhReference":"我觉得很难简单比较，因为不同的人承担的结果完全不同。一些企业可能获得利益，但政府要花钱，军人和平民也可能付出生命和生活上的代价。","enQuestion":"Do the benefits of war outweigh the costs?","enReference":"I think it is hard to compare because different groups face very different results. Some companies may benefit, but governments spend money, while soldiers and civilians may pay a much greater price.","idiomaticFull":"Honestly, it’s hard to say whether war’s benefits outweigh its costs, because different groups end up with very different outcomes. Some companies may come out ahead, but governments still have to spend money, while soldiers and civilians often pay a much higher price.","idiomatic":[{"orig":"I think it is hard to compare","better":"it’s hard to say whether war’s benefits outweigh its costs","why":"这样直接回应问题，比笼统说难以比较更自然。"},{"orig":"face very different results","better":"end up with very different outcomes","why":"end up with 是日常聊天中常用的口语结构，清楚地表达不同群体最终得到不同结果。"},{"orig":"Some companies may benefit","better":"Some companies may come out ahead","why":"come out ahead 常用来表示在一件事中占据优势或最终获利。"}],"media":null,"images":["media/6ada7e77000000001400c001-1.webp","media/6ada7e77000000001400c001-2.webp"]},{"kind":"image","noteId":"6ada7e67000000001400c400","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-22T21:21:43.000Z","durationSeconds":null,"likes":"11","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ada7e67000000001400c400?xsec_token=ABZOXas8oO_TMS9As3hE5w66jC3rZ8cKRz2eCPfYM68m4=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期围绕美国能否从战争中获利展开，练习用让步与转折说明军工企业获利并不等于国家整体获利。内容也适合影子跟读，积累军费、退伍军人保障和战争成本等相关表达。","tags":[],"keyPoints":["先承认部分军工企业可能因更多武器订单而赚钱。","再用 but 转折区分军工企业利润与国家整体收益。","最后列举军费、退伍军人保障和长期债务，说明战争本身代价高昂。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"美国能从战争中赚钱吗？","zhReference":"一些军工企业确实可能从更多武器订单中赚钱，但这不代表整个国家都在赚钱。政府同时需要承担巨额军费、退伍军人保障和长期债务，所以战争本身也非常昂贵。","enQuestion":"Can the US make money from war?","enReference":"Some defence companies may make money from more military contracts, but that does not mean the whole country makes money. The government also has to pay for the military, veterans, and long-term debt, so war itself is extremely expensive.","idiomaticFull":"Can the US actually make money from war? Sure, some defense companies might cash in on more military contracts, but that doesn't mean the whole country does. The government still has to cover the military, veterans, and long-term debt, so war itself ends up costing a ton.","idiomatic":[{"orig":"Can the US make money from war?","better":"Can the US actually make money from war?","why":"加了 actually 后，更像日常口语中带着疑问或求证语气的问法。"},{"orig":"Some defence companies may make money from more military contracts","better":"Sure, some defense companies might cash in on more military contracts","why":"cash in on 比 make money from 更口语化，Sure 也让转折前的让步听起来更自然。"},{"orig":"but that does not mean the whole country makes money","better":"but that doesn't mean the whole country does","why":"does 代替重复的 makes money，这是英语口语里很常见的省略说法。"},{"orig":"so war itself is extremely expensive","better":"so war itself ends up costing a ton","why":"ends up costing a ton 是美国人日常聊天中自然的说法，意思是最终代价非常高昂。"}],"media":null,"images":["media/6ada7e67000000001400c400-1.webp","media/6ada7e67000000001400c400-2.webp"]},{"kind":"image","noteId":"6ada7e45000000001901d801","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-22T21:21:09.000Z","durationSeconds":null,"likes":"12","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ada7e45000000001901d801?xsec_token=ABZOXas8oO_TMS9As3hE5w65mjx0Cct0kp4-CGgmbakI4=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练习如何用英语谈论美国参与海外战争的原因。表达涵盖国家安全、盟友、地区影响力、经济利益和全球地位等多个考虑因素。","tags":[],"keyPoints":["回答先从国家安全、盟友关系和地区影响力等方面说明介入动机。","能源、经济利益和全球战略地位也是判断是否介入的重要考量。","强调每场战争的具体原因不同，但这些属于反复出现的共同因素。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"为什么美国经常参与海外战争？","zhReference":"因为美国需要考虑国家安全、盟友关系、地区影响力、能源和经济利益，也会考虑自己的全球战略地位。不同战争的原因会不一样，但这些都是美国决定是否介入海外冲突时常见的考虑。","enQuestion":"Why is the US often involved in overseas wars?","enReference":"Because the US considers national security, alliances, regional influence, energy and economic interests, as well as its global position. The reasons are different in each war, but these are common factors when the US decides whether to get involved in an overseas conflict.","idiomaticFull":"Why does the US end up getting involved in wars overseas so often? Because the US takes national security, alliances, regional influence, energy and economic interests, and its global position into account. The reasons vary from one war to the next, but those are the common factors that come into play when the US is deciding whether to get involved in a conflict abroad.","idiomatic":[{"orig":"Why is the US often involved in overseas wars?","better":"Why does the US end up getting involved in wars overseas so often?","why":"end up getting involved 是美国人日常追问某种结果及其缘由时很自然的说法。"},{"orig":"Because the US considers national security, alliances, regional influence, energy and economic interests, as well as its global position.","better":"Because the US takes national security, alliances, regional influence, energy and economic interests, and its global position into account.","why":"takes ... into account 是口语中表达“把……纳入考量”的常用结构。"},{"orig":"The reasons are different in each war","better":"The reasons vary from one war to the next","why":"vary from one war to the next 比直译“每场战争不同”更简洁自然。"},{"orig":"when the US decides whether to get involved in an overseas conflict.","better":"when the US is deciding whether to get involved in a conflict abroad.","why":"is deciding 和 abroad 更贴近美国人日常描述决策过程时的表达。"}],"media":null,"images":["media/6ada7e45000000001901d801-1.webp","media/6ada7e45000000001901d801-2.webp"]},{"kind":"video","noteId":"6ad8115b000000002b01f34c","creator":"福禄咪学英语","title":"职场勾心斗角丨美式口语美剧学英语","publishedAt":"2026-10-21T01:11:55.000Z","durationSeconds":53.1,"likes":"49","noteUrl":"https://www.xiaohongshu.com/user/profile/683532dc000000001d017868/6ad8115b000000002b01f34c?xsec_token=AB1d6mQfWxy0GDcFDk-rN69uYGimpx1IrfvnPmn4PFwjw=&xsec_source=pc_user","ipLocation":"辽宁","summary":"视频用一场职场提案短剧，展示同事抢走创意、争夺奖金的办公室政治场景。除了能看懂这类职场冲突，还能学到谈论创意、内容热度和职场算计的实用口语。","tags":["职场英语","美剧口语","办公室政治","创意提案"],"keyPoints":["视频呈现了提案会上同事暗中窃取创意并抢走奖金的冲突。","对话涉及提案、爆红内容、积攒播放量和奖金等职场话题。","结尾点出这种行为属于办公室政治，并留下后续冲突的悬念。"],"patterns":[{"en":"fall for sb","zh":"爱上某人；迷上某人","usage":"描述剧情中某人爱上另一个人时用。","example":"The CEO fell for me.","start":1.32},{"en":"go viral","zh":"走红；迅速传播","usage":"形容内容突然爆红、被大量传播时用。","example":"This could go viral and rack up views.","start":29.94},{"en":"rack up views","zh":"累积播放量","usage":"谈论视频或内容获得大量播放量时用。","example":"This could go viral and rack up views.","start":29.94},{"en":"steal sb's idea","zh":"窃取某人的创意","usage":"同事抢先使用你的创意、想表达不满时用。","example":"You stole my idea!","start":35.72},{"en":"be shameless","zh":"真不要脸；脸皮真厚","usage":"口语中指责对方毫无羞愧之心时用。","example":"Wow, you're shameless.","start":39.1},{"en":"office politics","zh":"职场政治；办公室斗争","usage":"谈及职场算计、利益争夺和暗中较劲时用。","example":"That's office politics.","start":42.32},{"en":"This isn't over.","zh":"这事还没完。","usage":"放狠话表示冲突尚未结束、之后还会追究时用。","example":"This isn't over.","start":43.6}],"quotes":[{"text":"Got a pitch for today's meeting?","start":0,"matched":true},{"text":"You stole my idea!","start":35.72,"matched":true},{"text":"Yours? I thought of it too, I spoke first.","start":36.68,"matched":true},{"text":"That's office politics.","start":42.32,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Got a pitch for today's meeting?"},{"t":1.32,"x":"Yeah, the CEO fell for me."},{"t":3.44,"x":"A powerful CEO falls for an ordinary girl."},{"t":6.4,"x":"The boss is going to love it."},{"t":7.52,"x":"Wow, that's brilliant."},{"t":10.42,"x":"Today, we choose our next series."},{"t":12.66,"x":"The winning idea gets a double bonus."},{"t":16.24,"x":"Any pitches?"},{"t":17.74,"x":"I've got one."},{"t":18.9,"x":"The CEO fell for me."},{"t":21.33,"x":"A powerful CEO falls for an ordinary girl."},{"t":24.53,"x":"Our female audience loves this stuff."},{"t":28.5,"x":"That's brilliant."},{"t":29.94,"x":"This could go viral and rack up views."},{"t":32.62,"x":"Any other pitches?"},{"t":35.72,"x":"You stole my idea!"},{"t":36.68,"x":"Yours? I thought of it too, I spoke first."},{"t":39.1,"x":"Wow, you're shameless."},{"t":40.58,"x":"Whatever, I got the bonus."},{"t":42.32,"x":"That's office politics."},{"t":43.6,"x":"This isn't over."},{"t":45.18,"x":"Pitch, bonus, ordinary, go viral,"},{"t":50.02,"x":"stole, shameless."}],"media":"media/6ad8115b000000002b01f34c.mp4","images":[]},{"kind":"video","noteId":"6ad80959000000003103b99d","creator":"Cindy的英语世界","title":"我发现提升口语最快的方式，没有之一","publishedAt":"2026-10-21T00:37:45.000Z","durationSeconds":177,"likes":"8","noteUrl":"https://www.xiaohongshu.com/user/profile/66c1847c000000001d032526/6ad80959000000003103b99d?xsec_token=AB1d6mQfWxy0GDcFDk-rN69hOYmgS1Tl_1wqdzHTb79Jw=&xsec_source=pc_user","ipLocation":"浙江","summary":"视频围绕谷爱凌如何评价母亲的教育方式展开：母亲让她小时候广泛尝试，之后逐步把选择权交还给她，并反驳了“虎妈”标签。可以学到如何用英语描述成长塑造、兴趣探索、赋予自主权以及澄清误解。","tags":["亲子教育","兴趣探索","自主选择","地道表达"],"keyPoints":["她小时候，母亲让她广泛接触不同活动，以保留多种可能性。","随着年龄增长，母亲逐步把做决定的自由和责任交还给她。","母亲并非替她规划一切的“虎妈”，而是极力保障她自主选择的空间。","谷爱凌认为这种不断演变的伙伴关系是她成长中的关键。"],"patterns":[{"en":"be shaped by sth","zh":"受到……塑造或影响","usage":"谈论成长经历、性格或成就的成因时使用。","example":"She was curious to know how much of your excellence has been shaped by your mother in particular","start":0},{"en":"get sth off the table","zh":"先把某事明确处理掉","usage":"表示先解决某个话题或消除某项不确定性。","example":"Like let's just get that off the table.","start":22.54},{"en":"beyond a certain point","zh":"超过某个阶段之后","usage":"说明情况在达到一定程度后发生变化。","example":"That just means that like beyond a certain point you are more created by your peer group, by your environment, by the people who you look up to, by the media you consume, by the beliefs that you hold versus your home and family life directly.","start":46.48},{"en":"optimize for sth","zh":"优先考虑；为……优化","usage":"说明围绕某种目标安排资源或作出选择时使用。","example":"she really optimized for play and she optimized for optionality so she put me into everything like I'm literally talking about everything, like ballet, piano, archery","start":89.04},{"en":"against one's will","zh":"违背某人的意愿","usage":"说明某事并非出于本人自愿时使用。","example":"I did singing lessons against my will.","start":null},{"en":"give sb the full spread","zh":"让某人广泛尝试各种选择","usage":"形容给孩子或初学者提供丰富多样的体验。","example":"And so the point being that when I was younger she really gave me the full spread so that when I was older and when I knew myself better and when I was responsible to make those decisions I could make an informed one having tried all the options","start":110.56},{"en":"make the incorrect assumption that ...","zh":"错误地以为……","usage":"用于指出并纠正别人对某事的误解。","example":"A lot of people make the incorrect assumption that she's a tiger mom","start":141.92},{"en":"entrust sb with sth","zh":"把某事托付给某人","usage":"说明将重要责任或决定交给他人时使用。","example":"I think that responsibility that she she really entrusted me with from a somewhat young age I think that was critical and really fundamental.","start":132.56}],"quotes":[{"text":"when I was young she gave me the choices and then when I was a little bit older she gave me the freedom to make the choice","start":115.32,"matched":true},{"text":"A lot of people make the incorrect assumption that she's a tiger mom","start":141.92,"matched":true},{"text":"She was in many ways the opposite of that where she just vigorously provided me with freedom and agency and like enforced my freedom really intensely","start":154.16,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"She was curious to know how much of your excellence has been shaped by your mother in particular"},{"t":6.72,"x":"and the environment she created and how that helped develop your intrinsic drive or perhaps"},{"t":14.16,"x":"the intrinsic drive was there to start off. Yeah, so my mom's the best for sure. Like let's just"},{"t":22.54,"x":"get that off the table. That's like no question. So she's here. She looks great. She's in the"},{"t":28.7,"x":"the front everyone tell her she looks pretty. So yeah absolutely I think that"},{"t":41.28,"x":"so she would always say that up until I was 13 I was her job and then after I"},{"t":46.48,"x":"turned 13 I was the job of the world and that just means that like beyond a"},{"t":52.2,"x":"certain point you are more created by your peer group, by your environment, by"},{"t":56.48,"x":"the people who you look up to, by the media you consume, by the beliefs"},{"t":61.44,"x":"that you hold versus your home and family life directly but I've been really lucky in"},{"t":68.12,"x":"so far that I've had this very unique partnership through the course of my life that has constantly"},{"t":73.72,"x":"evolved and we always have had kind of different roles so like obviously when I was three she"},{"t":79.72,"x":"was my mom so she was taking me to the playground and I think she really optimized"},{"t":83.68,"x":"for play and she optimized for optionality so she put me into everything like I'm"},{"t":89.04,"x":"literally talking about everything, like ballet, piano, archery, because I had an"},{"t":95.24,"x":"archery phase because I was really into dystopian novels and I thought that this"},{"t":99,"x":"was gonna be like a skill that I was really gonna need. So archery, basketball,"},{"t":103.8,"x":"soccer, cross-country, skiing, I did math camp, I did science camp, I did singing"},{"t":110.56,"x":"lessons against my will. There were lots of things, right? And so the point"},{"t":115.32,"x":"being that when I was younger she really gave me the full spread so that when I"},{"t":121,"x":"was older and when I knew myself better and when I was responsible to make"},{"t":124.48,"x":"those decisions I could make an informed one having tried all the options so when"},{"t":129.12,"x":"I was young she gave me the choices and then when I was a little bit older she"},{"t":132.56,"x":"gave me the freedom to make the choice and I think that responsibility that"},{"t":137.32,"x":"she she really entrusted me with from a somewhat young age I think that was"},{"t":141.92,"x":"critical and really fundamental. A lot of people make the incorrect assumption"},{"t":147.2,"x":"that she's a tiger mom and I think the tiger mom definition is that you know"},{"t":150.84,"x":"it's like a helicopter parent that pilots you and like forces you to do"},{"t":154.16,"x":"various things. She was in many ways the opposite of that where she just"},{"t":157.92,"x":"vigorously provided me with freedom and agency and like enforced my freedom"},{"t":162.68,"x":"really intensely and that was like the effect of her tiger mom so so that"},{"t":167.84,"x":"was kind of like the parenting thesis and then as I got older I keep"},{"t":171.52,"x":"Calling us co-founders because I really think that's like the best way to encapsulate our partnership"}],"media":"media/6ad80959000000003103b99d.mp4","images":[]},{"kind":"image","noteId":"6ad7fb43000000001901ec00","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-20T23:37:39.000Z","durationSeconds":null,"likes":"31","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ad7fb43000000001901ec00?xsec_token=ABPHQYH3EIgfeJclxX7huodkqjFh88OnqMjwXPnhWeg0s=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练习用英文回答公司该如何吸引年轻人担任管理者，重点讨论责任、报酬、工作负担和管理权限之间的平衡。","tags":[],"keyPoints":["晋升应与更好的薪资和真实的决策权相匹配。","减少无谓工作才能让管理岗位更有吸引力。","只有更多麻烦却没有相应回报的晋升很难打动年轻人。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"公司应该如何激励年轻人？","zhReference":"我觉得最重要的是让责任和回报更匹配，比如提高工资、减少没有必要的工作，并给管理者真正的决定权。如果升职只是意味着更多麻烦，却没有更多收入或权力，那自然很难吸引年轻人。","enQuestion":"How should companies encourage young people to become managers?","enReference":"I think the most important thing is to match responsibility with rewards, such as better pay, less unnecessary work, and real decision-making power. If promotion only brings more problems without enough money or authority, it will naturally be less attractive.","idiomaticFull":"How can companies get young people to step up into management? I think the key is to make the responsibility worth their while with better pay, less busywork, and a real say in decisions. If a promotion only means more headaches without enough money or authority, it’s naturally going to look a lot less appealing.","idiomatic":[{"orig":"encourage young people to become managers","better":"get young people to step up into management","why":"get someone to do something 和 step up into a role 都是日常口语中很自然的说法。"},{"orig":"match responsibility with rewards","better":"make the responsibility worth their while","why":"这个说法更口语化，也更直接表达“责任要配得上回报”。"},{"orig":"real decision-making power","better":"a real say in decisions","why":"have a say 是表达“有实际话语权”的常用日常说法。"},{"orig":"brings more problems without enough money or authority","better":"means more headaches without enough money or authority","why":"more headaches 比 more problems 更像母语者在聊天时描述工作烦恼的说法。"}],"media":null,"images":["media/6ad7fb43000000001901ec00-1.webp","media/6ad7fb43000000001901ec00-2.webp"]},{"kind":"image","noteId":"6ad7faed0000000013033400","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-20T23:36:13.000Z","durationSeconds":null,"likes":"24","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ad7faed0000000013033400?xsec_token=ABPHQYH3EIgfeJclxX7huodsU06Z_PV8yytZLy5lNmvZU=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期围绕年轻人的管理意愿练习表达观点，并讨论职业成功、管理压力和公司管理方式之间的关系。适合用于雅思口语中的职场、晋升与工作价值类话题。","tags":[],"keyPoints":["回答时先避免简单判断好坏，再补充不同人的能力和职业目标存在差异。","用升职并非成功的唯一形式来支持个人选择。","最后把普遍逃避管理归因于过大压力，并提出公司需要调整管理方式。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"年轻人不想当领导是好现象吗？","zhReference":"我觉得不能简单说好或者不好，因为不是每个人都适合管理，也不是只有升职才算成功。但如果大家都因为压力太大而不愿意承担管理工作，那可能说明公司的管理方式本身需要改变。","enQuestion":"Is it a good thing that young people do not want to become managers?","enReference":"I don’t think it is simply good or bad, because not everyone is suited to management and promotion is not the only form of success. But if people avoid management mainly because of excessive pressure, companies may need to change how these roles work.","idiomaticFull":"Is it a good thing that young people don't want to be managers? I don't think it's all good or all bad. Not everyone's cut out for management, and moving up isn't the only way to be successful. But if young people steer clear of management mainly because of the pressure, companies may need to rethink how those roles work.","idiomatic":[{"orig":"do not want to become managers","better":"don't want to be managers","why":"日常聊天里通常用 be 来表示担任职位，更简短自然。"},{"orig":"not everyone is suited to management","better":"Not everyone's cut out for management","why":"cut out for 是很常见的口语说法，表示某人适合做某类工作。"},{"orig":"promotion is not the only form of success","better":"moving up isn't the only way to be successful","why":"moving up 更口语化，也让“职业晋升”这层意思更直观。"},{"orig":"companies may need to change how these roles work","better":"companies may need to rethink how those roles work","why":"rethink 在职场讨论中很常用，自然表达“重新考虑并调整”。"}],"media":null,"images":["media/6ad7faed0000000013033400-1.webp","media/6ad7faed0000000013033400-2.webp"]},{"kind":"image","noteId":"6ad7fad20000000013033400","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-20T23:35:46.000Z","durationSeconds":null,"likes":"25","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ad7fad20000000013033400?xsec_token=ABPHQYH3EIgfeJclxX7huodlfY7cnHJd7XDLh7FJ7MOYE=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练习在职场中谈论年轻人为何隐藏野心，以及主动争取晋升可能带来的人际影响。适合雅思口语中关于工作、职业发展和职场关系的表达。","tags":[],"keyPoints":["公开表达晋升意愿可能被看作竞争心太强。","过度争取晋升有时会影响与同事的关系。","表现出不太在意晋升，可能显得选择更多、经济压力更小。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"为什么有些年轻人不愿表现出野心？","zhReference":"因为太明显地想升职，有时候会让人觉得这个人竞争心太强，甚至可能影响同事关系。相反，表现得“不太在乎升职”，有时还会给人一种选择很多、经济压力没那么大的感觉。","enQuestion":"Why do some young people avoid showing ambition?","enReference":"Because openly wanting a promotion can sometimes make someone look too competitive and may affect relationships with colleagues. In contrast, acting less interested in promotion can make a person seem more relaxed, as if they have more choices and less financial pressure.","idiomaticFull":"Why do some young people avoid showing ambition? A lot of it comes down to the fact that openly going after a promotion can make you seem too competitive and can end up hurting your relationships with coworkers. On the flip side, acting like you're less interested in moving up can make you come across as more laid-back, as if you have more options and aren't under as much financial pressure.","idiomatic":[{"orig":"openly wanting a promotion","better":"openly going after a promotion","why":"go after 是日常口语里表达“主动争取”的自然说法。"},{"orig":"may affect relationships with colleagues","better":"can end up hurting your relationships with coworkers","why":"end up 更能自然表达某种行为最终带来的负面影响。"},{"orig":"make a person seem more relaxed","better":"make you come across as more laid-back","why":"come across as 和 laid-back 都是美国人聊天时常用的自然表达。"},{"orig":"In contrast","better":"On the flip side","why":"On the flip side 更口语化，适合日常对话中的转折。"}],"media":null,"images":["media/6ad7fad20000000013033400-1.webp","media/6ad7fad20000000013033400-2.webp"]},{"kind":"image","noteId":"6ad7fab2000000001901e400","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-20T23:35:14.000Z","durationSeconds":null,"likes":"7","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ad7fab2000000001901e400?xsec_token=ABPHQYH3EIgfeJclxX7huodi5OVWAovwty4b0Pg_ia0dw=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练习用英语解释年轻人为何不愿晋升为管理者，涉及职位提升、团队关系、责任与薪酬回报等问题。适合职场观点表达和雅思口语原因分析。","tags":[],"keyPoints":["管理岗位不只意味着更高的职位，还意味着要承担更多责任。","管理者需要处理人际关系和团队冲突，出现问题时还要负责。","如果加薪幅度有限，一些年轻人会认为额外压力不值得承担。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"为什么年轻人越来越不想当领导？","zhReference":"因为当领导不只是职位更高，还要处理人际关系、团队冲突和各种责任，出了问题也往往需要负责。如果工资没有增加很多，有些年轻人会觉得承担这些压力并不划算。","enQuestion":"Why do more young people not want to become managers?","enReference":"Because being a manager means more than having a higher position. It also means dealing with relationships, team conflicts, and more responsibility, so if the pay does not increase much, some young people may feel that the extra pressure is not worth it.","idiomaticFull":"Why don't more young people want to become managers? Well, being a manager isn't just about getting a higher position. It also means having to deal with relationships, team conflicts, and more responsibility. So if the pay bump isn't that big, some young people may figure the extra stress just isn't worth it.","idiomatic":[{"orig":"Why do more young people not want to become managers?","better":"Why don't more young people want to become managers?","why":"这是日常问句更自然的语序，并用缩写 don't。"},{"orig":"more than having a higher position","better":"isn't just about getting a higher position","why":"这种说法更像口语中的对比表达，也更符合聊天语气。"},{"orig":"dealing with relationships","better":"having to deal with relationships","why":"加上 have to 更清楚地表达这些事是不得不处理的。"},{"orig":"if the pay does not increase much","better":"if the pay bump isn't that big","why":"pay bump 和 isn't that big 都是职场口语里很常见的说法。"}],"media":null,"images":["media/6ad7fab2000000001901e400-1.webp","media/6ad7fab2000000001901e400-2.webp"]},{"kind":"video","noteId":"6ad61c98000000001e036b12","creator":"福禄咪学英语","title":"面试情景剧之怒怼面试官职场英语","publishedAt":"2026-10-20T00:30:17.000Z","durationSeconds":52.9,"likes":"34","noteUrl":"https://www.xiaohongshu.com/user/profile/683532dc000000001d017868/6ad61c98000000001e036b12?xsec_token=ABGXCRXCeS2ezYNTf-6PDzxAZGIVLCjTJObDYzCMcR89A=&xsec_source=pc_user","ipLocation":"黑龙江","summary":"视频还原了一场面试与薪资谈判：求职者先简明介绍相关经验和优势，随后发现实际薪资、周末要求与招聘信息不符。可以学习如何陈述经历、追问岗位条件，并在遭遇不诚信招聘时直接反驳。","tags":["职场面试","薪资谈判","英文口语"],"keyPoints":["回答个人优势时，用相关经验和具体能力让介绍更有说服力。","求职者主动追问薪资与周末要求，发现招聘信息与实际条件存在出入。","面对模糊解释，求职者直接指出对方隐瞒真实条款，并拒绝接受误导。","被质疑能力时，求职者将问题拉回招聘方诚信，而不是陷入自我辩解。"],"patterns":[{"en":"have over a year of experience","zh":"拥有一年多经验","usage":"面试中概括自己在某领域的工作年限时使用","example":"I have over a year of social media marketing experience.","start":9.09},{"en":"be great at spotting trends","zh":"擅长发现趋势","usage":"突出对市场或行业变化的敏锐度时使用","example":"I'm great at spotting trends","start":9.09},{"en":"want room to grow","zh":"希望有成长空间","usage":"解释离职原因或表达职业发展诉求时使用","example":"I wanted room to grow","start":16.29},{"en":"Your job posting said ...","zh":"你们招聘信息写的是……","usage":"指出实际岗位条件与招聘描述不一致时使用","example":"Your job posting said five grand and nothing about weekends.","start":26.38},{"en":"be performance based","zh":"以绩效为依据","usage":"说明薪资会根据工作表现浮动时使用","example":"Five grand is performance based.","start":31.38},{"en":"hide the real terms","zh":"隐瞒真实条件","usage":"指出招聘方没有提前说明关键条款时使用","example":"You hid the real terms.","start":34.38},{"en":"My skills aren't the problem.","zh":"问题不在我的能力","usage":"因能力受质疑而反驳，并把焦点转向对方问题时使用","example":"My skills aren't the problem. Your honesty is.","start":38.38}],"quotes":[{"text":"I wanted room to grow","start":16.29,"matched":true},{"text":"Your job posting said five grand and nothing about weekends.","start":26.38,"matched":true},{"text":"That's misleading. You hid the real terms.","start":34.38,"matched":true},{"text":"My skills aren't the problem. Your honesty is.","start":38.38,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.53,"x":"May I come in come in"},{"t":2.77,"x":"Here's my resume. Tell me about yourself. I'm from me from, California. I studied communications at UCLA"},{"t":9.09,"x":"What are your strengths? I have over a year of social media marketing experience. I'm great at spotting trends"},{"t":16.29,"x":"Why'd you leave your last job? I wanted room to grow"},{"t":20.85,"x":"Six grand a month dream on"},{"t":23.94,"x":"Starting pay is two grand weekends are mandatory"},{"t":26.38,"x":"Two grand? Your job posting said five grand and nothing about weekends."},{"t":31.38,"x":"Five grand is performance based."},{"t":33.38,"x":"Weekend work helps you grow."},{"t":34.38,"x":"That's misleading. You hid the real terms."},{"t":36.38,"x":"Maybe you're just not qualified."},{"t":38.38,"x":"You wasted my time. My skills aren't the problem. Your honesty is."},{"t":42.38,"x":"Suit yourself."},{"t":44.47,"x":"Resume."},{"t":45.47,"x":"Strengths."},{"t":46.47,"x":"Trends."},{"t":47.47,"x":"Job posting."},{"t":49.47,"x":"Misleading."},{"t":50.47,"x":"Honesty."}],"media":"media/6ad61c98000000001e036b12.mp4","images":[]},{"kind":"image","noteId":"6ad64adf000000001400c800","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-19T16:52:47.000Z","durationSeconds":null,"likes":"19","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ad64adf000000001400c800?xsec_token=ABGXCRXCeS2ezYNTf-6PDzxAGiiWkd7ELYugElS5mSnlQ=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练习用英语讨论赚钱与孩子成长质量之间的关系，重点表达金钱的积极作用和隐私、选择权等代价。适合雅思口语 Part 3 中陈述观点并作让步转折。","tags":[],"keyPoints":["先承认金钱能够改善生活条件，再指出它并非提升生活质量的充分条件。","用“不一定代表生活更好”说明收入增加与孩子福祉之间不能直接画等号。","通过长期曝光和失去选择权说明需要权衡金钱收益与成长环境。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"有人认为只要能赚钱，孩子的生活就会越来越好，你怎么看？","zhReference":"我觉得钱当然可以改善生活条件，但不能因此忽略孩子的隐私和正常童年。赚到更多钱不一定代表生活一定更好，如果代价是长期曝光和失去选择权，那就需要认真考虑。","enQuestion":"Some people think earning money will automatically give children a better life. What do you think?","enReference":"I think money can certainly improve living conditions, but it should not come at the cost of a child’s privacy or normal childhood. More money does not always mean a better life if the price is constant exposure and less personal choice.","idiomaticFull":"Some people think making more money will automatically give their kids a better life. What do you think? Sure, money can make life more comfortable for kids, but it shouldn't come at the expense of their privacy or a normal childhood. Just because you have more money doesn't mean you'll have a better life, especially if it means they're constantly in the spotlight and have less say over their own lives.","idiomatic":[{"orig":"I think money can certainly improve living conditions","better":"Sure, money can make life more comfortable for kids","why":"用 Sure 开头更像口语回应，make life more comfortable 也比 improve living conditions 更自然。"},{"orig":"it should not come at the cost of a child’s privacy or normal childhood","better":"it shouldn't come at the expense of their privacy or a normal childhood","why":"come at the expense of 是日常常说的固定搭配，缩写 shouldn't 也更符合聊天语气。"},{"orig":"More money does not always mean a better life","better":"Just because you have more money doesn't mean you'll have a better life","why":"Just because...doesn't mean... 是美国人表达“有钱未必就好”时很常见的口语句型。"},{"orig":"the price is constant exposure and less personal choice","better":"it means they're constantly in the spotlight and have less say over their own lives","why":"in the spotlight 和 have less say 都是自然口语表达，分别对应持续曝光和个人选择减少。"}],"media":null,"images":["media/6ad64adf000000001400c800-1.webp","media/6ad64adf000000001400c800-2.webp"]},{"kind":"image","noteId":"6ad64aac000000001901ec00","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-19T16:51:56.000Z","durationSeconds":null,"likes":"18","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ad64aac000000001901ec00?xsec_token=ABGXCRXCeS2ezYNTf-6PDzxDvcgTd_G4QXYumYImy9TYc=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练习谈论儿童过早接触互联网的风险，以及网络记录可能对个人隐私造成的长期影响。适合用于雅思口语中的家庭、科技与儿童成长话题。","tags":[],"keyPoints":["孩子尚难充分理解隐私和网络信息长期留存的意义。","童年的尴尬瞬间和家庭生活可能被陌生人持续看到。","表达观点时可以先说明风险，再解释原因并延伸未来影响。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"过早暴露在互联网上对孩子好吗？","zhReference":"我觉得风险很大，因为小孩子还不能真正理解隐私和长期网络记录意味着什么。等他们长大以后，可能并不希望自己的童年、尴尬瞬间甚至家庭生活一直被陌生人看到。","enQuestion":"Is being exposed online at a young age good for children?","enReference":"I think it can be risky because young children cannot fully understand privacy or the long-term effects of having their lives online. When they grow up, they may not want strangers to keep seeing their childhood, embarrassing moments, or family life.","idiomaticFull":"Is it really a good idea for kids to be out there online at such a young age? I think it can be risky because little kids don’t really get privacy or how having their lives online could affect them long term. Once they’re older, they might not want strangers to keep seeing their childhood, embarrassing moments, or family life.","idiomatic":[{"orig":"Is being exposed online at a young age good for children?","better":"Is it really a good idea for kids to be out there online at such a young age?","why":"用 be a good idea 和 kids 发问更像口语聊天，也比 is being exposed 更自然。"},{"orig":"cannot fully understand privacy or the long-term effects","better":"don’t really get privacy or how having their lives online could affect them long term","why":"don’t really get 是日常表达，把抽象名词拆成 could affect them 更口语化。"},{"orig":"When they grow up, they may not want","better":"Once they’re older, they might not want","why":"Once they’re older 更符合日常对话的节奏，might not want 也比 may not want 更自然。"}],"media":null,"images":["media/6ad64aac000000001901ec00-1.webp","media/6ad64aac000000001901ec00-2.webp"]},{"kind":"image","noteId":"6ad64a93000000001400c800","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-19T16:51:31.000Z","durationSeconds":null,"likes":"18","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ad64a93000000001400c800?xsec_token=ABGXCRXCeS2ezYNTf-6PDzxP9GtCscLKPZ4F6VxSMZMR8=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练习如何用英文解释部分父母让孩子做网红赚钱的原因，并说明儿童内容如何既记录生活，又逐渐带来收入。","tags":[],"keyPoints":["儿童内容因为可爱、搞笑、贴近真实家庭生活而更容易吸引关注。","关注度和品牌合作使拍摄孩子具备商业变现的可能。","回答同时呈现了记录生活和获得收入这两类动机。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"为什么有些父母想通过孩子做网红赚钱？","zhReference":"因为孩子的内容很容易吸引注意，尤其是可爱、搞笑或者真实的家庭日常，也比较容易获得流量和品牌合作。对一些父母来说，拍孩子既像记录生活，也可能变成一种收入来源。","enQuestion":"Why do some parents try to make money by turning their children into influencers?","enReference":"Because content featuring children can easily attract attention, especially when it is cute, funny, or shows real family life. For some parents, filming their children starts as a way to record life but can later become a source of income.","idiomaticFull":"Why do some parents try to make money by turning their kids into influencers? A big part of it is that content with kids in it just draws people in, especially when they’re cute or funny, or when it shows what family life is really like. Some parents start out filming their kids just to capture everyday life, but it can end up bringing in money.","idiomatic":[{"orig":"content featuring children can easily attract attention","better":"content with kids in it just draws people in","why":"with kids in it 和 draw people in 都是更自然的日常说法，比 featuring 和 attract attention 更口语。"},{"orig":"shows real family life","better":"shows what family life is really like","why":"这个说法更像日常聊天，也更自然地表达“真实的家庭生活”。"},{"orig":"starts as a way to record life","better":"start out filming their kids just to capture everyday life","why":"start out 表示一开始只是做某事，capture everyday life 也比 record life 更地道。"},{"orig":"can later become a source of income","better":"can end up bringing in money","why":"end up 自然表达事情后来变成某种结果，bring in money 是很常见的口语说法。"}],"media":null,"images":["media/6ad64a93000000001400c800-1.webp","media/6ad64a93000000001400c800-2.webp"]},{"kind":"image","noteId":"6ad64a52000000001400c400","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-19T16:50:26.000Z","durationSeconds":null,"likes":"13","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ad64a52000000001400c400?xsec_token=ABGXCRXCeS2ezYNTf-6PDzxKS1ftX0Xup7-LSA1g9ZUDc=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练习谈论儿童网红现象：解释社交媒体降低了发布门槛，以及流量如何让普通孩子快速积攒粉丝。适合用于社会现象、社交媒体与网络影响力话题的口语表达。","tags":[],"keyPoints":["手机和社交媒体让普通家庭无需电视台或经纪公司也能发布内容。","视频只要获得足够关注，普通孩子就可能迅速走红。","发布门槛降低和流量传播是儿童网红增多的重要原因。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"为什么小孩网红越来越多？","zhReference":"因为现在只要有手机和社交媒体，普通家庭也可以很容易地发布内容，不再需要电视台或者经纪公司。只要视频获得足够关注，一个普通小孩也可能很快积累大量粉丝。","enQuestion":"Why are child influencers becoming more common?","enReference":"Because smartphones and social media make it easy for ordinary families to post content without needing a TV network or agency. If a video gets enough attention, an ordinary child can quickly build a large online audience.","idiomaticFull":"Why are kid influencers getting so common? Because smartphones and social media make it super easy for regular families to post content; you don’t need a TV network or an agency anymore. If a video gets enough buzz, even an ordinary kid can quickly end up with a huge online following.","idiomatic":[{"orig":"child influencers","better":"kid influencers","why":"kid 在日常口语里比 child 更自然、更随意。"},{"orig":"ordinary families","better":"regular families","why":"regular families 是美国人聊普通家庭时更常用的说法。"},{"orig":"without needing a TV network or agency","better":"you don’t need a TV network or an agency anymore","why":"直接说 you don’t need... 更符合日常聊天语气。"},{"orig":"build a large online audience","better":"end up with a huge online following","why":"end up with 和 huge following 都是很口语化的常见表达。"}],"media":null,"images":["media/6ad64a52000000001400c400-1.webp","media/6ad64a52000000001400c400-2.webp"]},{"kind":"image","noteId":"6ad58b9d0000000013001c00","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-19T03:16:45.000Z","durationSeconds":null,"likes":"18","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ad58b9d0000000013001c00?xsec_token=ABlmjuBhF2lVEgmq0OSBSCqJ6Za3JUgZ2cdEvNJnIwze8=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练的是职场话题里「年龄是否该影响就业机会」的观点表达，重点是用英文说明能力和经验比年龄更重要，并从公平和用人两方面给出理由。","tags":[],"keyPoints":["先用「I don't think it should」直接表态，再展开理由，是口语答题的常见结构。","用「should matter more」把能力、经验和年龄作对比，突出真正重要的标准。","从对员工不公平和公司错失人才两个角度补充论据，让回答更完整。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"年龄应该影响一个人的就业机会吗？","zhReference":"我觉得不应该，真正重要的应该是能力、经验和这个人是否适合岗位。只因为年龄超过某个数字就减少机会，不仅对员工不公平，也可能让公司错过真正有能力的人。","enQuestion":"Should age affect a person's job opportunities?","enReference":"I don't think it should. Skills, experience, and whether someone is suitable for the job should matter more. Reducing opportunities simply because a person is over a certain age is unfair and may also cause companies to miss strong candidates.","idiomaticFull":"Should age really play a part in whether someone gets a job? I don't think it should, honestly. Skills, experience, and whether someone's actually a good fit for the job should count for more. Writing people off just because they're over a certain age isn't fair, and it can end up making companies miss out on strong candidates.","idiomatic":[{"orig":"Should age affect a person's job opportunities?","better":"Should age really play a part in whether someone gets a job?","why":"“play a part”和“get a job”更像日常对话里的自然说法。"},{"orig":"Skills, experience, and whether someone is suitable for the job should matter more.","better":"Skills, experience, and whether someone's actually a good fit for the job should count for more.","why":"“be a good fit”和“count for more”比正式搭配更口语化。"},{"orig":"Reducing opportunities simply because a person is over a certain age is unfair and may also cause companies to miss strong candidates.","better":"Writing people off just because they're over a certain age isn't fair, and it can end up making companies miss out on strong candidates.","why":"“write someone off”和“miss out on”是母语者常用的自然表达，也弱化了书面感。"}],"media":null,"images":["media/6ad58b9d0000000013001c00-1.webp","media/6ad58b9d0000000013001c00-2.webp"]},{"kind":"image","noteId":"6ad58b7e0000000013033800","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-19T03:16:14.000Z","durationSeconds":null,"likes":"32","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ad58b7e0000000013033800?xsec_token=ABlmjuBhF2lVEgmq0OSBSCqMPdqhnpCcxy_vEciVttTu4=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练习如何用英文回答年龄与工作经验价值相关的职场与雅思口语问题。","tags":[],"keyPoints":["先明确态度：经验不会随着年龄增长而失去价值。","用“更快解决问题”和“减少不必要的错误”说明经验的实际作用。","指出部分公司过度关注工资成本，低估经验带来的长期价值。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"工作经验会随着年龄增长变得不重要吗？","zhReference":"我觉得不会，经验可以帮助员工更快解决问题，也能减少很多不必要的错误。问题是有些公司只看到更高的工资成本，却没有充分考虑经验能够带来的长期价值。","enQuestion":"Does work experience become less valuable with age?","enReference":"I don't think so. Experience can help employees solve problems faster and avoid unnecessary mistakes. The problem is that some companies focus mainly on higher salary costs and may not fully consider the long-term value that experience can bring.","idiomaticFull":"Does experience lose its value as you get older? I don't think so. Experience helps you solve problems faster and avoid mistakes you don't need to make. The thing is, some companies get so hung up on higher salary costs that they don't really think about what experience is worth down the road.","idiomatic":[{"orig":"Does work experience become less valuable with age?","better":"Does experience lose its value as you get older?","why":"用 lose its value 和 as you get older 更像日常聊天，也比 with age 更自然。"},{"orig":"Experience can help employees solve problems faster and avoid unnecessary mistakes.","better":"Experience helps you solve problems faster and avoid mistakes you don't need to make.","why":"helps you 和 mistakes you don't need to make 更直接，也更符合美国人说话的习惯。"},{"orig":"The problem is that some companies focus mainly on higher salary costs and may not fully consider the long-term value that experience can bring.","better":"The thing is, some companies get so hung up on higher salary costs that they don't really think about what experience is worth down the road.","why":"get hung up on、worth 和 down the road 都是很自然的口语说法，同时保留了原句的意思。"}],"media":null,"images":["media/6ad58b7e0000000013033800-1.webp","media/6ad58b7e0000000013033800-2.webp"]},{"kind":"image","noteId":"6ad58b50000000001901d800","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-19T03:15:28.000Z","durationSeconds":null,"likes":"30","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ad58b50000000001901d800?xsec_token=ABlmjuBhF2lVEgmq0OSBSCqLp-OAz4BK6-6H_UoQYDNuI=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练的是职场话题里解释“企业为什么更偏爱年轻员工”的说法，从成本和管理两个角度给出观点并做对比，适合雅思口语 Part 3 的原因分析题。","tags":[],"keyPoints":["开头先亮明核心原因：成本和用人管理方式。","用对比展开：年轻员工薪资低、可塑性强，资深员工预期更明确。","落到薪资、职位、工作环境三个具体维度，让回答有细节支撑。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"企业为什么更偏爱年轻员工？","zhReference":"我觉得一个重要原因是成本和管理方式。年轻员工通常薪资更低，也更容易按照公司的方式培养，而经验更丰富的员工往往对薪资、职位和工作环境有更明确的要求。","enQuestion":"Why do some companies prefer younger workers?","enReference":"I think an important reason is cost and management. Younger workers usually earn less and may be easier to train in the company's way, while experienced workers often have clearer expectations about salary, position, and working conditions.","idiomaticFull":"Why do some companies tend to go for younger workers? I'd say a big part of it comes down to cost and management. Younger workers usually make less and can be easier to train in how the company does things, while experienced workers tend to have a clearer idea of what they want when it comes to salary, title, and working conditions.","idiomatic":[{"orig":"prefer younger workers","better":"tend to go for younger workers","why":"go for 在这里表示“倾向选择”，比 prefer 更像日常聊天里的说法。"},{"orig":"I think an important reason is","better":"I'd say a big part of it comes down to","why":"这个表达更口语化，也能自然地引出主要原因。"},{"orig":"earn less","better":"make less","why":"在美式口语里谈工资时，make less 比 earn less 更常见、更随意。"},{"orig":"have clearer expectations about salary, position, and working conditions","better":"have a clearer idea of what they want when it comes to salary, title, and working conditions","why":"这个说法更像真人自然表达，title 也比 position 更贴近职场口语。"}],"media":null,"images":["media/6ad58b50000000001901d800-1.webp","media/6ad58b50000000001901d800-2.webp"]},{"kind":"image","noteId":"6ad58b380000000013033400","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-19T03:15:04.000Z","durationSeconds":null,"likes":"16","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ad58b380000000013033400?xsec_token=ABlmjuBhF2lVEgmq0OSBSCqA8_JgDxSpopAojH6kozPMo=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练习用英语讨论职场“35岁危机”，解释部分企业为何更青睐年轻员工，以及年长员工被视为用人成本的原因。","tags":[],"keyPoints":["用 push out 表达“变相让员工离开”或“优化人员”。","用 see A as B 结构对比年轻员工与35岁以上员工的用人成本。","用 long hours、heavy workloads 和 family responsibilities 描述加班强度与家庭负担。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"为什么有些公司会“优化”35岁以上的员工？","zhReference":"因为一些公司觉得年轻员工工资更低，也更能接受加班和高强度工作。相比之下，35岁以上的员工通常薪资更高、家庭责任更多，所以有些企业会把它们看成更高的用人成本。","enQuestion":"Why do some companies push out employees over 35?","enReference":"Because some companies see younger workers as cheaper and more willing to accept long hours and heavy workloads. Employees over 35 usually earn more and have more family responsibilities, so some employers may see them as more expensive to keep.","idiomaticFull":"Why do some companies push out employees who are over 35? Because some companies see younger workers as cheaper and more willing to put in long hours and take on heavy workloads. Employees over 35 usually make more money and have more family responsibilities, so some employers may see them as more expensive to keep around.","idiomatic":[{"orig":"push out employees over 35","better":"push out employees who are over 35","why":"补上 who are 后更像自然口语，表达也更清楚。"},{"orig":"are more willing to accept long hours","better":"are more willing to put in long hours","why":"put in long hours 是日常英语中很常见的说法。"},{"orig":"earn more","better":"make more money","why":"make more money 在美式口语里比 earn more 更常用。"},{"orig":"more expensive to keep","better":"more expensive to keep around","why":"keep around 用在员工或人身上更自然、更像口语。"}],"media":null,"images":["media/6ad58b380000000013033400-1.webp","media/6ad58b380000000013033400-2.webp"]},{"kind":"video","noteId":"6ad58759000000002600b6ff","creator":"开心学英语","title":"英语口语：新人上班的各种遭遇！","publishedAt":"2026-10-19T02:58:33.000Z","durationSeconds":167,"likes":"49","noteUrl":"https://www.xiaohongshu.com/user/profile/69cf8d170000000032036d59/6ad58759000000002600b6ff?xsec_token=ABlmjuBhF2lVEgmq0OSBSCqEqQjbWVKpTdnpNFW_h2yO8=&xsec_source=pc_user","ipLocation":"浙江","summary":"这条视频还原新人入职后填表、使用打印机、查看群消息和写项目计划的职场遭遇。对话涵盖催问进度、主动求助、确认消息，以及下班后回复消息和无偿加班的边界沟通。","tags":["职场英语","口语表达","新人入职","工作边界"],"keyPoints":["新人求助时常遭遇冷处理，需要学会主动确认信息并推进工作。","视频包含催问进度、快速审阅、指导流程和沟通工作方向的实用表达。","后半段涉及下班后待命、无偿加班和个人时间边界的争论。"],"patterns":[{"en":"What's taking you so long?","zh":"怎么这么久还没弄好","usage":"用于催问对方为什么一件事做这么久。","example":"What's taking you so long to print one file?","start":17.18},{"en":"catch my message","zh":"看到我发的消息了吗","usage":"用于确认对方是否看到或收到消息。","example":"Did you catch my message in the group yesterday?","start":29.09},{"en":"speak up","zh":"主动说出来；大胆发声","usage":"适合提醒对方有情况要主动提出或说明。","example":"Then why didn't you speak up?","start":36.29},{"en":"how to go about it","zh":"怎样着手处理","usage":"用于表示不知道该如何开始或推进一件事。","example":"The manager asked me to write a project plan, but I'm not sure how to go about it.","start":50.66},{"en":"give it a once over","zh":"快速过一遍；粗略检查","usage":"适合请别人快速审阅文件或内容。","example":"Send me what you've got, and I'll give it a once over.","start":56.5},{"en":"point you in the right direction","zh":"帮你指明方向","usage":"适合在对方先尝试后给出方向性建议。","example":"Then I can point you in the right direction.","start":67.94},{"en":"walk you through it","zh":"带你一步步了解","usage":"适合请人逐步讲解流程或操作方法。","example":"Maybe give it a shot on your own before you ask someone to walk you through it.","start":73.78},{"en":"past quitting time","zh":"已过下班时间","usage":"用于说明事情已经拖到下班之后。","example":"But it's already past quitting time and I actually have plans tonight.","start":146.9}],"quotes":[{"text":"Work comes first, no matter the hour.","start":102.29,"matched":true},{"text":"I won't bother you after hours unless it's urgent.","start":107.29,"matched":true},{"text":"I'm not going to sacrifice my personal time to work for free.","start":157.5,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.08,"x":"Excuse me, I'm new here. Could you show me how to fill out this form?"},{"t":2.96,"x":"I'm busy. Just look it up online yourself."},{"t":5.52,"x":"Alright, thanks."},{"t":7.28,"x":"Excuse me, could you show me how to use this printer?"},{"t":10.32,"x":"Figure it out yourself. That's how all new interns learn."},{"t":13.36,"x":"Okay, fine. Thank you."},{"t":17.18,"x":"What's taking you so long to print one file?"},{"t":19.74,"x":"Sorry, it's my first time using the office printer. Still trying to work it out."},{"t":22.94,"x":"If you're stuck, just ask your cohorts. Stay on top of your work."},{"t":26.78,"x":"Okay, got it."},{"t":29.09,"x":"Did you catch my message in the group yesterday?"},{"t":31.81,"x":"What group? I didn't see anything."},{"t":33.97,"x":"The team group?"},{"t":35.17,"x":"I'm not in that group."},{"t":36.29,"x":"Then why didn't you speak up?"},{"t":37.89,"x":"How could I? I didn't know it was a thing."},{"t":40.45,"x":"You need to be more proactive."},{"t":42.29,"x":"Don't wait for me to tell you every little thing."},{"t":45.46,"x":"All right, get back to work."},{"t":47.78,"x":"Excuse me, do you have a minute?"},{"t":49.86,"x":"What's going on?"},{"t":50.66,"x":"The manager asked me to write a project plan,"},{"t":52.98,"x":"but I'm not sure how to go about it."},{"t":54.58,"x":"Could I ask for your advice?"},{"t":56.1,"x":"Sure."},{"t":56.5,"x":"Send me what you've got,"},{"t":57.7,"x":"and I'll give it a once over."},{"t":59.86,"x":"I haven't actually written anything yet."},{"t":61.86,"x":"Well, it's not like I can write it for you, right?"},{"t":64.26,"x":"There's a template in the group chat."},{"t":65.94,"x":"You need to put together a rough draft first."},{"t":67.94,"x":"Then I can point you in the right direction."},{"t":70.58,"x":"That makes sense."},{"t":71.94,"x":"Work is different from school."},{"t":73.78,"x":"Maybe give it a shot on your own"},{"t":75.3,"x":"before you ask someone to walk you through it."},{"t":77.86,"x":"Got it. I'll draft it myself first."},{"t":81.81,"x":"I messaged you last night."},{"t":82.85,"x":"Why didn't you reply in time?"},{"t":84.13,"x":"Sorry, I'd already fallen asleep by then."},{"t":86.29,"x":"I told you to reply to messages promptly."},{"t":88.85,"x":"But you texted me at midnight."},{"t":90.53,"x":"Then why didn't you pick up my calls?"},{"t":92.13,"x":"My phone was on silent."},{"t":93.63,"x":"From now on, keep it off silent and reply immediately."},{"t":96.63,"x":"But work hours are nine to six."},{"t":99.89,"x":"Outside that, I have the right to put it on silent."},{"t":102.29,"x":"Work comes first, no matter the hour."},{"t":104.09,"x":"I get that work matters, but so does my rest."},{"t":107.29,"x":"I won't bother you after hours unless it's urgent."},{"t":109.89,"x":"But if it is, you need to pick up."},{"t":114.89,"x":"Keep the door open during work hours."},{"t":116.59,"x":"Okay."},{"t":117.89,"x":"The air conditioner is on."},{"t":118.99,"x":"Keep the door closed."},{"t":120.09,"x":"Don't waste electricity."},{"t":122.85,"x":"So my words don't count anymore, huh?"},{"t":124.75,"x":"Hold you! Door stay open!"},{"t":127.72,"x":"Would you mind stepping over here? I have something to discuss with you."},{"t":130.52,"x":"Would you two please discuss this? Should we leave the door open or keep it closed?"},{"t":135.32,"x":"It doesn't matter. It's open or closed, right?"},{"t":138.04,"x":"Revise this file and send it to me tonight."},{"t":142.5,"x":"Why didn't you tell me during work hours?"},{"t":144.7,"x":"I had my own work to handle during the day."},{"t":146.9,"x":"But it's already past quitting time and I actually have plans tonight. Can I just do it tomorrow?"},{"t":151.1,"x":"No, it has to be finished tonight."},{"t":152.5,"x":"So, is there overtime pay for this?"},{"t":154.5,"x":"You're on salary and you're asking for overtime? Seriously?"},{"t":157.5,"x":"Then I'm sorry. I'm not going to sacrifice my personal time to work for free."},{"t":161.2,"x":"Are you refusing to follow work assignments?"},{"t":163.2,"x":"This work has to be done tonight. No exceptions."}],"media":"media/6ad58759000000002600b6ff.mp4","images":[]},{"kind":"video","noteId":"6ad56864000000001e027bed","creator":"福禄咪学英语","title":"慢速英语vlog｜洗漱护肤篇","publishedAt":"2026-10-19T00:46:28.000Z","durationSeconds":31.1,"likes":"58","noteUrl":"https://www.xiaohongshu.com/user/profile/683532dc000000001d017868/6ad56864000000001e027bed?xsec_token=ABlmjuBhF2lVEgmq0OSBSCqJl8LdkrU3U27g29euhOpLI=&xsec_source=pc_user","ipLocation":"黑龙江","summary":"视频用慢速英语展示晨间护肤流程，依次介绍洁面、爽肤水、精华、眼霜、面霜、防晒和粉底。可以学到常见护肤品名称，以及描述产品功效和生活状态的实用表达。","tags":["护肤日常","晨间口语","护肤品英语"],"keyPoints":["视频按洁面、爽肤水、精华、眼霜、面霜、防晒和粉底的顺序介绍晨间护肤流程。","介绍产品时反复使用“It helps + 动词”说明功效，如锁水、防护和均匀肤色。","可重点积累“target skin concerns”“lock in moisture”等护肤品功效搭配。"],"patterns":[{"en":"skincare routine","zh":"护肤流程","usage":"谈论每日护肤步骤时使用","example":"This is my skincare routine.","start":0},{"en":"prep my skin","zh":"为皮肤打底","usage":"介绍护肤或底妆前的皮肤准备时使用","example":"It helps prep my skin.","start":0},{"en":"target skin concerns","zh":"针对肌肤问题","usage":"说明精华等产品所针对的皮肤问题时使用","example":"It helps target skin concerns.","start":11.57},{"en":"hydrate the eye area","zh":"滋润眼周","usage":"介绍眼霜的保湿作用时使用","example":"It helps hydrate the eye area.","start":11.57},{"en":"lock in moisture","zh":"锁住水分","usage":"说明面霜的保湿封闭作用时使用","example":"It helps lock in moisture.","start":19.01},{"en":"even out my skin tone","zh":"均匀肤色","usage":"描述粉底修饰肤色的作用时使用","example":"It helps even out my skin tone.","start":26.05},{"en":"I'm ready for the day.","zh":"准备好迎接新一天","usage":"完成晨间准备后表达状态良好时使用","example":"I'm ready for the day.","start":26.05}],"quotes":[{"text":"This is my skincare routine.","start":0,"matched":true},{"text":"It helps target skin concerns.","start":11.57,"matched":true},{"text":"It helps lock in moisture.","start":19.01,"matched":true},{"text":"I'm ready for the day.","start":26.05,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"This is my skincare routine. Cleanser. I use it to wash my face. Toner. It helps prep my skin."},{"t":11.57,"x":"Serum. It helps target skin concerns. Eye cream. It helps hydrate the eye area."},{"t":19.01,"x":"Face cream. It helps lock in moisture. Sunscreen. It helps protect my skin."},{"t":26.05,"x":"Foundation. It helps even out my skin tone. I'm ready for the day."}],"media":"media/6ad56864000000001e027bed.mp4","images":[]},{"kind":"image","noteId":"6ad41f930000000013033400","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-18T01:23:31.000Z","durationSeconds":null,"likes":"25","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ad41f930000000013033400?xsec_token=ABfUahSrn8Pzz8Bf6CaMEgNonqtsQLA2AVLzOD5RefH74=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练的是在雅思口语中比较胖瘦带来的健康风险、表达个人判断并补充说明的说法。适合用来回答需要权衡两种情况的观点题。","tags":[],"keyPoints":["先用 I don't think... 表明自己不完全认同，再提出真正的判断标准。","用 it depends on... 说明结论要视严重程度和具体健康问题而定。","用 while... 对比体重过高与过度消瘦这两类健康风险。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"不健康的胖和不健康的瘦，哪个更危险？","zhReference":"我觉得不能只看胖还是瘦，因为两种情况都可能伤害身体，关键要看严重程度和具体健康问题。体重太高可能增加慢性病风险，而过度消瘦和饮食失调也可能造成非常严重的身体后果。","enQuestion":"Which is more dangerous, being unhealthily overweight or unhealthily thin?","enReference":"I don't think we can judge only by body size because both can harm health; it depends on the severity and the specific health problems involved. Excess weight can raise some long-term health risks, while extreme thinness and eating disorders can also cause serious physical damage.","idiomaticFull":"Which is more dangerous: being seriously overweight or seriously underweight? Honestly, I don't think you can go by body size alone, because either one can take a toll on your health. It really depends on how severe it is and what health problems are involved. Being overweight can raise your risk of certain long-term health problems, while being really underweight or having an eating disorder can do serious physical damage too.","idiomatic":[{"orig":"judge only by body size","better":"go by body size alone","why":"go by 是日常口语中表示“根据……来判断”的自然说法。"},{"orig":"both can harm health","better":"either one can take a toll on your health","why":"take a toll on 更贴近母语者聊健康影响时的口语表达。"},{"orig":"Excess weight can raise some long-term health risks","better":"Being overweight can raise your risk of certain long-term health problems","why":"用 Being overweight 指人更自然，raise your risk 也是常见搭配。"},{"orig":"extreme thinness and eating disorders","better":"being really underweight or having an eating disorder","why":"really underweight 比 extreme thinness 更像日常对话中的说法。"}],"media":null,"images":["media/6ad41f930000000013033400-1.webp","media/6ad41f930000000013033400-2.webp"]},{"kind":"image","noteId":"6ad41f85000000001901e400","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-18T01:23:17.000Z","durationSeconds":null,"likes":"25","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ad41f85000000001901e400?xsec_token=ABfUahSrn8Pzz8Bf6CaMEgNiJgA77GS84jZ6lhslUn8hU=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练习用英文解释“极端瘦”为何成为流行审美，涉及媒体影响、审美标准和健康体型的讨论，适合雅思口语Part 3的因果分析题。","tags":[],"keyPoints":["先直接回答原因，用“a big reason is that”引出核心观点，避免绕圈子。","用明星、广告、社交媒体三类主体说明“瘦”如何被等同于漂亮和自律。","结尾落到影响上，指出反复接触会让人把不健康的体型误当理想标准。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"为什么“极端瘦”会成为一种流行审美？","zhReference":"我觉得很大一部分原因是明星、广告和社交媒体长期把很瘦的身材和“漂亮”“自律”联系在一起。看得多了以后，人们就可能把原本并不健康的体型，也当成理想标准。","enQuestion":"Why has extreme thinness become a popular beauty standard?","enReference":"I think a big reason is that celebrities, advertising, and social media often connect very thin bodies with beauty and self-discipline. After seeing this again and again, people may start to treat an unhealthy body size as an ideal.","idiomaticFull":"Why do you think being super skinny has become such a popular beauty standard? I think a big part of it is that celebrities, ads, and social media often link being super skinny to beauty and self-discipline. Once people see that over and over, they can end up treating an unhealthy body size as the ideal.","idiomatic":[{"orig":"a big reason is","better":"a big part of it is","why":"这是日常聊天中解释主要原因时更自然的说法。"},{"orig":"connect very thin bodies with","better":"link being super skinny to","why":"link 搭配 to 更简洁，super skinny 也更符合口语表达。"},{"orig":"After seeing this again and again, people may start to","better":"Once people see that over and over, they can end up","why":"over and over 和 end up 很有生活气息，也自然表达反复接触后逐渐形成看法。"}],"media":null,"images":["media/6ad41f85000000001901e400-1.webp","media/6ad41f85000000001901e400-2.webp"]},{"kind":"image","noteId":"6ad41f6f0000000013001c00","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-18T01:22:55.000Z","durationSeconds":null,"likes":"15","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ad41f6f0000000013001c00?xsec_token=ABfUahSrn8Pzz8Bf6CaMEgNoKA8k1IEjQvzAS9HyOP9rA=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期练的是用英文回答「为什么饮食失调越来越常见」，属于雅思口语 Part 3 的社会现象分析题。重点是把原因分成「一方面…另一方面…」两层，并在结尾给出「问题确实变多，同时被识别出来的也更多」的平衡结论。","tags":[],"keyPoints":["先说外部原因：外貌焦虑加重、社交媒体上的比较变多，是这类问题上升的直接推手。","再说认知层面的变化：大家对饮食失调了解更多，也更愿意识别和公开讨论，所以曝光度自然提高。","结尾用「问题在变大 + 案例被看见得更多」的双重解释收束，避免把原因说成单一结论。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"为什么饮食失调越来越常见？","zhReference":"我觉得一方面是外貌压力和社交媒体比较变多了，另一方面也是因为大家现在更了解饮食失调，更愿意识别和讨论这些问题。所以可能既有问题增加，也有更多人被发现。","enQuestion":"Why are eating disorders becoming more common?","enReference":"I think appearance pressure and social media comparison have increased, but people also understand eating disorders better now and are more willing to talk about them. So the problem may be growing, while more cases are also being recognized.","idiomaticFull":"Why are eating disorders becoming more common? I think there’s more pressure around how we look and more comparing ourselves on social media, but people have a better understanding of eating disorders now and feel more comfortable talking about them. So the problem may be getting worse, while more cases are also being recognized.","idiomatic":[{"orig":"appearance pressure and social media comparison have increased","better":"there’s more pressure around how we look and more comparing ourselves on social media","why":"这里用 there’s more... 描述整体趋势，更像日常聊天的自然说法。"},{"orig":"people also understand eating disorders better now","better":"people have a better understanding of eating disorders now","why":"have a better understanding of 比 understand...better 更完整自然。"},{"orig":"are more willing to talk about them","better":"feel more comfortable talking about them","why":"feel comfortable talking about 更贴近日常口语，也更容易传达愿意开口的意思。"},{"orig":"the problem may be growing","better":"the problem may be getting worse","why":"谈问题加重时，get worse 比 grow 更地道。"}],"media":null,"images":["media/6ad41f6f0000000013001c00-1.webp","media/6ad41f6f0000000013001c00-2.webp"]},{"kind":"image","noteId":"6ad41f57000000001901d800","creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","publishedAt":"2026-10-18T01:22:31.000Z","durationSeconds":null,"likes":"23","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ad41f57000000001901d800?xsec_token=ABfUahSrn8Pzz8Bf6CaMEgNlio0JCYnrmAO1GKGniYOew=&xsec_source=pc_user","ipLocation":"加拿大","summary":"这期围绕进食障碍（ED）的定义和常见表现，练习用英文做简短的健康概念解释，适合雅思口语或日常科普表达。","tags":[],"keyPoints":["先说明 ED 的全称和定义，再展开常见表现。","列举表现时可用 include 引出多个例子。","重点掌握 dieting、binge eating、purging 等相关词汇。"],"partial":false,"partialReason":null,"transcript":[],"zhQuestion":"什么是 ED？一般会有哪些表现？","zhReference":"ED 是 eating disorder 的缩写，指一类和进食、体重或身体形象有关的问题。常见表现包括过度节食、暴食、催吐、非常害怕长胖，或者对食物和体重产生持续的焦虑。","enQuestion":"What is an ED, and what are the common signs?","enReference":"ED stands for eating disorder, a group of problems related to eating, weight, or body image. Common signs can include extreme dieting, binge eating, purging, a strong fear of gaining weight, or constant anxiety about food and body weight.","idiomaticFull":"“What’s an ED, and what are some common signs?” “ED stands for eating disorder—it’s a group of issues that have to do with eating, weight, or body image. Common signs include extreme dieting, binge eating, purging, a strong fear of putting on weight, or being constantly anxious about food and body weight.”","idiomatic":[{"orig":"What is an ED, and what are the common signs?","better":"What’s an ED, and what are some common signs?","why":"用缩写和 some 更符合日常聊天里的自然问法。"},{"orig":"a group of problems related to eating, weight, or body image","better":"a group of issues that have to do with eating, weight, or body image","why":"have to do with 是美国人谈论相关话题时很常用的口语结构。"},{"orig":"constant anxiety about food and body weight","better":"being constantly anxious about food and body weight","why":"用形容词 anxious 描述持续状态，比名词词组更像日常口语。"}],"media":null,"images":["media/6ad41f57000000001901d800-1.webp","media/6ad41f57000000001901d800-2.webp"]},{"kind":"video","noteId":"6ad419830000000025037d21","creator":"福禄咪学英语","title":"新概念英语美剧风剧情演绎丨第一册121课","publishedAt":"2026-10-18T00:57:39.000Z","durationSeconds":37.2,"likes":"33","noteUrl":"https://www.xiaohongshu.com/user/profile/683532dc000000001d017868/6ad419830000000025037d21?xsec_token=ABfUahSrn8Pzz8Bf6CaMEgNu9FdPlXMW8XFAvGLTeoWAc=&xsec_source=pc_user","ipLocation":"黑龙江","summary":"这条视频用美剧风格的剧情演绎，讲的是新概念英语第一册第121课的场景：顾客买完书却忘了带走，店员只能靠「戴帽子的男人」这一线索帮他确认身份。核心可以学到 who、which、that 引导的定语从句，用它们来限定「哪个人、哪些东西」。","tags":["定语从句","新概念英语","情景口语","英语听力"],"keyPoints":["who 引导的定语从句用来修饰人，which 引导的定语从句用来修饰物，而 that 既可以指人也可以指物。","当定语从句修饰的是宾语时，口语里的 who 或 that 常常可以省略。","说明当时身上穿着什么，要用过去进行时 was wearing；put on 则表示「戴上去」这个动作。","forget to do sth 表示忘了做某事，搭配 take sth with sb，说明离开时没有把东西随身带走。"],"patterns":[{"en":"the lady who is standing behind the counter","zh":"站在柜台后面的那位女士","usage":"用 who 引导从句把人限定清楚，说明是哪一位。","example":"The lady who is standing behind the counter","start":6.51},{"en":"the books which are on the counter","zh":"柜台上的那些书","usage":"用 which 引导从句限定物品，说明具体是哪一些。","example":"The books which are on the counter","start":11.61},{"en":"the man that you served","zh":"你接待过的那位男士","usage":"用 that 引导定语从句，在从句里作宾语，口语中很常见。","example":"is this the man that you served Caroline?","start":26.58},{"en":"was wearing a hat","zh":"当时戴着帽子","usage":"用过去进行时描述某人当时的外表或穿着。","example":"The man who I served was wearing a hat","start":20.21},{"en":"half an hour ago","zh":"半小时前","usage":"表示某事发生在多久以前，用于一般过去时。","example":"I bought two expensive dictionaries here half an hour ago","start":0.43},{"en":"forget to take sth with sb","zh":"忘了把某物随身带上","usage":"说明离开某处后才发现东西没带走。","example":"I forgot to take them with me","start":0.43},{"en":"put it on","zh":"把它戴上","usage":"代词作宾语时，要放在动词和 on、off 这类副词中间。","example":"would you put it on please","start":26.58}],"quotes":[{"text":"I bought two expensive dictionaries here half an hour ago, but I forgot to take them with me","start":0.43,"matched":true},{"text":"He says he's the man who bought these books.","start":13.96,"matched":true},{"text":"The man who I served was wearing a hat","start":20.21,"matched":true},{"text":"Have you got a hat sir?","start":23.04,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.43,"x":"I bought two expensive dictionaries here half an hour ago, but I forgot to take them with me who served you sir"},{"t":6.51,"x":"The lady who is standing behind the counter"},{"t":9.89,"x":"Which books did you buy?"},{"t":11.61,"x":"The books which are on the counter"},{"t":13.96,"x":"Did you serve this gentleman half an hour ago Caroline? He says he's the man who bought these books. I can't remember"},{"t":20.21,"x":"The man who I served was wearing a hat"},{"t":23.04,"x":"Have you got a hat sir?"},{"t":26.58,"x":"Yes, I have would you put it on please all right is this the man that you served Caroline?"},{"t":33.92,"x":"Recognize him now!"}],"media":"media/6ad419830000000025037d21.mp4","images":[]},{"kind":"video","noteId":"6ad2f49c000000001b01e06d","creator":"开心学英语","title":"英语口语：新人上班的各种遭遇！","publishedAt":"2026-10-17T09:24:02.000Z","durationSeconds":171.4,"likes":"23","noteUrl":"https://www.xiaohongshu.com/user/profile/69cf8d170000000032036d59/6ad2f49c000000001b01e06d?xsec_token=ABYMEKjNvGa9YJfVNGGwPMut_kzAwyKjo2hnEESniARag=&xsec_source=pc_user","ipLocation":"浙江","summary":"视频围绕新人入职后的职场沟通展开，涵盖项目进度汇报、临时请假、前台电话转接和向上级确认安排等场景。可以学到一批自然的办公室口语，尤其是礼貌请求、进度跟进、承担责任和团队协作的表达。","tags":["职场英语","办公室口语","新人沟通","英语听力"],"keyPoints":["新人要主动汇报项目进度，让上级清楚自己对工作的掌握情况。","请假或提出个人安排时，可以用委婉问句，同时要了解公司的考勤规则。","前台转接电话时，应先确认来电事由，再询问上级是否接听。","涉及客户安排等事项时，应先向上级确认，避免让团队陷入被动。"],"patterns":[{"en":"be up to","zh":"最近在忙什么","usage":"询问或谈论某人最近的动向时。","example":"What's the new intern been up to lately?","start":0.14},{"en":"give daily progress updates","zh":"每天汇报进度","usage":"向管理者说明任务推进情况时。","example":"You should give daily progress updates","start":20.01},{"en":"be on top of one's work","zh":"对工作进度了如指掌","usage":"表示自己清楚并掌控着工作进展时。","example":"That way the manager knows you're on top of your work","start":25.49},{"en":"Would it be okay if I ...?","zh":"我可以……吗？","usage":"礼貌地请假或提出个人请求时。","example":"Would it be okay if I left early today?","start":33.12},{"en":"be on the clock","zh":"处于上班时间","usage":"说明还在工作时间内、不能随意离开时。","example":"Everyone's still on the clock, and if you leave early, you'll lose your attendance bonus.","start":40.12},{"en":"run sth by sb first","zh":"先征求某人意见","usage":"做决定或推进事项前先请上级确认时。","example":"Anything like this, you've got to run it by me first.","start":93.06},{"en":"put sb in a tough spot","zh":"让某人陷入困境","usage":"说明某个安排会给团队或他人带来麻烦时。","example":"If we don't have enough time to prepare, that puts us in a tough spot.","start":86.06},{"en":"take the lead on sth","zh":"牵头负责某事","usage":"询问或说明谁负责主导某项工作时。","example":"Who's going to take the lead on this event proposal?","start":120.87}],"quotes":[{"text":"You haven't checked in on the proposal yet.","start":9.82,"matched":true},{"text":"I'm sorry, that was on me. It won't happen again.","start":96.06,"matched":true},{"text":"Thanks for holding. He's available. I'll put you through now.","start":66.08,"matched":true},{"text":"I worked late yesterday to get it done.","start":157.22,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.14,"x":"What's the new intern been up to lately? She's been focused on the project proposal lately. I see"},{"t":6.62,"x":"She hasn't checked in so I have no idea what she's up to"},{"t":9.82,"x":"You haven't checked in on the proposal yet. The manager just asked about you"},{"t":13.89,"x":"I want to get it all done before I check in you can't just keep your head down or people might think you're slacking off"},{"t":20.01,"x":"But what am I supposed to say if I haven't finished it yet? You should give daily progress updates"},{"t":25.49,"x":"That way the manager knows you're on top of your work"},{"t":27.93,"x":"Got it, thanks. I'll keep him posted."},{"t":31.12,"x":"Miss Lee, what's going on?"},{"t":33.12,"x":"Would it be okay if I left early today?"},{"t":35.12,"x":"My parents are in Guangzhou today. They don't know how to get a cab,"},{"t":38.12,"x":"so I have to go to the train station to pick them up."},{"t":40.12,"x":"Everyone's still on the clock, and if you leave early, you'll lose your attendance bonus."},{"t":44.12,"x":"It's your call."},{"t":46.5,"x":"Fu Min Company, this is Lisa speaking. How can I help you?"},{"t":48.5,"x":"Hi, this is Mike from Tech Supply. Can I speak to Mr. Lee?"},{"t":51.5,"x":"Sure. Can I let him know what this is about?"},{"t":53.5,"x":"It's about the delivery date."},{"t":54.5,"x":"Got it. Hold on a second."},{"t":56.5,"x":"Come in."},{"t":57.82,"x":"Mr. Lee, Mike from Tech Supply is on the line. He's calling about the delivery date. Would you like to take it?"},{"t":64.08,"x":"Yeah, sure. Put him through."},{"t":65.08,"x":"Okay, I'll put him on."},{"t":66.08,"x":"Hello, Mike. Thanks for holding. He's available. I'll put you through now."},{"t":71.21,"x":"Miss Lee, I set up a client tour for tomorrow at 11."},{"t":78.06,"x":"Wait, you already confirmed that with client?"},{"t":80.06,"x":"Yeah."},{"t":81.06,"x":"Why didn't you check with me first for going ahead?"},{"t":83.06,"x":"I forgot."},{"t":84.06,"x":"What if I already have something at 11?"},{"t":86.06,"x":"If we don't have enough time to prepare, that puts us in a tough spot."},{"t":90.06,"x":"You're still an intern. You don't know the full process yet."},{"t":93.06,"x":"Anything like this, you've got to run it by me first."},{"t":96.06,"x":"I'm sorry, that was on me. It won't happen again."},{"t":99.06,"x":"All right, just get the prepare work going as soon as you can."},{"t":102.06,"x":"And shoot me the client information."},{"t":104.06,"x":"Got it. I'll send it right over."},{"t":106.06,"x":"I just sent you a file. Can you print two copies, black and white, double-sided?"},{"t":111.78,"x":"Okay, but we don't have a color printer."},{"t":113.78,"x":"Black and white is fine."},{"t":114.78,"x":"How many copies would you like?"},{"t":116.78,"x":"Two copies."},{"t":119.87,"x":"Single-sided?"},{"t":120.87,"x":"Who's going to take the lead on this event proposal?"},{"t":126.62,"x":"I'll take care of this and send it to you tomorrow."},{"t":130.26,"x":"Lisa, I'm swamped with client meetings."},{"t":132.26,"x":"I need you to get the event proposal done today."},{"t":134.26,"x":"Ugh, fine."},{"t":136.26,"x":"Who put this event proposal together?"},{"t":138.58,"x":"I'm sorry, Mr. Wang."},{"t":140.71,"x":"I planned to handle this myself, but I was swamped with work,"},{"t":143.71,"x":"so I passed the task off to Lisa."},{"t":145.71,"x":"So Lisa did the whole thing?"},{"t":147.71,"x":"Yes, she did it all on her own."},{"t":149.71,"x":"Lisa, come to my office."},{"t":151.71,"x":"Don't be nervous. Have a seat."},{"t":153.71,"x":"Did you put together this event proposal?"},{"t":157.22,"x":"Yes, I worked late yesterday to get it done."},{"t":159.22,"x":"Good work. The proposal is excellent."},{"t":162.22,"x":"This is your bonus from the company. You do a good job."},{"t":165.45,"x":"Thank you."},{"t":167.06,"x":"Keep it up. People who do solid work will never be overlooked."}],"media":"media/6ad2f49c000000001b01e06d.mp4","images":[]},{"kind":"video","noteId":"6ad2c942000000001b02d029","creator":"福禄咪学英语","title":"北美塑料姐妹花街头偶遇｜美式英语","publishedAt":"2026-10-17T01:02:58.000Z","durationSeconds":50.7,"likes":"81","noteUrl":"https://www.xiaohongshu.com/user/profile/683532dc000000001d017868/6ad2c942000000001b02d029?xsec_token=ABYMEKjNvGa9YJfVNGGwPMul-fZwearntMljX3Ju7YJzU=&xsec_source=pc_user","ipLocation":"黑龙江","summary":"视频模拟两位“塑料姐妹”在街头偶遇：人前热情寒暄、互相吹捧，人后立刻翻脸吐槽。能学到偶遇感叹、夸赞穿搭、客套告别，以及背后毒舌的地道美式表达。","tags":["美式口语","街头偶遇","社交寒暄","穿搭吐槽"],"keyPoints":["偶遇熟人时可以用 What are the odds? 感叹“真巧”。","夸衣服时可以说 That dress is so you，强调风格很适合对方。","寒暄结束可用 Let's catch up another day 约对方改天再聊。","人后吐槽时用 pull it off 暗讽对方驾驭不了某件衣服。"],"patterns":[{"en":"What are the odds?","zh":"真巧啊；概率多大","usage":"偶遇熟人、感叹事情太巧时用。","example":"What are the odds?","start":0.14},{"en":"That dress is so you.","zh":"这条裙子很符合你的风格","usage":"夸别人的衣服特别衬其个人气质时用。","example":"That dress is so you","start":7.18},{"en":"run into sb","zh":"偶然遇到某人","usage"
