st"},{"t":71.17,"x":"and then follow this account to learn more."}],"media":"media/6ac44d7d000000001b02c0d1.mp4","images":[]},{"kind":"video","noteId":"6ac44d60000000001a029e90","creator":"William","title":"这些日常用语，你会用英语说吗？","publishedAt":"2026-10-08T03:53:00.000Z","durationSeconds":50.4,"likes":"58","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44d60000000001a029e90?xsec_token=ABJJEVXqZom342wHuvi159oecZ0AgVQuy0kHnvFZHs7bs=&xsec_source=pc_user","ipLocation":"安徽","summary":"这条视频用一连串生活场景对话，教人描述物品“出状况”时该怎么说英语：碗磕了口、椅子晃、金属凹了，还有“这里的东西都旧了”。跟着看能学会 chipped、wobbly、dented 这类高频形容词，以及 seen better days 这种地道说法。","tags":["日常英语","英语口语","地道表达","状态形容词"],"keyPoints":["视频用一个接一个的实物场景（缺口的碗、摇晃的椅子、凹陷的金属），把描述物品破损状态的形容词串起来教。","chipped、wobbly、dented 都用来形容东西“有毛病”，但分别对应缺口、晃动、凹陷三种不同情况。","除了单词，还教了两个地道说法：seen better days 和 used to be in much better condition，用来形容东西旧了、不如从前。","每出现一个新词，对话里都会紧跟一句解释或追问，方便理解词的准确含义。"],"patterns":[{"en":"chipped","zh":"有缺口的、磕破的","usage":"形容碗盘、杯子等边缘掉了一小块时用。","example":"Oh, it's chipped.","start":4.98},{"en":"wobbly","zh":"摇晃的、不稳的","usage":"形容桌椅等因为不稳而会晃动的物体时用。","example":"It's wobbly.","start":14.18},{"en":"dented","zh":"有凹陷的、被撞瘪的","usage":"形容金属等硬物表面被撞出坑时用。","example":"Oh, it's dented.","start":24.66},{"en":"a small piece broke off","zh":"掉了一小块","usage":"解释某处缺口是怎么形成的时候用。","example":"You mean a small piece broke off?","start":6.98},{"en":"seen better days","zh":"不如从前了、有点旧了","usage":"委婉地说东西虽然还能用，但状态已经很旧很差时用。","example":"everything around here has seen better days","start":29.14}],"quotes":[{"text":"Wait, why is there a piece missing from this bowl?","start":0,"matched":true},{"text":"Oh, it's chipped.","start":4.98,"matched":true},{"text":"So it moves because it's not stable?","start":16.18,"matched":true},{"text":"everything around here has seen better days","start":29.14,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Wait, why is there a piece missing from this bowl?"},{"t":4.98,"x":"Oh, it's chipped."},{"t":6.18,"x":"Chipped?"},{"t":6.98,"x":"You mean a small piece broke off?"},{"t":9.14,"x":"Yeah, exactly."},{"t":10.26,"x":"Great."},{"t":11.7,"x":"Whoa, what's wrong with this chair?"},{"t":14.18,"x":"It's wobbly."},{"t":15.22,"x":"Wobbly?"},{"t":16.18,"x":"So it moves because it's not stable?"},{"t":19.46,"x":"Yeah, that's right."},{"t":20.82,"x":"Wonderful."},{"t":22.74,"x":"What happened to that?"},{"t":24.1,"x":"This?"},{"t":24.66,"x":"Oh, it's dented."},{"t":26.34,"x":"Dented?"},{"t":27.06,"x":"See how the metal got pushed in right here?"},{"t":29.14,"x":"that's a dent oh I see so that's a dent yeah everything around here has seen"},{"t":36.62,"x":"better days seen better days are you saying that all of this stuff used to"},{"t":41.1,"x":"be in much better condition yeah exactly hmm you've seen better days too excuse"},{"t":47.26,"x":"me nothing no no what did you say"}],"media":"media/6ac44d60000000001a029e90.mp4","images":[]},{"kind":"video","noteId":"6ac44d2c000000001a029e2b","creator":"William","title":"合租室友太双标，你会如何应对？","publishedAt":"2026-10-07T10:22:01.000Z","durationSeconds":41.7,"likes":"41","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44d2c000000001a029e2b?xsec_token=ABJJEVXqZom342wHuvi159oZ0ltMB8zFdCwJ5b-dodJ60=&xsec_source=pc_user","ipLocation":"安徽","summary":"这是一段合租室友吵架的口语对话，William 和室友互相指责对方邋遢、不体谅人、双标，最后以「放马过来吧」收场。视频把吵架时高频的地道表达逐个拆解并解释含义，适合学习如何用英语表达不满、反问和回怼。","tags":["英语口语","地道表达","合租冲突","吵架回怼"],"keyPoints":["视频用一段室友争执的短对话，演示了英语吵架时最常用的指责、反问和挑衅表达。","每个关键词都会立刻用英文解释一遍，例如 slob、inconsiderate、hypocrite 的含义。","反问句 Are you saying...? 是这对话里推动冲突升级的核心句式。","结尾的 Come at me, bro. 是口语中很有挑衅感的说法，语气比字面意思更强硬。"],"patterns":[{"en":"You're such a slob.","zh":"你真是太邋遢了。","usage":"直接指责对方又脏又乱、不收拾时使用。","example":"You're such a slob.","start":0},{"en":"At least I'm not inconsiderate.","zh":"至少我没那么不体谅人。","usage":"被指责后用来自我辩护，同时反手讽刺对方。","example":"Excuse me? At least I'm not inconsiderate.","start":7.04},{"en":"Are you saying ...?","zh":"你是在说……吗？","usage":"确认对方话里的隐含意思，通常带点火药味。","example":"Are you saying I don't care how my actions affect other people?","start":12.16},{"en":"You're such a hypocrite.","zh":"你真是个双标的人。","usage":"说别人说一套做一套、只要求别人不要求自己时使用。","example":"Oh please, you're such a hypocrite.","start":21.52},{"en":"Practice what you preach.","zh":"自己先做到再要求别人。","usage":"批评对方光会嘴上讲道理、自己却不照做时用。","example":"Practice what you preach.","start":29.54},{"en":"Come at me, bro.","zh":"放马过来吧，兄弟。","usage":"口语里带挑衅意味地表示随时奉陪、不服就打。","example":"Come at me, bro.","start":38.1}],"quotes":[{"text":"Are you serious? Look at this place. You're such a slob.","start":0,"matched":true},{"text":"Excuse me? At least I'm not inconsiderate.","start":7.04,"matched":true},{"text":"You leave your dirty dishes in the sink every night.","start":17.52,"matched":true},{"text":"Come at me, bro.","start":38.1,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Are you serious? Look at this place. You're such a slob."},{"t":3.52,"x":"A slob? You mean someone who's really messy?"},{"t":7.04,"x":"Yes. Look around. Excuse me? At least I'm not inconsiderate."},{"t":12.16,"x":"Inconsiderate me? Are you saying I don't care how my actions affect other people?"},{"t":17.52,"x":"Exactly. You leave your dirty dishes in the sink every night."},{"t":21.52,"x":"Oh please, you're such a hypocrite."},{"t":23.92,"x":"A hypocrite? Like I tell you what to do but I don't even do it myself?"},{"t":28.16,"x":"Exactly."},{"t":29.54,"x":"Practice what you preach."},{"t":31.1,"x":"Practice what you preach?"},{"t":32.18,"x":"Are you telling me that I can't tell you this stuff"},{"t":34.3,"x":"because I don't do it myself?"},{"t":35.82,"x":"Yeah."},{"t":36.7,"x":"Okay, you know what?"},{"t":38.1,"x":"Come at me, bro."},{"t":38.94,"x":"Oh, are you sure?"},{"t":39.78,"x":"Are you sure?"},{"t":40.62,"x":"Come on."}],"media":"media/6ac44d2c000000001a029e2b.mp4","images":[]},{"kind":"video","noteId":"6ac44cfe000000001500f89c","creator":"William","title":"遇到这些情况，你会用英语描述吗？","publishedAt":"2026-10-07T04:21:00.000Z","durationSeconds":41.5,"likes":"39","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44cfe000000001500f89c?xsec_token=ABJJEVXqZom342wHuvi159oSRe0Cw3wwUywMOxJksJLyM=&xsec_source=pc_user","ipLocation":"安徽","summary":"这段视频还原了面对一团糟的厨房时，如何用英语吐槽脏乱场景。通过对话形式，可以学到描述黏手、掉渣、剩饭等日常生活问题的地道说法。","tags":["实用英语","日常口语","厨房场景","地道表达"],"keyPoints":["视频用一段厨房对话演示如何抱怨脏乱环境，场景非常贴近日常生活。","重点词汇包括 sticky（黏的）、crumbs（碎屑）、leftovers（剩饭）。","句型上涵盖了抱怨、追问、确认和决定行动等常见口语功能。"],"patterns":[{"en":"This kitchen is a mess.","zh":"这个厨房一团糟。","usage":"抱怨某个地方又脏又乱时用。","example":"This kitchen is a mess.","start":0},{"en":"I can't live like this anymore.","zh":"我再也受不了这样了。","usage":"表达对某种状况忍无可忍时用。","example":"I can't live like this anymore.","start":0},{"en":"Do you mean sticky?","zh":"你是说黏黏的吗？","usage":"对方描述不清时，用关键词帮他把意思说出来。","example":"Oh, do you mean sticky?","start":13.96},{"en":"get stuck to my feet","zh":"粘在我脚上。","usage":"描述碎屑、纸片之类的东西粘在脚底时用。","example":"all these crumbs just get stuck to my feet","start":28.24}],"quotes":[{"text":"This kitchen is a mess.","start":0,"matched":true},{"text":"I can't live like this anymore.","start":0,"matched":true},{"text":"Oh, do you mean sticky?","start":13.96,"matched":true},{"text":"I think it's time for me to clean","start":39.04,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Oh my god. What's going on? This kitchen is a mess. I can't live like this anymore. Like the counter it's"},{"t":7.64,"x":"it's not wet, but"},{"t":9.76,"x":"it's like"},{"t":11.48,"x":"glue my hand is like"},{"t":13.96,"x":"Staying on it. Oh, do you mean sticky? Yeah sticky disgusting and when I walk all these little food"},{"t":22.64,"x":"Pieces, they just you know attack my feet. Oh, yeah all these crumbs"},{"t":28.24,"x":"yeah crumbs all these crumbs just get stuck to my feet and then you know you"},{"t":33.4,"x":"eat but then there's some food left afterwards oh yeah leftovers yeah I"},{"t":39.04,"x":"think it's time for me to clean"}],"media":"media/6ac44cfe000000001500f89c.mp4","images":[]},{"kind":"video","noteId":"6ac44cc7000000001500f814","creator":"William","title":"当你遇到这人这事，你会说...？","publishedAt":"2026-10-06T10:22:01.000Z","durationSeconds":46.6,"likes":"44","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44cc7000000001500f814?xsec_token=ABJJEVXqZom342wHuvi159oQNhLq9RVozPKtlPKhz2YKo=&xsec_source=pc_user","ipLocation":"安徽","summary":"这是一条生活场景英语短视频：William 在吃东西时被人直接伸手拿食物，他语气不好地回了一句，对方听不懂，于是顺势讲解 snap at someone 这个表达。看完能学会几个拿别人食物、被人凶、偷吃一口等日常互动里的地道说法。","tags":["生活英语","英语口语","地道表达","词汇辨析"],"keyPoints":["to snap at someone 指带着怒气和刻薄的语气对人说话，不一定是大喊。","steal a bite 是口语里「偷吃一口、蹭一口」的说法，常用来指没打招呼就吃别人东西。","视频用「没问过就拿我吃的」和「snap at someone」两个点串起了一段很日常的对话。","遇到听不懂的表达时，可以直接用 what does that mean 追问。"],"patterns":[{"en":"you didn't have to ...","zh":"你没必要……","usage":"觉得对方反应过激、做得太过了的时候说。","example":"you didn't have to snap at me like that","start":5.91},{"en":"snap at someone","zh":"冲某人发火","usage":"形容因为生气而语气很冲、很刻薄地回应别人。","example":"to snap at someone means to speak angrily and harshly","start":11.79},{"en":"steal a bite","zh":"偷吃一口、蹭一口","usage":"说别人没问过就吃了一口你的东西。","example":"do you mean you don't like when people steal a bite?","start":32.37}],"quotes":[{"text":"you didn't have to snap at me like that","start":5.91,"matched":true},{"text":"I snapped at you because I don't like when people take my food without like asking","start":16.15,"matched":true},{"text":"I snap at people when they try to steal a bite.","start":32.37,"matched":true},{"text":"can I have some now?","start":42.33,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.24,"x":"Hey, what you doing? I'm eating. Oh, yeah, let me have some whoa. No"},{"t":5.91,"x":"What are you whoa you didn't have to snap at me like that wait what snap"},{"t":11.79,"x":"Wait, what what does that mean to snap at someone means to speak?"},{"t":16.15,"x": erreacting.","start":25.9},{"en":"blow this way out of proportion","zh":"小题大做、过度放大","usage":"说对方把一件小事搞成了大问题。","example":"Yes, you're blowing this way out of proportion.","start":32.76}],"quotes":[{"text":"Did you seriously eat the last cookie?","start":0,"matched":true},{"text":"I was saving that.","start":3.1,"matched":true},{"text":"It's a cookie.","start":12.2,"matched":true},{"text":"I'm just protecting myself because you're criticizing me.","start":19.2,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Did you seriously eat the last cookie?"},{"t":2.4,"x":"Yeah."},{"t":3.1,"x":"I was saving that."},{"t":4.2,"x":"Oh my god, you're being so petty."},{"t":6.6,"x":"Petty?"},{"t":7.8,"x":"Like I'm getting upset over something small and unimportant?"},{"t":11.1,"x":"Yes."},{"t":12.2,"x":"It's a cookie."},{"t":13.3,"x":"Well, maybe if you weren't so selfish."},{"t":15.9,"x":"Why are you getting so defensive?"},{"t":17.8,"x":"Defensive?"},{"t":19.2,"x":"I'm just protecting myself because you're criticizing me."},{"t":22.1,"x":"You started it."},{"t":23.2,"x":"Because you ate my cookie."},{"t":25.9,"x":"You're completely overreacting."},{"t":28.4,"x":"Overreacting?"},{"t":29.4,"x":"you think my reaction is stronger than the situation deserves?"},{"t":32.76,"x":"Yes, you're blowing this way out of proportion."},{"t":35.52,"x":"Are you saying I'm making the situation way more serious"},{"t":38.56,"x":"than it needs to be?"},{"t":39.52,"x":"Yeah."},{"t":40.36,"x":"Oh, you wanna see me blow something out of proportion?"},{"t":43.2,"x":"Are you serious right now?"},{"t":44.7,"x":"Let's see how you like that."}],"media":"media/6ac44c980000000018039101.mp4","images":[]},{"kind":"video","noteId":"6abfa28c00000000140383bc","creator":"瑞秋爱玛","title":"全英｜失业近五个月，只为等外企offer…","publishedAt":"2026-10-02T12:24:44Z","durationSeconds":217.3,"likes":"74","noteUrl":"https://www.xiaohongshu.com/user/profile/61361d670000000002019d71/6abfa28c00000000140383bc?xsec_token=ABv3RalkvFCSrUwbgHRIf3-_iJGkb2hLPypZDn95H5H9Y=&xsec_source=pc_user","ipLocation":"上海","summary":"在外企和私企都待过的亲身对比，从加班、工作范围、团队氛围、请假制度一路讲到年会，全程英语叙述，适合练「对比陈述」的句式。","tags":["全英播客","职场英语","对比论述"],"keyPoints":["对比类口播的万能结构：先立维度（加班/工作量/氛围/请假/年会），再逐条对比","描述公司文化的高频词：work-life boundaries、job scope、proper boundaries、office politics","讲自己的经历时用 During my stay at …, I would have to … 这种过去习惯句式","ASR 提示：结尾一段识别质量差（出现 keyboard 等无关词），引用时建议回看原片"],"patterns":[{"en":"respect work-life boundaries","zh":"尊重工作与生活的边界","usage":"形容公司不侵占私人时间","example":"Multinationals generally respect work-life boundaries.","start":27.79},{"en":"Once your tasks are wrapped up, you can log off.","zh":"活干完就能下线。","usage":"wrap up = 收尾完成，log off 比 leave 更贴线上办公","example":"Once your assigned tasks are wrapped up, you can log off.","start":35.79},{"en":"You are expected to stay reachable at work.","zh":"要求你随时能被联系上。","usage":"be expected to 表达隐性要求，比 must 更准","example":"In private companies, you are expected to stay reachable.","start":44.79},{"en":"a daily occurrence","zh":"每天都会发生的事","usage":"描述常态化的加班或状况","example":"Getting off work at 10pm is a daily occurrence.","start":46.79},{"en":"value efficiency over looking busy","zh":"看重效率，而不是看起来很忙","usage":"A over B 句式，对比两种取向","example":"Foreign companies value efficiency over looking busy.","start":72.95},{"en":"job boundaries tend to be blurry","zh":"职责边界往往很模糊","usage":"tend to be 表示普遍倾向","example":"For local private firms, job boundaries tend to be blurry.","start":77.63},{"en":"asking for leave still feels like asking for a favor","zh":"请假还是像在求人。","usage":"feel like + 动名词，描述主观感受","example":"In many private companies, asking for leave still feels like asking for a favor.","start":140.46}],"quotes":[{"text":"Foreign companies usually have clear job descriptions. Your responsibilities are well defined and value efficiency over looking busy.","start":70.15,"matched":true},{"text":"In many private companies, asking for leave still feels like asking for a favor.","start":140.46,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"As you guys know, I find a new job at a multinational company after five months of gap."},{"t":5.07,"x":"What you probably don't know is that one's worked at a private local company."},{"t":9.47,"x":"You may wonder what's the real difference between the two."},{"t":12.11,"x":"Today we are skipping those one-sided stereotypes."},{"t":15.07,"x":"Let's talk about the actual differences I've observed from overtime, workload, team"},{"t":20.59,"x":"vibe, leave policy all the way to annual parties."},{"t":25.95,"x":"First, overtime and working hours."},{"t":27.79,"x":"Multinationalists generally respect work-life boundaries."},{"t":31.79,"x":"Overtime is only for exceptional cases, never a counter-expectation."},{"t":35.79,"x":"Once your assigned tasks are wrapped up, you can log off."},{"t":39.79,"x":"The person time is respected, but private companies may operate with a different mindset."},{"t":44.79,"x":"You are expected to stay reachable at work."},{"t":46.79,"x":"During my stay at that private company, getting off work at 10pm is a daily occurrence."},{"t":51.79,"x":"If there happens to be a special occasion like annual meetings or exhibitions,"},{"t":55.79,"x":"decisions, I would have to stand by for the whole night."},{"t":58.79,"x":"I simply could not understand why there are so many things to do and why those things"},{"t":62.43,"x":"have to be done with such urgency."},{"t":67.95,"x":"Next workload and job scope."},{"t":70.15,"x":"Foreign companies usually have clear job descriptions."},{"t":72.95,"x":"Your responsibilities are where defined and value efficiency over looking busy."},{"t":77.63,"x":"For local private firms, job boundaries tend to be blurry."},{"t":81.11,"x":"It's common for one person to have multiple roles."},{"t":84.07,"x":"constantly take on unexpected extra work and absorb all sorts of emergency"},{"t":88.51,"x":"issues like changing water for bars fish tank. Then workplace atmosphere"},{"t":97.1,"x":"multinational teams are professional and polite, colleagues maintain proper boundaries."},{"t":101.54,"x":"We focus on getting things done with less emotional pressure or office politics."},{"t":106.02,"x":"In a private company the boss is more dictatorial than supportive and sometimes"},{"t":110.74,"x":"your boss could be the major source of pressure and uncomfortableness of your work."},{"t":114.46,"x":"For example, you may find yourself in a meeting listening to your boss rambling on and on and"},{"t":119.9,"x":"you have to pretend to stay for attention by scribbling away furiously, besides invisible"},{"t":125.94,"x":"internal competition and the pressure I usually have here."},{"t":131.91,"x":"At foreign companies, vocation is treated as your basic right."},{"t":135.05,"x":"You submit the application no need to over-explain or feel guilty for taking time off."},{"t":140.46,"x":"In many private companies, asking for leave still feels like asking for a favor."},{"t":145.42,"x":"You have to carefully explain your situation and worry about leaving your extra work for"},{"t":150.1,"x":"your team or leaving a bad impression on your manager."},{"t":154.13,"x":"In my case, another bothering issue is that a leave was released by the hour, meaning you"},{"t":158.45,"x":"have to work until you get eight hours to ask for a day's leave."},{"t":162.77,"x":"What can I say?"},{"t":163.77,"x":"Let's talk about annual parties."},{"t":169.65,"x":"Annual parties and multinationals are mostly for rest and rewards, good food,"},{"t":174.61,"x":"lucky draws, simple socializing."},{"t":177.25,"x":"No mandatory performances or meaningless formalities."},{"t":180.21,"x":"Private company annual parties are designed to boost team morale, which I'm not sure about."},{"t":184.53,"x":"The emphasised passion and the unity, which often means compulsory group activities and"},{"t":189.41,"x":"talent shows, are forced to act on state play, boosting about the greatness of the company."},{"t":196.05,"x":"As a newcomer, I was like,"},{"t":197.89,"x":"Mi ma to vi mi ma!"},{"t":200.01,"x":"Okay, now here is a keyboard."},{"t":202.45,"x":"the option is inherently better or worse. Your choice really depends on what you're prioritizing"},{"t":208.29,"x":"your career, so which one can start if it's you? Drop your thoughts in the comment below. Bye."}],"media":"media/6abfa28c00000000140383bc.mp4","images":[]},{"kind":"video","noteId":"6abf181a000000001c00f40b","creator":"William","title":"Do You Know...？","publishedAt":"2026-10-02T10:40:04Z","durationSeconds":63.4,"likes":"179","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6abf181a000000001c00f40b?xsec_token=ABv3RalkvFCSrUwbgHRIf3-7N39J2h9FxEPavOJ91SE7A=&xsec_source=pc_user","ipLocation":"安徽","summary":"室友没打招呼就搬走、当天还要塞个新室友进来。整段对话专门练「被突袭」「背着我做」「已成定局」这几组高频表达。","tags":["日常口语","冲突对话","室友沟通"],"keyPoints":["冲突场景里英语母语者很少直说「你怎么不告诉我」，而是用 blindside / behind my back 这类固定搭配","set in stone 用来表示「已经定了、不能改」，比 decided 更强调不可逆","pretty much 是口语里表示「基本上就是」的高频缩写式回答"],"patterns":[{"en":"blindside someone","zh":"突然袭击、把人打个措手不及","usage":"对方毫无预兆地抛来一个重大消息时","example":"You can't just blindside me like that.","start":5.66},{"en":"hit someone with huge news","zh":"甩给某人一个重磅消息","usage":"强调消息的分量和突然性","example":"You hit me with huge news with absolutely no warning.","start":5.66},{"en":"behind someone's back","zh":"背着某人（偷偷做）","usage":"发现对方瞒着自己行动时","example":"You did all of this behind my back?","start":19.64},{"en":"take matters into your own hands","zh":"自己动手把事情办了","usage":"等不及别人、决定自己解决","example":"Somebody had to take matters into their own hands.","start":30.1},{"en":"It's already set in stone.","zh":"已经板上钉钉了。","usage":"表示决定已定、不打算改","example":"It's too late. It's already set in stone.","start":40.82},{"en":"Pretty much.","zh":"差不多就是这样。","usage":"口语里简短肯定对方的总结","example":"So you just handled everything yourself? — Pretty much.","start":35.22},{"en":"easy to live with","zh":"好相处、适合同住","usage":"评价室友或伴侣的相处难度","example":"He said you're super easy to live with.","start":54.3}],"quotes":[{"text":"You can't just blindside me like that.","start":5.66,"matched":true},{"text":"It's already set in stone.","start":40.82,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.5,"x":"Whoa, whoa, whoa. Where are you going? I'm moving out. You're what? I'm moving out"},{"t":5.66,"x":"You can't just blindside me like that blindside you. Yes hit me with huge news with absolutely no warning"},{"t":13.64,"x":"Relax, I already found someone to take my room. You what? He's moving in today today"},{"t":19.64,"x":"You did all of this behind my back behind your back"},{"t":23.26,"x":"Yes, you planned the whole thing without telling me because I knew you'd make it difficult"},{"t":27.46,"x":"Of course I'd make it difficult. I live here."},{"t":30.1,"x":"Look, somebody had to take matters into their own hands."},{"t":33.3,"x":"Take matters into your own hands?"},{"t":35.22,"x":"So you just handled everything yourself without asking me?"},{"t":38.18,"x":"Pretty much."},{"t":39.14,"x":"You don't get to choose my new roommate?"},{"t":40.82,"x":"It's too late. It's already set in stone."},{"t":42.9,"x":"Set in stone?"},{"t":44.18,"x":"It's decided. It's not changing."},{"t":46.26,"x":"Oh, it's changing."},{"t":47.7,"x":"No, it's not."},{"t":49.06,"x":"Yes, it..."},{"t":50.46,"x":"Actually, that should be him."},{"t":51.98,"x":"Him?"},{"t":52.78,"x":"Hey, you must be my new roommate."},{"t":54.3,"x":"He said you're super easy to live with."},{"t":56.54,"x":"Nice to meet you."},{"t":57.74,"x":"Is there something going on?"}],"media":"media/6abf181a000000001c00f40b.mp4","images":[]},{"kind":"video","noteId":"6abe414f000000001802e6de","creator":"William","title":"生活英语：遇到这些情况怎么说？","publishedAt":"2026-10-01T13:30:12.000Z","durationSeconds":42.7,"likes":"174","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6abe414f000000001802e6de?xsec_token=ABMM5QYrg-hkp0j8yab-OPSbfVp518R7T6Inq9vIlhr4w=&xsec_source=pc_user","ipLocation":"安徽","summary":"这条视频还原了把咖啡打翻在笔记本电脑上后的真实对话场景，从惊呼、询问状况到描述电脑故障，全程用英语完成。博主顺带讲了几个描述「打翻、卡住、死机、报废」的地道说法，并点出背过的单词在需要时用不出来，是因为「认识单词」和「压力下用出单词」是两回事。","tags":["生活英语","英语口语","突发状况","单词活用"],"keyPoints":["场景是打翻咖啡、电脑出故障时的即时英语对话，重点在描述物品状态。","打翻用 knocked over，死机可以用 it froze 或 it's just not responding。","彻底坏掉，尤其是被液体弄坏，可以用 it might be fried。","博主提醒：认识单词和能在紧张时脱口而出，是两个完全不同的能力。"],"patterns":[{"en":"knocked over","zh":"打翻、碰倒","usage":"描述不小心把液体或物件弄翻时","example":"Oh, you knocked over your coffee.","start":6.79},{"en":"it's just not responding","zh":"它就是没有任何反应","usage":"描述电子设备有电但操作无反应时","example":"Oh, it's on it's just not responding or you could say it froze froze like frozen","start":13.03},{"en":"Is it dead?","zh":"它是彻底废了吗？","usage":"半开玩笑地问设备是不是完全没救了","example":"Wait, is it dead?","start":22.38},{"en":"it might be fried","zh":"它可能已经烧了／废了","usage":"推测设备因进水等原因彻底损坏时","example":"Yeah, it might be fried as in completely broken from the liquid","start":22.38},{"en":"I just can't seem to find them","zh":"就是想不起来／找不到","usage":"表达明明会却一时想不起来时","example":"it seems like I know these words but when I need them I just can't seem to find them","start":28.42}],"quotes":[{"text":"Oh, you knocked over your coffee.","start":6.79,"matched":true},{"text":"Wait, is it dead?","start":22.38,"matched":true},{"text":"Yeah, it might be fried as in completely broken from the liquid","start":22.38,"matched":true},{"text":"knowing words and being able to use them under pressure are two completely different things","start":35.22,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.43,"x":"Oh, my laptop. Oh, no. Is it okay? What happened? I pushed down my coffee"},{"t":6.79,"x":"Oh, you knocked over your coffee. Yeah knocked over and now the computer"},{"t":13.03,"x":"Isn't working. Oh, it's on it's just not responding or you could say it froze froze like frozen"},{"t":22.38,"x":"Wait, is it dead? Yeah, it might be fried as in completely broken from the liquid"},{"t":28.42,"x":"fried knocked over froze it seems like I know these words but when I need them I"},{"t":35.22,"x":"just can't seem to find them well that's because knowing words and being able to"},{"t":39.18,"x":"use them under pressure are two completely different things"}],"media":"media/6abe414f000000001802e6de.mp4","images":[]},{"kind":"video","noteId":"6abe4106000000001500efd7","creator":"William","title":"当你英语不好，遇到这种情况怎么说？","publishedAt":"2026-10-01T11:16:22.000Z","durationSeconds":38.6,"likes":"308","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6abe4106000000001500efd7?xsec_token=ABMM5QYrg-hkp0j8yab-OPSZdg7yFmCD99Lx4JngAIbng=&xsec_source=pc_user","ipLocation":"安徽","summary":"这条视频模拟室友不讲卫生的日常抱怨场景：剪脚趾甲不收拾、洗完澡吹头发掉一地。通过一问一答的对话，自然带出「toenail clippings」「blow-dry」「shed」等地道词汇和口语表达，适合用来吐槽生活琐事。","tags":["英语口语","生活词汇","室友吐槽","地道表达"],"keyPoints":["视频用室友邋遢的真实场景，把「剪脚趾甲、吹头发、掉头发」这几个日常动作串成一段对话。","重点词汇是 toenail clippings（脚趾甲碎屑）、blow-dry（用吹风机吹干）、shed（掉毛、掉发）。","表达不满时可以用 That's disgusting 和 What's going on，语气自然又口语化。","博主最后提醒可以关注账号继续学这类生活词汇。"],"patterns":[{"en":"leave sth all over the floor","zh":"把某物弄得满地都是。","usage":"抱怨别人乱丢东西、不收拾时用。","example":"My roommate, he cut his nails on his feet and left them all over the floor.","start":0},{"en":"toenail clippings","zh":"剪下的脚趾甲","usage":"具体指剪脚趾甲留下的碎屑。","example":"Oh, toenail clippings?","start":7.92},{"en":"blow-dry one's hair","zh":"用吹风机吹头发。","usage":"描述洗完澡后用吹风机吹干头发。","example":"Oh, and he blow-dries his hair.","start":14.67},{"en":"hair shedding","zh":"掉头发、掉毛。","usage":"说头发正常脱落时用这个名词形式。","example":"I mean the little hair shedding is normal, he just needs to clean it up.","start":21.39},{"en":"shed","zh":"掉（毛发）。","usage":"动词，指人或动物掉毛、掉发。","example":"Sheds, yes, he sheds a lot.","start":29.85}],"quotes":[{"text":"Oh my god, that's disgusting.","start":0,"matched":true},{"text":"My roommate, he cut his nails on his feet and left them all over the floor.","start":0,"matched":true},{"text":"Oh, and he blow-dries his hair.","start":14.67,"matched":true},{"text":"I mean the little hair shedding is normal, he just needs to clean it up.","start":21.39,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Oh my god, that's disgusting. What's going on? My roommate, he cut his nails on his"},{"t":7.92,"x":"feet and left them all over the floor. Oh, toenail clippings? Tonal clippings, yeah."},{"t":14.67,"x":"And after the shower, he also blew his hair. Oh, and he blow-dries his hair. He has blow-dries his"},{"t":21.39,"x":"hair and his hair comes out of his head a lot on the floor. I mean the little"},{"t":29.85,"x":"hair shedding is normal, he just needs to clean it up. Sheds, yes, he sheds a lot."},{"t":34.33,"x":"Wow, where can I learn this vocabulary? Oh you can just follow this account to"},{"t":38.05,"x":"learn more."}],"media":"media/6abe4106000000001500efd7.mp4","images":[]},{"kind":"video","noteId":"6abdf54c000000001a028227","creator":"Bapanda职场英语表达","title":"英文不好牛马主持英文线上会议无痛版下","publishedAt":"2026-10-01T05:53:16.000Z","durationSeconds":116.1,"likes":"88","noteUrl":"https://www.xiaohongshu.com/user/profile/59addf2d50c4b41fabc101b0/6abdf54c000000001a028227?xsec_token=AB88Uln-G1_PhlGHQgj5kfkJvPDtj1gENCMAvXWivMQJU=&xsec_source=pc_user","ipLocation":"云南","summary":"这条视频演示了主持英文线上会议的完整流程，从开场问候、调试麦克风和屏幕共享，到引导同事发言、澄清疑问、控制节奏和收尾总结。可以学到一套开线上会议时最常用的救场句和推进句，不用背长难句也能把会议主持下来。","tags":["职场英语","英文会议","线上会议","会议表达"],"keyPoints":["开场先用问候加确认音画的方式启动会议，比如确认大家能否听到、能否看到屏幕。","听不清或技术卡顿时，可以用简短的句子请对方重复、确认是否掉线，不用慌张。","听不懂时要主动打断澄清，用追问把模糊的说法问具体，避免会议跑偏。","推进会议靠分配发言、暂时搁置跑题内容和最后总结下一步，这几步串起来就是一套完整主持流程。"],"patterns":[{"en":"Am I breaking up?","zh":"我的声音是不是断断续续的？","usage":"怀疑网络或麦克风有问题、对方没回应时主动检查。","example":"Am I breaking up?","start":3.76},{"en":"Could you repeat that last part?","zh":"你能把最后那部分再说一遍吗？","usage":"对方刚才那句话没听清，只求重复关键部分时用。","example":"Could you repeat that last part?","start":38.72},{"en":"Sorry I'm not sure I follow.","zh":"抱歉，我不太跟得上你的意思。","usage":"礼貌表示没听懂，请对方补充说明。","example":"Sorry I'm not sure I follow.","start":43.2},{"en":"What do you mean by that?","zh":"你这么说是什么意思？","usage":"对方表述含糊，需要问清楚具体所指。","example":"What do you mean by that?","start":47.39},{"en":"Let's park there for now.","zh":"这个我们先暂时放一放。","usage":"话题跑偏或需要留到后面再谈时，温和地把讨论拉回来。","example":"Well, that's a good point, but let's park there for now.","start":72},{"en":"Do you want to take this one?","zh":"这个问题你想来回答吗？","usage":"把问题转给更合适的同事，请对方接手。","example":"Sarah, do you want to take this one?","start":67.39},{"en":"Does that work for everyone?","zh":"这样安排大家都方便吗？","usage":"确定时间或下一步安排后，向所有人确认是否可行。","example":"Does that work for everyone?","start":108.91}],"quotes":[{"text":"Can everyone see it okay? Hang on, let me try that again.","start":15.25,"matched":true},{"text":"Wait are we looking at the same time period?","start":52.48,"matched":true},{"text":"All right, let's quickly recap the next steps.","start":98.51,"matched":true},{"text":"I'll send out a quick recap email.","start":111.97,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Morning everyone, good to see you all. Welcome to our Q2 review."},{"t":3.76,"x":"Can everyone hear me okay? Am I breaking up? Hold on, let me check my mic."},{"t":10.02,"x":"Is this any better? Great, thanks. All right, let me share my screen."},{"t":15.25,"x":"Can everyone see it okay? Hang on, let me try that again."},{"t":19.98,"x":"How about now? Perfect."},{"t":22.56,"x":"So today we went through our Q2 results and discussed our priorities for Q3."},{"t":28.08,"x":"So overall it was a solid quarter but customer retention was our biggest challenge."},{"t":34.72,"x":"James over to you. Sorry James you cut out for a second."},{"t":38.72,"x":"Could you repeat that last part? Got it, thanks."},{"t":43.2,"x":"Sarah anything to add? Sorry I'm not sure I follow."},{"t":47.39,"x":"What do you mean by that? Oh okay that makes sense."},{"t":52.48,"x":"Wait are we looking at the same time period?"},{"t":55.36,"x":"James is that for the whole quarter or just August?"},{"t":59.94,"x":"Oh, got it. That's why the numbers don't match."},{"t":63.95,"x":"Well, actually, Sarah would be the best person to answer that."},{"t":67.39,"x":"Sarah, do you want to take this one?"},{"t":70,"x":"Got it. Thanks."},{"t":72,"x":"Well, that's a good point, but let's park there for now."},{"t":75,"x":"Let's bring it back to Q2 customer retention first."},{"t":78,"x":"So what do you think caused the problem?"},{"t":80.4,"x":"Sarah, go ahead. James, I'll come to you next."},{"t":84.2,"x":"Sounds good. Thanks, Sarah. James, go ahead."},{"t":87.2,"x":"You're right. Good point."},{"t":89.2,"x":"All right, we have about 10 minutes left."},{"t":91.2,"x":"So let's move on to Q3."},{"t":93.44,"x":"Jack, what's the main focus for your team?"},{"t":97.23,"x":"Sounds good."},{"t":98.51,"x":"All right, let's quickly recap the next steps."},{"t":100.99,"x":"Our main focus for Q3 is customer retention."},{"t":104.75,"x":"Jar will share the updated plan by Friday."},{"t":107.23,"x":"We'll go over it next week."},{"t":108.91,"x":"Does that work for everyone?"},{"t":111.49,"x":"Perfect."},{"t":111.97,"x":"I'll send out a quick recap email."},{"t":114.13,"x":"Thanks everyone."},{"t":115.09,"x":"Have a good day."}],"media":"media/6abdf54c000000001a028227.mp4","images":[]},{"kind":"video","noteId":"6abb869c000000001803aad9","creator":"Bapanda职场英语表达","title":"英文不好牛马主持英文线上会议无痛版中","publishedAt":"2026-09-29T09:36:28.000Z","durationSeconds":131.8,"likes":"391","noteUrl":"https://www.xiaohongshu.com/user/profile/59addf2d50c4b41fabc101b0/6abb869c000000001803aad9?xsec_token=AB2HWJnCOMa6nyKXjfiibhZev7TCAQ1y85bG7-dtAk_-I=&xsec_source=pc_user","ipLocation":"云南","summary":"这条视频模拟了一场英文线上项目会议，从开场等人、催进度、遇到网络卡顿，到确认分工和收尾总结，覆盖了主持会议的完整流程。可以学到一批职场会议里高频、拿来就能用的短句，尤其是控场、追问和礼貌插话的表达。","tags":["线上会议","职场英语","会议口语","主持控场"],"keyPoints":["开场先感谢已到场的人，说明还在等人，并承诺之后补上进度，可以让会议顺利开始。","用简短问句请别人汇报进度、确 ":"Thanks. And Mike, how's testing going?"},{"t":30.54,"x":"Mike, I think you froze for a second."},{"t":32.34,"x":"Can you hear us?"},{"t":34.1,"x":"Oh, good."},{"t":34.8,"x":"You're back now."},{"t":35.6,"x":"You were saying there are two issues left,"},{"t":38.73,"x":"so you can't finish testing until you get Lisa's page."},{"t":42.53,"x":"Got it."},{"t":43.23,"x":"We'll ask Lisa about the timing."},{"t":44.93,"x":"Hi Lisa, welcome."},{"t":46.03,"x":"No worries."},{"t":46.73,"x":"Mike is waiting for your final product page"},{"t":48.73,"x":"before he can finish testing."},{"t":51.03,"x":"How are the launch materials looking?"},{"t":54.1,"x":"Sorry to jump in, just so we say on time,"},{"t":56.3,"x":"what's left to finish?"},{"t":58.32,"x":"Thursday."},{"t":59.32,"x":"Sounds good."},{"t":60.22,"x":"Thanks."},{"t":60.72,"x":"Mike, once you get the page, how long will testing take?"},{"t":63.84,"x":"So sorry, go ahead."},{"t":66.21,"x":"Great."},{"t":67.25,"x":"Does it work for you, Mike?"},{"t":68.97,"x":"Perfect."},{"t":70.32,"x":"Oh, sure. Thanks for the update."},{"t":71.88,"x":"Hi, Derek. Good to have you with us."},{"t":73.8,"x":"We're just going through the latest updates."},{"t":76.8,"x":"We're still aiming for next Friday."},{"t":78.6,"x":"Development is almost done and testing is in progress."},{"t":83.4,"x":"There are two things we are watching."},{"t":85,"x":"We are expecting confirmation from the supplier tomorrow"},{"t":87.92,"x":"and the final product page is still Thursday."},{"t":90.72,"x":"Right now, either one affects the launch date."},{"t":93.5,"x":"But I'll let you know if anything changes."},{"t":96.14,"x":"We'll do."},{"t":97.88,"x":"I don't have the latest number with me right now,"},{"t":100.04,"x":"so let me double check after the meeting."},{"t":102.16,"x":"I will send them to you by the end of today."},{"t":105.4,"x":"Thanks for dropping in."},{"t":106.64,"x":"All right, let's quickly go over the next steps."},{"t":109.32,"x":"James will time.","zh":"谢谢大家的时间。","usage":"结束语，比 Thanks 更有分量","example":"Alright, let's wrap up here. I appreciate everyone's time.","start":79.27}],"quotes":[{"text":"Can everyone hear me and see my screen?","start":13.25,"matched":true},{"text":"I think you're on mute.","start":26.34,"matched":true},{"text":"Let's take that offline. I'll ping you right after this.","start":76.35,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Morning, everyone. Good to see you. How's everyone doing today?"},{"t":4.29,"x":"Yes, I'm here. Busy week. Alright, looks like a few people are still joining."},{"t":8.45,"x":"So before we get started, I'll pull up today's agenda and share my screen."},{"t":13.25,"x":"Can everyone hear me and see my screen?"},{"t":16.05,"x":"Great. Alright, let's get into it."},{"t":18.13,"x":"So today we want through project updates, flag any blogs,"},{"t":21.17,"x":"and come from this week's action items."},{"t":23.49,"x":"Sarah, would you like to kick us off?"},{"t":26.34,"x":"I think you're on mute."},{"t":28.46,"x":"There you go. We can hear you now."},{"t":29.98,"x":"Thanks. So what's the next step on your site?"},{"t":34.22,"x":"Got it. If we haven't heard back by Wednesday,"},{"t":36.78,"x":"could you follow up with the client?"},{"t":39.33,"x":"Sounds good."},{"t":41.02,"x":"Hi Mike, welcome. We've just started and going through project updates."},{"t":45.68,"x":"Jack, anything to add from the product site?"},{"t":48.66,"x":"Got it. So the revised timeline should be ready by Thursday."},{"t":52.82,"x":"Great, thanks Jack."},{"t":54.18,"x":"Alright, that covers the project updates."},{"t":56.26,"x":"Does anyone have any blocks to flag?"},{"t":58.34,"x":"Perfect, no blocks then."},{"t":59.94,"x":"Next up, action items."},{"t":61.46,"x":"Let's quickly confirm who's doing what."},{"t":63.6,"x":"Sarah will follow up with the client on Wednesday if we haven't heard back."},{"t":67.5,"x":"Jack will share the revised timeline by Thursday."},{"t":70.62,"x":"Anything I missed? Yeah, go ahead."},{"t":72.62,"x":"Good point. We're running a little short on time today,"},{"t":76.35,"x":"so let's take that offline. I'll paint you right after this."},{"t":79.27,"x":"Alright, let's wrap up here."},{"t":81.11,"x":"I appreciate everyone's time. See you next week."}],"media":"media/6ab4e8f5000000001203e583.mp4","images":[]},{"kind":"video","noteId":"6ab27d57000000003403460a","creator":"瑞秋爱玛","title":"全英｜缓解高敏感？放弃抵抗吧...","publishedAt":"2026-09-22T13:06:31Z","durationSeconds":199.4,"likes":"41","noteUrl":"https://www.xiaohongshu.com/user/profile/61361d670000000002019d71/6ab27d57000000003403460a?xsec_token=AB9E-xa2VSqgYZ2v3DktfXBND7mlAMnZcDX1f2H4QCjnM=&xsec_source=pc_user","ipLocation":"上海","summary":"35 岁才发现自己是高敏感人格（HSP），今年终于学会不再对抗情绪。情绪类英语口播，长句多、情绪词密集，适合练「描述心理状态」。","tags":["全英播客","情绪表达","心理词汇"],"keyPoints":["描述内耗的成套词汇：emotionally burned out、brain is spinning、on the verge of falling apart","核心转折句是本条的精华：When you stop fighting your emotions, they get bored.","self-doubt 时自我攻击的问句三连：What's wrong with me? Am I not good enough? Am I incompetent?","结尾的安慰句式可以直接背下来用在别人身上：You are not broken, you are not too much."],"patterns":[{"en":"emotionally burned out","zh":"情绪上彻底耗竭","usage":"比 tired 更准确地描述长期透支","example":"I don't know if you ever felt emotionally burned out.","start":6.64},{"en":"your brain is spinning","zh":"脑子停不下来地转","usage":"形容想太多、静不下来","example":"Your brain is spinning all the time, even when you tell it to stop.","start":12.96},{"en":"on the verge of falling apart","zh":"处在崩溃边缘","usage":"on the verge of + 名词/动名词","example":"I constantly felt like I was on the verge of completely falling apart.","start":57.48},{"en":"process things differently","zh":"对外界信息的处理方式不同","usage":"中性描述敏感特质，不带贬义","example":"I literally process things differently from other people.","start":null},{"en":"make peace with myself","zh":"与自己和解","usage":"接受自身特质的关键短语","example":"This year, I finally figured out how to make peace with myself.","start":77.01},{"en":"I just sit with it, quietly, unapologetically.","zh":"安静地陪着情绪，不觉得抱歉","usage":"sit with + 情绪，表示不逃避也不对抗","example":"I don't fake the smile. I just sit with it, quietly, unapologetically.","start":94.28},{"en":"When you stop fighting your emotions, they get bored.","zh":"不再对抗情绪，它自己就无聊了","usage":"整条视频的金句，可直接引用","example":"They realize you're not giving them any drama, any resistance, any fuel, and they just leave.","start":0},{"en":"You are not broken, you are not too much.","zh":"你没有坏掉，你也不是太过分。","usage":"安慰高敏感者最有效的一句","example":"You just feel things deeply and that's not a flaw, that's who you are.","start":190.16}],"quotes":[{"text":"When you stop fighting your emotions, they get bored.","start":148.45,"matched":true},{"text":"You are not broken, you are not too much. You just feel things deeply and that's not a flaw, that's who you are.","start":186.36,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"They realize you're not giving them any drama, any resistance, any fuel, and they just leave."},{"t":6.64,"x":"Hey guys, today I want to talk about how I eat my high sensitivity. I don't know if you ever felt"},{"t":12.96,"x":"emotionally burned out or like your brain is spinning all the time even when you tell it to stop"},{"t":18.48,"x":"or maybe when you're interacting with people your heart is racing and you feel like you're"},{"t":22.96,"x":"or burning yourself out. That used to be me for years, actually for most of my life."},{"t":30.28,"x":"And if you're a highly sensitive person, you probably know exactly what I'm talking about."},{"t":35.2,"x":"If you're always exhausted, even after a full night's sleep, if you can't focus no"},{"t":39.64,"x":"matter how hard you try, if a single comment from someone can ruin your entire day, this"},{"t":45.68,"x":"one is for you because I've been there. I'm 35 and I've always presented myself"},{"t":51.76,"x":"by the easygoing, positive one, the one who's always fine,"},{"t":55.76,"x":"the one who never breaks."},{"t":57.48,"x":"But deep down, I constantly felt like"},{"t":59.88,"x":"I was on the verge of completely falling apart."},{"t":62.56,"x":"But I never knew why."},{"t":63.76,"x":"Or maybe I just never had the energy to figure it out."},{"t":66.89,"x":"It took me almost two decades to realize"},{"t":69.69,"x":"I'm a highly sensitive person."},{"t":72.93,"x":"I bring literally processed things"},{"t":75.01,"x":"differently from other people."},{"t":77.01,"x":"And this year, I finally figured out"},{"t":79.57,"x":"how to make peace with myself."},{"t":81.84,"x":"be a slave to your feelings."},{"t":84.32,"x":"That's right, I give up."},{"t":86.82,"x":"I surrender to whatever the hell that is bothering me."},{"t":89.76,"x":"If I'm feeling down,"},{"t":91.04,"x":"I let myself be down for it as long as I want."},{"t":94.28,"x":"I don't fake the smile I'm always wearing."},{"t":97.2,"x":"I don't pretend to be happy when I'm not."},{"t":99.4,"x":"I don't force myself to be interested in a conversation"},{"t":102,"x":"just to avoid seeming rude."},{"t":104.16,"x":"I just sit with it, quietly, unapologetically"},{"t":107.92,"x":"and let myself feel every bit of it."},{"t":110.96,"x":"Before when my brain was spinning and I couldn't focus, the old me would spiral into self-doubt."},{"t":116.96,"x":"Like what's wrong with me?"},{"t":118.96,"x":"Am I not good enough?"},{"t":120.26,"x":"Am I incompetent?"},{"t":121.96,"x":"And then I pushed myself a bit harder, which of course just made everything worse."},{"t":127.96,"x":"But now I literally say it out loud."},{"t":131.96,"x":"Fuck it. I'm exhausted. I need to stop."},{"t":134.96,"x":"I stop the work I'm doing. I step away from the conversations that drew me."},{"t":138.96,"x":"I close my eyes, or stare into space, or go to the park, find a bench, and stay there"},{"t":144.4,"x":"alone."},{"t":145.69,"x":"And you know what the craziest part is?"},{"t":148.45,"x":"When you stop fighting your emotions, they get bored."},{"t":151.69,"x":"They realize you're not giving them any drama, any resistance, any fuel, and they just"},{"t":157.25,"x":"leave."},{"t":158.25,"x":"I wish I could go back in time and hug the younger me."},{"t":160.93,"x":"The one who was constantly struggling, who didn't know what was wrong with her,"},{"t":165.65,"x":"who thought she just wasn't trying hard enough."},{"t":168.57,"x":"I tell her I'm so sorry I didn't know how to take care of you emotionally and I want"},{"t":173.73,"x":"you to know this is who you are and that's okay, you are enough just as you are."},{"t":179.04,"x":"And if you are watching this and you are a highly sensitive person too, I hope that makes"},{"t":184.24,"x":"you feel a little less alone."},{"t":186.36,"x":"You are not broken, you are not too much."},{"t":190.16,"x":"You just feel things deeply and that's not a flaw, that's who you are."}],"media":"media/6ab27d57000000003403460a.mp4","images":[]},{"kind":"video","noteId":"6aacfbdc000000000b002e93","creator":"开心学英语","title":"情景英语：老板替员工去开家长会破防了！","publishedAt":"2026-09-18T08:52:44Z","durationSeconds":41.2,"likes":"89","noteUrl":"https://www.xiaohongshu.com/user/profile/69cf8d170000000032036d59/6aacfbdc000000000b002e93?xsec_token=AB8mR_Nd0S3GYoZeUObSwukau_SLGLm2DZlLHW5LtzdBM=&xsec_source=pc_user","ipLocation":"黑龙江","summary":"员工想请假去开家长会，老板嫌客户要来验货不放人，最后老板自己冒充叔叔去了，回来被老师骂到破防。","tags":["职场英语","请假","情景对话"],"keyPoints":["请假时的固定说法是 take a day off，理由用 there's … and someone has to be there","No can do 是很口语的「不行」，比 No 多一点无奈","ripped me a new one 表示「把我骂惨了」，属于口语俚语，听懂即可"],"patterns":[{"en":"take a day off","zh":"请一天假","usage":"临时请假最常用的表达","example":"Mr. Lee, I need to take a day off today.","start":0.82},{"en":"No can do.","zh":"不行。","usage":"口语化的拒绝，带无奈而非生硬","example":"No can do. We have a client coming in today to inspect the goods.","start":11.32},{"en":"I've got this.","zh":"这事我来。","usage":"接下任务的自信说法","example":"I'll pretend to be his uncle. — For real? — Yeah, I've got this.","start":21.1},{"en":"rip someone a new one","zh":"把某人骂惨了","usage":"俚语，意思是严厉斥责","example":"The teacher ripped me a new one all afternoon.","start":32.24}],"quotes":[{"text":"No can do. We have a client coming in today to inspect the goods.","start":11.32,"matched":true},{"text":"The teacher ripped me a new one all afternoon.","start":32.24,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.82,"x":"Mr. Lee, I need to take a day off today."},{"t":3.42,"x":"You just got here. Why do you need time off?"},{"t":5.62,"x":"My kid teacher just called."},{"t":7.32,"x":"There's a parent teacher conference and someone has to be there."},{"t":10.12,"x":"No can do."},{"t":11.32,"x":"We have a client coming in today to inspect the goods."},{"t":14.32,"x":"Who's gonna host them if you're gone?"},{"t":16.32,"x":"The teacher was really strict about it."},{"t":19.1,"x":"Said no exceptions."},{"t":21.1,"x":"I'll go. I'll pretend to be his uncle."},{"t":24.65,"x":"For real?"},{"t":25.94,"x":"Yeah. I've got this."},{"t":27.94,"x":"Thanks a lot."},{"t":29.44,"x":"Your kid got a six on his test."},{"t":32.24,"x":"The teacher ripped me a new one all afternoon."},{"t":35.3,"x":"I was so embarrassed."},{"t":36.76,"x":"Next time, no matter whose parent teacher conference it is,"},{"t":39.52,"x":"I'm not going."}],"media":"media/6aacfbdc000000000b002e93.mp4","images":[]},{"kind":"video","noteId":"6aa3c183000000002600a97e","creator":"开心学英语","title":"情景英语：工作中的遭遇！","publishedAt":"2026-09-11T08:53:23Z","durationSeconds":332.6,"likes":"8167","noteUrl":"https://www.xiaohongshu.com/user/profile/69cf8d170000000032036d59/6aa3c183000000002600a97e?xsec_token=ABOEOvAiJfPqdric2HyjHDg5jD5GY1-N8U5J43aUDuKWk=&xsec_source=pc_user","ipLocation":"黑龙江","summary":"一条 5 分半的办公室情景合集，把新人最容易踩的坑全演了一遍：打印机不会用、被指着干活、被抢功劳、请假被怼、最后因为迟到早退被开除。","tags":["职场英语","情景对话","新人生存"],"keyPoints":["求助前先自己试：Maybe give it a shot on your own before you ask someone to walk you through it","优先级要能说清楚：Your priority should be your core responsibilities","被抢功劳可以直接问：How come she gets all the credit?","进度要主动报：You can't just keep your head down or people might think you're slacking off","健康优先的收尾句：We work to live, not live to work"],"patterns":[{"en":"black and white, double-sided","zh":"黑白、双面（打印）","usage":"交代打印任务时的标准说法","example":"Can you print two copies, black and white, double-sided?","start":0.34},{"en":"Figure it out yourself.","zh":"自己想办法。","usage":"冷淡地拒绝手把手教；学的时候要知道对方在敷衍","example":"Figure it out yourself. That's how all new interns learn.","start":26.74},{"en":"If you're stuck, just ask your cohorts.","zh":"卡住了就去问同批进来的人。","usage":"cohorts 指同期同事，比 colleagues 更具体","example":"If you're stuck, just ask your cohorts. Stay on top of your work.","start":39.42},{"en":"Would you mind stepping over here?","zh":"方便过来一下吗？","usage":"把同事叫到一边谈话，比 come here 客气","example":"Would you mind stepping over here? I have something to discuss with you.","start":58.36},{"en":"Could I ask for your advice?","zh":"能请教你一下吗？","usage":"向资深同事求教的开场","example":"I'm not sure how to go about it. Could I ask for your advice?","start":75},{"en":"put together a rough draft first","zh":"先攒个初稿","usage":"让对方先有产出，而不是空手来问","example":"You need to put together a rough draft first, then I can point you in the right direction.","start":87.92},{"en":"Crank it out.","zh":"赶紧赶出来。","usage":"催活的口语说法，带点不耐烦","example":"The manager needs the new product video urgently. Crank it out.","start":102.64},{"en":"I'm swamped.","zh":"我忙炸了。","usage":"比 I'm busy 更有画面，也更容易换来体谅","example":"I'm swamped. Just get it done and send it over by 10, okay?","start":109.36},{"en":"keep your focus on what truly matters","zh":"把精力放在真正重要的事上","usage":"主管讲优先级时的说法","example":"Assist with other tasks when time permits, but always keep your focus on what truly matters.","start":224.09},{"en":"How come she gets all the credit?","zh":"凭什么功劳都算她的？","usage":"How come 是口语里的「凭什么/怎么会」","example":"But didn't you do all that work? How come she gets all the credit?","start":138.06},{"en":"It's your call.","zh":"你自己决定。","usage":"把决定权交回给对方，同时不承担后果","example":"If you leave early, you'll lose your attendance bonus. It's your call.","start":155.96},{"en":"slacking off","zh":"摸鱼、偷懒","usage":"描述工作态度不积极","example":"You can't just keep your head down or people might think you're slacking off.","start":175.61},{"en":"Health comes first.","zh":"健康第一。","usage":"劝人休息时的收尾句","example":"Take a few days off and rest at home. Health comes first.","start":297.13},{"en":"We work to live, not live to work.","zh":"为生活而工作，不为工作而活","usage":"反内卷金句，适合收尾","example":"We work to live, not live to work. Don't let it break you down.","start":302.89},{"en":"I am sorry to inform you that you are fired.","zh":"很遗憾地通知你，你被解雇了。","usage":"正式通知句型，I am sorry to inform you 是固定开头","example":"I am sorry to inform you that you are fired. — I will leave after handing over my work.","start":325.67},{"en":"People who do solid work will never be overlooked.","zh":"踏实做事的人不会被埋没。","usage":"表扬 + 给信心，solid work 比 good work 更实","example":"You do a good job. People who do solid work will never be overlooked.","start":272.54}],"quotes":[{"text":"Work is different from school. Maybe give it a shot on your own before you ask someone to walk you through it.","start":93.96,"matched":true},{"text":"We work to live, not live to work. Don't let it break you down.","start":302.89,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.34,"x":"I just sent you a file. Can you print two copies, black and white, double-sided?"},{"t":4.34,"x":"Okay, but we don't have a color printer."},{"t":6.34,"x":"Black and white is fine."},{"t":7.34,"x":"How many copies would you like?"},{"t":10.34,"x":"Two copies."},{"t":12.62,"x":"Single-sided?"},{"t":13.62,"x":"Double-sided! Double-sided!"},{"t":16.45,"x":"Excuse me, I'm new here. Could you show me how to fill out this form?"},{"t":19.45,"x":"I'm busy. Just look it up online yourself."},{"t":21.45,"x":"Alright, thanks."},{"t":23.74,"x":"Excuse me, could you show me how to use this printer?"},{"t":26.74,"x":"Figure it out yourself. That's how all new interns learn."},{"t":29.74,"x":"Okay, fine. Thank you."},{"t":33.66,"x":"What's taking you so long to print one file?"},{"t":36.06,"x":"Sorry, it's my first time using the office printer."},{"t":38.22,"x":"Still trying to work it out."},{"t":39.42,"x":"If you're stuck, just ask your cohorts."},{"t":41.3,"x":"Stay on top of your work."},{"t":43.84,"x":"Got it."},{"t":45.62,"x":"Keep the door open during work hours."},{"t":47.3,"x":"OK."},{"t":48.6,"x":"The air conditioner is on."},{"t":49.68,"x":"Keep the door closed."},{"t":50.76,"x":"Don't waste electricity."},{"t":53.52,"x":"So my words don't count anymore, huh?"},{"t":55.4,"x":"I told you."},{"t":56.24,"x":"Door stays open."},{"t":58.36,"x":"Would you mind stepping over here?"},{"t":59.6,"x":"I have something to discuss with you."},{"t":61.24,"x":"Would you two please discuss this?"},{"t":62.96,"x":"Should we leave the door open or keep it closed?"},{"t":66.46,"x":"It doesn't matter if it's open or closed, right?"},{"t":69.72,"x":"Excuse me, do you have a minute?"},{"t":71.84,"x":"What's going on?"},{"t":72.68,"x":"The manager asked me to write a project plan,"},{"t":75,"x":"but I'm not sure how to go about it."},{"t":76.56,"x":"Could I ask for your advice?"},{"t":78,"x":"Sure, send me what you've got"},{"t":79.72,"x":"and I'll give it a once over."},{"t":81.8,"x":"I haven't actually written anything yet."},{"t":83.8,"x":"Well, it's not like I can write it for you, right?"},{"t":86.24,"x":"There's a template in the group chat."},{"t":87.92,"x":"You need to put together a rough draft first,"},{"t":89.96,"x":"then I can point you in the right direction."},{"t":92.6,"x":"That makes sense."},{"t":93.96,"x":"Work is different from school."},{"t":95.76,"x":"Maybe give it a shot on your own"},{"t":97.32,"x":"before you ask someone to walk you through it."},{"t":99.84,"x":"Got it."},{"t":100.84,"x":"I'll draft it fore I check in."},{"t":175.61,"x":"You can't just keep your head down"},{"t":177.53,"x":"or people might think you're slacking off."},{"t":179.85,"x":"But what am I supposed to say"},{"t":181.29,"x":"if I haven't finished it yet."},{"t":183.03,"x":"You should give daily progress updates."},{"t":185.33,"x":"That way the manager knows you're on top of your work."},{"t":188.57,"x":"Got it, thanks."},{"t":189.57,"x":"I'll keep him posted."},{"t":190.93,"x":"Could you grab my packets from the lobby?"},{"t":192.81,"x":"I texted you the pickup code."},{"t":194.21,"x":"Sure, no problem."},{"t":197.46,"x":"Where should I put your packages?"},{"t":199.06,"x":"You can leave them right here, please."},{"t":200.9,"x":"Could you please organize these files by category?"},{"t":203.78,"x":"But I still have other tasks to complete."},{"t":205.74,"x":"Could you do this first?"},{"t":206.78,"x":"It's urgent."},{"t":208.9,"x":"All right."},{"t":209.74,"x":"Have you finished the data report I assigned to you?"},{"t":212.81,"x":"I'm sorry, I haven't finished it yet."},{"t":215.85,"x":"This is a straightforward task, why has it taken you so long?"},{"t":219.37,"x":"I assisted colleagues with some other tasks today and that slowed down my progress."},{"t":224.09,"x":"Your priority should be your core responsibilities, assist with other tasks when time permits,"},{"t":229.29,"x":"but always keep your focus on what truly matters."},{"t":232.21,"x":"Who's going to take the lead on this event proposal?"},{"t":234.57,"x":"I'll take care of this and send it to you tomorrow."},{"t":237.62,"x":"Lisa, I'm swamp with client meetings. I need you to get the event proposal done today."},{"t":242.62,"x":"Ah, fine."},{"t":244.82,"x":"Who put this event proposal together?"},{"t":246.82,"x":"I'm sorry, Mr. Wang. I planned to handle this myself, but I was swamped with work, so I passed the task off to Lisa."},{"t":253.94,"x":"So Lisa did the whole thing?"},{"t":254.94,"x":"Yes! She did it all on her own!"} const state = { q: '', creator: null, date: null };

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtTime = (sec) => {
  if (sec === null || sec === undefined) return null;
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
};
const fmtDate = (iso) => (iso ? String(iso).slice(0, 10) : '');
const highlight = (text) => {
  const q = state.q.trim();
  const safe = esc(text);
  if (!q) return safe;
  const pattern = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try { return safe.replace(new RegExp(pattern, 'gi'), (m) => '<mark>' + m + '</mark>'); } catch { return safe; }
};

function searchable(card) {
  return [
    card.creator, card.title, card.summary, (card.keyPoints ?? []).join(' '),
    (card.patterns ?? []).map((p) => [p.en, p.zh, p.usage, p.example].join(' ')).join(' '),
    card.zhQuestion, card.zhReference, card.enQuestion, card.enReference,
    (card.idiomatic ?? []).map((it) => [it.orig, it.better, it.why].join(' ')).join(' '),
    (card.transcript ?? []).map((seg) => seg.x).join(' '),
  ].join(' ').toLowerCase();
}

function patternMatches(card, q) {
  if (!q) return true;
  const hay = searchable(card);
  return q.toLowerCase().split(/\s+/).every((token) => hay.includes(token));
}

// 卡片没写到的说法，也能从视频原话里捞出来
function transcriptHits(card, q) {
  if (!q || !card.transcript || card.transcript.length === 0) return [];
  const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (tokens.length === 0) return [];
  return card.transcript
    .filter((seg) => tokens.every((token) => String(seg.x).toLowerCase().includes(token)))
    .slice(0, 3);
}

function cover(card) {
  const accent = DATA.palette[card.creator] || { bg: '#dcdad2', fg: '#1a1a18' };
  const isImage = card.kind === 'image';
  const heading = isImage ? (card.zhQuestion || card.title) : card.title;
  const sub = isImage ? card.enQuestion : '';
  const meta = [];
  meta.push('<span class="who-name">' + esc(card.creator) + '</span>');
  meta.push('<span>' + fmtDate(card.publishedAt) + '</span>');
  if (isImage) meta.push('<span class="badge">图文</span>');
  else if (card.durationSeconds) meta.push('<span>' + Math.round(card.durationSeconds / 60 * 10) / 10 + ' 分钟</span>');
  return `<div class="cover">
    <div class="who">${meta.join('')}</div>
    <h2>${highlight(heading)}</h2>
    ${sub ? `<div class="en-sub">${highlight(sub)}</div>` : ''}
  </div>`;
}

function imageBody(card) {
  const parts = [];
  const rows = [];
  if (card.zhReference) {
    rows.push(`<div class="qa-row"><span class="qa-label">中文参考</span><p class="qa-zh">${highlight(card.zhReference)}</p></div>`);
  }
  if (card.enReference) {
    rows.push(`<div class="qa-row"><span class="qa-label">英文原文</span><p class="qa-en">${highlight(card.enReference)}</p></div>`);
  }
  if (rows.length) parts.push(`<div class="qa">${rows.join('')}</div>`);

  // 整段改写：这是主体，逐处改动只是它下面的脚注
  if (String(card.idiomaticFull ?? '').trim()) {
    parts.push('<h3>全篇地道版</h3><p class="full-en">' + highlight(card.idiomaticFull) + '</p>');
  }

  if ((card.idiomatic ?? []).length) {
    parts.push('<h3>改了什么</h3><div class="idioms">' + card.idiomatic.map((it) => `<div class="idiom">
      <div class="was">${highlight(it.orig)}</div>
      <div class="now">${highlight(it.better)}</div>
      <div class="why">${highlight(it.why)}</div>
    </div>`).join('') + '</div>');
  }

  if ((card.keyPoints ?? []).length) {
    parts.push('<h3>要点</h3><ul class="points">' + card.keyPoints.map((p) => '<li>' + highlight(p) + '</li>').join('') + '</ul>');
  }

  if ((card.images ?? []).length) {
    parts.push('<h3>原图</h3><div class="slides">' + card.images.map((src, i) =>
      `<a href="${esc(src)}" target="_blank" rel="noreferrer"><img src="${esc(src)}" alt="原图 ${i + 1}" loading="lazy" /></a>`).join('') + '</div>');
  }
  return parts.join('');
}

function videoBody(card, q) {
  const parts = [];
  const hits = transcriptHits(card, q);
  if (hits.length) {
    parts.push('<div class="hits"><h3>视频里说到的地方</h3>' + hits.map((hit) => `<div class="hit">
      <div class="rail"><button class="time" data-t="${hit.t}" data-note="${esc(card.noteId)}" title="跳到视频这一秒（Shift+点击复制时间）">${fmtTime(hit.t)}</button></div>
      <span class="hit-text">${highlight(hit.x)}</span>
    </div>`).join('') + '</div>');
  }
  parts.push(`<p class="summary">${highlight(card.summary)}</p>`);
  if (card.partial) parts.push(`<div class="flag">${esc(card.partialReason)}</div>`);
  if ((card.keyPoints ?? []).length) {
    parts.push('<h3>要点</h3><ul class="points">' + card.keyPoints.map((p) => '<li>' + highlight(p) + '</li>').join('') + '</ul>');
  }
  if ((card.patterns ?? []).length) {
    parts.push('<h3>可复用句型</h3><div class="patterns">' + card.patterns.map((p) => `<div class="pattern">
      <div class="rail">${p.start !== null && p.start !== undefined ? `<button class="time" data-t="${p.start}" data-note="${esc(card.noteId)}" title="跳到视频这一秒（Shift+点击复制时间）">${fmtTime(p.start)}</button>` : ''}</div>
      <div>
        <div class="pat-head"><span class="en">${highlight(p.en)}</span><span class="zh">${highlight(p.zh)}</span></div>
        <div class="usage">${highlight(p.usage)}</div>
        <div class="ex">${highlight(p.example)}</div>
      </div>
    </div>`).join('') + '</div>');
  }
  if (card.media) parts.push('<div class="player" hidden></div>');
  return parts.join('');
}

function actionsFor(card) {
  const acts = [`<a class="act" href="${esc(card.noteUrl)}" target="_blank" rel="noreferrer">看原笔记</a>`];
  if (card.media) acts.push(`<button class="act" data-play="${esc(card.noteId)}">播放整段</button>`);
  if ((card.patterns ?? []).length) acts.push(`<button class="act" data-copy="${esc(card.noteId)}">复制全部句型</button>`);
  return '<div class="actions">' + acts.join('') + '</div>';
}

function render() {
  const q = state.q.trim();
  const cards = DATA.cards.filter((c) =>
    patternMatches(c, q) &&
    (!state.creator || c.creator === state.creator) &&
    (!state.date || dayOf(c) === state.date)
  );

  syncCreators();
  syncDates();

  const where = state.creator ? esc(state.creator) : '全部博主';
  const when = state.date ? ' · ' + esc(state.date) : '';
  const videos = cards.filter((c) => c.kind === 'video').length;
  const images = cards.length - videos;
  const parts = [];
  if (videos) parts.push(videos + ' 条视频');
  if (images) parts.push(images + ' 篇图文');
  document.getElementById('crumb').innerHTML =
    '<b>' + where + '</b>' + when + ' · ' + (cards.length === 0 ? '没有内容' : parts.join(' + '));

  document.getElementById('list').innerHTML = cards.length === 0
    ? '<div class="empty">这里还没有内容。换个博主、换个日期，或者清空搜索试试。</div>'
    : cards.map((card) => {
        const accent = DATA.palette[card.creator] || { bg: '#dcdad2', fg: '#1a1a18' };
        return `<article data-card="${esc(card.noteId)}" style="--accent:${accent.bg};--accent-fg:${accent.fg}">
          ${cover(card)}
          <div class="body">${card.kind === 'image' ? imageBody(card) : videoBody(card, q)}${actionsFor(card)}</div>
        </article>`;
      }).join('');

  wirePlayers();
}

// 原片拿不到时（比如网页被单独发到手机、media 文件夹没跟过去）给一句人话，
// 而不是留一个点了没反应的黑框。
const markNoMedia = (box) => {
  if (box.dataset.dead === '1') return;
  box.dataset.dead = '1';
  box.hidden = false;
  box.innerHTML = '<p class="flag">原片在电脑上。单独把网页发到手机就播不了，连同一个 Wi-Fi 用桌面「手机上看知识库」才有视频。</p>';
};

function ensurePlayer(card) {
  if (!card || !card.media) return null;
  const article = document.querySelector('article[data-card="' + card.noteId + '"]');
  if (!article) return null;
  const box = article.querySelector('.player');
  if (!box) return null;
  if (box.dataset.dead === '1') return null;
  box.hidden = false;
  let video = box.querySelector('video');
  if (!video) {
    video = document.createElement('video');
    video.controls = true;
    video.preload = 'metadata';
    video.src = card.media;
    const watchdog = setTimeout(() => { if (video.readyState < 1) markNoMedia(box); }, 4000);
    video.addEventListener('loadedmetadata', () => clearTimeout(watchdog));
    video.addEventListener('error', () => { clearTimeout(watchdog); markNoMedia(box); });
    box.appendChild(video);
  }
  return video;
}

function wirePlayers() {
  // 时间戳直接播本地已下载的原片段，不用再开小红书（小红书走系统代理会被风控）
  document.querySelectorAll('[data-t]').forEach((btn) => {
    btn.addEventListener('click', (event) => {
      if (event.shiftKey) {
        if (navigator.clipboard) navigator.clipboard.writeText(btn.textContent.trim()).catch(() => {});
        return;
      }
      const card = DATA.cards.find((c) => c.noteId === btn.dataset.note);
      const video = ensurePlayer(card);
      if (!video) {
        navigator.clipboard && navigator.clipboard.writeText(btn.textContent.trim()).catch(() => {});
        return;
      }
      const second = Number(btn.dataset.t) || 0;
      const seek = () => {
        video.currentTime = second;
        const playing = video.play();
        if (playing && playing.catch) playing.catch(() => {});
      };
      if (video.readyState >= 1) seek();
      else video.addEventListener('loadedmetadata', seek, { once: true });
      const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      video.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'center' });
    });
  });

  document.querySelectorAll('[data-play]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const card = DATA.cards.find((c) => c.noteId === btn.dataset.play);
      const video = ensurePlayer(card);
      if (video && video.play) video.play().catch(() => {});
    });
  });

  document.querySelectorAll('[data-copy]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const card = DATA.cards.find((c) => c.noteId === btn.dataset.copy);
      if (!card) return;
      const text = [
        card.creator + ' · ' + card.title,
        '',
        ...card.patterns.map((p) => `${p.en} | ${p.zh}
  ${p.example}`),
      ].join('\n');
      try { await navigator.clipboard.writeText(text); btn.textContent = '已复制'; } catch { btn.textContent = '复制失败'; }
      setTimeout(() => { btn.textContent = '复制全部句型'; }, 1400);
    });
  });
}

/* ------------------------------------------------ 左栏：博主 + 发布日期 */

const cardsOf = (creator) => DATA.cards.filter((c) => !creator || c.creator === creator);
const dayOf = (card) => String(card.publishedAt ?? '').slice(0, 10);

function readHash() {
  const params = new URLSearchParams(location.hash.replace(/^#/, ''));
  const raw = params.get('c');
  const date = params.get('d');
  return {
    // undefined = 没选过（用默认博主）；null = 明确选了「全部博主」
    creator: raw === null ? undefined : (raw === 'all' ? null : (DATA.creators.includes(raw) ? raw : undefined)),
    date: date || null,
  };
}

function writeHash() {
  const params = new URLSearchParams();
  params.set('c', state.creator ?? 'all');
  if (state.date) params.set('d', state.date);
  const target = '#' + params.toString();
  try { history.replaceState(null, '', target); } catch { /* file:// 某些情况下不允许，忽略 */ }
}

function renderCreators() {
  const box = document.getElementById('creatorNav');
  const items = [{ key: null, label: '全部博主', count: DATA.cards.length }]
    .concat(DATA.creators.map((name) => ({
      key: name,
      label: name,
      count: cardsOf(name).length,
      colors: DATA.palette[name],
    })));

  box.innerHTML = items.map((item) => {
    const colors = item.colors ? `style="--accent:${item.colors.bg};--accent-fg:${item.colors.fg}"` : '';
    return `<button type="button" data-creator="${item.key === null ? '' : esc(item.key)}" ${colors}>
      <span>${esc(item.label)}</span><span class="n">${item.count}</span>
    </button>`;
  }).join('');

  box.querySelectorAll('[data-creator]').forEach((el) => el.addEventListener('click', () => {
    state.creator = el.dataset.creator || null;
    state.date = null;
    writeHash();
    renderCreators();
    renderDates();
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }));
}

function syncCreators() {
  document.querySelectorAll('#creatorNav [data-creator]').forEach((el) => {
    el.dataset.on = (el.dataset.creator || null) === state.creator ? '1' : '0';
  });
}

function renderDates() {
  const box = document.getElementById('dateNav');
  const block = document.getElementById('dateBlock');
  const scoped = cardsOf(state.creator);
  const counts = new Map();
  for (const card of scoped) {
    const day = dayOf(card);
    if (day) counts.set(day, (counts.get(day) ?? 0) + 1);
  }
  const days = [...counts.keys()].sort().reverse();
  block.hidden = days.length === 0;

  box.innerHTML = [{ key: null, label: '全部日期', count: scoped.length }]
    .concat(days.map((day) => ({ key: day, label: day.slice(5), count: counts.get(day), title: day })))
    .map((item) => `<button type="button" data-date="${item.key ?? ''}" title="${esc(item.title ?? '')}">
      <span>${esc(item.label)}</span><span class="n">${item.count}</span>
    </button>`).join('');

  box.querySelectorAll('[data-date]').forEach((el) => el.addEventListener('click', () => {
    state.date = el.dataset.date || null;
    writeHash();
    renderDates();
    render();
  }));
}

function syncDates() {
  document.querySelectorAll('#dateNav [data-date]').forEach((el) => {
    el.dataset.on = (el.dataset.date || null) === state.date ? '1' : '0';
  });
}

document.getElementById('stats').innerHTML = [
  '<span><b>' + DATA.stats.cards + '</b> 条视频</span>',
  '<span><b>' + DATA.stats.imageCards + '</b> 篇图文</span>',
  '<span><b>' + DATA.stats.patterns + '</b> 个句型</span>',
  DATA.stats.fullRewrites ? '<span><b>' + DATA.stats.fullRewrites + '</b> 篇全篇地道版</span>' : '',
  DATA.stats.rewrites ? '<span><b>' + DATA.stats.rewrites + '</b> 处改动说明</span>' : '',
  '<span><b>' + DATA.stats.creators + '</b> 位博主</span>',
].filter(Boolean).join('');
document.getElementById('foot').textContent = '上次更新 ' + DATA.generatedAt.slice(0, 16).replace('T', ' ');

document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
// 默认落在最近更新的那位博主身上，首页不再把所有博主的稿子一次性铺开
const initial = readHash();
state.creator = initial.creator === undefined ? (DATA.creators[0] ?? null) : initial.creator;
state.date = initial.date;
writeHash();
renderCreators();
renderDates();
render();
</script>
</body>
</html>
