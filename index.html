:"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44d60000000001a029e90?xsec_token=ABJJEVXqZom342wHuvi159oecZ0AgVQuy0kHnvFZHs7bs=&xsec_source=pc_user","ipLocation":"安徽","summary":"这条视频用一连串生活场景对话，教人描述物品“出状况”时该怎么说英语：碗磕了口、椅子晃、金属凹了，还有“这里的东西都旧了”。跟着看能学会 chipped、wobbly、dented 这类高频形容词，以及 seen better days 这种地道说法。","tags":["日常英语","英语口语","地道表达","状态形容词"],"keyPoints":["视频用一个接一个的实物场景（缺口的碗、摇晃的椅子、凹陷的金属），把描述物品破损状态的形容词串起来教。","chipped、wobbly、dented 都用来形容东西“有毛病”，但分别对应缺口、晃动、凹陷三种不同情况。","除了单词，还教了两个地道说法：seen better days 和 used to be in much better condition，用来形容东西旧了、不如从前。","每出现一个新词，对话里都会紧跟一句解释或追问，方便理解词的准确含义。"],"patterns":[{"en":"chipped","zh":"有缺口的、磕破的","usage":"形容碗盘、杯子等边缘掉了一小块时用。","example":"Oh, it's chipped.","sourceIndex":0,"start":4.98},{"en":"wobbly","zh":"摇晃的、不稳的","usage":"形容桌椅等因为不稳而会晃动的物体时用。","example":"It's wobbly.","sourceIndex":1,"start":14.18},{"en":"dented","zh":"有凹陷的、被撞瘪的","usage":"形容金属等硬物表面被撞出坑时用。","example":"Oh, it's dented.","sourceIndex":2,"start":24.66},{"en":"a small piece broke off","zh":"掉了一小块","usage":"解释某处缺口是怎么形成的时候用。","example":"You mean a small piece broke off?","sourceIndex":3,"start":6.98},{"en":"seen better days","zh":"不如从前了、有点旧了","usage":"委婉地说东西虽然还能用，但状态已经很旧很差时用。","example":"everything around here has seen better days","sourceIndex":4,"start":29.14}],"quotes":[{"text":"Wait, why is there a piece missing from this bowl?","start":0,"matched":true},{"text":"Oh, it's chipped.","start":4.98,"matched":true},{"text":"So it moves because it's not stable?","start":16.18,"matched":true},{"text":"everything around here has seen better days","start":29.14,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Wait, why is there a piece missing from this bowl?"},{"t":4.98,"x":"Oh, it's chipped."},{"t":6.18,"x":"Chipped?"},{"t":6.98,"x":"You mean a small piece broke off?"},{"t":9.14,"x":"Yeah, exactly."},{"t":10.26,"x":"Great."},{"t":11.7,"x":"Whoa, what's wrong with this chair?"},{"t":14.18,"x":"It's wobbly."},{"t":15.22,"x":"Wobbly?"},{"t":16.18,"x":"So it moves because it's not stable?"},{"t":19.46,"x":"Yeah, that's right."},{"t":20.82,"x":"Wonderful."},{"t":22.74,"x":"What happened to that?"},{"t":24.1,"x":"This?"},{"t":24.66,"x":"Oh, it's dented."},{"t":26.34,"x":"Dented?"},{"t":27.06,"x":"See how the metal got pushed in right here?"},{"t":29.14,"x":"that's a dent oh I see so that's a dent yeah everything around here has seen"},{"t":36.62,"x":"better days seen better days are you saying that all of this stuff used to"},{"t":41.1,"x":"be in much better condition yeah exactly hmm you've seen better days too excuse"},{"t":47.26,"x":"me nothing no no what did you say"}],"media":"media/6ac44d60000000001a029e90.mp4","images":[]},{"kind":"video","noteId":"6ac44d2c000000001a029e2b","creator":"William","title":"合租室友太双标，你会如何应对？","publishedAt":"2026-10-07T10:22:01.000Z","durationSeconds":41.7,"likes":"41","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44d2c000000001a029e2b?xsec_token=ABJJEVXqZom342wHuvi159oZ0ltMB8zFdCwJ5b-dodJ60=&xsec_source=pc_user","ipLocation":"安徽","summary":"这是一段合租室友吵架的口语对话，William 和室友互相指责对方邋遢、不体谅人、双标，最后以「放马过来吧」收场。视频把吵架时高频的地道表达逐个拆解并解释含义，适合学习如何用英语表达不满、反问和回怼。","tags":["英语口语","地道表达","合租冲突","吵架回怼"],"keyPoints":["视频用一段室友争执的短对话，演示了英语吵架时最常用的指责、反问和挑衅表达。","每个关键词都会立刻用英文解释一遍，例如 slob、inconsiderate、hypocrite 的含义。","反问句 Are you saying...? 是这对话里推动冲突升级的核心句式。","结尾的 Come at me, bro. 是口语中很有挑衅感的说法，语气比字面意思更强硬。"],"patterns":[{"en":"You're such a slob.","zh":"你真是太邋遢了。","usage":"直接指责对方又脏又乱、不收拾时使用。","example":"You're such a slob.","sourceIndex":0,"start":0},{"en":"At least I'm not inconsiderate.","zh":"至少我没那么不体谅人。","usage":"被指责后用来自我辩护，同时反手讽刺对方。","example":"Excuse me? At least I'm not inconsiderate.","sourceIndex":1,"start":7.04},{"en":"Are you saying ...?","zh":"你是在说……吗？","usage":"确认对方话里的隐含意思，通常带点火药味。","example":"Are you saying I don't care how my actions affect other people?","sourceIndex":2,"start":12.16},{"en":"You're such a hypocrite.","zh":"你真是个双标的人。","usage":"说别人说一套做一套、只要求别人不要求自己时使用。","example":"Oh please, you're such a hypocrite.","sourceIndex":3,"start":21.52},{"en":"Practice what you preach.","zh":"自己先做到再要求别人。","usage":"批评对方光会嘴上讲道理、自己却不照做时用。","example":"Practice what you preach.","sourceIndex":4,"start":29.54},{"en":"Come at me, bro.","zh":"放马过来吧，兄弟。","usage":"口语里带挑衅意味地表示随时奉陪、不服就打。","example":"Come at me, bro.","sourceIndex":5,"start":38.1}],"quotes":[{"text":"Are you serious? Look at this place. You're such a slob.","start":0,"matched":true},{"text":"Excuse me? At least I'm not inconsiderate.","start":7.04,"matched":true},{"text":"You leave your dirty dishes in the sink every night.","start":17.52,"matched":true},{"text":"Come at me, bro.","start":38.1,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Are you serious? Look at this place. You're such a slob."},{"t":3.52,"x":"A slob? You mean someone who's really messy?"},{"t":7.04,"x":"Yes. Look around. Excuse me? At least I'm not inconsiderate."},{"t":12.16,"x":"Inconsiderate me? Are you saying I don't care how my actions affect other people?"},{"t":17.52,"x":"Exactly. You leave your dirty dishes in the sink every night."},{"t":21.52,"x":"Oh please, you're such a hypocrite."},{"t":23.92,"x":"A hypocrite? Like I tell you what to do but I don't even do it myself?"},{"t":28.16,"x":"Exactly."},{"t":29.54,"x":"Practice what you preach."},{"t":31.1,"x":"Practice what you preach?"},{"t":32.18,"x":"Are you telling me that I can't tell you this stuff"},{"t":34.3,"x":"because I don't do it myself?"},{"t":35.82,"x":"Yeah."},{"t":36.7,"x":"Okay, you know what?"},{"t":38.1,"x":"Come at me, bro."},{"t":38.94,"x":"Oh, are you sure?"},{"t":39.78,"x":"Are you sure?"},{"t":40.62,"x":"Come on."}],"media":"media/6ac44d2c000000001a029e2b.mp4","images":[]},{"kind":"video","noteId":"6ac44cfe000000001500f89c","creator":"William","title":"遇到这些情况，你会用英语描述吗？","publishedAt":"2026-10-07T04:21:00.000Z","durationSeconds":41.5,"likes":"39","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44cfe000000001500f89c?xsec_token=ABJJEVXqZom342wHuvi159oSRe0Cw3wwUywMOxJksJLyM=&xsec_source=pc_user","ipLocation":"安徽","summary":"这段视频还原了面对一团糟的厨房时，如何用英语吐槽脏乱场景。通过对话形式，可以学到描述黏手、掉渣、剩饭等日常生活问题的地道说法。","tags":["实用英语","日常口语","厨房场景","地道表达"],"keyPoints":["视频用一段厨房对话演示如何抱怨脏乱环境，场景非常贴近日常生活。","重点词汇包括 sticky（黏的）、crumbs（碎屑）、leftovers（剩饭）。","句型上涵盖了抱怨、追问、确认和决定行动等常见口语功能。"],"patterns":[{"en":"This kitchen is a mess.","zh":"这个厨房一团糟。","usage":"抱怨某个地方又脏又乱时用。","example":"This kitchen is a mess.","sourceIndex":0,"start":0},{"en":"I can't live like this anymore.","zh":"我再也受不了这样了。","usage":"表达对某种状况忍无可忍时用。","example":"I can't live like this anymore.","sourceIndex":1,"start":0},{"en":"Do you mean sticky?","zh":"你是说黏黏的吗？","usage":"对方描述不清时，用关键词帮他把意思说出来。","example":"Oh, do you mean sticky?","sourceIndex":2,"start":13.96},{"en":"get stuck to my feet","zh":"粘在我脚上。","usage":"描述碎屑、纸片之类的东西粘在脚底时用。","example":"all these crumbs just get stuck to my feet","sourceIndex":3,"start":28.24}],"quotes":[{"text":"This kitchen is a mess.","start":0,"matched":true},{"text":"I can't live like this anymore.","start":0,"matched":true},{"text":"Oh, do you mean sticky?","start":13.96,"matched":true},{"text":"I think it's time for me to clean","start":39.04,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Oh my god. What's going on? This kitchen is a mess. I can't live like this anymore. Like the counter it's"},{"t":7.64,"x":"it's not wet, but"},{"t":9.76,"x":"it's like"},{"t":11.48,"x":"glue my hand is like"},{"t":13.96,"x":"Staying on it. Oh, do you mean sticky? Yeah sticky disgusting and when I walk all these little food"},{"t":22.64,"x":"Pieces, they just you know attack my feet. Oh, yeah all these crumbs"},{"t":28.24,"x":"yeah crumbs all these crumbs just get stuck to my feet and then you know you"},{"t":33.4,"x":"eat but then there's some food left afterwards oh yeah leftovers yeah I"},{"t":39.04,"x":"think it's time for me to clean"}],"media":"media/6ac44cfe000000001500f89c.mp4","images":[]},{"kind":"video","noteId":"6ac44cc7000000001500f814","creator":"William","title":"当你遇到这人这事，你会说...？","publishedAt":"2026-10-06T10:22:01.000Z","durationSeconds":46.6,"likes":"44","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44cc7000000001500f814?xsec_token=ABJJEVXqZom342wHuvi159oQNhLq9RVozPKtlPKhz2YKo=&xsec_source=pc_user","ipLocation":"安徽","summary":"这是一条生活场景英语短视频：William 在吃东西时被人直接伸手拿食物，他语气不好地回了一句，对方听不懂，于是顺势讲解 snap at someone 这个表达。看完能学会几个拿别人食物、被人凶、偷吃一口等日常互动里的地道说法。","tags":["生活英语","英语口语","地道表达","词汇辨析"],"keyPoints":["to snap at someone 指带着怒气和刻薄的语气对人说话，不一定是大喊。","steal a bite 是口语里「偷吃一口、蹭一口」的说法，常用来指没打招呼就吃别人东西。","视频用「没问过就拿我吃的」和「snap at someone」两个点串起了一段很日常的对话。","遇到听不懂的表达时，可以直接用 what does that mean 追问。"],"patterns":[{"en":"you didn't have to ...","zh":"你没必要……","usage":"觉得对方反应过激、做得太过了的时候说。","example":"you didn't have to snap at me like that","sourceIndex":0,"start":5.91},{"en":"snap at someone","zh":"冲某人发火","usage":"形容因为生气而语气很冲、很刻薄地回应别人。","example":"to snap at someone means to speak angrily and harshly","sourceIndex":1,"start":11.79},{"en":"steal a bite","zh":"偷吃一口、蹭一口","usage":"说别人没问过就吃了一口你的东西。","example":"do you mean you don't like when people steal a bite?","sourceIndex":2,"start":32.37}],"quotes":[{"text":"you didn't have to snap at me like that","start":5.91,"matched":true},{"text":"I snapped at you because I don't like when people take my food without like asking","start":16.15,"matched":true},{"text":"I snap at people when they try to steal a bite.","start":32.37,"matched":true},{"text":"can I have some now?","start":42.33,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.24,"x":"Hey, what you doing? I'm eating. Oh, yeah, let me have some whoa. No"},{"t":5.91,"x":"What are you whoa you didn't have to snap at me like that wait what snap"},{"t":11.79,"x":"Wait, what what does that mean to snap at someone means to speak?"},{"t":16.15,"x":"Angrily and and harshly. Oh, yeah, I snapped at you because I don't like when people"},{"t":22.71,"x":"people take my food without like asking or just take my food in general do you"},{"t":32.37,"x":"mean you don't like when people steal a bite? oh yeah I snap at people when they"},{"t":38.01,"x":"try to steal a bite. where can I learn more of this vocabulary? oh you can"},{"t":42.33,"x":"always follow this account to learn more. can I have some now? no okay"}],"media":"media/6ac44cc7000000001500f814.mp4","images":[]},{"kind":"video","noteId":"6ac44c980000000018039101","creator":"William","title":"你在生活中会遇到这种人...？","publishedAt":"2026-10-06T03:40:04.000Z","durationSeconds":46.5,"likes":"154","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6ac44c980000000018039101?xsec_token=ABJJEVXqZom342wHuvi159obpjaGMf58Qn_yG7ULSCTsY=&xsec_source=pc_user","ipLocation":"安徽","summary":"这条视频用一段“最后一块饼干被吃掉”的争吵对话，演示了英语里指责对方时最常用的几个词。博主一人分饰两角，把 petty、defensive、overreacting、blow out of proportion 等词放进真实的互怼场景里，同时给出它们的解释。适合想学会在吵架时用地道英语表达不满的人。","tags":["英语口语","地道表达","争吵场景","词汇辨析"],"keyPoints":["视频只用一段饼干被吃掉的日常小冲突，就串起了四个互相指责的高频形容词和短语。","每个被指责的词后面，被指责的人都会反问一遍并复述它的意思，等于自带词典解释。","这些词都属于吵架时“说对方反应过度、太小气、太防御”的固定套路表达。","结尾用 blow something out of proportion 做了个喜剧式的升级，说明这个短语可以反过来威胁使用。"],"patterns":[{"en":"you're being so petty","zh":"你太斤斤计较了","usage":"觉得对方为一件小事较真、不值得计较时用。","example":"Oh my god, you're being so petty.","sourceIndex":0,"start":4.2},{"en":"get upset over something","zh":"因为某事而生气／不高兴","usage":"描述自己或别人为了某件具体的事恼火时用。","example":"Like I'm getting upset over something small and unimportant?","sourceIndex":1,"start":7.8},{"en":"Why are you getting so defensive?","zh":"你怎么这么玻璃心？","usage":"对方一被指出问题就急着辩解时反问。","example":"Why are you getting so defensive?","sourceIndex":2,"start":15.9},{"en":"You started it.","zh":"是你先挑起的。","usage":"把责任推回给对方、强调冲突由对方引起时用。","example":"You started it.","sourceIndex":3,"start":22.1},{"en":"You're completely overreacting.","zh":"你完全反应过度了。","usage":"认为对方的情绪或举动明显超过事情本身应得的程度时用。","example":"You're completely overreacting.","sourceIndex":4,"start":25.9},{"en":"blow this way out of proportion","zh":"小题大做、过度放大","usage":"说对方把一件小事搞成了大问题。","example":"Yes, you're blowing this way out of proportion.","sourceIndex":5,"start":32.76}],"quotes":[{"text":"Did you seriously eat the last cookie?","start":0,"matched":true},{"text":"I was saving that.","start":3.1,"matched":true},{"text":"It's a cookie.","start":12.2,"matched":true},{"text":"I'm just protecting myself because you're criticizing me.","start":19.2,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Did you seriously eat the last cookie?"},{"t":2.4,"x":"Yeah."},{"t":3.1,"x":"I was saving that."},{"t":4.2,"x":"Oh my god, you're being so petty."},{"t":6.6,"x":"Petty?"},{"t":7.8,"x":"Like I'm getting upset over something small and unimportant?"},{"t":11.1,"x":"Yes."},{"t":12.2,"x":"It's a cookie."},{"t":13.3,"x":"Well, maybe if you weren't so selfish."},{"t":15.9,"x":"Why are you getting so defensive?"},{"t":17.8,"x":"Defensive?"},{"t":19.2,"x":"I'm just protecting myself because you're criticizing me."},{"t":22.1,"x":"You started it."},{"t":23.2,"x":"Because you ate my cookie."},{"t":25.9,"x":"You're completely overreacting."},{"t":28.4,"x":"Overreacting?"},{"t":29.4,"x":"you think my reaction is stronger than the situation deserves?"},{"t":32.76,"x":"Yes, you're blowing this way out of proportion."},{"t":35.52,"x":"Are you saying I'm making the situation way more serious"},{"t":38.56,"x":"than it needs to be?"},{"t":39.52,"x":"Yeah."},{"t":40.36,"x":"Oh, you wanna see me blow something out of proportion?"},{"t":43.2,"x":"Are you serious right now?"},{"t":44.7,"x":"Let's see how you like that."}],"media":"media/6ac44c980000000018039101.mp4","images":[]},{"kind":"video","noteId":"6abfa28c00000000140383bc","creator":"瑞秋爱玛","title":"全英｜失业近五个月，只为等外企offer…","publishedAt":"2026-10-02T12:24:44Z","durationSeconds":217.3,"likes":"74","noteUrl":"https://www.xiaohongshu.com/user/profile/61361d670000000002019d71/6abfa28c00000000140383bc?xsec_token=ABv3RalkvFCSrUwbgHRIf3-_iJGkb2hLPypZDn95H5H9Y=&xsec_source=pc_user","ipLocation":"上海","summary":"在外企和私企都待过的亲身对比，从加班、工作范围、团队氛围、请假制度一路讲到年会，全程英语叙述，适合练「对比陈述」的句式。","tags":["全英播客","职场英语","对比论述"],"keyPoints":["对比类口播的万能结构：先立维度（加班/工作量/氛围/请假/年会），再逐条对比","描述公司文化的高频词：work-life boundaries、job scope、proper boundaries、office politics","讲自己的经历时用 During my stay at …, I would have to … 这种过去习惯句式","ASR 提示：结尾一段识别质量差（出现 keyboard 等无关词），引用时建议回看原片"],"patterns":[{"en":"respect work-life boundaries","zh":"尊重工作与生活的边界","usage":"形容公司不侵占私人时间","example":"Multinationals generally respect work-life boundaries.","sourceIndex":0,"start":27.79},{"en":"Once your tasks are wrapped up, you can log off.","zh":"活干完就能下线。","usage":"wrap up = 收尾完成，log off 比 leave 更贴线上办公","example":"Once your assigned tasks are wrapped up, you can log off.","sourceIndex":1,"start":35.79},{"en":"You are expected to stay reachable at work.","zh":"要求你随时能被联系上。","usage":"be expected to 表达隐性要求，比 must 更准","example":"In private companies, you are expected to stay reachable.","sourceIndex":2,"start":44.79},{"en":"a daily occurrence","zh":"每天都会发生的事","usage":"描述常态化的加班或状况","example":"Getting off work at 10pm is a daily occurrence.","sourceIndex":3,"start":46.79},{"en":"value efficiency over looking busy","zh":"看重效率，而不是看起来很忙","usage":"A over B 句式，对比两种取向","example":"Foreign companies value efficiency over looking busy.","sourceIndex":4,"start":72.95},{"en":"job boundaries tend to be blurry","zh":"职责边界往往很模糊","usage":"tend to be 表示普遍倾向","example":"For local private firms, job boundaries tend to be blurry.","sourceIndex":5,"start":77.63},{"en":"asking for leave still feels like asking for a favor","zh":"请假还是像在求人。","usage":"feel like + 动名词，描述主观感受","example":"In many private companies, asking for leave still feels like asking for a favor.","sourceIndex":6,"start":140.46}],"quotes":[{"text":"Foreign companies usually have clear job descriptions. Your responsibilities are well defined and value efficiency over looking busy.","start":70.15,"matched":true},{"text":"In many private companies, asking for leave still feels like asking for a favor.","start":140.46,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"As you guys know, I find a new job at a multinational company after five months of gap."},{"t":5.07,"x":"What you probably don't know is that one's worked at a private local company."},{"t":9.47,"x":"You may wonder what's the real difference between the two."},{"t":12.11,"x":"Today we are skipping those one-sided stereotypes."},{"t":15.07,"x":"Let's talk about the actual differences I've observed from overtime, workload, team"},{"t":20.59,"x":"vibe, leave policy all the way to annual parties."},{"t":25.95,"x":"First, overtime and working hours."},{"t":27.79,"x":"Multinationalists generally respect work-life boundaries."},{"t":31.79,"x":"Overtime is only for exceptional cases, never a counter-expectation."},{"t":35.79,"x":"Once your assigned tasks are wrapped up, you can log off."},{"t":39.79,"x":"The person time is respected, but private companies may operate with a different mindset."},{"t":44.79,"x":"You are expected to stay reachable at work."},{"t":46.79,"x":"During my stay at that private company, getting off work at 10pm is a daily occurrence."},{"t":51.79,"x":"If there happens to be a special occasion like annual meetings or exhibitions,"},{"t":55.79,"x":"decisions, I would have to stand by for the whole night."},{"t":58.79,"x":"I simply could not understand why there are so many things to do and why those things"},{"t":62.43,"x":"have to be done with such urgency."},{"t":67.95,"x":"Next workload and job scope."},{"t":70.15,"x":"Foreign companies usually have clear job descriptions."},{"t":72.95,"x":"Your responsibilities are where defined and value efficiency over looking busy."},{"t":77.63,"x":"For local private firms, job boundaries tend to be blurry."},{"t":81.11,"x":"It's common for one person to have multiple roles."},{"t":84.07,"x":"constantly take on unexpected extra work and absorb all sorts of emergency"},{"t":88.51,"x":"issues like changing water for bars fish tank. Then workplace atmosphere"},{"t":97.1,"x":"multinational teams are professional and polite, colleagues maintain proper boundaries."},{"t":101.54,"x":"We focus on getting things done with less emotional pressure or office politics."},{"t":106.02,"x":"In a private company the boss is more dictatorial than supportive and sometimes"},{"t":110.74,"x":"your boss could be the major source of pressure and uncomfortableness of your work."},{"t":114.46,"x":"For example, you may find yourself in a meeting listening to your boss rambling on and on and"},{"t":119.9,"x":"you have to pretend to stay for attention by scribbling away furiously, besides invisible"},{"t":125.94,"x":"internal competition and the pressure I usually have here."},{"t":131.91,"x":"At foreign companies, vocation is treated as your basic right."},{"t":135.05,"x":"You submit the application no need to over-explain or feel guilty for taking time off."},{"t":140.46,"x":"In many private companies, asking for leave still feels like asking for a favor."},{"t":145.42,"x":"You have to carefully explain your situation and worry about leaving your extra work for"},{"t":150.1,"x":"your team or leaving a bad impression on your manager."},{"t":154.13,"x":"In my case, another bothering issue is that a leave was released by the hour, meaning you"},{"t":158.45,"x":"have to work until you get eight hours to ask for a day's leave."},{"t":162.77,"x":"What can I say?"},{"t":163.77,"x":"Let's talk about annual parties."},{"t":169.65,"x":"Annual parties and multinationals are mostly for rest and rewards, good food,"},{"t":174.61,"x":"lucky draws, simple socializing."},{"t":177.25,"x":"No mandatory performances or meaningless formalities."},{"t":180.21,"x":"Private company annual parties are designed to boost team morale, which I'm not sure about."},{"t":184.53,"x":"The emphasised passion and the unity, which often means compulsory group activities and"},{"t":189.41,"x":"talent shows, are forced to act on state play, boosting about the greatness of the company."},{"t":196.05,"x":"As a newcomer, I was like,"},{"t":197.89,"x":"Mi ma to vi mi ma!"},{"t":200.01,"x":"Okay, now here is a keyboard."},{"t":202.45,"x":"the option is inherently better or worse. Your choice really depends on what you're prioritizing"},{"t":208.29,"x":"your career, so which one can start if it's you? Drop your thoughts in the comment below. Bye."}],"media":"media/6abfa28c00000000140383bc.mp4","images":[]},{"kind":"video","noteId":"6abf181a000000001c00f40b","creator":"William","title":"Do You Know...？","publishedAt":"2026-10-02T10:40:04Z","durationSeconds":63.4,"likes":"179","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6abf181a000000001c00f40b?xsec_token=ABv3RalkvFCSrUwbgHRIf3-7N39J2h9FxEPavOJ91SE7A=&xsec_source=pc_user","ipLocation":"安徽","summary":"室友没打招呼就搬走、当天还要塞个新室友进来。整段对话专门练「被突袭」「背着我做」「已成定局」这几组高频表达。","tags":["日常口语","冲突对话","室友沟通"],"keyPoints":["冲突场景里英语母语者很少直说「你怎么不告诉我」，而是用 blindside / behind my back 这类固定搭配","set in stone 用来表示「已经定了、不能改」，比 decided 更强调不可逆","pretty much 是口语里表示「基本上就是」的高频缩写式回答"],"patterns":[{"en":"blindside someone","zh":"突然袭击、把人打个措手不及","usage":"对方毫无预兆地抛来一个重大消息时","example":"You can't just blindside me like that.","sourceIndex":0,"start":5.66},{"en":"hit someone with huge news","zh":"甩给某人一个重磅消息","usage":"强调消息的分量和突然性","example":"You hit me with huge news with absolutely no warning.","sourceIndex":1,"start":5.66},{"en":"behind someone's back","zh":"背着某人（偷偷做）","usage":"发现对方瞒着自己行动时","example":"You did all of this behind my back?","sourceIndex":2,"start":19.64},{"en":"take matters into your own hands","zh":"自己动手把事情办了","usage":"等不及别人、决定自己解决","example":"Somebody had to take matters into their own hands.","sourceIndex":3,"start":30.1},{"en":"It's already set in stone.","zh":"已经板上钉钉了。","usage":"表示决定已定、不打算改","example":"It's too late. It's already set in stone.","sourceIndex":4,"start":40.82},{"en":"Pretty much.","zh":"差不多就是这样。","usage":"口语里简短肯定对方的总结","example":"So you just handled everything yourself? — Pretty much.","sourceIndex":5,"start":35.22},{"en":"easy to live with","zh":"好相处、适合同住","usage":"评价室友或伴侣的相处难度","example":"He said you're super easy to live with.","sourceIndex":6,"start":54.3}],"quotes":[{"text":"You can't just blindside me like that.","start":5.66,"matched":true},{"text":"It's already set in stone.","start":40.82,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.5,"x":"Whoa, whoa, whoa. Where are you going? I'm moving out. You're what? I'm moving out"},{"t":5.66,"x":"You can't just blindside me like that blindside you. Yes hit me with huge news with absolutely no warning"},{"t":13.64,"x":"Relax, I already found someone to take my room. You what? He's moving in today today"},{"t":19.64,"x":"You did all of this behind my back behind your back"},{"t":23.26,"x":"Yes, you planned the whole thing without telling me because I knew you'd make it difficult"},{"t":27.46,"x":"Of course I'd make it difficult. I live here."},{"t":30.1,"x":"Look, somebody had to take matters into their own hands."},{"t":33.3,"x":"Take matters into your own hands?"},{"t":35.22,"x":"So you just handled everything yourself without asking me?"},{"t":38.18,"x":"Pretty much."},{"t":39.14,"x":"You don't get to choose my new roommate?"},{"t":40.82,"x":"It's too late. It's already set in stone."},{"t":42.9,"x":"Set in stone?"},{"t":44.18,"x":"It's decided. It's not changing."},{"t":46.26,"x":"Oh, it's changing."},{"t":47.7,"x":"No, it's not."},{"t":49.06,"x":"Yes, it..."},{"t":50.46,"x":"Actually, that should be him."},{"t":51.98,"x":"Him?"},{"t":52.78,"x":"Hey, you must be my new roommate."},{"t":54.3,"x":"He said you're super easy to live with."},{"t":56.54,"x":"Nice to meet you."},{"t":57.74,"x":"Is there something going on?"}],"media":"media/6abf181a000000001c00f40b.mp4","images":[]},{"kind":"video","noteId":"6abe414f000000001802e6de","creator":"William","title":"生活英语：遇到这些情况怎么说？","publishedAt":"2026-10-01T13:30:12.000Z","durationSeconds":42.7,"likes":"174","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6abe414f000000001802e6de?xsec_token=ABMM5QYrg-hkp0j8yab-OPSbfVp518R7T6Inq9vIlhr4w=&xsec_source=pc_user","ipLocation":"安徽","summary":"这条视频还原了把咖啡打翻在笔记本电脑上后的真实对话场景，从惊呼、询问状况到描述电脑故障，全程用英语完成。博主顺带讲了几个描述「打翻、卡住、死机、报废」的地道说法，并点出背过的单词在需要时用不出来，是因为「认识单词」和「压力下用出单词」是两回事。","tags":["生活英语","英语口语","突发状况","单词活用"],"keyPoints":["场景是打翻咖啡、电脑出故障时的即时英语对话，重点在描述物品状态。","打翻用 knocked over，死机可以用 it froze 或 it's just not responding。","彻底坏掉，尤其是被液体弄坏，可以用 it might be fried。","博主提醒：认识单词和能在紧张时脱口而出，是两个完全不同的能力。"],"patterns":[{"en":"knocked over","zh":"打翻、碰倒","usage":"描述不小心把液体或物件弄翻时","example":"Oh, you knocked over your coffee.","sourceIndex":0,"start":6.79},{"en":"it's just not responding","zh":"它就是没有任何反应","usage":"描述电子设备有电但操作无反应时","example":"Oh, it's on it's just not responding or you could say it froze froze like frozen","sourceIndex":1,"start":13.03},{"en":"Is it dead?","zh":"它是彻底废了吗？","usage":"半开玩笑地问设备是不是完全没救了","example":"Wait, is it dead?","sourceIndex":2,"start":22.38},{"en":"it might be fried","zh":"它可能已经烧了／废了","usage":"推测设备因进水等原因彻底损坏时","example":"Yeah, it might be fried as in completely broken from the liquid","sourceIndex":3,"start":22.38},{"en":"I just can't seem to find them","zh":"就是想不起来／找不到","usage":"表达明明会却一时想不起来时","example":"it seems like I know these words but when I need them I just can't seem to find them","sourceIndex":4,"start":28.42}],"quotes":[{"text":"Oh, you knocked over your coffee.","start":6.79,"matched":true},{"text":"Wait, is it dead?","start":22.38,"matched":true},{"text":"Yeah, it might be fried as in completely broken from the liquid","start":22.38,"matched":true},{"text":"knowing words and being able to use them under pressure are two completely different things","start":35.22,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0.43,"x":"Oh, my laptop. Oh, no. Is it okay? What happened? I pushed down my coffee"},{"t":6.79,"x":"Oh, you knocked over your coffee. Yeah knocked over and now the computer"},{"t":13.03,"x":"Isn't working. Oh, it's on it's just not responding or you could say it froze froze like frozen"},{"t":22.38,"x":"Wait, is it dead? Yeah, it might be fried as in completely broken from the liquid"},{"t":28.42,"x":"fried knocked over froze it seems like I know these words but when I need them I"},{"t":35.22,"x":"just can't seem to find them well that's because knowing words and being able to"},{"t":39.18,"x":"use them under pressure are two completely different things"}],"media":"media/6abe414f000000001802e6de.mp4","images":[]},{"kind":"video","noteId":"6abe4106000000001500efd7","creator":"William","title":"当你英语不好，遇到这种情况怎么说？","publishedAt":"2026-10-01T11:16:22.000Z","durationSeconds":38.6,"likes":"308","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6abe4106000000001500efd7?xsec_token=ABMM5QYrg-hkp0j8yab-OPSZdg7yFmCD99Lx4JngAIbng=&xsec_source=pc_user","ipLocation":"安徽","summary":"这条视频模拟室友不讲卫生的日常抱怨场景：剪脚趾甲不收拾、洗完澡吹头发掉一地。通过一问一答的对话，自然带出「toenail clippings」「blow-dry」「shed」等地道词汇和口语表达，适合用来吐槽生活琐事。","tags":["英语口语","生活词汇","室友吐槽","地道表达"],"keyPoints":["视频用室友邋遢的真实场景，把「剪脚趾甲、吹头发、掉头发」这几个日常动作串成一段对话。","重点词汇是 toenail clippings（脚趾甲碎屑）、blow-dry（用吹风机吹干）、shed（掉毛、掉发）。","表达不满时可以用 That's disgusting 和 What's going on，语气自然又口语化。","博主最后提醒可以关注账号继续学这类生活词汇。"],"patterns":[{"en":"leave sth all over the floor","zh":"把某物弄得满地都是。","usage":"抱怨别人乱丢东西、不收拾时用。","example":"My roommate, he cut his nails on his feet and left them all over the floor.","sourceIndex":0,"start":0},{"en":"toenail clippings","zh":"剪下的脚趾甲","usage":"具体指剪脚趾甲留下的碎屑。","example":"Oh, toenail clippings?","sourceIndex":1,"start":7.92},{"en":"blow-dry one's hair","zh":"用吹风机吹头发。","usage":"描述洗完澡后用吹风机吹干头发。","example":"Oh, and he blow-dries his hair.","sourceIndex":2,"start":14.67},{"en":"hair shedding","zh":"掉头发、掉毛。","usage":"说头发正常脱落时用这个名词形式。","example":"I mean the little hair shedding is normal, he just needs to clean it up.","sourceIndex":3,"start":21.39},{"en":"shed","zh":"掉（毛发）。","usage":"动词，指人或动物掉毛、掉发。","example":"Sheds, yes, he sheds a lot.","sourceIndex":4,"start":29.85}],"quotes":[{"text":"Oh my god, that's disgusting.","start":0,"matched":true},{"text":"My roommate, he cut his nails on his feet and left them all over the floor.","start":0,"matched":true},{"text":"Oh, and he blow-dries his hair.","start":14.67,"matched":true},{"text":"I mean the little hair shedding is normal, he just needs to clean it up.","start":21.39,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Oh my god, that's disgusting. What's going on? My roommate, he cut his nails on his"},{"t":7.92,"x":"feet and left them all over the floor. Oh, toenail clippings? Tonal clippings, yeah."},{"t":14.67,"x":"And after the shower, he also blew his hair. Oh, and he blow-dries his hair. He has blow-dries his"},{"t":21.39,"x":"hair and his hair comes out of his head a lot on the floor. I mean the little"},{"t":29.85,"x":"hair shedding is normal, he just needs to clean it up. Sheds, yes, he sheds a lot."},{"t":34.33,"x":"Wow, where can I learn this vocabulary? Oh you can just follow this account to"},{"t":38.05,"x":"learn more."}],"media":"media/6abe4106000000001500efd7.mp4","images":[]},{"kind":"video","noteId":"6aba3abf000000001a02b51b","creator":"William","title":"生活中这些英语表达，你会说...?","publishedAt":"2026-09-28T10:00:31.000Z","durationSeconds":54.4,"likes":"282","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cc8c00000000010001001/6aba3abf000000001a02b51b?xsec_token=ABaCxODGoN2P_dlhnIMH1e-XInQkRiLb_I0fCklKcb9sg=&xsec_source=pc_user","ipLocation":"安徽","summary":"视频用一段情侣之间闹别扭、互相埋怨的日常对话，自然带出多个地道口语表达。你能学到怎么用英语表达「冷战、戳我痛点、翻旧账、掩藏问题」这类情绪化场景，也能顺便记住几个口语化的固定说法。","tags":["英语口语","地道表达","日常对话","情绪表达"],"keyPoints":["整条视频以情侣吵架的对话展开，语境真实，便于直接套用到日常口语。","核心表达集中在「冷战、惹人生气、记仇翻旧账、回避问题」这几类情绪话题上。","对话后半段用「饼干」这个梗把矛盾夸张化，适合观察口语里的语气和吐槽方式。","所有例句都是口语短句，适合背诵后用在朋友或伴侣之间的对话里。"],"patterns":[{"en":"give me the cold shoulder","zh":"对我冷淡、跟我冷战","usage":"对方因为生气而故意不理你时用","example":"Are you seriously giving me the cold shoulder?","sourceIndex":0,"start":6.1},{"en":"push my buttons","zh":"专戳我的痛点","usage":"说某人明知会让你不爽还故意那么做时用","example":"Maybe because you know how to push my buttons.","sourceIndex":1,"start":11.58},{"en":"keep score","zh":"记仇、把对错都记着","usage":"形容别人总记得你做过的每件错事时用","example":"No, you just keep score.","sourceIndex":2,"start":24.1},{"en":"bring it up","zh":"（把旧事）提起来、翻出来说","usage":"指在争吵或谈话中重提某件往事时用","example":"and you bring it up every time we argue.","sourceIndex":3,"start":29.58},{"en":"sweep everything under the rug","zh":"把问题掩盖起来、当没发生过","usage":"形容回避问题、不愿正面解决时用","example":"Because you just sweep everything under the rug.","sourceIndex":4,"start":31.5},{"en":"I swear to God","zh":"我发誓、真的","usage":"想强调自己说的是实话或急于辩解时用","example":"I swear to God.","sourceIndex":5,"start":45.49},{"en":"since you brought it up","zh":"既然你提起来了","usage":"对方先提到某件事，你顺势接着说时用","example":"But since you brought it up.","sourceIndex":6,"start":48.39}],"quotes":[{"text":"Seriously, you're just gonna ignore me now?","start":2.33,"matched":true},{"text":"Are you seriously giving me the cold shoulder?","start":6.1,"matched":true},{"text":"Yes, you remember every single thing I've done wrong","start":26.86,"matched":true},{"text":"It was my last cookie.","start":51.29,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"Hey, what are you about to do?"},{"t":2.33,"x":"Seriously, you're just gonna ignore me now?"},{"t":6.1,"x":"Are you seriously giving me the cold shoulder?"},{"t":8.3,"x":"The cold shoulder?"},{"t":9.38,"x":"Yeah, you're ignoring me because you're mad at me."},{"t":11.58,"x":"Maybe because you know how to push my buttons."},{"t":13.9,"x":"Push your buttons."},{"t":15.26,"x":"You say and do things because you know they will annoy me."},{"t":18.78,"x":"Come on, you get mad about everything"},{"t":21.5,"x":"because you keep doing the same things."},{"t":24.1,"x":"No, you just keep score."},{"t":25.82,"x":"Keep score?"},{"t":26.86,"x":"Yes, you remember every single thing I've done wrong"},{"t":29.58,"x":"and you bring it up every time we argue."},{"t":31.5,"x":"Because you just sweep everything under the rug."},{"t":34.4,"x":"Sweep it under the rug?"},{"t":36.3,"x":"You ignore problems that pretend they never happened instead of dealing with them."},{"t":39.6,"x":"Hey, I don't do that."},{"t":41.4,"x":"Really?"},{"t":42.99,"x":"Did you forget about the do not bring up the cookie?"},{"t":45.49,"x":"I swear to God."},{"t":46.49,"x":"I wasn't going to."},{"t":47.49,"x":"Good."},{"t":48.39,"x":"But since you brought it up."},{"t":50.29,"x":"Oh my God."},{"t":51.29,"x":"It was my last cookie."},{"t":52.79,"x":"Not this sh** again."}],"media":"media/6aba3abf000000001a02b51b.mp4","images":[]},{"kind":"video","noteId":"6ab27d57000000003403460a","creator":"瑞秋爱玛","title":"全英｜缓解高敏感？放弃抵抗吧...","publishedAt":"2026-09-22T13:06:31Z","durationSeconds":199.4,"likes":"41","noteUrl":"https://www.xiaohongshu.com/user/profile/61361d670000000002019d71/6ab27d57000000003403460a?xsec_token=AB9E-xa2VSqgYZ2v3DktfXBND7mlAMnZcDX1f2H4QCjnM=&xsec_source=pc_user","ipLocation":"上海","summary":"35 岁才发现自己是高敏感人格（HSP），今年终于学会不再对抗情绪。情绪类英语口播，长句多、情绪词密集，适合练「描述心理状态」。","tags":["全英播客","情绪表达","心理词汇"],"keyPoints":["描述内耗的成套词汇：emotionally burned out、brain is spinning、on the verge of falling apart","核心转折句是本条的精华：When you stop fighting your emotions, they get bored.","self-doubt 时自我攻击的问句三连：What's wrong with me? Am I not good enough? Am I incompetent?","结尾的安慰句式可以直接背下来用在别人身上：You are not broken, you are not too much."],"patterns":[{"en":"emotionally burned out","zh":"情绪上彻底耗竭","usage":"比 tired 更准确地描述长期透支","example":"I don't know if you ever felt emotionally burned out.","sourceIndex":0,"start":6.64},{"en":"your brain is spinning","zh":"脑子停不下来地转","usage":"形容想太多、静不下来","example":"Your brain is spinning all the time, even when you tell it to stop.","sourceIndex":1,"start":12.96},{"en":"on the verge of falling apart","zh":"处在崩溃边缘","usage":"on the verge of + 名词/动名词","example":"I constantly felt like I was on the verge of completely falling apart.","sourceIndex":2,"start":57.48},{"en":"process things differently","zh":"对外界信息的处理方式不同","usage":"中性描述敏感特质，不带贬义","example":"I literally process things differently from other people.","sourceIndex":3,"start":null},{"en":"make peace with myself","zh":"与自己和解","usage":"接受自身特质的关键短语","example":"This year, I finally figured out how to make peace with myself.","sourceIndex":4,"start":77.01},{"en":"I just sit with it, quietly, unapologetically.","zh":"安静地陪着情绪，不觉得抱歉","usage":"sit with + 情绪，表示不逃避也不对抗","example":"I don't fake the smile. I just sit with it, quietly, unapologetically.","sourceIndex":5,"start":94.28},{"en":"When you stop fighting your emotions, they get bored.","zh":"不再对抗情绪，它自己就无聊了","usage":"整条视频的金句，可直接引用","example":"They realize you're not giving them any drama, any resistance, any fuel, and they just leave.","sourceIndex":6,"start":0},{"en":"You are not broken, you are not too much.","zh":"你没有坏掉，你也不是太过分。","usage":"安慰高敏感者最有效的一句","example":"You just feel things deeply and that's not a flaw, that's who you are.","sourceIndex":7,"start":190.16}],"quotes":[{"text":"When you stop fighting your emotions, they get bored.","start":148.45,"matched":true},{"text":"You are not broken, you are not too much. You just feel things deeply and that's not a flaw, that's who you are.","start":186.36,"matched":true}],"partial":false,"partialReason":null,"transcript":[{"t":0,"x":"They realize you're not giving them any drama, any resistance, any fuel, and they just leave."},{"t":6.64,"x":"Hey guys, today I want to talk about how I eat my high sensitivity. I don't know if you ever felt"},{"t":12.96,"x":"emotionally burned out or like your brain is spinning all the time even when you tell it to stop"},{"t":18.48,"x":"or maybe when you're interacting with people your heart is racing and you feel like you're"},{"t":22.96,"x":"or burning yourself out. That used to be me for years, actually for most of my life."},{"t":30.28,"x":"And if you're a highly sensitive person, you probably know exactly what I'm talking about."},{"t":35.2,"x":"If you're always exhausted, even after a full night's sleep, if you can't focus no"},{"t":39.64,"x":"matter how hard you try, if a single comment from someone can ruin your entire day, this"},{"t":45.68,"x":"one is for you because I've been there. I'm 35 and I've always presented myself"},{"t":51.76,"x":"by the easygoing, positive one, the one who's always fine,"},{"t":55.76,"x":"the one who never breaks."},{"t":57.48,"x":"But deep down, I constantly felt like"},{"t":59.88,"x":"I was on the verge of completely falling apart."},{"t":62.56,"x":"But I never knew why."},{"t":63.76,"x":"Or maybe I just never had the energy to figure it out."},{"t":66.89,"x":"It took me almost two decades to realize"},{"t":69.69,"x":"I'm a highly sensitive person."},{"t":72.93,"x":"I bring literally processed things"},{"t":75.01,"x":"differently from other people."},{"t":77.01,"x":"And this year, I finally figured out"},{"t":79.57,"x":"how to make peace with myself."},{"t":81.84,"x":"be a slave to your feelings."},{"t":84.32,"x":"That's right, I give up."},{"t":86.82,"x":"I surrender to whatever the hell that is bothering me."},{"t":89.76,"x":"If I'm feeling down,"},{"t":91.04,"x":"I let myself be down for it as long as I want."},{"t":94.28,"x":"I don't fake the smile I'm always wearing."},{"t":97.2,"x":"I don't pretend to be happy when I'm not."},{"t":99.4,"x":"I don't force myself to be interested in a conversation"},{"t":102,"x":"just to avoid seeming rude."},{"t":104.16,"x":"I just sit with it, quietly, unapologetically"},{"t":107.92,"x":"and let myself feel every bit of it."},{"t":110.96,"x":"Before when my brain was spinning and I couldn't focus, the old me would spiral into self-doubt."},{"t":116.96,"x":"Like what's wrong with me?"},{"t":118.96,"x":"Am I not good enough?"},{"t":120.26,"x":"Am I incompetent?"},{"t":121.96,"x":"And then I pushed myself a bit harder, which of course just made everything worse."},{"t":127.96,"x":"But now I literally say it out loud."},{"t":131.96,"x":"Fuck it. I'm exhausted. I need to stop."},{"t":134.96,"x":"I stop the work I'm doing. I step away from the conversations that drew me."},{"t":138.96,"x":"I close my eyes, or stare into space, or go to the park, find a bench, and stay there"},{"t":144.4,"x":"alone."},{"t":145.69,"x":"And you know what the craziest part is?"},{"t":148.45,"x":"When you stop fighting your emotions, they get bored."},{"t":151.69,"x":"They realize you're not giving them any drama, any resistance, any fuel, and they just"},{"t":157.25,"x":"leave."},{"t":158.25,"x":"I wish I could go back in time and hug the younger me."},{"t":160.93,"x":"The one who was constantly struggling, who didn't know what was wrong with her,"},{"t":165.65,"x":"who thought she just wasn't trying hard enough."},{"t":168.57,"x":"I tell her I'm so sorry I didn't know how to take care of you emotionally and I want"},{"t":173.73,"x":"you to know this is who you are and that's okay, you are enough just as you are."},{"t":179.04,"x":"And if you are watching this and you are a highly sensitive person too, I hope that makes"},{"t":184.24,"x":"you feel a little less alone."},{"t":186.36,"x":"You are not broken, you are not too much."},{"t":190.16,"x":"You just feel things deeply and that's not a flaw, that's who you are."}],"media":"media/6ab27d57000000003403460a.mp4","images":[]}],"patterns":[{"id":"p_c9c1c14778d4","sourceIndex":0,"en":"the most important thing is to","zh":"最重要的是去……","usage":"用于优先排序或明确给出核心建议时。","example":"I think the most important thing is to separate what we can change from what we have to accept.","keywords":[{"term":"the most important thing is to","meaning":"最重要的是去……","kind":"core"}],"slots":[],"structure":"the most important thing is to","scenes":["natural"],"difficulty":"cet6","cetLevel":"cet6","knowledgeType":"discourse","whyLearn":"四级学习者常用简单句表态，这个框架能让观点更有层次，也可直接迁移到口语和写作。","source":{"creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","noteId":"6ae7e023000000001901e400","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ae7e023000000001901e400?xsec_token=ABDMhUEbWw4gtpKOigShy3Sr2M6D0CZj7LJPxsVdyLXOo=&xsec_source=pc_user","publishedAt":"2026-11-02T00:58:11.000Z","start":null},"sourceTags":[],"similarIds":["p_13daa0c93726","p_45b7ab91c2f2","p_003a8bb04cd6"]},{"id":"p_45b7ab91c2f2","sourceIndex":1,"en":"separate what we can change from what we have to accept","zh":"区分能改变和必须接受的事","usage":"用于讨论边界、分类或取舍时。","example":"I think the most important thing is to separate what we can change from what we have to accept.","keywords":[{"term":"separate what we can change from what we have to accept","meaning":"区分能改变和必须接受的事","kind":"core"}],"slots":[],"structure":"separate what we can change from what we have to accept","scenes":["natural"],"difficulty":"cet6","cetLevel":"cet6","knowledgeType":"grammar","whyLearn":"它展示两个名词从句如何并列作介词宾语，能让表达从简单词义上升到完整且对称的句式。","source":{"creator":"每日口语丨Daily Speaking","title":"一分钟口语挑战！","noteId":"6ae7e023000000001901e400","noteUrl":"https://www.xiaohongshu.com/user/profile/6a4cb1c60000000001004800/6ae7e023000000001901e400?xsec_token=ABDMhUEbWw4gtpKOigShy3Sr2M6D0CZj7LJPxsVdyLXOo=&xsec_source=pc_user","publishedAt":"2026-11-02T00:58:11.000Z","start":null},"sourceTags":[],"similarIds":["p_a10fc247d0f0","p_13daa0c93726","p_c9c1c14778d4"]},{"id":"p_13daa0c93726","sourceIndex":2,"en":"Understanding problems still matters","zh":"理解问题仍然很重要","usage":"先承认某件事有价值，再补充限制时。","example":"Understanding problems still matters, but we do not need to treat every problem in the world as our personal responsibility.","keywords":[{"term":"Understanding problems still matters","meaning":"理解问题仍然很重要","kind":"core"}]," /* ------------------------------------------------ 句型库本机学习状态 */

const LEARNING_STORAGE_KEY = 'xhs-kb-learning-v1';
let learningState = readLearningState();

function readLearningState() {
  const empty = { version: 1, items: {} };
  try {
    const value = JSON.parse(localStorage.getItem(LEARNING_STORAGE_KEY) || 'null');
    if (!value || value.version !== 1 || !value.items || typeof value.items !== 'object') return empty;
    for (const [id, item] of Object.entries(value.items)) {
      if (!patternById.has(id) || !item || typeof item !== 'object') {
        delete value.items[id];
        continue;
      }
      if (!['unseen', 'learning', 'mastered'].includes(item.mastery)) item.mastery = 'unseen';
      item.favorite = Boolean(item.favorite);
      if (item.favorite && !item.favoriteAddedAt) item.favoriteAddedAt = new Date().toISOString();
      if (!item.favorite) item.favoriteAddedAt = null;
    }
    return value;
  } catch {
    return empty;
  }
}

function persistLearningState() {
  try {
    localStorage.setItem(LEARNING_STORAGE_KEY, JSON.stringify(learningState));
    return true;
  } catch {
    showToast('浏览器没有允许本地保存');
    return false;
  }
}

function learningFor(id) {
  return learningState.items[id] ?? {
    mastery: 'unseen',
    favorite: false,
    favoriteAddedAt: null,
    updatedAt: null,
  };
}

function updateLearning(id, patch) {
  if (!patternById.has(id)) return;
  const current = learningFor(id);
  learningState.items[id] = {
    ...current,
    ...patch,
    updatedAt: new Date().toISOString(),
  };
  persistLearningState();
  renderViewNav();
  render();
}

function toggleFavorite(id) {
  const current = learningFor(id);
  const favorite = !current.favorite;
  updateLearning(id, {
    favorite,
    favoriteAddedAt: favorite ? new Date().toISOString() : null,
  });
  showToast(favorite ? '已加入高频收藏' : '已取消收藏');
}

function learningCounts() {
  const values = Object.values(learningState.items);
  return {
    favorites: values.filter((item) => item.favorite).length,
    learning: values.filter((item) => item.mastery === 'learning').length,
    mastered: values.filter((item) => item.mastery === 'mastered').length,
  };
}

const HIGHLIGHT_STORAGE_KEY = 'xhs-kb-highlights-v1';
let savedHighlights = [];
let selectionInfo = null;
let pointerStart = null;
let toolbarBusy = false;
let toastTimer = null;

function readSavedHighlights() {
  try {
    const value = JSON.parse(localStorage.getItem(HIGHLIGHT_STORAGE_KEY) || 'null');
    if (!Array.isArray(value?.items)) return [];
    return value.items.filter((item) =>
      item && typeof item.id === 'string' && typeof item.cardId === 'string' &&
      typeof item.blockId === 'string' && Number.isInteger(item.start) &&
      Number.isInteger(item.end) && typeof item.text === 'string' &&
      item.start >= 0 && item.end > item.start
    );
  } catch {
    return [];
  }
}

function persistHighlights() {
  try {
    localStorage.setItem(HIGHLIGHT_STORAGE_KEY, JSON.stringify({
      version: 1,
      items: savedHighlights,
    }));
    return true;
  } catch {
    showToast('浏览器没有允许本地保存，这次高亮不会保留');
    return false;
  }
}

function showToast(message) {
  const toast = document.getElementById('speakToast');
  if (!toast) return;
  toast.textContent = message;
  toast.dataset.show = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.dataset.show = '0'; }, 1900);
}

function textNodesInside(root) {
  const nodes = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let node = walker.nextNode();
  while (node) {
    if (node.nodeValue) nodes.push(node);
    node = walker.nextNode();
  }
  return nodes;
}

function unwrapHighlights() {
  document.querySelectorAll('.hl').forEach((span) => {
    const parent = span.parentNode;
    if (!parent) return;
    while (span.firstChild) parent.insertBefore(span.firstChild, span);
    parent.removeChild(span);
  });
  document.querySelectorAll('[data-block]').forEach((block) => block.normalize());
}

function articleFromRecord(item) {
  return [...document.querySelectorAll('article[data-card]')]
    .find((node) => node.dataset.card === item.cardId) ?? null;
}

function blockFromRecord(item) {
  const article = articleFromRecord(item);
  if (!article) return null;
  return [...article.querySelectorAll('[data-block]')]
    .find((node) => node.dataset.block === item.blockId) ?? null;
}

function wrapBlockRange(block, start, end, highlightId) {
  let cursor = 0;
  const targets = [];
  for (const node of textNodesInside(block)) {
    const length = node.nodeValue.length;
    const nodeEnd = cursor + length;
    if (nodeEnd > start && cursor < end) {
      targets.push({
        node,
        start: Math.max(0, start - cursor),
        end: Math.min(length, end - cursor),
      });
    }
    cursor = nodeEnd;
    if (cursor >= end) break;
  }

  // 从后往前包，避免前一次拆分文本节点影响后面的字符偏移。
  targets.reverse().forEach((target) => {
    if (target.start >= target.end) return;
    const range = document.createRange();
    range.setStart(target.node, target.start);
    range.setEnd(target.node, target.end);
    const span = document.createElement('span');
    span.className = 'hl';
    span.dataset.hlId = highlightId;
    range.surroundContents(span);
  });
}

function applyStoredHighlights() {
  unwrapHighlights();
  const live = [];
  const groups = new Map();
  let stale = false;

  for (const item of savedHighlights) {
    const article = articleFromRecord(item);
    if (!article) {
      // 当前筛选没显示这张卡，不代表记录失效；原样留着，等切回来再复原。
      live.push(item);
      continue;
    }
    const block = blockFromRecord(item);
    const raw = block?.textContent ?? '';
    if (!block || item.end > raw.length || raw.slice(item.start, item.end) !== item.text) {
      stale = true;
      continue;
    }
    live.push(item);
    const key = item.cardId + '\u0000' + item.blockId;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ item, block });
  }

  if (stale) {
    savedHighlights = live;
    persistHighlights();
  }

  groups.forEach((entries) => {
    entries.sort((a, b) => a.item.start - b.item.start);
    let coveredUntil = -1;
    entries.forEach(({ item, block }) => {
      if (item.start < coveredUntil) return;
      wrapBlockRange(block, item.start, item.end, item.id);
      coveredUntil = item.end;
    });
  });
}

function offsetWithin(block, node, offset) {
  if (!block.contains(node)) return null;
  try {
    const range = document.createRange();
    range.selectNodeContents(block);
    range.setEnd(node, offset);
    return range.toString().length;
  } catch {
    return null;
  }
}

function readSelection() {
  const selection = window.getSelection();
  if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return null;
  const range = selection.getRangeAt(0);
  const segments = [];

  document.querySelectorAll('[data-block]').forEach((block) => {
    let intersects = false;
    try { intersects = range.intersectsNode(block); } catch { intersects = false; }
    if (!intersects) return;

    const start = offsetWithin(block, range.startContainer, range.startOffset) ?? 0;
    const end = offsetWithin(block, range.endContainer, range.endOffset) ?? block.textContent.length;
    if (end <= start) return;
    const text = block.textContent.slice(start, end);
    if (!text.trim()) return;

    const article = block.closest('article[data-card]');
    if (!article) return;
    segments.push({
      cardId: article.dataset.card,
      blockId: block.dataset.block,
      start,
      end,
      text,
    });
  });

  const text = selection.toString().trim();
  if (!segments.length || !text) return null;
  return { range: range.cloneRange(), segments, text };
}

function containingHighlightIds(segments) {
  const ids = new Set();
  for (const segment of segments) {
    const match = savedHighlights.find((item) =>
      item.cardId === segment.cardId && item.blockId === segment.blockId &&
      item.start <= segment.start && item.end >= segment.end
    );
    if (!match) return [];
    ids.add(match.id);
  }
  return [...ids];
}

function hideSelectionTools() {
  const toolbar = document.getElementById('selectionTools');
  if (toolbar) toolbar.hidden = true;
  selectionInfo = null;
}

function showSelectionTools(info) {
  const toolbar = document.getElementById('selectionTools');
  if (!toolbar || !info) return;
  selectionInfo = info;
  const removeIds = containingHighlightIds(info.segments);
  const action = toolbar.querySelector('[data-selection-act="highlight"]');
  action.textContent = removeIds.length ? '取消高亮' : '荧光笔';
  action.dataset.removeIds = removeIds.join(',');
  toolbar.hidden = false;

  const rect = info.range.getBoundingClientRect();
  const width = toolbar.offsetWidth;
  const height = toolbar.offsetHeight;
  const margin = 8;
  let left = rect.left + rect.width / 2 - width / 2;
  left = Math.max(margin, Math.min(left, window.innerWidth - width - margin));
  let top = rect.top - height - margin;
  if (top < margin) top = Math.min(window.innerHeight - height - margin, rect.bottom + margin);
  toolbar.style.left = Math.round(left) + 'px';
  toolbar.style.top = Math.round(Math.max(margin, top)) + 'px';
}

function removeHighlights(ids) {
  if (!ids.length) return;
  const doomed = new Set(ids);
  savedHighlights = savedHighlights.filter((item) => !doomed.has(item.id));
  persistHighlights();
  applyStoredHighlights();
  showToast('已取消高亮');
}

function addHighlights(segments) {
  const id = 'hl-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  for (const segment of segments) {
    savedHighlights = savedHighlights.filter((item) =>
      item.cardId !== segment.cardId || item.blockId !== segment.blockId ||
      item.end <= segment.start || item.start >= segment.end
    );
    savedHighlights.push({ ...segment, id, createdAt: new Date().toISOString() });
  }
  if (!persistHighlights()) return;
  applyStoredHighlights();
  showToast('已用荧光笔标好，只保存在这台设备');
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast('已复制');
    return;
  } catch {
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    const ok = document.execCommand('copy');
    area.remove();
    showToast(ok ? '已复制' : '复制失败，请手动选择复制');
  }
}

function speakText(text) {
  const value = String(text ?? '').replace(/\s+/g, ' ').trim();
  if (!value) return;
  if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') {
    showToast('这个浏览器不支持语音朗读');
    return;
  }
  try {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(value);
    const chinese = /[\u3400-\u9fff]/.test(value);
    utterance.lang = chinese ? 'zh-CN' : 'en-US';
    utterance.rate = chinese ? 0.95 : 0.9;
    const voices = window.speechSynthesis.getVoices?.() ?? [];
    const wanted = chinese ? /^zh/i : /^en-US/i;
    utterance.voice = voices.find((voice) => wanted.test(voice.lang))
      ?? (chinese ? voices.find((voice) => /^zh/i.test(voice.lang)) : voices.find((voice) => /^en/i.test(voice.lang)))
      ?? null;
    window.speechSynthesis.speak(utterance);
    showToast('朗读：' + (value.length > 48 ? value.slice(0, 47) + '…' : value));
  } catch {
    showToast('朗读没有启动，请再点一次');
  }
}

function wordAtPoint(block, x, y) {
  let range = null;
  if (document.caretRangeFromPoint) {
    range = document.caretRangeFromPoint(x, y);
  } else if (document.caretPositionFromPoint) {
    const position = document.caretPositionFromPoint(x, y);
    if (position) {
      range = document.createRange();
      range.setStart(position.offsetNode, position.offset);
      range.collapse(true);
    }
  }
  if (!range || range.startContainer.nodeType !== Node.TEXT_NODE) return '';

  const point = offsetWithin(block, range.startContainer, range.startOffset);
  if (point === null) return '';
  const text = block.textContent;
  const pattern = /[A-Za-z]+(?:[’'-][A-Za-z]+)*/g;
  let match = pattern.exec(text);
  while (match) {
    const start = match.index;
    const end = start + match[0].length;
    if ((point >= start && point <= end) || (point - 1 >= start && point - 1 < end)) {
      return match[0];
    }
    match = pattern.exec(text);
  }
  return '';
}

function wireTextTools() {
  const toolbar = document.getElementById('selectionTools');
  if (!toolbar) return;

  document.addEventListener('pointerdown', (event) => {
    if (event.target.closest('#selectionTools')) {
      toolbarBusy = true;
      return;
    }
    pointerStart = event.button === 0
      ? { x: event.clientX, y: event.clientY, at: Date.now() }
      : null;
  }, true);

  document.addEventListener('pointerup', (event) => {
    const wasToolbar = Boolean(event.target.closest('#selectionTools'));
    toolbarBusy = wasToolbar;
    if (wasToolbar) return;

    const info = readSelection();
    if (info) {
      showSelectionTools(info);
      pointerStart = null;
      return;
    }

    if (pointerStart && Date.now() - pointerStart.at < 800 &&
        Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y) < 7) {
      const block = event.target.closest('[data-block]');
      if (block && !event.target.closest('a, button, input, textarea, select')) {
        const word = wordAtPoint(block, event.clientX, event.clientY);
        if (word.length > 1) speakText(word);
      }
    }
    pointerStart = null;
  }, true);

  document.addEventListener('selectionchange', () => {
    if (toolbarBusy) return;
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed) hideSelectionTools();
  });

  document.addEventListener('scroll', hideSelectionTools, true);
  window.addEventListener('resize', hideSelectionTools);

  toolbar.addEventListener('click', (event) => {
    const button = event.target.closest('[data-selection-act]');
    if (!button || !selectionInfo) return;
    const info = selectionInfo;
    const action = button.dataset.selectionAct;
    if (action === 'highlight') {
      const ids = (button.dataset.removeIds || '').split(',').filter(Boolean);
      if (ids.length) removeHighlights(ids);
      else addHighlights(info.segments);
    } else if (action === 'speak') {
      speakText(info.text);
    } else if (action === 'copy') {
      copyText(info.text);
    }
    hideSelectionTools();
    toolbarBusy = false;
  });
  toolbar.addEventListener('pointerup', () => { toolbarBusy = false; });

  savedHighlights = readSavedHighlights();
}

const normalizeSearch = (value) => String(value ?? '')
  .toLowerCase()
  .replace(/[‘’ʼ]/g, "'")
  .replace(/[^a-z0-9一-龥']+/g, ' ')
  .trim();

function fuzzyTokenMatch(hay, token) {
  if (!token) return true;
  if (hay.includes(token)) return true;
  if (token.length < 3) return false;
  return hay.split(' ').some((word) => word.startsWith(token));
}

function patternSearchText(pattern) {
  return normalizeSearch([
    pattern.en,
    pattern.zh,
    pattern.usage,
    pattern.example,
    pattern.structure,
    ...pattern.scenes.flatMap((id) => {
      const scene = sceneById.get(id);
      return scene ? [scene.name, scene.zh, scene.description] : [];
    }),
    ...pattern.keywords.flatMap((keyword) => [
      keyword.term ?? keyword.en,
      keyword.meaning ?? keyword.zh,
    ]),
    ...(pattern.sourceTags ?? []),
    DIFFICULTY_LABELS[pattern.cetLevel],
    KNOWLEDGE_TYPE_LABELS[pattern.knowledgeType],
    pattern.whyLearn,
    pattern.source.creator,
    pattern.source.title,
  ].join(' '));
}

function patternMatchesQuery(pattern, query) {
  const tokens = normalizeSearch(query).split(/s+/).filter(Boolean);
  if (!tokens.length) return true;
  const hay = patternSearchText(pattern);
  return tokens.every((token) => fuzzyTokenMatch(hay, token));
}

function filteredPatterns() {
  const query = state.q.trim();
  let patterns = DATA.patterns.filter((pattern) => {
    if (state.creator && pattern.source.creator !== state.creator) return false;
    if (state.date && !String(pattern.source.publishedAt ?? '').startsWith(state.date)) return false;
    if (state.scene && !pattern.scenes.includes(state.scene)) return false;
    if (state.difficulty && pattern.difficulty !== state.difficulty) return false;
    if (state.mastery && learningFor(pattern.id).mastery !== state.mastery) return false;
    if (state.favoriteOnly && !learningFor(pattern.id).favorite) return false;
    if (state.view === 'favorites' && !learningFor(pattern.id).favorite) return false;
    return patternMatchesQuery(pattern, query);
  });

  if (state.view === 'favorites') {
    patterns = patterns.sort((a, b) =>
      String(learningFor(b.id).favoriteAddedAt ?? '').localeCompare(
        String(learningFor(a.id).favoriteAddedAt ?? '')
      )
    );
  }
  return patterns;
}

function sceneNames(pattern, chinese = false) {
  return pattern.scenes
    .map((id) => {
      const scene = sceneById.get(id);
      return scene ? (chinese ? scene.zh : scene.name) : '';
    })
    .filter(Boolean);
}

        fmtTime(source.start) + '</button>'

function wirePatternControls() {
  document.querySelectorAll('[data-filter-type]').forEach((button) => {
    button.addEventListener('click', () => {
      const type = button.dataset.filterType;
      const value = button.dataset.filterValue || null;
      if (type === 'scene') state.scene = value;
      else if (type === 'difficulty') state.difficulty = value;
      else if (type === 'mastery') state.mastery = value;
      else if (type === 'favorite') state.favoriteOnly = value === '1';
      writeHash();
      render();
    });
  });
  document.querySelectorAll('[data-fav]').forEach((button) => {
    button.addEventListener('click', () => toggleFavorite(button.dataset.fav));
  });
  document.querySelectorAll('[data-mastery-id]').forEach((select) => {
    select.addEventListener('change', () => {
      updateLearning(select.dataset.masteryId, { mastery: select.value });
      showToast('掌握程度已更新为“' + MASTERY_LABELS[select.value] + '”');
    });
  });
  document.querySelectorAll('[data-open-pattern]').forEach((button) => {
    button.addEventListener('click', () => {
      state.patternId = button.dataset.openPattern;
      writeHash();
      render();
      window.scrollTo({ top: 0, behavior: 'auto' });
    });
  });
  document.querySelectorAll('[data-pattern-back]').forEach((button) => {
    button.addEventListener('click', () => {
      state.patternId = null;
      writeHash();
      render();
    });
  });
  document.querySelectorAll('[data-pattern-time]').forEach((button) => {
    button.addEventListener('click', () => copyText(fmtTime(Number(button.dataset.patternTime))));
  });
}

function searchable(card) {
  return [
    card.creator, card.title, card.summary, (card.keyPoints ?? []).join(' '),
    (card.patterns ?? []).map((p) => [p.en, p.zh, p.usage, p.example].join(' ')).join(' '),
    card.zhQuestion, card.zhReference, card.enQuestion, card.enReference,
    (card.idiomatic ?? []).map((it) => [it.orig, it.better, it.why].join(' ')).join(' '),
    (card.transcript ?? []).map((seg) => seg.x).join(' '),
  ].join(' ').toLowerCase();
}

function patternMatches(card, q) {
  if (!q) return true;
  const hay = searchable(card);
  return q.toLowerCase().split(/\s+/).every((token) => hay.includes(token));
}

// 卡片没写到的说法，也能从视频原话里捞出来
function transcriptHits(card, q) {
  if (!q || !card.transcript || card.transcript.length === 0) return [];
  const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (tokens.length === 0) return [];
  return card.transcript
    .filter((seg) => tokens.every((token) => String(seg.x).toLowerCase().includes(token)))
    .slice(0, 3);
}

function cover(card) {
  const accent = DATA.palette[card.creator] || { bg: '#dcdad2', fg: '#1a1a18' };
  const isImage = card.kind === 'image';
  const heading = isImage ? (card.zhQuestion || card.title) : card.title;
  const sub = isImage ? card.enQuestion : '';
  const meta = [];
  meta.push('<span class="who-name">' + esc(card.creator) + '</span>');
  meta.push('<span>' + fmtDate(card.publishedAt) + '</span>');
  if (isImage) meta.push('<span class="badge">图文</span>');
  else if (card.durationSeconds) meta.push('<span>' + Math.round(card.durationSeconds / 60 * 10) / 10 + ' 分钟</span>');
  return `<div class="cover">
    <div class="who">${meta.join('')}</div>
    <h2 data-block="heading">${highlight(heading)}</h2>
    ${sub ? `<div class="en-sub" data-block="en-question">${highlight(sub)}</div>` : ''}
  </div>`;
}

function imageBody(card) {
  const parts = [];
  const rows = [];
  if (card.zhReference) {
    rows.push(`<div class="qa-row"><span class="qa-label">中文参考</span><p class="qa-zh" data-block="zh-reference">${highlight(card.zhReference)}</p></div>`);
  }
  if (card.enReference) {
    rows.push(`<div class="qa-row"><span class="qa-label">英文原文</span><p class="qa-en" data-block="en-reference">${highlight(card.enReference)}</p></div>`);
  }
  if (rows.length) parts.push(`<div class="qa">${rows.join('')}</div>`);

  // 整段改写：这是主体，逐处改动只是它下面的脚注
  if (String(card.idiomaticFull ?? '').trim()) {
    parts.push('<h3>全篇地道版</h3><p class="full-en" data-block="idiomatic-full">' + highlight(card.idiomaticFull) + '</p>');
  }

  if ((card.idiomatic ?? []).length) {
    parts.push('<h3>改了什么</h3><div class="idioms">' + card.idiomatic.map((it, i) => `<div class="idiom">
      <div class="was" data-block="idiom-${i}-was">${highlight(it.orig)}</div>
      <div class="now" data-block="idiom-${i}-now">${highlight(it.better)}</div>
      <div class="why" data-block="idiom-${i}-why">${highlight(it.why)}</div>
    </div>`).join('') + '</div>');
  }

  if ((card.keyPoints ?? []).length) {
    parts.push('<h3>要点</h3><ul class="points">' + card.keyPoints.map((p, i) => '<li data-block="point-' + i + '">' + highlight(p) + '</li>').join('') + '</ul>');
  }

  if ((card.images ?? []).length) {
    parts.push('<h3>原图</h3><div class="slides">' + card.images.map((src, i) =>
      `<a href="${esc(src)}" target="_blank" rel="noreferrer"><img src="${esc(src)}" alt="原图 ${i + 1}" loading="lazy" /></a>`).join('') + '</div>');
  }
  return parts.join('');
}

function videoBody(card, q) {
  const parts = [];
  const hits = transcriptHits(card, q);
  if (hits.length) {
    parts.push('<div class="hits"><h3>视频里说到的地方</h3>' + hits.map((hit, i) => `<div class="hit">
      <div class="rail"><button class="time" data-t="${hit.t}" data-note="${esc(card.noteId)}" title="跳到视频这一秒（Shift+点击复制时间）">${fmtTime(hit.t)}</button></div>
      <span class="hit-text" data-block="transcript-${i}">${highlight(hit.x)}</span>
    </div>`).join('') + '</div>');
  }
  parts.push(`<p class="summary" data-block="summary">${highlight(card.summary)}</p>`);
  if (card.partial) parts.push(`<div class="flag">${esc(card.partialReason)}</div>`);
  if ((card.keyPoints ?? []).length) {
    parts.push('<h3>要点</h3><ul class="points">' + card.keyPoints.map((p, i) => '<li data-block="point-' + i + '">' + highlight(p) + '</li>').join('') + '</ul>');
  }
  if ((card.patterns ?? []).length) {
    parts.push('<h3>可复用句型</h3><div class="patterns">' + card.patterns.map((p, i) => `<div class="pattern">
      <div class="rail">${p.start !== null && p.start !== undefined ? `<button class="time" data-t="${p.start}" data-note="${esc(card.noteId)}" title="跳到视频这一秒（Shift+点击复制时间）">${fmtTime(p.start)}</button>` : ''}</div>
      <div>
        <div class="pat-head"><span class="en" data-block="pattern-${i}-en">${highlight(p.en)}</span><span class="zh" data-block="pattern-${i}-zh">${highlight(p.zh)}</span></div>
        <div class="usage" data-block="pattern-${i}-usage">${highlight(p.usage)}</div>
        <div class="ex" data-block="pattern-${i}-example">${highlight(p.example)}</div>
      </div>
    </div>`).join('') + '</div>');
  }
  if (card.media) parts.push('<div class="player" hidden></div>');
  return parts.join('');
}

function actionsFor(card) {
  const acts = [`<a class="act" href="${esc(card.noteUrl)}" target="_blank" rel="noreferrer">看原笔记</a>`];
  if (card.media) acts.push(`<button class="act" data-play="${esc(card.noteId)}">播放整段</button>`);
  if ((card.patterns ?? []).length) acts.push(`<button class="act" data-copy="${esc(card.noteId)}">复制全部句型</button>`);
  return '<div class="actions">' + acts.join('') + '</div>';
}

  const q = state.q.trim();

function notionTone(value) {
  const text = String(value ?? '').toLowerCase();
  if (text.includes('mastered') || text.includes('must') || text.includes('已掌握')) return 'mastered';
  if (text.includes('learning') || text.includes('学习中')) return 'learning';
  if (text.includes('new') || text.includes('未学习')) return 'new';
  return '';
}

function notionCategoryTone(value) {
  const text = String(value ?? '').toLowerCase();
  if (text.includes('natural')) return 'category-natural';
  if (text.includes('creator') || text.includes('negotiation')) return 'category-creator';
  if (text.includes('work') || text.includes('bd')) return 'category-work';
  if (text.includes('tiktok') || text.includes('sales')) return 'category-tiktok';
  if (text.includes('pattern')) return 'category-pattern';
  if (text.includes('daily')) return 'category-daily';
  return '';
}

// 原片拿不到时（比如网页被单独发到手机、media 文件夹没跟过去）给一句人话，
// 而不是留一个点了没反应的黑框。
const markNoMedia = (box) => {
  if (box.dataset.dead === '1') return;
  box.dataset.dead = '1';
  box.hidden = false;
  box.innerHTML = '<p class="flag">原片在电脑上。单独把网页发到手机就播不了，连同一个 Wi-Fi 用桌面「手机上看知识库」才有视频。</p>';
};

function ensurePlayer(card) {
  if (!card || !card.media) return null;
  const article = document.querySelector('article[data-card="' + card.noteId + '"]');
  if (!article) return null;
  const box = article.querySelector('.player');
  if (!box) return null;
  if (box.dataset.dead === '1') return null;
  box.hidden = false;
  let video = box.querySelector('video');
  if (!video) {
    video = document.createElement('video');
    video.controls = true;
    video.preload = 'metadata';
    video.src = card.media;
    const watchdog = setTimeout(() => { if (video.readyState < 1) markNoMedia(box); }, 4000);
    video.addEventListener('loadedmetadata', () => clearTimeout(watchdog));
    video.addEventListener('error', () => { clearTimeout(watchdog); markNoMedia(box); });
    box.appendChild(video);
  }
  return video;
}

function wirePlayers() {
  // 时间戳直接播本地已下载的原片段，不用再开小红书（小红书走系统代理会被风控）
  document.querySelectorAll('[data-t]').forEach((btn) => {
    btn.addEventListener('click', (event) => {
      if (event.shiftKey) {
        if (navigator.clipboard) navigator.clipboard.writeText(btn.textContent.trim()).catch(() => {});
        return;
      }
      const card = DATA.cards.find((c) => c.noteId === btn.dataset.note);
      const video = ensurePlayer(card);
      if (!video) {
        navigator.clipboard && navigator.clipboard.writeText(btn.textContent.trim()).catch(() => {});
        return;
      }
      const second = Number(btn.dataset.t) || 0;
      const seek = () => {
        video.currentTime = second;
        const playing = video.play();
        if (playing && playing.catch) playing.catch(() => {});
      };
      if (video.readyState >= 1) seek();
      else video.addEventListener('loadedmetadata', seek, { once: true });
      const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      video.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'center' });
    });
  });

  document.querySelectorAll('[data-play]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const card = DATA.cards.find((c) => c.noteId === btn.dataset.play);
      const video = ensurePlayer(card);
      if (video && video.play) video.play().catch(() => {});
    });
  });

  document.querySelectorAll('[data-copy]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const card = DATA.cards.find((c) => c.noteId === btn.dataset.copy);
      if (!card) return;
      const text = [
        card.creator + ' · ' + card.title,
        '',
        ...card.patterns.map((p) => `${p.en} | ${p.zh}
  ${p.example}`),
      ].join('\n');
      try { await navigator.clipboard.writeText(text); btn.textContent = '已复制'; } catch { btn.textContent = '复制失败'; }
      setTimeout(() => { btn.textContent = '复制全部句型'; }, 1400);
    });
  });
}

const cardsOf = (creator) => DATA.cards.filter((c) => !creator || c.creator === creator);
const dayOf = (card) => String(card.publishedAt ?? '').slice(0, 10);

function readHash() {
  const params = new URLSearchParams(location.hash.replace(/^#/, ''));
  const raw = params.get('c');
  const date = params.get('d');
  const viewRaw = params.get('v');
  const view = VIEW_NAMES[viewRaw] ? viewRaw : 'content';
  const sceneRaw = params.get('s');
  const difficultyRaw = params.get('x');
  const masteryRaw = params.get('m');
  const favoriteRaw = params.get('f');
  const patternRaw = params.get('p');
  const notionCategory = params.get('nc');
  const notionPriority = params.get('np');
  const notionMastery = params.get('nm');
  return {
    // undefined = 没选过（用默认博主）；null = 明确选了「全部博主」
    creator: raw === null
      ? undefined
      : raw === 'all'
        ? null
        : raw === 'notion'
          ? NOTION_CREATOR
          : (DATA.creators.includes(raw) ? raw : undefined),
    date: date || null,
    view,
    scene: sceneById.has(sceneRaw) ? sceneRaw : null,
    difficulty: DIFFICULTY_LABELS[difficultyRaw] ? difficultyRaw : null,
    mastery: MASTERY_LABELS[masteryRaw] ? masteryRaw : null,
    favoriteOnly: favoriteRaw === '1',
    patternId: patternById.has(patternRaw) ? patternRaw : null,
    notionCategory: notionCategory || null,
    notionPriority: notionPriority || null,
    notionMastery: notionMastery || null,
  };
}

function writeHash() {
  const params = new URLSearchParams();
  params.set('v', state.view);
  params.set('c', state.creator === NOTION_CREATOR ? 'notion' : (state.creator ?? 'all'));
  if (state.view === 'content' && state.date) params.set('d', state.date);
  if (state.scene) params.set('s', state.scene);
  if (state.difficulty) params.set('x', state.difficulty);
  if (state.mastery) params.set('m', state.mastery);
  if (state.favoriteOnly) params.set('f', '1');
  if (state.patternId) params.set('p', state.patternId);
  if (state.notionCategory) params.set('nc', state.notionCategory);
  if (state.notionPriority) params.set('np', state.notionPriority);
  if (state.notionMastery) params.set('nm', state.notionMastery);
  const target = '#' + params.toString();
  try { history.replaceState(null, '', target); } catch { /* file:// 某些情况下不允许，忽略 */ }
}

function renderCreators() {
  const box = document.getElementById('creatorNav');
  const usingPatterns = state.view !== 'content';
  const totalCount = usingPatterns ? DATA.patterns.length : DATA.cards.length;
  const items = [{ key: null, label: '全部博主', count: totalCount }]
    .concat(DATA.creators.map((name) => ({
      key: name,
      label: name,
      count: usingPatterns
        ? DATA.patterns.filter((pattern) => pattern.source.creator === name).length
        : cardsOf(name).length,
      colors: DATA.palette[name],
    })));

  box.innerHTML = items.map((item) => {
    const colors = item.colors ? `style="--accent:${item.colors.bg};--accent-fg:${item.colors.fg}"` : '';
    return `<button type="button" data-creator="${item.key === null ? '' : esc(item.key)}" ${colors}>
      <span>${esc(item.label)}</span><span class="n">${item.count}</span>
    </button>`;
  }).join('');

  box.querySelectorAll('[data-creator]').forEach((el) => el.addEventListener('click', () => {
    state.creator = el.dataset.creator || null;
    state.date = null;
    state.dateExpanded = false;
    writeHash();
    renderCreators();
    renderDates();
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }));
}

function renderNotionNav() {
  const box = document.getElementById('notionNav');
  if (!box) return;
  const name = DATA.notion?.databaseName || 'Expression Library';
  box.innerHTML = '<button type="button" class="notion-source" data-notion-source="1" title="Notion · ' +
    esc(name) + '"><span>Notion 知识库</span><span class="n">' +
    (DATA.notion?.items?.length ?? 0) + '</span></button>';
  box.querySelector('[data-notion-source]').addEventListener('click', () => {
    state.view = 'content';
    state.creator = NOTION_CREATOR;
    state.date = null;
    state.dateExpanded = false;
    state.patternId = null;
    writeHash();
    renderViewNav();
    renderCreators();
    renderDates();
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
  });
}

function syncCreators() {
  document.querySelectorAll('#creatorNav [data-creator]').forEach((el) => {
    el.dataset.on = state.creator !== NOTION_CREATOR && (el.dataset.creator || null) === state.creator ? '1' : '0';
  });
  document.querySelectorAll('#notionNav [data-notion-source]').forEach((el) => {
    el.dataset.on = state.creator === NOTION_CREATOR ? '1' : '0';
  });
}

function renderDates() {
  const box = document.getElementById('dateNav');
  const block = document.getElementById('dateBlock');
  const scoped = cardsOf(state.creator);
  const counts = new Map();
  for (const card of scoped) {
    const day = dayOf(card);
    if (day) counts.set(day, (counts.get(day) ?? 0) + 1);
  }
  const days = [...counts.keys()].sort().reverse();
  block.hidden = state.view !== 'content' || days.length === 0;

  const recentDays = days.slice(0, 5);
  let visibleDays = state.dateExpanded ? days : recentDays;
  if (!state.dateExpanded && state.date && !visibleDays.includes(state.date)) {
    visibleDays = [state.date, ...visibleDays];
  }
  const hiddenCount = days.length - new Set(visibleDays).size;

  const items = [{ key: null, label: '全部日期', count: scoped.length }]
    .concat(visibleDays.map((day) => ({ key: day, label: day.slice(5), count: counts.get(day), title: day })));
  box.innerHTML = items
    .map((item) => `<button type="button" data-date="${item.key ?? ''}" title="${esc(item.title ?? '')}">
      <span>${esc(item.label)}</span><span class="n">${item.count}</span>
    </button>`).join('') +
    (days.length > 5
      ? `<button type="button" class="date-toggle" data-date-toggle="1" aria-expanded="${state.dateExpanded ? 'true' : 'false'}">
          ${state.dateExpanded ? '收起日期' : `展开更多 · ${hiddenCount}`}
        </button>`
      : '');

  box.querySelectorAll('[data-date]').forEach((el) => el.addEventListener('click', () => {
    state.date = el.dataset.date || null;
    writeHash();
    renderDates();
    render();
  }));
  box.querySelector('[data-date-toggle]')?.addEventListener('click', () => {
    state.dateExpanded = !state.dateExpanded;
    renderDates();
  });
  syncDates();
}

function syncDates() {
  document.querySelectorAll('#dateNav [data-date]').forEach((el) => {
    el.dataset.on = (el.dataset.date || null) === state.date ? '1' : '0';
  });
}

document.getElementById('stats').innerHTML = [
  '<span><b>' + DATA.stats.cards + '</b> 条视频</span>',
  '<span><b>' + DATA.stats.imageCards + '</b> 篇图文</span>',
  '<span><b>' + DATA.stats.patterns + '</b> 个句型</span>',
  DATA.stats.fullRewrites ? '<span><b>' + DATA.stats.fullRewrites + '</b> 篇全篇地道版</span>' : '',
  DATA.stats.rewrites ? '<span><b>' + DATA.stats.rewrites + '</b> 处改动说明</span>' : '',
  DATA.stats.notionEntries ? '<span><b>' + DATA.stats.notionEntries + '</b> 条 Notion 表达</span>' : '',
  '<span><b>' + DATA.stats.creators + '</b> 位博主</span>',
].filter(Boolean).join('');
document.getElementById('foot').textContent = '上次更新 ' + DATA.generatedAt.slice(0, 16).replace('T', ' ');

document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
// 默认落在最近更新的那位博主身上，首页不再把所有博主的稿子一次性铺开
const initial = readHash();
state.view = initial.view;
state.creator = initial.creator === undefined ? (DATA.creators[0] ?? null) : initial.creator;
state.date = state.view === 'content' ? initial.date : null;
state.scene = initial.scene;
state.difficulty = initial.difficulty;
state.mastery = initial.mastery;
state.favoriteOnly = initial.favoriteOnly;
state.patternId = initial.patternId;
state.notionCategory = initial.notionCategory;
state.notionPriority = initial.notionPriority;
state.notionMastery = initial.notionMastery;
writeHash();
renderCreators();
renderNotionNav();
renderDates();
savedHighlights = readSavedHighlights();
wireTextTools();
render();
</script>
</body>
</html>
